name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  large-files:
    name: Large files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Reject raw files over 5 MB and non-LFS *.glb
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in 0000000000000000000000000000000000000000) base= ;; esac
          bash .github/scripts/check-large-files.sh "$base" HEAD

  web:
    name: Web demos (build + JS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Both workspaces: the stress-solver wasm (engine/stress-oracle) is the longest compile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            engine/stress-oracle
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # wasm-pack cargo-installs the wasm-bindgen CLI pinned by the wasm crates (~1 min).
      - name: Cache slangc, wasm-pack, Binaryen and wasm-bindgen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rubble-tools
            ~/.cache/.wasm-pack
          key: rubble-tools-${{ runner.os }}-${{ hashFiles('engine/scripts/build-web.sh', 'engine/scripts/slangc.sh', 'engine/crates/*-wasm/Cargo.toml', 'engine/stress-oracle/crates/stress-web/Cargo.toml') }}
      # The same build as the Vercel preview: slangc → WGSL, wasm modules, scene snapshots.
      - name: Build the demo site
        run: bash engine/scripts/build-web.sh
      - name: JS tests (WebGPU host, vehicle and fracture modules)
        run: node --test engine/crates/engine-webgpu/tests/*.test.mjs engine/crates/engine-webgpu/fracture/*.test.mjs
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: engine/web-dist
          retention-days: 7

  engine-host:
    name: Engine host tests (no GPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      # engine-fracture's tests read the fracture GLBs.
      - uses: ./.github/actions/lfs-pull
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Schema, scene builders (host build, no Metal), step graph, vehicle, soft-body
      # (importers, beam model, CPU reference) and fracture host logic. GPU tests need a
      # real adapter (Metal or a hardware wgpu backend) and run locally; see
      # engine/crates/engine-webgpu/README.md and engine/docs/softbody.md.
      - name: cargo test
        run: cargo test --release -p engine-schema -p engine-exec -p engine-scenes -p engine-vehicle -p engine-softbody -p engine-fracture --no-default-features

  # The C library a game engine links (engine/crates/engine-ffi): built, its header
  # checked, packaged with engine/scripts/build-ffi.sh, and examples/hello.c compiled
  # and linked against the package. macOS runs it on the runner's Metal device and
  # Linux on lavapipe (Mesa's CPU Vulkan); Windows runners have no Vulkan driver, so
  # there it is linked only. Each package is uploaded as `rubble-<os>`.
  c-abi:
    name: C library (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            run_example: 1
          - name: linux
            os: ubuntu-latest
            run_example: 1
          - name: windows
            os: windows-latest
            run_example: 0
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: c-abi
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.cache/rubble-tools
          key: rubble-slangc-${{ runner.os }}-${{ hashFiles('engine/scripts/slangc.sh') }}
      - name: Mesa lavapipe (Vulkan on the CPU)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build, package and run the C example
        env:
          RUN_EXAMPLE: ${{ matrix.run_example }}
        run: bash engine/scripts/build-ffi.sh
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: rubble-${{ matrix.name }}
          path: engine/ffi-dist
          retention-days: 30
