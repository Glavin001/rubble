name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  # engine-webgpu's build script keeps its slangc outputs here, keyed by its inputs
  # (build.rs `cache_key`). Compiling every kernel takes 3.5-6 min on a runner and the
  # web build runs that build script three times, so the `shaders` job compiles them
  # once per change and the other jobs restore it. The cache key's hashFiles covers what
  # `cache_key` hashes plus the pinned slangc version (scripts/slangc.sh).
  RUBBLE_SLANG_CACHE: ${{ github.workspace }}/.rubble-slang-cache

# Every job has a 10 minute cap (timeout-minutes): a hung GPU example or test fails
# the run instead of holding a runner for hours.

jobs:
  large-files:
    name: Large files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Reject raw files over 5 MB and non-LFS *.glb
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in 0000000000000000000000000000000000000000) base= ;; esac
          bash .github/scripts/check-large-files.sh "$base" HEAD

  # Compiles engine-webgpu's Slang kernels into RUBBLE_SLANG_CACHE once per change to
  # them, per OS (Windows checks out CRLF, which changes build.rs's key). When the cache
  # already has this key, the job only looks it up.
  shaders:
    name: Shaders (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Slang outputs already cached?
        id: slang
        uses: actions/cache/restore@v4
        with:
          path: .rubble-slang-cache
          key: slang-${{ runner.os }}-${{ hashFiles('engine/slang/**', 'engine/crates/engine-webgpu/build.rs', 'engine/crates/engine-webgpu/src/wgsl_loop_cap.rs', 'engine/crates/engine-slang-build/src/lib.rs', 'engine/scripts/slangc.sh') }}
          lookup-only: true
      - uses: dtolnay/rust-toolchain@stable
        if: steps.slang.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.slang.outputs.cache-hit != 'true'
        with:
          workspaces: engine
          key: shaders
      - name: Cache slangc
        if: steps.slang.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/rubble-tools
          key: rubble-slangc-${{ runner.os }}-${{ hashFiles('engine/scripts/slangc.sh') }}
      # `cargo check` runs the build script (every slangc compile) without codegen.
      - name: Compile the Slang kernels
        if: steps.slang.outputs.cache-hit != 'true'
        run: |
          TOOLS="$HOME/.cache/rubble-tools"
          . engine/scripts/slangc.sh
          cd engine && cargo check --release -p engine-webgpu --no-default-features
      - name: Save the Slang outputs
        if: steps.slang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .rubble-slang-cache
          key: slang-${{ runner.os }}-${{ hashFiles('engine/slang/**', 'engine/crates/engine-webgpu/build.rs', 'engine/crates/engine-webgpu/src/wgsl_loop_cap.rs', 'engine/crates/engine-slang-build/src/lib.rs', 'engine/scripts/slangc.sh') }}

  web:
    name: Web demos (build + JS tests)
    needs: shaders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - name: Restore the Slang outputs (shaders job)
        uses: actions/cache/restore@v4
        with:
          path: .rubble-slang-cache
          key: slang-${{ runner.os }}-${{ hashFiles('engine/slang/**', 'engine/crates/engine-webgpu/build.rs', 'engine/crates/engine-webgpu/src/wgsl_loop_cap.rs', 'engine/crates/engine-slang-build/src/lib.rs', 'engine/scripts/slangc.sh') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Both workspaces: the stress-solver wasm (engine/stress-oracle) is the longest compile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            engine/stress-oracle
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # wasm-pack cargo-installs the wasm-bindgen CLI pinned by the wasm crates (~1 min).
      - name: Cache slangc, wasm-pack, Binaryen and wasm-bindgen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rubble-tools
            ~/.cache/.wasm-pack
          key: rubble-tools-${{ runner.os }}-${{ hashFiles('engine/scripts/build-web.sh', 'engine/scripts/slangc.sh', 'engine/crates/*-wasm/Cargo.toml', 'engine/stress-oracle/crates/stress-web/Cargo.toml') }}
      # The same build as the Vercel preview: slangc → WGSL, wasm modules, scene snapshots.
      - name: Build the demo site
        run: bash engine/scripts/build-web.sh
      - name: JS tests (WebGPU host, vehicle and fracture modules)
        run: node --test engine/crates/engine-webgpu/tests/*.test.mjs engine/crates/engine-webgpu/fracture/*.test.mjs
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: engine/web-dist
          retention-days: 7

  engine-host:
    name: Engine host tests (no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      # engine-fracture's tests read the fracture GLBs.
      - uses: ./.github/actions/lfs-pull
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Schema, scene builders (host build, no Metal), step graph, vehicle, soft-body
      # (importers, beam model, CPU reference) and fracture host logic. GPU tests need a
      # real adapter (Metal or a hardware wgpu backend) and run locally; see
      # engine/crates/engine-webgpu/README.md and engine/docs/softbody.md.
      - name: cargo test
        run: cargo test --release -p engine-schema -p engine-exec -p engine-scenes -p engine-vehicle -p engine-softbody -p engine-fracture --no-default-features

  # The C library a game engine links (engine/crates/engine-ffi): built, its header
  # checked, packaged with engine/scripts/build-ffi.sh, and examples/hello.c compiled
  # and linked against the package. macOS runs it on the runner's Metal device and
  # Linux on lavapipe (Mesa's CPU Vulkan); Windows runners have no Vulkan driver, so
  # there it is linked only. Each package is uploaded as `rubble-<os>`.
  c-abi:
    name: C library (${{ matrix.name }})
    needs: shaders
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-14
            run_example: 1
          - name: linux
            os: ubuntu-latest
            run_example: 1
          - name: windows
            os: windows-latest
            run_example: 0
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - name: Restore the Slang outputs (shaders job)
        uses: actions/cache/restore@v4
        with:
          path: .rubble-slang-cache
          key: slang-${{ runner.os }}-${{ hashFiles('engine/slang/**', 'engine/crates/engine-webgpu/build.rs', 'engine/crates/engine-webgpu/src/wgsl_loop_cap.rs', 'engine/crates/engine-slang-build/src/lib.rs', 'engine/scripts/slangc.sh') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: c-abi
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.cache/rubble-tools
          key: rubble-slangc-${{ runner.os }}-${{ hashFiles('engine/scripts/slangc.sh') }}
      - name: Mesa lavapipe (Vulkan on the CPU)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: MSVC developer shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build, package and run the C example
        env:
          RUN_EXAMPLE: ${{ matrix.run_example }}
        run: bash engine/scripts/build-ffi.sh
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: rubble-${{ matrix.name }}
          path: engine/ffi-dist
          retention-days: 30
