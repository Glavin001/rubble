# TEMPORARY (investigation of the macOS 'char_move' "Compilation failed"): builds the
# C library once and runs examples/hello many times, printing what macOS logged about
# Metal's compiler after each failure. Removed before this branch is merged.
name: Metal probe
on:
  push:
    branches: [claude/admiring-dhawan-d1aea5]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: c-abi
          save-if: false
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.cache/rubble-tools
          key: rubble-slangc-${{ runner.os }}-${{ hashFiles('engine/scripts/slangc.sh') }}
      - name: Build
        env:
          RUN_EXAMPLE: 0
        run: bash engine/scripts/build-ffi.sh
      - name: Machine
        run: |
          sysctl -n machdep.cpu.brand_string hw.model hw.ncpu hw.memsize kern.osversion kern.hv_vmm_present
          sw_vers
          system_profiler SPDisplaysDataType SPHardwareDataType | grep -v -i "serial\|uuid\|udid"
          vm_stat | sed -n 1,8p
      - name: Run hello 8 times
        run: |
          HELLO=engine/ffi-dist/rubble-macos-aarch64/examples/hello
          fails=0; attempts=0
          for i in $(seq 1 8); do
            echo "::group::run $i"
            start=$(date +%s)
            if /usr/bin/time -l "$HELLO" > run.out 2> run.err; then r=ok; else r=FAIL; fails=$((fails+1)); fi
            cat run.out; cat run.err
            echo "::endgroup::"
            a=$(grep -c "^prewarm: kernel" run.err || true)
            attempts=$((attempts+a))
            echo "RUN $i: $r in $(( $(date +%s) - start )) s, failed attempts $a"
            if [[ $a != 0 ]]; then
              echo "::group::metal log after run $i"
              bash engine/scripts/metal-compiler-log.sh 1
              echo "::endgroup::"
            fi
          done
          echo "FAILED $fails of 8 runs, $attempts failed attempts"
      - name: Time the old and the new char_move pipeline on this runner
        if: always()
        run: |
          cd engine
          TOOLS="${RUBBLE_TOOLS:-$HOME/.cache/rubble-tools}"
          . scripts/slangc.sh
          SLANGC="${SLANGC:-$(command -v slangc)}"
          cargo build -p engine-webgpu --release --bin gpu_adapter
          git fetch --depth 1 origin 977ff3ac5e48f1fcb199aaac03dd445f7f59651b
          mkdir -p /tmp/k/old /tmp/k/new
          cp -R slang /tmp/k/old/slang
          git show FETCH_HEAD:engine/slang/kernels/character_step.slang > /tmp/k/old/slang/kernels/character_step.slang
          cp -R slang /tmp/k/new/slang
          for v in old new; do
            (cd /tmp/k/$v/slang/kernels && "$SLANGC" -target wgsl -stage compute -entry char_move -o /tmp/k/$v/char_move.wgsl -DENGINE_WGSL=1 character_step.slang) 2>&1 | grep -i error || true
            ls -l /tmp/k/$v/char_move.wgsl
          done
          python3 scripts/wgsl-inline-size.py /tmp/k/old/char_move.wgsl /tmp/k/new/char_move.wgsl --top 0
          for i in 1 2 3; do
            for v in new old; do
              cp /tmp/k/$v/char_move.wgsl /tmp/k/$v/char_move_$i.wgsl
              echo "// $i" >> /tmp/k/$v/char_move_$i.wgsl
              echo "== $v $i"
              ./target/release/gpu_adapter --compile /tmp/k/$v/char_move_$i.wgsl 2>&1 | grep -E "pipeline char_move|error|panicked|Compilation" || true
            done
          done
          bash scripts/metal-compiler-log.sh 3 | grep -E "MTLCompiler\)|Timeout|Paravirt" || true
