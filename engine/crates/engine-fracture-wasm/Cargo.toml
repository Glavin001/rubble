[package]
name = "engine-fracture-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen bindings of engine-fracture for the browser fracture lab (thin typed JS layer over the shared Rust host logic)"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
engine-fracture.workspace = true
engine-schema.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.129"
