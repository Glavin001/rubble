[package]
name = "engine-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rubble's public world API: one handle for rigid bodies, joints, vehicles and soft bodies on the GPU"

[lib]
name = "rubble"

[dependencies]
engine-schema.workspace = true
engine-webgpu.workspace = true
engine-vehicle.workspace = true
engine-softbody.workspace = true
engine-fracture.workspace = true
engine-gpu-wait.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
serde_json = { workspace = true, optional = true }
# The fracture lab's stress-solver modes (`StrengthModel::Threshold`): the stress
# oracle's GPU fracture and contact ingest on the world's device, its scene import
# and the lab's cooking of clusters (engine/stress-oracle, its own workspace).
stress-gpu = { path = "../../stress-oracle/crates/stress-gpu", optional = true }
stress-ref = { path = "../../stress-oracle/crates/stress-ref", optional = true }
stress-rubble = { path = "../../stress-oracle/crates/stress-rubble", default-features = false, features = ["gpu"], optional = true }

[features]
default = ["stress"]
stress = ["dep:stress-gpu", "dep:stress-ref", "dep:stress-rubble", "dep:serde_json"]
# The destruction-reactions harness only (tests/support/reactions.rs): count the
# reactions other branches add once they merge (engine/docs/destruction-reactions.md).
# Off until then; enabling one before its event exists fails to compile.
reactions-crush = ["stress"]
reactions-blast = ["stress"]
reactions-support = ["stress"]

[[example]]
name = "destruction_reactions"
required-features = ["stress"]
