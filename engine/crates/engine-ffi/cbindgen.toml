language = "C"
header = """/* Rubble physics C ABI (generated by cbindgen from engine/crates/engine-ffi; do not edit).
 * ABI 0.x: unstable until destructibles ship. See engine/docs/public-api.md. */"""
include_guard = "RUBBLE_H"
cpp_compat = true
usize_is_size_t = true
style = "both"
documentation = true
documentation_style = "c99"

[enum]
rename_variants = "None"
prefix_with_name = false

[export]
include = ["RbCoordinates"]
