[package]
name = "engine-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rubble's C ABI over rubble::World (header: include/rubble.h), for Unreal, Godot, Unity and other C/C++ hosts"

[lib]
name = "rubble_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
engine-world = { path = "../engine-world" }
engine-schema.workspace = true
engine-vehicle.workspace = true
engine-softbody.workspace = true
glam.workspace = true
anyhow.workspace = true

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
