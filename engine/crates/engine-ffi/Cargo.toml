[package]
name = "engine-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rubble's C ABI over rubble::World (header: include/rubble.h), for Unreal, Godot, Unity and other C/C++ hosts"

[lib]
name = "rubble_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
engine-world = { path = "../engine-world" }
# The host renderer's device and buffers (metal_interop) for rbCreateWorldOnMetal.
engine-webgpu.workspace = true
wgpu.workspace = true
engine-schema.workspace = true
engine-vehicle.workspace = true
engine-softbody.workspace = true
glam.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2 = "0.6"
objc2-metal = "0.3"
