[package]
name = "engine-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CUDA replay of the shared rigid step graph and explicit-beams plan (Slang → CUDA → PTX, NVIDIA Linux)"

[dependencies]
engine-schema.workspace = true
engine-exec.workspace = true
engine-softbody.workspace = true
glam.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
log.workspace = true
# Driver API only, loaded at run time: builds without CUDA installed and needs
# just the NVIDIA driver (libcuda) where it runs.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-12060"] }

[build-dependencies]
engine-kernel-manifest.workspace = true
engine-slang-build.workspace = true
anyhow.workspace = true

[dev-dependencies]
# Path, not the workspace entry: without the default `metal` feature (Linux builds).
engine-scenes = { path = "../engine-scenes", default-features = false }
serde_json.workspace = true
engine-softbody-authoring.workspace = true
