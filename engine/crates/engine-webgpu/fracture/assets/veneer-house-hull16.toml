# Shardwright bake settings for assets/veneer-house-hull16.glb: building_lite.toml
# (Shardwright f10ce21) plus a 16-vertex hull cap. See ../README.md for commands.
# Building starter config: primitive geometry, coarse cells, plain render
# (one LOD, no interior noise or chipping), agglomeration for Level 1.
seed = 1337
levels = 4

[cells]
target_analysis_cells_per_m3 = 20
fine_per_analysis = 4

[modes]
enabled = false

[render]
lods = 1
noise = false
chipping = false

# Rubble 20-house row: collision hulls capped at 16 vertices by the bake (an
# inner approximation chosen at the source), enforced by the collision_shapes gate.
[collision]
max_hull_vertices = 16

[validation]
max_hull_vertices = 16
