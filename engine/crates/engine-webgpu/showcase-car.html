<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showcase car</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242a; color: #dde; font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 10px; top: 8px; background: rgba(0, 0, 0, 0.45); padding: 6px 9px; border-radius: 5px; white-space: pre; line-height: 1.4; }
  #err { position: fixed; left: 10px; bottom: 10px; color: #f88; white-space: pre-wrap; }
</style>
<script type="importmap">{ "imports": { "rubble-gpu-wait": "./fracture/gpu-wait.mjs" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="err"></div>
<script type="module">
// Test page of the authored showcase car: its .truck on the explicit solver
// (WebWorld.explicitSim), its visual skin deformed on the GPU from the solver's
// nodes (showcase-car-render.mjs). Query: ?res=low|medium|high, ?scene=idle|coast|
// wall|pole|sidepole|drop, ?speed= km/h, ?offset= / ?at= m (pole, sidepole),
// ?height= m (drop), ?style=sedan|hatchback, ?paint=r,g,b, ?freeze= s (stop the
// simulation there), ?cam=front|side|rear|top|three, ?dist= m, ?drag=0, ?n= cars (idle row).
import { createWorld } from './rubble-world.mjs';
import { showcaseCar } from './generated/world-wasm/engine_world_wasm.js';
import { createShowcaseCarRenderer } from './showcase-car-render.mjs';

const qs = new URLSearchParams(location.search);
const hud = document.getElementById('hud');
let failed = false;
const fail = (e) => { if (failed) return; failed = true; document.getElementById('err').textContent = String(e?.stack ?? e); window.__state = { error: String(e) }; };
window.__state = { ready: false };

try {
  const res = qs.get('res') ?? 'medium';
  const scene = qs.get('scene') ?? 'idle';
  const kmh = Number(qs.get('speed') ?? (scene === 'idle' ? 0 : 56));
  const paint = qs.get('paint')?.split(',').map(Number);
  const freeze = qs.has('freeze') ? Number(qs.get('freeze')) : Infinity;
  const n = Math.max(1, Number(qs.get('n')) || 1);
  const t0 = performance.now();
  const world = await createWorld({ gravity: [0, -9.81, 0], capacity: { maxBodies: 1024, maxColliders: 2048, maxContacts: 65536, maxJoints: 64, maxCandidates: 131072, maxColors: 32, maxCommands: 256, maxHullVertices: 64 } });
  const car = showcaseCar({ style: qs.get('style') ?? 'sedan', resolution: res, ...(paint ? { paint } : {}) });
  const buildMs = performance.now() - t0;
  const device = world.device();
  device.addEventListener('uncapturederror', (e) => fail('gpu: ' + (e.error?.message ?? e.error)));
  const spec = { vehicles: Array.from({ length: n }, (_, i) => ({ truck: car.truck, at: [(i - (n - 1) / 2) * 3, 0], yaw: 0 })), scene, speed: kmh / 3.6, drag: qs.get('drag') !== '0' };
  for (const k of ['offset', 'at', 'height', 'angle', 'runUp']) if (qs.has(k)) spec[k] = Number(qs.get(k));
  const sim = world.explicitSim(spec);
  const layout = sim.layout();

  const canvas = document.getElementById('c');
  const context = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  // 4× MSAA: panel gaps and trim are a few millimetres wide.
  const SAMPLES = 4;
  let depth = null, msaa = null;
  const configure = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    context.configure({ device, format, alphaMode: 'opaque' });
    depth?.destroy();
    msaa?.destroy();
    depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', sampleCount: SAMPLES, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    msaa = device.createTexture({ size: [canvas.width, canvas.height], format, sampleCount: SAMPLES, usage: GPUTextureUsage.RENDER_ATTACHMENT });
  };
  configure();
  addEventListener('resize', configure);

  const r = createShowcaseCarRenderer(device, { format, depthFormat: 'depth24plus', sampleCount: SAMPLES });
  r.setSolver(sim.nodesBuffer(), sim.miscBuffer());
  layout.vehicles.forEach((v, i) => r.addCar(car.visual, { nodeOffset: v.nodeOffset, vehicle: i }));

  // Ground and the scene's static shapes: flat-shaded boxes and cylinders.
  const SCENE_WGSL = `
    struct F { vp: mat4x4f, eye: vec4f, light: vec4f, shadow: vec4f };
    @group(0) @binding(0) var<uniform> f: F;
    struct O { @builtin(position) p: vec4f, @location(0) w: vec3f, @location(1) n: vec3f, @location(2) c: vec3f };
    @vertex fn vs(@location(0) p: vec3f, @location(1) n: vec3f, @location(2) c: vec3f) -> O {
      var o: O; o.p = f.vp * vec4f(p, 1.0); o.w = p; o.n = n; o.c = c; return o;
    }
    @fragment fn fs(i: O) -> @location(0) vec4f {
      var c = i.c;
      let fw = fwidth(i.w.xz);
      if (i.n.y > 0.99 && i.w.y < 0.001) {
        let g = abs(fract(i.w.xz) - 0.5);
        let gl = smoothstep(vec2f(0.5) - fw * 1.5, vec2f(0.5), g);
        let line = 1.0 - 0.1 * max(gl.x, gl.y);
        let d = length(i.w.xz - f.eye.xz);
        c = mix(c * line, vec3f(0.135, 0.142, 0.158), clamp(d / 60.0, 0.0, 1.0));
        // A soft contact shadow under the car (f.shadow.z: its heading): a
        // rounded footprint, darkest at its core.
        let q = i.w.xz - f.shadow.xy;
        let cs = cos(f.shadow.z); let sn = sin(f.shadow.z);
        let lq = vec2f(cs * q.x - sn * q.y, sn * q.x + cs * q.y);
        let fp = length(max(abs(lq) - vec2f(0.72, 2.05), vec2f(0.0))) - 0.18;
        c *= 1.0 - 0.55 * exp(-max(fp, 0.0) * 6.0) * (0.75 + 0.25 * smoothstep(0.0, -0.6, fp));
      }
      let l = max(dot(normalize(i.n), normalize(f.light.xyz)), 0.0);
      let col = c * (0.35 + 0.75 * l);
      return vec4f(pow(col, vec3f(1.0 / 2.2)), 1.0);
    }`;
  const sm = device.createShaderModule({ code: SCENE_WGSL });
  const scenePipe = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: sm, entryPoint: 'vs', buffers: [{ arrayStride: 36, attributes: [0, 1, 2].map((l) => ({ shaderLocation: l, offset: 12 * l, format: 'float32x3' })) }] },
    fragment: { module: sm, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
    multisample: { count: SAMPLES },
  });
  const verts = [];
  const quad = (a, b, c, d, nrm, col) => { for (const p of [a, b, c, a, c, d]) verts.push(...p, ...nrm, ...col); };
  quad([-200, 0, -200], [200, 0, -200], [200, 0, 200], [-200, 0, 200], [0, 1, 0], [0.26, 0.265, 0.275]);
  const conc = [0.62, 0.6, 0.56];
  for (const b of layout.boxes) {
    const [cx, cy, cz, hx, hy, hz, qx, qy, qz, qw, kind] = b;
    if (kind === 2) {
      const N = 24;
      for (let i = 0; i < N; i++) {
        const a0 = (i / N) * 2 * Math.PI, a1 = ((i + 1) / N) * 2 * Math.PI;
        const p = (a, y) => [cx + hx * Math.cos(a), cy + y, cz + hx * Math.sin(a)];
        quad(p(a0, -hy), p(a1, -hy), p(a1, hy), p(a0, hy), [Math.cos((a0 + a1) / 2), 0, Math.sin((a0 + a1) / 2)], conc);
      }
      continue;
    }
    // Boxes (rotation ignored: the scenes' boxes are axis-aligned).
    const c = [cx, cy, cz], h = [hx, hy, hz];
    for (let ax = 0; ax < 3; ax++) for (const s of [-1, 1]) {
      const u = (ax + 1) % 3, v = (ax + 2) % 3;
      const corner = (du, dv) => { const p = [...c]; p[ax] += s * h[ax]; p[u] += du * h[u]; p[v] += dv * h[v]; return p; };
      const nrm = [0, 0, 0]; nrm[ax] = s;
      quad(corner(-1, -1), corner(1, -1), corner(1, 1), corner(-1, 1), nrm, conc);
    }
  }
  const sceneBuf = device.createBuffer({ size: verts.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(sceneBuf, 0, new Float32Array(verts));
  const frameBuf = device.createBuffer({ size: 112, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const sceneBind = device.createBindGroup({ layout: scenePipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: frameBuf } }] });

  // Camera: orbits the first car's reference node.
  const mat = {
    persp(fovy, aspect, near, far) { const f = 1 / Math.tan(fovy / 2); return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, far / (near - far), -1, 0, 0, (near * far) / (near - far), 0]; },
    look(e, t) {
      const sub = (a, b) => a.map((x, i) => x - b[i]); const norm = (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); };
      const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const z = norm(sub(e, t)); const x = norm(cr([0, 1, 0], z)); const y = cr(z, x);
      return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1];
    },
    mul(a, b) { const o = new Array(16).fill(0); for (let c = 0; c < 4; c++) for (let r2 = 0; r2 < 4; r2++) for (let k = 0; k < 4; k++) o[c * 4 + r2] += a[k * 4 + r2] * b[c * 4 + k]; return o; },
  };
  const cams = { three: [0.8, 0.32, 0.75], front: [0.1, 0.25, 1], rear: [-0.6, 0.35, -0.8], side: [1, 0.2, 0.05], top: [0.3, 1, 0.3], left: [-1, 0.25, 0.25] };
  let camDir = cams[qs.get('cam') ?? 'three'] ?? cams.three;
  const dist = Number(qs.get('dist')) || 6.2;
  let target = [0, 0.6, 0];
  let yaw = Math.atan2(camDir[0], camDir[2]), pitch = Math.asin(camDir[1] / Math.hypot(...camDir));
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.006; pitch = Math.min(1.4, Math.max(-0.1, pitch + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; });

  const rate = sim.stepRate();
  let simTime = 0, carry = 0, last = performance.now(), frames = 0, gpuMs = [], damage = null, posePending = false, timesPending = false;
  const poll = () => {
    if (!posePending) { posePending = true; sim.readPoses().then((p) => { target = [p[0], Math.max(0.5, p[1]), p[2]]; posePending = false; }); }
    if (!timesPending && sim.timed()) { timesPending = true; sim.readFrameTimes().then((t) => { if (t.length) gpuMs = [...t].slice(-60); timesPending = false; }); }
    if (frames % 30 === 0) sim.readDamage(1).then((d) => { damage = d[0]; });
  };
  const frame = () => {
    const now = performance.now();
    let dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (simTime + dt > freeze) dt = Math.max(0, freeze - simTime);
    carry += dt * rate;
    let steps = Math.min(sim.maxFrameSteps(), Math.floor(carry));
    carry -= steps;
    if (steps > 0) { sim.frame(steps); simTime += steps / rate; }
    const enc = device.createCommandEncoder();
    r.update(enc);
    const aspect = canvas.width / canvas.height;
    const eye = [target[0] + dist * Math.sin(yaw) * Math.cos(pitch), target[1] + dist * Math.sin(pitch), target[2] + dist * Math.cos(yaw) * Math.cos(pitch)];
    const vp = mat.mul(mat.persp(0.75, aspect, 0.05, 500), mat.look(eye, target));
    const light = [0.45, 0.8, 0.4];
    const fr = new Float32Array(28); fr.set(vp, 0); fr.set([...eye, 1], 16); fr.set([...light, 0], 20); fr.set([target[0], target[2], 0, 0], 24);
    device.queue.writeBuffer(frameBuf, 0, fr);
    const pass = enc.beginRenderPass({
      colorAttachments: [{ view: msaa.createView(), resolveTarget: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'discard', clearValue: { r: 0.40, g: 0.415, b: 0.44, a: 1 } }],
      depthStencilAttachment: { view: depth.createView(), depthLoadOp: 'clear', depthClearValue: 1, depthStoreOp: 'store' },
    });
    pass.setPipeline(scenePipe); pass.setBindGroup(0, sceneBind); pass.setVertexBuffer(0, sceneBuf); pass.draw(verts.length / 9);
    r.draw(pass, { viewProj: vp, eye, light });
    pass.end();
    device.queue.submit([enc.finish()]);
    frames++;
    poll();
    const c = car.counts;
    const gm = gpuMs.length ? gpuMs.reduce((a, b) => a + b, 0) / gpuMs.length : NaN;
    hud.textContent = `${qs.get('style') ?? 'sedan'} ${res}: ${c.nodes} nodes, ${c.beams} beams, ${c.collisionTriangles} collision tris, ${car.visual.indices.length / 3} visual tris, ${c.mass.toFixed(0)} kg\n` +
      `scene ${scene} ${kmh} km/h × ${n}   t ${simTime.toFixed(2)} s   GPU ${isNaN(gm) ? '–' : gm.toFixed(2)} ms/frame   build ${buildMs.toFixed(0)} ms` +
      (damage ? `\nbroken ${damage.broken}  bent ${damage.bent}` : '');
    window.__state = { ready: frames > 3, time: simTime, frozen: simTime >= freeze, gpuMs: gm, damage, counts: c };
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
} catch (e) { fail(e); }
</script>
</body>
</html>
