<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Rubble vehicles — WebGPU AVBD</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; color: #dfe4ee; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: fixed; background: rgba(16, 19, 26, 0.78); border: 1px solid #2c3346; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px); }
    #hud { top: 12px; left: 12px; width: 21rem; max-width: calc(100vw - 48px); }
    #hud h1 { font-size: 15px; margin: 0 0 6px; font-weight: 650; }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
    .muted { color: #8d96aa; }
    select, button { background: #1d2333; color: #dfe4ee; border: 1px solid #3a4360; border-radius: 5px; padding: 3px 8px; font: inherit; cursor: pointer; }
    button:hover { border-color: #6c7aa6; }
    button:disabled { opacity: 0.4; cursor: default; }
    #err { color: #ff8e8e; white-space: pre-wrap; }
    #dash { right: 12px; bottom: 12px; width: 15rem; font-variant-numeric: tabular-nums; }
    #speed { font-size: 34px; font-weight: 700; line-height: 1; }
    #speed small { font-size: 13px; font-weight: 500; color: #8d96aa; }
    #gear { font-size: 26px; font-weight: 700; float: right; }
    .bar { height: 6px; background: #252c3d; border-radius: 3px; overflow: hidden; margin: 6px 0; }
    .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #4fb0ff, #ffb04f 75%, #ff5050); }
    #wheels { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
    .wheel { border: 1px solid #333c55; border-radius: 4px; padding: 2px 6px; font-size: 11px; }
    .wheel.contact { border-color: #4fb06a; }
    .wheel.slide { border-color: #ffb04f; }
    .wheel.gone { opacity: 0.35; text-decoration: line-through; }
    #parts { right: 12px; top: 12px; width: 15rem; max-height: 50vh; overflow: auto; }
    .part { display: flex; justify-content: space-between; align-items: center; margin: 3px 0; gap: 6px; }
    .part.lost span { opacity: 0.4; text-decoration: line-through; }
    kbd { background: #252c3d; border: 1px solid #3a4360; border-radius: 3px; padding: 0 4px; font-size: 11px; }
    @media (max-width: 700px) { #parts { display: none; } #dash { width: 11rem; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" class="panel">
    <h1>Rubble vehicles · Slang AVBD on WebGPU</h1>
    <div class="row">
      <label class="muted" for="sceneSel">Scene</label><select id="sceneSel"></select>
      <label class="muted" for="presetSel">Car</label><select id="presetSel"></select>
    </div>
    <div class="row muted" id="help">
      <span><kbd>W</kbd><kbd>S</kbd> drive/brake · <kbd>A</kbd><kbd>D</kbd> steer · <kbd>Space</kbd> handbrake</span>
      <span><kbd>X</kbd> sever a wheel · <kbd>P</kbd> sever a part · <kbd>B</kbd> cannonball · <kbd>R</kbd> reset · <kbd>C</kbd> camera · <kbd>Tab</kbd> switch vehicle</span>
    </div>
    <div id="status" class="muted">starting…</div>
    <div id="err"></div>
  </div>
  <div id="parts" class="panel" hidden>
    <div class="row" style="justify-content: space-between"><strong>Parts &amp; wheels</strong><span class="muted">sever / disable</span></div>
    <div id="partList"></div>
  </div>
  <div id="dash" class="panel">
    <span id="gear">N</span>
    <div id="speed">0 <small>km/h</small></div>
    <div class="bar"><div id="rpm"></div></div>
    <div class="muted" id="rpmText">— rpm</div>
    <div id="wheels"></div>
  </div>
  <script type="module">
    import { createWorld, sceneCapacity, JOINT_BALL } from './world-host.mjs';
    import { L, WHEEL_RIM_MATERIAL, bitsf } from './vehicle.mjs';

    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const fail = (e) => { errEl.textContent = String((e && e.stack) || e); statusEl.textContent = 'stopped'; };
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });
    addEventListener('error', (e) => fail(e.error || e.message));

    const qs = new URLSearchParams(location.search);
    const SCENES = {
      playground: 'Playground: ramps, stacks, wall',
      destruction: 'Destruction yard: sever parts',
      traffic: 'Traffic: many AI vehicles',
      slab: 'Lab: car on a slab sliding on ice',
      seesaw: 'Lab: seesaw plank',
      carry: 'Lab: kart riding on a truck',
      sidewall: 'Lab: crates beside the tyres',
      bridge: 'Lab: plank bridge with breakable bolts',
    };
    const scene = qs.get('scene') || 'playground';
    if (!SCENES[scene]) throw new Error(`unknown scene ${scene}`);
    const presets = await (await fetch('./generated/vehicle_presets.json', { cache: 'no-store' })).json();
    const byName = Object.fromEntries(presets.map((p) => [p.name, p]));
    const presetName = qs.get('preset') || (scene === 'destruction' ? 'destructible_sedan' : scene === 'carry' ? 'monster_truck' : 'sedan');
    if (!byName[presetName]) throw new Error(`unknown preset ${presetName}; have ${Object.keys(byName).join(', ')}`);

    const sceneSel = document.getElementById('sceneSel');
    const presetSel = document.getElementById('presetSel');
    for (const [id, t] of Object.entries(SCENES)) sceneSel.add(new Option(t, id, false, id === scene));
    for (const p of presets) presetSel.add(new Option(p.name.replaceAll('_', ' '), p.name, false, p.name === presetName));
    const go = (k, v) => { const u = new URL(location.href); u.searchParams.set(k, v); if (k === 'scene') u.searchParams.delete('preset'); location.href = u.href; };
    sceneSel.onchange = () => go('scene', sceneSel.value);
    presetSel.onchange = () => go('preset', presetSel.value);

    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('no WebGPU adapter');
    const device = await adapter.requestDevice({
      requiredLimits: {
        maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        maxBufferSize: adapter.limits.maxBufferSize,
      },
    });
    device.lost.then((i) => fail('device lost: ' + i.message));
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + ((e.error && e.error.message) || e.error)));
    const canvas = document.getElementById('c');
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    const configure = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      context.configure({ device, format, alphaMode: 'opaque' });
    };
    configure();
    addEventListener('resize', configure);

    // ---------------------------------------------------------------- scene
    const nTraffic = scene === 'traffic' ? Math.max(1, Math.min(60, Number(qs.get('vehicles')) || 48)) : 0;
    const est = scene === 'traffic' ? 4000 + nTraffic * 40 : 6000;
    const cap = sceneCapacity(est, est * 2);
    const vehicleCap = { maxVehicles: 64, maxWheels: 1024, maxCurvePoints: 8192, maxDiffs: 256, maxAntiRolls: 256, maxParts: 512, maxRays: 64 };
    const world = await createWorld(device, { cap, vehicleCap, status: (s) => { statusEl.textContent = s; } });
    // The bridge's bolt forces are calibrated at 10 iterations (tests/vehicle.rs).
    world.params.iterations = scene === 'bridge' ? 10 : 8;
    const sleepQ = qs.get('sleep');
    if (sleepQ === 'off') world.params.sleepTime = 1e6;
    const MAT_GROUND = 0, MAT_PROP = 1, MAT_ICE = 2;
    world.setMaterial(MAT_GROUND, 1.0);
    world.setMaterial(MAT_PROP, 0.6);
    world.setMaterial(MAT_ICE, 0.08);
    world.setMaterial(WHEEL_RIM_MATERIAL, 0.9);

    const qAxis = (ax, ang) => { const s = Math.sin(ang / 2); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(ang / 2)]; };
    const boxInv = (m, hx, hy, hz) => [3 / (m * (hy * hy + hz * hz)), 3 / (m * (hx * hx + hz * hz)), 3 / (m * (hx * hx + hy * hy))];
    const staticBox = (p, half, q = [0, 0, 0, 1], material = MAT_PROP) => {
      const body = world.addBody({ p, q, flags: 0 });
      world.addCollider({ body, shape: 2, material, params: [...half, Math.hypot(...half)] });
      return body;
    };
    const dynBox = (p, half, mass, q = [0, 0, 0, 1]) => {
      const body = world.addBody({ p, q, invMass: 1 / mass, invI: boxInv(mass, ...half), flags: 1 | 8 });
      world.addCollider({ body, shape: 2, material: MAT_PROP, params: [...half, Math.hypot(...half)] });
      return body;
    };
    const dynBall = (p, r, mass, v = [0, 0, 0]) => {
      const i = 2.5 / (mass * r * r);
      const body = world.addBody({ p, invMass: 1 / mass, invI: [i, i, i], flags: 1 | 8, v });
      world.addCollider({ body, shape: 0, material: MAT_PROP, params: [r, 0, 0, r] });
      return body;
    };
    // Ground slab (collider 0; the renderer draws it as a plane).
    staticBox([0, -5, 0], [400, 5, 400], [0, 0, 0, 1], MAT_GROUND);

    const vehicles = []; // {h, preset, ai}
    const addVehicle = (name, p, yaw = 0, ai = null) => {
      const h = world.vehicles.addVehicle(world.backend, byName[name], p, qAxis([0, 1, 0], yaw));
      vehicles.push({ h, name, ai });
      return h;
    };

    let rng = 7;
    let bridgeBolts = 0; // breakable joints in the scene (bridge)
    // ?spawn=x,z,yaw places the player vehicle (yaw in radians about +Y).
    const spawnAt = (qs.get('spawn') || '').split(',').filter(Boolean).map(Number);
    const rand = () => { rng = (Math.imul(rng, 1103515245) + 12345) >>> 0; return rng / 2 ** 32; };
    if (scene === 'playground' || scene === 'destruction') {
      addVehicle(presetName, [spawnAt[0] ?? 0, 2.5, spawnAt[1] ?? 0], spawnAt[2] ?? 0);
      // Ramps (static, rotated about X), a long hill and a kicker.
      staticBox([0, 0.6, 30], [4, 0.4, 6], qAxis([1, 0, 0], -0.22));
      staticBox([0, 1.95, 41], [4, 0.4, 5.5], [0, 0, 0, 1]);
      staticBox([0, 0.6, 52], [4, 0.4, 6], qAxis([1, 0, 0], 0.22));
      staticBox([-22, 0.9, 10], [3, 0.3, 4], qAxis([1, 0, 0], -0.32));
      staticBox([24, 0.0, -20], [10, 1.5, 14], qAxis([0, 0, 1], 0.18));
      // Ice patch.
      staticBox([-30, -0.02, -25], [12, 0.05, 12], [0, 0, 0, 1], MAT_ICE);
      // Bollards (small statics).
      for (let i = 0; i < 8; i++) staticBox([-12 + i * 3.4, 0.6, 18], [0.25, 0.6, 0.25]);
      // Box stacks.
      for (const [x, z] of [[8, 26], [-10, 32], [14, 40]]) {
        for (let y = 0; y < 5; y++) for (let i = 0; i < 4 - (y >> 1); i++) dynBox([x + (i - 1.5) * 1.05, 0.5 + y * 1.0, z], [0.5, 0.5, 0.5], 40);
      }
      // Brick wall.
      for (let c = 0; c < 8; c++) for (let i = 0; i < 14; i++) dynBox([-20 + i * 1.02 + (c & 1) * 0.5, 0.25 + c * 0.5, 60], [0.5, 0.25, 0.25], 12);
      // Balls.
      for (let i = 0; i < 6; i++) dynBall([20 + i * 2.2, 0.8, 6], 0.8, 60);
      if (scene === 'destruction') {
        addVehicle('destructible_sedan', [8, 2.5, -10], 1.2);
        addVehicle('destructible_sedan', [-8, 2.5, -12], -0.6);
        for (let c = 0; c < 6; c++) for (let i = 0; i < 10; i++) dynBox([12 + i * 1.02 + (c & 1) * 0.5, 0.25 + c * 0.5, -30], [0.5, 0.25, 0.25], 12);
      } else {
        addVehicle('monster_truck', [-14, 3.5, -12], 0.4);
        addVehicle('kart', [6, 1.5, -6], 2.0);
        addVehicle('six_wheel_truck', [18, 3, 22], -1.2);
      }
    } else if (scene !== 'traffic') {
      // Two-way coupling labs: each mirrors a test in tests/vehicle.rs.
      const MAT_SKID = 3;
      world.setMaterial(MAT_SKID, 0.0);
      const boxBody = (p, half, mass, extra = {}) => {
        const body = world.addBody({ p, q: extra.q, invMass: 1 / mass, invI: boxInv(mass, ...half), flags: 1 | 8 });
        return body;
      };
      const boxCol = (body, half, material, localPos = [0, 0, 0]) =>
        world.addCollider({ body, shape: 2, material, localPos, params: [...half, Math.hypot(...half)] });
      if (scene === 'slab') {
        // Heavy slab: grippy deck on frictionless skids. The car's tyres push it back.
        const m = 2500, half = [6, 0.15, 30];
        const body = boxBody([0, 0.25, 0], [6, 0.25, 30], m);
        boxCol(body, half, MAT_GROUND, [0, 0.1, 0]);
        boxCol(body, half, MAT_SKID, [0, -0.1, 0]);
        // Cones along the world so the slab's motion reads on camera.
        for (let z = -40; z <= 40; z += 8) staticBox([8.5, 0.5, z], [0.25, 0.5, 0.25]);
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.0, spawnAt[1] ?? -20], spawnAt[2] ?? 0);
      } else if (scene === 'seesaw') {
        // Low pivot, long plank resting on its near (-Z) end; the car's weight tips it.
        staticBox([0, 0.25, 0], [2.6, 0.25, 0.2]);
        // Centre 1 m on the near side so the plank rests on its near end until the car's
        // weight crosses the pivot.
        const tilt = -Math.atan(0.5 / 8);
        const body = boxBody([0, 0.58 - Math.tan(-tilt), -1], [2.2, 0.08, 7], 250, { q: qAxis([1, 0, 0], tilt) });
        boxCol(body, [2.2, 0.08, 7], MAT_GROUND);
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.0, spawnAt[1] ?? -16], spawnAt[2] ?? 0);
      } else if (scene === 'carry') {
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.0, spawnAt[1] ?? 0], spawnAt[2] ?? 0);
        // Parked kart (handbrake on) riding on the truck's roof.
        addVehicle('kart', [spawnAt[0] ?? 0, 4.0, spawnAt[1] ?? 0], spawnAt[2] ?? 0, { forward: 0, steer: 0, handbrake: 1 });
      } else if (scene === 'bridge') {
        // Mirrors bridge() in tests/vehicle.rs: five 2.6 m timber planks (200 kg/m)
        // span a 12 m gap 3 m up, resting on the abutment seats. Each seam has four
        // ball-joint bolts (top and bottom corners) rated 220 kN, so the deck carries
        // bending as a bolt couple: ~100 kN at rest, ~190 kN under the sedan, ~250 kN
        // under the monster truck, which snaps them and falls through.
        const Y = 3.0, N = 5, LEN = 2.6, GAP = 0.005, HX = 2.2, HY = 0.1, HZ = LEN / 2;
        const MASS = 200 * LEN, BOLT_K = 1e8, BOLT_BREAK = 220e3;
        const pitch = LEN + GAP, endZ = N * pitch - GAP, seat = 0.5, roadHalf = 30, roadX = HX + 0.3;
        const seatTop = Y - 2 * HY;
        staticBox([0, Y / 2, -GAP - roadHalf], [roadX, Y / 2, roadHalf]);
        staticBox([0, Y / 2, endZ + GAP + roadHalf], [roadX, Y / 2, roadHalf]);
        staticBox([0, seatTop / 2, (seat - GAP) / 2], [roadX, seatTop / 2, (seat + GAP) / 2]);
        staticBox([0, seatTop / 2, endZ - (seat - GAP) / 2], [roadX, seatTop / 2, (seat + GAP) / 2]);
        const planks = [];
        for (let i = 0; i < N; i++) {
          const body = boxBody([0, Y - HY, i * pitch + HZ], [HX, HY, HZ], MASS);
          boxCol(body, [HX, HY, HZ], MAT_GROUND);
          planks.push(body);
        }
        for (let i = 0; i + 1 < N; i++) {
          for (const [bx, by] of [[-0.8 * HX, -0.8 * HY], [0.8 * HX, -0.8 * HY], [-0.8 * HX, 0.8 * HY], [0.8 * HX, 0.8 * HY]]) {
            world.addJoint({
              bodyA: planks[i], bodyB: planks[i + 1], jointType: JOINT_BALL,
              anchorA: [bx, by, HZ + GAP / 2], anchorB: [bx, by, -HZ - GAP / 2],
              stiffness: Infinity, k: BOLT_K, breakForce: BOLT_BREAK,
            });
          }
        }
        bridgeBolts = (N - 1) * 4;
        // The light car first; the heavy vehicle waits behind it (Tab to drive it).
        addVehicle(presetName, [spawnAt[0] ?? 0, Y + 1.5, spawnAt[1] ?? -2.5], spawnAt[2] ?? 0);
        const heavy = qs.get('heavy') || 'monster_truck';
        if (!byName[heavy]) throw new Error(`unknown heavy preset ${heavy}`);
        addVehicle(heavy, [0, Y + 2, -11], 0, { forward: 0, steer: 0, handbrake: 1 });
      } else if (scene === 'sidewall') {
        // Light crates in two rows that only the tyre outlines reach (outside the body,
        // off the ray lines): the wheel shells shove them.
        for (let i = 0; i < 8; i++) for (const x of [-1.15, 1.15]) {
          const body = boxBody([x, 0.2, 6 + i * 2.5], [0.3, 0.2, 0.3], 15);
          boxCol(body, [0.3, 0.2, 0.3], MAT_PROP);
        }
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.0, spawnAt[1] ?? 0], spawnAt[2] ?? 0);
      }
    } else {
      addVehicle(presetName, [spawnAt[0] ?? 0, 2.5, spawnAt[1] ?? -60], spawnAt[2] ?? 0);
      const kinds = ['sedan', 'sports', 'kart', 'jolt_default', 'destructible_sedan', 'monster_truck'];
      const cols = Math.ceil(Math.sqrt(nTraffic));
      for (let i = 0; i < nTraffic; i++) {
        const x = ((i % cols) - cols / 2) * 14, z = (Math.floor(i / cols) - cols / 2) * 14;
        const kind = kinds[i % kinds.length];
        addVehicle(kind, [x, kind === 'monster_truck' ? 3.5 : 2.2, z], rand() * 6.28,
          { forward: 0.2 + 0.25 * rand(), steer: (rand() < 0.5 ? -1 : 1) * (0.15 + 0.35 * rand()) });
      }
      for (let i = 0; i < 400; i++) dynBox([(rand() - 0.5) * 120, 0.5 + rand() * 6, (rand() - 0.5) * 120], [0.5, 0.5, 0.5], 30);
    }
    // Cannonballs: parked static spheres, launched by writing their body records.
    const cannon = [];
    for (let i = 0; i < 12; i++) {
      const body = world.addBody({ p: [-4000 - i * 5, -4000, -4000], flags: 0, invMass: 1 / 400, invI: [2.5 / (400 * 0.36), 2.5 / (400 * 0.36), 2.5 / (400 * 0.36)] });
      world.addCollider({ body, shape: 0, material: MAT_PROP, params: [0.6, 0, 0, 0.6] });
      cannon.push(body);
    }
    for (const v of vehicles) if (v.ai) world.vehicles.setInput(world.backend, v.h, v.ai);
    const initial = world.snapshot();
    // The controlled vehicle (Tab cycles; __record act 'player:<i>').
    let player = 0;
    statusEl.textContent = `scene ready · ${world.bodyCount} bodies · ${world.vehicles.vehicleCount} vehicles`;

    // ---------------------------------------------------------------- renderer
    const SHADER = /* wgsl */`
struct Body { position: vec3f, invMass: f32, orientation: vec4f, invInertia: vec3f, flags: u32,
  linearVel: vec3f, sleepTimer: f32, angularVel: vec3f, generation: u32, initialPos: vec3f, initialPad: f32, initialRot: vec4f };
struct Collider { body: u32, shape: u32, material: u32, generation: u32, localPos: vec3f, density: f32, localRot: vec4f, params: vec4f };
struct Frame { viewProj: mat4x4f, eye: vec4f, light: vec4f };
@group(0) @binding(0) var<storage, read> bodies: array<Body>;
@group(0) @binding(1) var<uniform> frame: Frame;
@group(0) @binding(2) var<storage, read> cols: array<Collider>;
@group(0) @binding(3) var<storage, read> vdata: array<vec4u>;

fn qrot(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}
fn hash(n: u32) -> f32 { var x = n * 747796405u + 2891336453u; x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u; return f32((x >> 22u) ^ x) / 4294967295.0; }
fn shade(c: vec3f, n: vec3f, w: vec3f) -> vec3f {
  let l = normalize(frame.light.xyz);
  let diff = max(dot(n, l), 0.0);
  let v = normalize(frame.eye.xyz - w);
  let spec = pow(max(dot(reflect(-l, n), v), 0.0), 32.0) * 0.25;
  let sky = 0.5 + 0.5 * n.y;
  let fog = clamp(length(frame.eye.xyz - w) / 260.0, 0.0, 1.0);
  return mix(c * (0.22 + 0.18 * sky + 0.75 * diff) + spec, vec3f(0.55, 0.62, 0.72), fog * fog);
}

struct Out { @builtin(position) clip: vec4f, @location(0) n: vec3f, @location(1) c: vec3f, @location(2) w: vec3f, @location(3) center: vec3f, @location(4) r: f32, @location(5) m: vec3f };

@vertex fn vsCol(@location(0) corner: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> Out {
  let ci = inst + 1u;
  let col = cols[ci];
  let b = bodies[col.body];
  var o: Out;
  o.r = 0.0; o.m = corner;
  let hidden = col.material == ${WHEEL_RIM_MATERIAL}u || b.position.y < -1000.0;
  var half = col.params.xyz;
  if (col.shape == 0u) { half = vec3f(col.params.x); o.r = col.params.x; }
  let q = vec4f(b.orientation);
  let lq = col.localRot;
  let local = col.localPos + qrot(lq, corner * half * 2.0);
  let w = b.position + qrot(q, local);
  o.w = w;
  o.center = b.position + qrot(q, col.localPos);
  o.n = qrot(q, qrot(lq, normal));
  o.clip = select(frame.viewProj * vec4f(w, 1.0), vec4f(0.0, 0.0, 2.0, 1.0), hidden);
  let dyn = b.invMass > 0.0 && (b.flags & 1u) != 0u;
  if ((b.flags & 16u) != 0u) {
    let hue = hash(col.body * 3u + 1u);

        const pos = lastChassis.p;
        const f = qrot(lastChassis.q, [0, 0, 1]);
        const flat = norm3([f[0], 0, f[2]]);
        const desiredT = [pos[0], pos[1] + 1.0, pos[2]];
        let desiredE;
        if (camMode === 'chase') {
          const d = chaseDist;
          desiredE = [pos[0] - flat[0] * d, pos[1] + d * 0.38, pos[2] - flat[2] * d];
        } else {
          const cp = Math.cos(orbit.pitch);
          desiredE = [pos[0] + orbit.dist * cp * Math.sin(orbit.yaw), pos[1] + orbit.dist * Math.sin(orbit.pitch), pos[2] + orbit.dist * cp * Math.cos(orbit.yaw)];
        }
        // Smooth the eye's offset from the target (not its world position) so a fast
        // vehicle stays the same size on screen instead of pulling away from the camera.
        const k = snap ? 1 : 1 - Math.pow(0.0015, dt);
        const off = sub3(camEye, camTarget), wantOff = sub3(desiredE, desiredT);
        camTarget = camTarget.map((x, i) => x + (desiredT[i] - x) * Math.min(1, k * 4));
        camEye = camTarget.map((x, i) => x + off[i] + (wantOff[i] - off[i]) * k);
      }
      if (!depth || depth.width !== canvas.width || depth.height !== canvas.height) {
        depth?.destroy();
        depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
      }
      frameF.set(viewProj(camEye, camTarget, canvas.width / canvas.height), 0);
      frameF.set([...camEye, 0], 16);
      frameF.set([0.4, 0.85, 0.3, 0], 20);
      device.queue.writeBuffer(frameBuf, 0, frameF);
    }
    function drawScene(enc) {
      const rp = enc.beginRenderPass({
        colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.55, 0.62, 0.72, 1], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      rp.setPipeline(groundPipe); rp.setBindGroup(0, groundBind); rp.setVertexBuffer(0, groundVbo); rp.draw(6);
      rp.setPipeline(colPipe); rp.setBindGroup(0, colBind); rp.setVertexBuffer(0, cubeVbo); rp.draw(36, world.colliderCount - 1);
      rp.setPipeline(wheelPipe); rp.setBindGroup(0, wheelBind); rp.setVertexBuffer(0, cylVbo); rp.draw(cyl.length / 6, world.vehicles.wheelCount);
      rp.end();
    }

    // ---------------------------------------------------------------- loop
    const stopAt = Number(qs.get('stopAt')) || 0;
    let inFlight = 0;
    let lastT = performance.now();
    let fpsAcc = 0, fpsN = 0, fpsShow = 0;
    const frameF = new Float32Array(24);
    function frame(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      fpsAcc += dt; fpsN++;
      if (fpsAcc > 0.5) { fpsShow = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
      if (rbFree.length === 0) { requestAnimationFrame(frame); return; }
      if (manual) {
        // Scripted via __step(): render only, never overwrite the scripted input.
        updateCamera(dt, false);
        const enc = device.createCommandEncoder();
        drawScene(enc);
        device.queue.submit([enc.finish()]);
        requestAnimationFrame(frame);
        return;
      }
      const input = readInput(dt);
      world.vehicles.setInput(world.backend, player, input);

      updateCamera(dt, false);
      const enc = device.createCommandEncoder();
      const frozen = stopAt > 0 && world.steps >= stopAt;
      if (!frozen) world.encodeStep(enc);
      drawScene(enc);
      const rb = rbFree.pop();
      encodeReadback(enc, rb);
      device.queue.submit([enc.finish()]);
      inFlight++;
      rb.mapAsync(GPUMapMode.READ).then(() => { decode(rb); rbFree.push(rb); inFlight--; updateHud(); }).catch(fail);
      statusEl.textContent = `${world.bodyCount} bodies · ${world.vehicles.vehicleCount} vehicles · step ${world.steps}${frozen ? ' (stopAt)' : ''} · ${fpsShow.toFixed(0)} fps`
        + (lastCounters ? ` · contacts ${lastCounters.contact} · awake ${lastCounters.awake}` : '') + ` · ${camMode} cam` + boltText();
      requestAnimationFrame(frame);
    }

    // Debug / automation hooks. __step(n, input) advances n physics steps without
    // rendering (rAF is throttled in background tabs) and returns the player state.
    let manual = false;
    window.__step = async (n = 1, input = null) => {
      manual = true;
      if (input) world.vehicles.setInput(world.backend, player, input);
      for (let i = 0; i < n; i++) {
        const enc = device.createCommandEncoder();
        world.encodeStep(enc);
        device.queue.submit([enc.finish()]);
        if (i % 30 === 29) await device.queue.onSubmittedWorkDone();
      }
      while (rbFree.length === 0) await new Promise((r) => setTimeout(r, 5));
      const rb = rbFree.pop();
      const enc = device.createCommandEncoder();
      encodeReadback(enc, rb);
      device.queue.submit([enc.finish()]);
      await rb.mapAsync(GPUMapMode.READ);
      decode(rb);
      rbFree.push(rb);
      updateHud();
      updateCamera(0, true);
      const renc = device.createCommandEncoder();
      drawScene(renc);
      device.queue.submit([renc.finish()]);
      return { steps: world.steps, chassis: lastChassis, state: lastState, counters: lastCounters };
    };
    // __record(script, {name, every, width, upload}) plays a scripted drive frame-locked
    // (one physics step per video frame at 60 Hz, independent of rAF timing) and PUTs
    // each composited frame (canvas + caption) as JPEG to `${upload}/${name}/f00000.jpg`.
    // Script items: {n, input?, act?: 'wheel:<i>'|'remove:<i>'|'part'|'cannon'|'reset',
    // cam?: 'chase' | {orbit: [yaw, pitch, dist], spin?}, caption?}.
    window.__record = async (script, opts = {}) => {
      manual = true;
      const name = opts.name || 'take';
      const every = opts.every || 1;
      const upload = opts.upload || '/rec';
      const W = Math.min(opts.width || 1280, canvas.width);
      const H = Math.round((W * canvas.height) / canvas.width / 2) * 2;
      const out = new OffscreenCanvas(W, H);
      const g = out.getContext('2d');
      let frameNo = 0, caption = '', spin = 0;
      const pending = new Set();
      const t0 = performance.now();
      for (const seg of script) {
        if (seg.input) world.vehicles.setInput(world.backend, player, seg.input);
        if (seg.caption !== undefined) caption = seg.caption;
        if (seg.cam === 'chase') { camMode = 'chase'; spin = 0; }
        else if (seg.cam && seg.cam.orbit) { camMode = 'orbit'; [orbit.yaw, orbit.pitch, orbit.dist] = seg.cam.orbit; spin = seg.cam.spin || 0; }
        if (seg.act) {
          const [a, arg] = seg.act.split(':');
          if (a === 'wheel') world.vehicles.detachWheel(world.backend, player, Number(arg));
          else if (a === 'remove') world.vehicles.disableWheel(world.backend, player, Number(arg));
          else if (a === 'part') severPart();
          else if (a === 'cannon') fireCannon();
          else if (a === 'reset') resetScene();
          else if (a === 'player') { world.vehicles.setInput(world.backend, player, { forward: 0, steer: 0, brake: 1 }); selectPlayer(Number(arg)); }
        }
        for (let i = 0; i < (seg.n || 0); i++) {
          orbit.yaw += spin;
          if (seg.cruise !== undefined && lastState) {
            // Hold a target forward speed (m/s) with throttle / brake.
            const e = seg.cruise - lastState.forwardSpeed;
            world.vehicles.setInput(world.backend, player, { ...(seg.input || {}), forward: Math.max(0, Math.min(1, e * 0.4)), brake: e < -1 ? Math.min(1, -e * 0.2) : 0 });
          }
          const enc = device.createCommandEncoder();
          world.encodeStep(enc);
          const rb = rbFree.pop();
          encodeReadback(enc, rb);
          device.queue.submit([enc.finish()]);
          await rb.mapAsync(GPUMapMode.READ);
          decode(rb);
          rbFree.push(rb);
          if (world.steps % every !== 0) continue;
          updateHud();
          updateCamera(1 / 60, frameNo === 0);
          const renc = device.createCommandEncoder();
          drawScene(renc);
          device.queue.submit([renc.finish()]);
          g.drawImage(canvas, 0, 0, W, H);
          const st = lastState;
          g.fillStyle = 'rgba(10,14,22,0.62)';
          g.fillRect(12, H - 74, Math.min(W - 24, 720), 62);
          g.fillStyle = '#fff';
          g.font = '600 22px system-ui, sans-serif';
          g.fillText(caption || playerDesc.name.replaceAll('_', ' '), 24, H - 46);
          g.font = '16px ui-monospace, monospace';
          if (st) {
            const gear = maxRpm ? (st.gear < 0 ? 'R' : st.gear === 0 ? 'N' : String(st.gear)) : 'D';
            g.fillText(bridgeBolts
              ? `${playerDesc.name.replaceAll('_', ' ')}  ${Math.abs(st.forwardSpeed * 3.6).toFixed(0).padStart(3)} km/h  bolts broken ${bolts.broken}/${bridgeBolts}  step ${world.steps}`
              : `${Math.abs(st.forwardSpeed * 3.6).toFixed(0).padStart(3)} km/h  gear ${gear}  ${maxRpm ? st.engineRpm.toFixed(0) + ' rpm' : ''}  yaw ${st.yawRate.toFixed(2)}  contacts ${st.contacts}  step ${world.steps}`, 24, H - 22);
          }
          const blob = await out.convertToBlob({ type: 'image/jpeg', quality: 0.88 });
          const p = fetch(`${upload}/${name}/f${String(frameNo++).padStart(5, '0')}.jpg`, { method: 'PUT', body: blob }).then(() => pending.delete(p));
          pending.add(p);
          if (pending.size > 16) await Promise.race(pending);
        }
      }
      await Promise.all(pending);
      return { name, frames: frameNo, width: W, height: H, seconds: (performance.now() - t0) / 1000, state: lastState, chassis: lastChassis };
    };
    // Chassis poses of every vehicle: [{name, p, up, speed}] (one GPU readback).
    window.__chassisPoses = async () => {
      const n = world.bodyCount * 112;
      const buf = device.createBuffer({ size: n, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(world.bufs[0], 0, buf, 0, n);
      device.queue.submit([enc.finish()]);
      await buf.mapAsync(GPUMapMode.READ);
      const f = new Float32Array(buf.getMappedRange().slice(0));
      buf.destroy();
      return vehicles.map((v) => {
        const o = world.vehicles.chassisBody(v.h) * 28;
        const q = [f[o + 4], f[o + 5], f[o + 6], f[o + 7]];
        return { name: v.name, p: [f[o], f[o + 1], f[o + 2]], up: qrot(q, [0, 1, 0]), speed: Math.hypot(f[o + 12], f[o + 13], f[o + 14]) };
      });
    };
    window.__vehicleState = () => lastState;
    window.__setVehicleInput = (h, input) => world.vehicles.setInput(world.backend, h, input);
    window.__world = world;
    renderParts();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
