<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Rubble vehicles — WebGPU AVBD</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; color: #dfe4ee; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: fixed; background: rgba(16, 19, 26, 0.78); border: 1px solid #2c3346; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px); }
    #hud { top: 12px; left: 12px; width: 21rem; max-width: calc(100vw - 48px); }
    #hud h1 { font-size: 15px; margin: 0 0 6px; font-weight: 650; }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
    .muted { color: #8d96aa; }
    select, button { background: #1d2333; color: #dfe4ee; border: 1px solid #3a4360; border-radius: 5px; padding: 3px 8px; font: inherit; cursor: pointer; }
    button:hover { border-color: #6c7aa6; }
    button:disabled { opacity: 0.4; cursor: default; }
    #err { color: #ff8e8e; white-space: pre-wrap; }
    #dash { right: 12px; bottom: 12px; width: 15rem; font-variant-numeric: tabular-nums; }
    #speed { font-size: 34px; font-weight: 700; line-height: 1; }
    #speed small { font-size: 13px; font-weight: 500; color: #8d96aa; }
    #gear { font-size: 26px; font-weight: 700; float: right; }
    .bar { height: 6px; background: #252c3d; border-radius: 3px; overflow: hidden; margin: 6px 0; }
    .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #4fb0ff, #ffb04f 75%, #ff5050); }
    #wheels { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
    .wheel { border: 1px solid #333c55; border-radius: 4px; padding: 2px 6px; font-size: 11px; }
    .wheel.contact { border-color: #4fb06a; }
    .wheel.slide { border-color: #ffb04f; }
    .wheel.gone { opacity: 0.35; text-decoration: line-through; }
    #parts { right: 12px; top: 12px; width: 15rem; max-height: 50vh; overflow: auto; }
    .part { display: flex; justify-content: space-between; align-items: center; margin: 3px 0; gap: 6px; }
    .part.lost span { opacity: 0.4; text-decoration: line-through; }
    kbd { background: #252c3d; border: 1px solid #3a4360; border-radius: 3px; padding: 0 4px; font-size: 11px; }
    @media (max-width: 700px) { #parts { display: none; } #dash { width: 11rem; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" class="panel">
    <h1>Rubble vehicles · Slang AVBD on WebGPU</h1>
    <div class="row">
      <label class="muted" for="sceneSel">Scene</label><select id="sceneSel"></select>
      <label class="muted" for="presetSel">Car</label><select id="presetSel"></select>
    </div>
    <div class="row muted" id="help">
      <span><kbd>W</kbd><kbd>S</kbd> drive/brake · <kbd>A</kbd><kbd>D</kbd> steer · <kbd>Space</kbd> handbrake</span>
      <span><kbd>X</kbd> sever a wheel · <kbd>P</kbd> sever a part · <kbd>B</kbd> cannonball · <kbd>R</kbd> reset · <kbd>C</kbd> camera · <kbd>Tab</kbd> switch vehicle</span>
    </div>
    <div class="row" id="gauntletUi" hidden>
      <label><input type="checkbox" id="guideOn" checked /> Directed debris</label>
      <select id="guideStrength"><option value="0">subtle</option><option value="1" selected>cinematic</option><option value="2">exaggerated</option></select>
      <label><input type="checkbox" id="shellOn" checked /> <span id="shellLabel">Shelling</span></label>
      <span class="muted"><kbd>F</kbd> <span id="shellKey">shell now</span></span>
    </div>
    <div id="guideStats" class="muted" hidden></div>
    <div id="status" class="muted">starting…</div>
    <div id="err"></div>
  </div>
  <div id="parts" class="panel" hidden>
    <div class="row" style="justify-content: space-between"><strong>Parts &amp; wheels</strong><span class="muted">sever / disable</span></div>
    <div id="partList"></div>
  </div>
  <div id="dash" class="panel">
    <span id="gear">N</span>
    <div id="speed">0 <small>km/h</small></div>
    <div class="bar"><div id="rpm"></div></div>
    <div class="muted" id="rpmText">— rpm</div>
    <div id="wheels"></div>
  </div>
  <script type="module">
    import { createWorld, sceneCapacity, colliderWords } from './world-host.mjs';
    import { L, M, WHEEL_RIM_MATERIAL, bitsf, centerOfMass, Gauntlet, MeteorRange } from './vehicle.mjs';
    import { createBuggyRenderer, BUGGY_SHADE_WGSL } from './buggy-render.mjs';
    import { duneBuggySoft, calibratedSettings } from './soft.mjs';

    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const fail = (e) => { errEl.textContent = String((e && e.stack) || e); statusEl.textContent = 'stopped'; };
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });
    addEventListener('error', (e) => fail(e.error || e.message));

    const qs = new URLSearchParams(location.search);
    const SCENES = {
      playground: 'Playground: ramps, stacks, wall',
      destruction: 'Destruction yard: sever parts',
      traffic: 'Traffic: many AI vehicles',
      slab: 'Lab: car on a slab sliding on ice',
      seesaw: 'Lab: seesaw plank',
      carry: 'Lab: kart riding on a truck',
      sidewall: 'Lab: crates beside the tyres',
      bridge: 'Lab: plank bridge with breakable bolts',
      tanklab: 'Lab: tank over rubble, logs and a ledge',
      buggies: 'Dune buggies: jumps, walls, cannon (parts break off under load)',
      vibeland: 'vibe-land garage: all seven, jumps, walls, cannon',
      gauntlet: 'Gauntlet: drive a shelled street (directed debris)',
      meteors: 'Meteor range: steered vs unsteered lanes (directed debris)',
    };
    const scene = qs.get('scene') || 'playground';
    if (!SCENES[scene]) throw new Error(`unknown scene ${scene}`);
    const presets = await (await fetch('./generated/vehicle_presets.json', { cache: 'no-store' })).json();
    const byName = Object.fromEntries(presets.map((p) => [p.name, p]));
    const presetName = qs.get('preset') || (scene === 'destruction' ? 'destructible_sedan' : scene === 'carry' || scene === 'gauntlet' ? 'monster_truck' : scene === 'tanklab' ? 'tank' : scene === 'buggies' || scene === 'vibeland' ? 'dune_buggy' : 'sedan');
    if (!byName[presetName]) throw new Error(`unknown preset ${presetName}; have ${Object.keys(byName).join(', ')}`);
    // ?tracks=shells: the tank as it was before track pods (wheel shells, belly 1 m up),
    // for side-by-side comparisons.
    if (qs.get('tracks') === 'shells' && byName[presetName].tracks) {
      const d = structuredClone(byName[presetName]);
      d.tracks.left.pod = null;
      d.tracks.right.pod = null;
      const belly = d.parts.findIndex((p) => p.name === 'belly');
      if (belly >= 0) d.parts[0].mass += d.parts.splice(belly, 1)[0].mass;
      d.name += '_shells';
      byName[presetName] = d;
    }

    const sceneSel = document.getElementById('sceneSel');
    const presetSel = document.getElementById('presetSel');
    for (const [id, t] of Object.entries(SCENES)) sceneSel.add(new Option(t, id, false, id === scene));
    for (const p of presets) if (!p.name.endsWith('_trailer')) presetSel.add(new Option(p.name.replaceAll('_', ' '), p.name, false, p.name === presetName));
    const go = (k, v) => { const u = new URL(location.href); u.searchParams.set(k, v); if (k === 'scene') u.searchParams.delete('preset'); location.href = u.href; };
    sceneSel.onchange = () => go('scene', sceneSel.value);
    presetSel.onchange = () => go('preset', presetSel.value);
    if (scene === 'buggies' || scene === 'vibeland' || (byName[presetName].parts || []).some((p, i) => i > 0 && p.mount?.break_force > 0)) {
      const label = document.createElement('label');
      label.className = 'muted'; label.htmlFor = 'strengthSel'; label.textContent = 'Mounts';
      const sel = document.createElement('select');
      sel.id = 'strengthSel';
      for (const [k, t] of [[1, 'rated'], [0.5, '½ strength'], [0.25, '¼ strength'], [0.1, 'fragile']]) sel.add(new Option(t, k, false, Number(qs.get('strength') || 1) === k));
      sel.onchange = () => go('strength', sel.value);
      presetSel.parentElement.append(label, sel);
      if (scene === 'buggies' || scene === 'vibeland') {
        const bl = document.createElement('label');
        bl.className = 'muted'; bl.htmlFor = 'buildSel'; bl.textContent = 'Frame';
        const bs = document.createElement('select');
        bs.id = 'buildSel';
        for (const [k, t] of [['rigid', 'rigid parts'], ['hybrid', 'soft frame + rigid parts']]) bs.add(new Option(t, k, false, (qs.get('build') || 'rigid') === k));
        bs.onchange = () => go('build', bs.value);
        presetSel.parentElement.append(bl, bs);
      }
    }

    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('no WebGPU adapter');
    const device = await adapter.requestDevice({
      requiredLimits: {
        maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        maxBufferSize: adapter.limits.maxBufferSize,
      },
    });
    device.lost.then((i) => fail('device lost: ' + i.message));
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + ((e.error && e.error.message) || e.error)));
    const canvas = document.getElementById('c');
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    const configure = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      context.configure({ device, format, alphaMode: 'opaque' });
    };
    configure();
    addEventListener('resize', configure);

    // ---------------------------------------------------------------- scene
    const nTraffic = scene === 'traffic' ? Math.max(1, Math.min(60, Number(qs.get('vehicles')) || 48)) : 0;
    const est = scene === 'traffic' ? 4000 + nTraffic * 40 : scene === 'gauntlet' ? 9000 : 6000;
    const cap = sceneCapacity(est, est * 2);
    const vehicleCap = { maxVehicles: 64, maxWheels: 1024, maxCurvePoints: 8192, maxDiffs: 256, maxAntiRolls: 256, maxParts: 512, maxRays: 64 };
    // ?build=hybrid (buggies scene): node-beam frames with bolted parts on joints
    // (engine_softbody::buggy), stepped as the soft-body demo: 240 Hz, 4 steps a frame.
    const hybrid = (scene === 'buggies' || scene === 'vibeland') && qs.get('build') === 'hybrid';
    const SOFT_HZ = 240;
    const STEPS_PER_FRAME = hybrid ? Math.round(SOFT_HZ / 60) : 1;
    if (hybrid) cap.maxJoints = 1024;
    const world = await createWorld(device, { cap, vehicleCap, ...(hybrid ? { softCap: {} } : {}), ...(scene === 'gauntlet' || scene === 'meteors' ? { guidance: {} } : {}), status: (s) => { statusEl.textContent = s; } });
    // The bridge needs 20 iterations to converge its bending within a fast crossing
    // (tests/vehicle.rs BRIDGE_ITERATIONS).
    world.params.iterations = scene === 'bridge' ? 20 : 8;
    if (hybrid) {
      Object.assign(world.params, { dt: 1 / SOFT_HZ, iterations: 10, gravityY: -9.81, betaLin: 1e7 });
      // Rigid mode (on unless ?rigid=0): a buggy that only drives rides its core
      // (drives exactly as the rigid buggy); any contact turns it soft that step.
      world.setSoftSettings({ ...calibratedSettings(SOFT_HZ), rigid_mode: qs.get('rigid') !== '0' });
      world.setMaterial(9, 0.8); // node spheres
    }
    const sleepQ = qs.get('sleep');
    if (sleepQ === 'off') world.params.sleepTime = 1e6;
    const MAT_GROUND = 0, MAT_PROP = 1, MAT_ICE = 2;
    // Meteor range colours (the renderer keys static bodies on these).
    const MAT_PAD = 4, MAT_HIT = 5, MAT_MISS = 6;
    world.setMaterial(MAT_GROUND, 1.0);
    world.setMaterial(MAT_PROP, 0.6);
    world.setMaterial(MAT_ICE, 0.08);
    world.setMaterial(WHEEL_RIM_MATERIAL, 0.9);

    const qAxis = (ax, ang) => { const s = Math.sin(ang / 2); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(ang / 2)]; };
    const boxInv = (m, hx, hy, hz) => [3 / (m * (hy * hy + hz * hz)), 3 / (m * (hx * hx + hz * hz)), 3 / (m * (hx * hx + hy * hy))];
    const staticBox = (p, half, q = [0, 0, 0, 1], material = MAT_PROP) => {
      const body = world.addBody({ p, q, flags: 0 });
      world.addCollider({ body, shape: 2, material, params: [...half, Math.hypot(...half)] });
      return body;
    };
    const dynBox = (p, half, mass, q = [0, 0, 0, 1]) => {
      const body = world.addBody({ p, q, invMass: 1 / mass, invI: boxInv(mass, ...half), flags: 1 | 8 });
      world.addCollider({ body, shape: 2, material: MAT_PROP, params: [...half, Math.hypot(...half)] });
      return body;
    };
    const dynBall = (p, r, mass, v = [0, 0, 0]) => {
      const i = 2.5 / (mass * r * r);
      const body = world.addBody({ p, invMass: 1 / mass, invI: [i, i, i], flags: 1 | 8, v });
      world.addCollider({ body, shape: 0, material: MAT_PROP, params: [r, 0, 0, r] });
      return body;
    };
    // Ground slab (collider 0; the renderer draws it as a plane).
    staticBox([0, -5, 0], [400, 5, 400], [0, 0, 0, 1], MAT_GROUND);

    // ?strength=k scales every mount limit (1 = the rated joints, smaller = more fragile).
    const strength = Math.max(0.01, Number(qs.get('strength')) || 1);
    const withStrength = (d) => {
      if (strength === 1) return d;
      d = structuredClone(d);
      const scaleMount = (m) => { if (m) { m.break_force *= strength; m.break_torque *= strength; } };
      d.parts.forEach((part) => scaleMount(part.mount));
      d.wheels.forEach((w) => scaleMount(w.mount));
      return d;
    };
    const vehicles = []; // {h, preset, ai, soft?}
    const addVehicle = (name, p, yaw = 0, ai = null) => {
      if (hybrid && name === 'dune_buggy') {
        // The soft frame stands on its core's wheels from the ground up.
        const desc = duneBuggySoft(strength);
        const s = world.addSoftVehicle(desc, [p[0], 0.1, p[2]], qAxis([0, 1, 0], yaw));
        const h = world.soft.entries[s].core.vehicle;
        vehicles.push({ h, name, ai, soft: s, softDesc: desc });
        return h;
      }
      const q = qAxis([0, 1, 0], yaw);
      const h = world.vehicles.addVehicle(world.backend, withStrength(byName[name]), p, q);
      const v = { h, name, ai };
      vehicles.push(v);
      if (name === 'vibe_semi') {
        // Its flatbed: a vehicle of its own, placed so the two hitch points meet
        // (both design spaces share the origin), joined there by a ball joint.
        const trailer = byName.vibe_semi_trailer;
        const oc = world.vehicles.entries[h].origin, ot = centerOfMass(trailer);
        const d = qrotJs(q, ot.map((x, k) => x - oc[k]));
        const t = world.vehicles.addVehicle(world.backend, trailer, p.map((x, k) => x + d[k]), q);
        const hitch = [0, 1.12, -2.3]; // presets::VIBE_SEMI_HITCH
        world.addBallJoint({ bodyA: world.vehicles.chassisBody(h), bodyB: world.vehicles.chassisBody(t),
          anchorA: hitch.map((x, k) => x - oc[k]), anchorB: hitch.map((x, k) => x - ot[k]) });
        v.trailer = t;
      }
      return h;
    };
    function qrotJs(q, v) {
      const [x, y, z, w] = q, d = 2 * (x * v[0] + y * v[1] + z * v[2]), s = w * w - (x * x + y * y + z * z);
      const c = [y * v[2] - z * v[1], z * v[0] - x * v[2], x * v[1] - y * v[0]];
      return [x * d + v[0] * s + c[0] * 2 * w, y * d + v[1] * s + c[1] * 2 * w, z * d + v[2] * s + c[2] * 2 * w];
    }

    // Gauntlet: the street's shelling state and its facade blocks (bodies first..first+count).
    const street = scene === 'gauntlet' ? new Gauntlet() : null;
    const range = scene === 'meteors';
    const blocks = { first: 0, count: 0, parked: [] };
    // Meteor range: launched meteors and their touchdown markers.
    const meteors = { first: 0, count: 36, markerFirst: 0, markers: 60, next: 0, nextMarker: 0, volley: 0, flying: [], landed: [], score: [[0, 0], [0, 0]] };
    let rng = 7;
    let bridgeBolts = 0; // breakable joints in the scene (bridge)
    // ?spawn=x,z,yaw places the player vehicle (yaw in radians about +Y).
    const spawnAt = (qs.get('spawn') || '').split(',').filter(Boolean).map(Number);
    const rand = () => { rng = (Math.imul(rng, 1103515245) + 12345) >>> 0; return rng / 2 ** 32; };
    if (scene === 'playground' || scene === 'destruction') {
      addVehicle(presetName, [spawnAt[0] ?? 0, 2.5, spawnAt[1] ?? 0], spawnAt[2] ?? 0);
      // Ramps (static, rotated about X), a long hill and a kicker.
      staticBox([0, 0.6, 30], [4, 0.4, 6], qAxis([1, 0, 0], -0.22));
      staticBox([0, 1.95, 41], [4, 0.4, 5.5], [0, 0, 0, 1]);
      staticBox([0, 0.6, 52], [4, 0.4, 6], qAxis([1, 0, 0], 0.22));
      staticBox([-22, 0.9, 10], [3, 0.3, 4], qAxis([1, 0, 0], -0.32));
      staticBox([24, 0.0, -20], [10, 1.5, 14], qAxis([0, 0, 1], 0.18));
      // Ice patch.
      staticBox([-30, -0.02, -25], [12, 0.05, 12], [0, 0, 0, 1], MAT_ICE);
      // Bollards (small statics).
      for (let i = 0; i < 8; i++) staticBox([-12 + i * 3.4, 0.6, 18], [0.25, 0.6, 0.25]);
      // Box stacks.
      for (const [x, z] of [[8, 26], [-10, 32], [14, 40]]) {
        for (let y = 0; y < 5; y++) for (let i = 0; i < 4 - (y >> 1); i++) dynBox([x + (i - 1.5) * 1.05, 0.5 + y * 1.0, z], [0.5, 0.5, 0.5], 40);
      }
      // Brick wall.
      for (let c = 0; c < 8; c++) for (let i = 0; i < 14; i++) dynBox([-20 + i * 1.02 + (c & 1) * 0.5, 0.25 + c * 0.5, 60], [0.5, 0.25, 0.25], 12);
      // Balls.
      for (let i = 0; i < 6; i++) dynBall([20 + i * 2.2, 0.8, 6], 0.8, 60);
      if (scene === 'destruction') {
        addVehicle('destructible_sedan', [8, 2.5, -10], 1.2);
        addVehicle('destructible_sedan', [-8, 2.5, -12], -0.6);
        for (let c = 0; c < 6; c++) for (let i = 0; i < 10; i++) dynBox([12 + i * 1.02 + (c & 1) * 0.5, 0.25 + c * 0.5, -30], [0.5, 0.25, 0.25], 12);
      } else {
        addVehicle('monster_truck', [-14, 3.5, -12], 0.4);
        addVehicle('kart', [6, 1.5, -6], 2.0);
        addVehicle('six_wheel_truck', [18, 3, 22], -1.2);
      }
    } else if (scene === 'buggies' || scene === 'vibeland') {
      // Arena for vibe-land's vehicles: every part breaks off when its mount is
      // overloaded (MountDesc; engine/scenes/dune-buggy rates them from the
      // recipe's measured joints).
      addVehicle(presetName, [spawnAt[0] ?? 0, 1.5, spawnAt[1] ?? 0], spawnAt[2] ?? 0);
      // Perimeter berms.
      for (const [x, z, hx, hz] of [[0, 95, 60, 1], [0, -45, 60, 1], [60, 25, 1, 70], [-60, 25, 1, 70]]) staticBox([x, 1, z], [hx, 1, hz]);
      // Dunes ahead: a kicker, a tabletop with its down-ramp, then a step-down.
      staticBox([0, 0.55, 22], [3.5, 0.3, 4], qAxis([1, 0, 0], -0.3));
      staticBox([0, 1.6, 33], [3.5, 0.3, 5]);
      staticBox([0, 0.55, 44], [3.5, 0.3, 4], qAxis([1, 0, 0], 0.3));
      staticBox([-18, 0.7, 18], [3, 0.3, 5], qAxis([1, 0, 0], -0.22));
      staticBox([-18, 1.85, 30], [3, 0.3, 7]);
      // A concrete barrier row to crash into.
      for (let i = 0; i < 7; i++) staticBox([16 + i * 2.2, 0.5, 8], [1, 0.5, 0.3]);
      // Brick wall and crate stacks.
      for (let c = 0; c < 6; c++) for (let i = 0; i < 12; i++) dynBox([-12 + i * 1.02 + (c & 1) * 0.5, 0.25 + c * 0.5, 70], [0.5, 0.25, 0.25], 12);
      for (const [x, z] of [[20, 40], [-30, 50]]) {
        for (let y = 0; y < 4; y++) for (let i = 0; i < 4 - (y >> 1); i++) dynBox([x + (i - 1.5) * 1.05, 0.5 + y * 1.0, z], [0.5, 0.5, 0.5], 40);
      }
      if (scene === 'buggies') {
        // Parked buggies: targets for the cannon (B) and for ramming.
        for (const [x, z, yaw] of [[12, -12, 1.57], [-12, -12, -1.57], [30, 20, 0.6], [-30, 15, -2.2]]) addVehicle('dune_buggy', [x, 1.5, z], yaw);
        // A heavy ball dropped on the first one's engine and fuel tank as the scene
        // starts (it faces +X: its tail is at -X).
        dynBall([10.8, 9, -12], 0.7, 900);
      } else {
        // The catalog, parked in a row behind the start (Tab drives the next one).
        const lineup = ['dune_buggy', 'vibe_trophy', 'vibe_rally', 'vibe_monster', 'vibe_derby', 'vibe_sprint', 'vibe_semi'];
        lineup.forEach((name, i) => addVehicle(name, [-24 + i * 8, name === 'vibe_monster' ? 1.2 : 0.8, -16], 0));
      }
    } else if (scene === 'meteors') {
      // engine-vehicle-wasm meteors.rs: two lanes of target pads; the left one is
      // steered. The car only anchors the camera, between the lanes.
      const g = JSON.parse(MeteorRange.range());
      addVehicle(presetName, [0, 2.2, 18], 0);
      for (const p of g.pads) staticBox([p.p[0], p.half[1], p.p[2]], p.half, [0, 0, 0, 1], MAT_PAD);
      // Parked meteors (static until launched) and touchdown markers (collide with nothing).
      meteors.first = world.bodyCount;
      for (let i = 0; i < meteors.count; i++) {
        const body = world.addBody({ p: [-3000 - i * 3, -3000, -3000], flags: 0 });
        world.addCollider({ body, shape: 0, material: MAT_PROP, params: [g.radius, 0, 0, g.radius] });
      }
      meteors.markerFirst = world.bodyCount;
      for (let i = 0; i < meteors.markers; i++) {
        const body = world.addBody({ p: [-3000 - i * 3, -3000, -2000], flags: 0 });
        const c = world.addColliderWords(colliderWords({ body, shape: 2, material: MAT_MISS, generation: 0x8000, localPos: [0, 0, 0], density: 0, localRot: [0, 0, 0, 1], params: [0.25, 0.06, 0.25, 0.36] }));
        if (i === 0) meteors.markerCollider = c;
      }
      meteors.radius = g.radius; meteors.mass = g.mass;
    } else if (scene === 'gauntlet') {
      // engine-vehicle-wasm gauntlet.rs: masonry facades on both sides of a street,
      // static cores behind them and parked cars at the kerbs. Facade blocks stay
      // static (held by the frame) until a blast launches them (fireShell).
      const g = JSON.parse(street.layout());
      addVehicle(presetName, g.spawn, 0);
      for (const c of g.cores) staticBox(c.p, c.half);
      blocks.first = world.bodyCount;
      for (const b of g.blocks) {
        const body = world.addBody({ p: b.p, flags: 0 });
        const c = world.addCollider({ body, shape: 2, material: MAT_PROP, params: [...b.half, Math.hypot(...b.half)] });
        world.colliderInfo[c].dynamic = true; // a launched block sizes the grid cell
      }
      blocks.count = g.blocks.length;
      blocks.layout = g.blocks;
      for (const c of g.parked) blocks.parked.push(addVehicle('sedan', c.p, c.yaw, { forward: 0, steer: 0, handbrake: 1 }));
    } else if (scene !== 'traffic') {
      // Two-way coupling labs: each mirrors a test in tests/vehicle.rs.
      const MAT_SKID = 3;
      world.setMaterial(MAT_SKID, 0.0);
      const boxBody = (p, half, mass, extra = {}) => {
        const body = world.addBody({ p, q: extra.q, invMass: 1 / mass, invI: boxInv(mass, ...half), flags: 1 | 8 });
        return body;
      };
      const boxCol = (body, half, material, localPos = [0, 0, 0]) =>
        world.addCollider({ body, shape: 2, material, localPos, params: [...half, Math.hypot(...half)] });
      if (scene === 'slab') {
        // Heavy slab: grippy deck on frictionless skids. The car's tyres push it back.
        const m = 2500, half = [6, 0.15, 30];
        const body = boxBody([0, 0.25, 0], [6, 0.25, 30], m);
        boxCol(body, half, MAT_GROUND, [0, 0.1, 0]);
        boxCol(body, half, MAT_SKID, [0, -0.1, 0]);
        // Cones along the world so the slab's motion reads on camera.
        for (let z = -40; z <= 40; z += 8) staticBox([8.5, 0.5, z], [0.25, 0.5, 0.25]);
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.0, spawnAt[1] ?? -20], spawnAt[2] ?? 0);
      } else if (scene === 'seesaw') {
        // Low pivot, long plank resting on its near (-Z) end; the car's weight tips it.
        staticBox([0, 0.25, 0], [2.6, 0.25, 0.2]);
        // Centre 1 m on the near side so the plank rests on its near end until the car's
        // weight crosses the pivot.
        const tilt = -Math.atan(0.5 / 8);
        const body = boxBody([0, 0.58 - Math.tan(-tilt), -1], [2.2, 0.08, 7], 250, { q: qAxis([1, 0, 0], tilt) });
        boxCol(body, [2.2, 0.08, 7], MAT_GROUND);
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.0, spawnAt[1] ?? -16], spawnAt[2] ?? 0);
      } else if (scene === 'carry') {
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.0, spawnAt[1] ?? 0], spawnAt[2] ?? 0);
        // Parked kart (handbrake on) riding on the truck's roof.
        addVehicle('kart', [spawnAt[0] ?? 0, 4.0, spawnAt[1] ?? 0], spawnAt[2] ?? 0, { forward: 0, steer: 0, handbrake: 1 });
      } else if (scene === 'bridge') {
        // Mirrors bridge() in tests/vehicle.rs: five 2.6 m timber planks (200 kg/m)
        // span a 12 m gap 3 m up, resting on the abutment seats. Each seam has four
        // ball-joint bolts (top and bottom corners) rated 255 kN, so the deck carries
        // bending as a bolt couple: ~100 kN at rest, ~205 kN under the sedan, ~320 kN
        // under the monster truck, which snaps them. Below ~9 m/s it falls through;
        // faster, the deck folds behind it and it makes it over.
        const Y = 3.0, N = 5, LEN = 2.6, GAP = 0.005, HX = 2.2, HY = 0.1, HZ = LEN / 2;
        const MASS = 200 * LEN, BOLT_K = 1e8, BOLT_BREAK = 255e3;
        const pitch = LEN + GAP, endZ = N * pitch - GAP, seat = 0.5, roadHalf = 30, roadX = HX + 0.3;
        const seatTop = Y - 2 * HY;
        staticBox([0, Y / 2, -GAP - roadHalf], [roadX, Y / 2, roadHalf]);
        staticBox([0, Y / 2, endZ + GAP + roadHalf], [roadX, Y / 2, roadHalf]);
        staticBox([0, seatTop / 2, (seat - GAP) / 2], [roadX, seatTop / 2, (seat + GAP) / 2]);
        staticBox([0, seatTop / 2, endZ - (seat - GAP) / 2], [roadX, seatTop / 2, (seat + GAP) / 2]);
        const planks = [];
        for (let i = 0; i < N; i++) {
          const body = boxBody([0, Y - HY, i * pitch + HZ], [HX, HY, HZ], MASS);
          boxCol(body, [HX, HY, HZ], MAT_GROUND);
          planks.push(body);
        }
        for (let i = 0; i + 1 < N; i++) {
          for (const [bx, by] of [[-0.8 * HX, -0.8 * HY], [0.8 * HX, -0.8 * HY], [-0.8 * HX, 0.8 * HY], [0.8 * HX, 0.8 * HY]]) {
            // D6 ball bolt; its rows start at BOLT_K (the default kStart lets the span sag).
            world.addBallJoint({
              bodyA: planks[i], bodyB: planks[i + 1],
              anchorA: [bx, by, HZ + GAP / 2], anchorB: [bx, by, -HZ - GAP / 2],
              penalty: BOLT_K, breakForce: BOLT_BREAK,
            });
          }
        }
        bridgeBolts = (N - 1) * 4;
        // The light car first; the heavy vehicle waits behind it (Tab to drive it).
        addVehicle(presetName, [spawnAt[0] ?? 0, Y + 1.5, spawnAt[1] ?? -2.5], spawnAt[2] ?? 0);
        // ?heavy=none leaves the player alone (e.g. preset=monster_truck&spawn=0,-27).
        const heavy = qs.get('heavy') || 'monster_truck';
        if (heavy !== 'none') {
          if (!byName[heavy]) throw new Error(`unknown heavy preset ${heavy}`);
          addVehicle(heavy, [0, Y + 2, -11], 0, { forward: 0, steer: 0, handbrake: 1 });
        }
      } else if (scene === 'tanklab') {
        // Mirrors the tank tests in tests/vehicle.rs: rubble in the track paths, logs
        // across the lane, then a 0.6 m ledge (twice the road wheels' reach).
        for (let row = 0; row < 7; row++) for (const x of [-1.7, 0, 1.7]) {
          const h = row % 2 ? 0.175 : 0.12, z = 10 + row * 1.5, j = (row % 3 - 1) * 0.15;
          const body = boxBody([x + j, h, z], [h, h, h], 1500 * 8 * h * h * h);
          boxCol(body, [h, h, h], MAT_PROP);
        }
        for (const z of [24, 28]) {
          const half = [2.6, 0.2, 0.2];
          const body = boxBody([0, 0.2, z], half, 250);
          boxCol(body, half, MAT_PROP);
        }
        staticBox([0, 0.3, 36 + 25], [6, 0.3, 25], [0, 0, 0, 1], MAT_GROUND);
        for (let z = 0; z <= 80; z += 8) staticBox([7.5, 0.5, z], [0.25, 0.5, 0.25]);
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.5, spawnAt[1] ?? 0], spawnAt[2] ?? 0);
      } else if (scene === 'sidewall') {
        // Light crates in two rows that only the tyre outlines reach (outside the body,
        // off the ray lines): the wheel shells shove them.
        for (let i = 0; i < 8; i++) for (const x of [-1.15, 1.15]) {
          const body = boxBody([x, 0.2, 6 + i * 2.5], [0.3, 0.2, 0.3], 15);
          boxCol(body, [0.3, 0.2, 0.3], MAT_PROP);
        }
        addVehicle(presetName, [spawnAt[0] ?? 0, 2.0, spawnAt[1] ?? 0], spawnAt[2] ?? 0);
      }
    } else {
      addVehicle(presetName, [spawnAt[0] ?? 0, 2.5, spawnAt[1] ?? -60], spawnAt[2] ?? 0);
      const kinds = ['sedan', 'sports', 'kart', 'jolt_default', 'destructible_sedan', 'monster_truck'];
      const cols = Math.ceil(Math.sqrt(nTraffic));
      for (let i = 0; i < nTraffic; i++) {
        const x = ((i % cols) - cols / 2) * 14, z = (Math.floor(i / cols) - cols / 2) * 14;
        const kind = kinds[i % kinds.length];
        addVehicle(kind, [x, kind === 'monster_truck' ? 3.5 : 2.2, z], rand() * 6.28,
          { forward: 0.2 + 0.25 * rand(), steer: (rand() < 0.5 ? -1 : 1) * (0.15 + 0.35 * rand()) });
      }
      for (let i = 0; i < 400; i++) dynBox([(rand() - 0.5) * 120, 0.5 + rand() * 6, (rand() - 0.5) * 120], [0.5, 0.5, 0.5], 30);
    }
    // Cannonballs: parked static spheres, launched by writing their body records.
    // Continuous collision (BODY_CCD, engine/docs/ccd.md): a 45 m/s ball gets a
    // time-of-impact contact instead of passing thin parts between steps; ?ccd=0
    // turns it off. The flag is inert on a parked (static) ball.
    const cannonCcd = new URLSearchParams(location.search).get('ccd') === '0' ? 0 : M.BODY_CCD;
    const cannon = [];
    for (let i = 0; i < 12; i++) {
      const body = world.addBody({ p: [-4000 - i * 5, -4000, -4000], flags: cannonCcd, invMass: 1 / 400, invI: [2.5 / (400 * 0.36), 2.5 / (400 * 0.36), 2.5 / (400 * 0.36)] });
      world.addCollider({ body, shape: 0, material: MAT_PROP, params: [0.6, 0, 0, 0.6] });
      cannon.push(body);
    }
    for (const v of vehicles) if (v.ai) world.vehicles.setInput(world.backend, v.h, v.ai);
    const initial = world.snapshot();
    // ---------------------------------------------------------------- directed debris (gauntlet)
    const guideOn = document.getElementById('guideOn'), guideStrength = document.getElementById('guideStrength');
    const shellOn = document.getElementById('shellOn'), guideStatsEl = document.getElementById('guideStats');
    if (street || range) {
      if (range) { document.getElementById('shellLabel').textContent = 'Volleys'; document.getElementById('shellKey').textContent = 'volley now'; }
      document.getElementById('gauntletUi').hidden = false;
      guideStatsEl.hidden = false;
      if (qs.get('guide') === '0') guideOn.checked = false;
      if (qs.get('strength')) guideStrength.value = qs.get('strength');
      guideOn.onchange = guideStrength.onchange = () => { applyGuidance(); guideOn.blur(); guideStrength.blur(); };
    }
    let guideZoneCount = 0;
    // The player chassis' height over the ground once it has settled (the zones
    // around it lie on the ground); a guess until then.
    let chassisRest = 0;
    function applyGuidance(rearm = true) {
      if (range) {
        const zones = JSON.parse(MeteorRange.zones());
        guideZoneCount = zones.length;
        world.setGuidance(JSON.parse(Gauntlet.settings(Number(guideStrength.value), guideOn.checked)), zones);
        return;
      }
      if (!street) return;
      const chassis = world.vehicles.chassisBody(vehicles[0].h);
      const zones = JSON.parse(street.zones(chassis, chassisRest || 0.8, Uint32Array.from(blocks.parked.map((h) => world.vehicles.chassisBody(h)))));
      guideZoneCount = zones.length;
      world.setGuidance(JSON.parse(Gauntlet.settings(Number(guideStrength.value), guideOn.checked)), zones);
      if (rearm) world.setGuided(blocks.first, blocks.count, 1);
    }
    applyGuidance();
    let lastShell = 0;
    // Blast the facade ahead of the player car (gauntlet.rs Gauntlet::blast).
    // Meteor range: launch the next volley into both lanes (meteors.rs volley).
    function fireVolley() {
      lastShell = world.steps;
      const r = meteors.radius, m = meteors.mass, inv = 2.5 / (m * r * r);
      for (const l of JSON.parse(MeteorRange.volley(meteors.volley++, world.params.gravityY))) {
        const body = meteors.first + (meteors.next++ % meteors.count);
        const words = new Uint32Array(world.bodyWords.buffer, body * 112, 28).slice();
        const f = new Float32Array(words.buffer);
        f.set(l.p, 0); f[3] = 1 / m; f.set([0, 0, 0, 1], 4); f.set([inv, inv, inv], 8); words[11] = 1 | 8;
        f.set(l.v, 12); f[15] = 0; f.set([0, 0, 0], 16); words[19] = world.steps; f.set(l.p, 20); f.set([0, 0, 0, 1], 24);
        world.backend.writeBody(body, words);
        world.setGuided(body, 1, l.tags);
        meteors.flying = meteors.flying.filter((x) => x.body !== body);
        meteors.landed = meteors.landed.filter((x) => x.body !== body);
        meteors.flying.push({ body, lane: l.lane, pad: l.pad, prev: null });
      }
    }
    // Touchdowns since the last call (meteors' first crossing of their resting
    // height, interpolated between reads): marked on the ground and scored.
    async function trackMeteors() {
      if (!meteors.flying.length) return;
      const f = new Float32Array((await world.readBodies(meteors.first, meteors.count)).buffer);
      const rest = meteors.radius + 0.05;
      for (const x of [...meteors.flying]) {
        const o = (x.body - meteors.first) * 28;
        const p = [f[o], f[o + 1], f[o + 2]];
        if (x.prev && x.prev[1] > rest && p[1] <= rest) {
          const s = (x.prev[1] - rest) / (x.prev[1] - p[1]);
          const at = [0, 1, 2].map((k) => x.prev[k] + s * (p[k] - x.prev[k]));
          const hit = MeteorRange.on_pad(x.lane, x.pad, at[0], at[1], at[2]);
          meteors.score[x.lane][0] += hit ? 1 : 0;
          meteors.log?.push({ lane: x.lane, pad: x.pad, at, hit, body: x.body });
          meteors.score[x.lane][1] += 1;
          const k = meteors.nextMarker++ % meteors.markers;
          const mk = meteors.markerFirst + k, ci = meteors.markerCollider + k;
          const words = new Uint32Array(world.bodyWords.buffer, mk * 112, 28).slice();
          new Float32Array(words.buffer).set([at[0], 0.07, at[2]], 0);
          world.backend.writeBody(mk, words);
          const cw = world.colliderWords.slice(ci * 16, ci * 16 + 16);
          cw[2] = hit ? MAT_HIT : MAT_MISS;
          world.backend.writeCollider(ci, cw);
          meteors.flying.splice(meteors.flying.indexOf(x), 1);
          meteors.landed.push({ body: x.body, step: world.steps });
        } else x.prev = p;
      }
      // Park meteors 1.5 s after they come down, so the range stays clear.
      while (meteors.landed.length && world.steps - meteors.landed[0].step > 90) {
        const { body } = meteors.landed.shift();
        if (meteors.flying.some((x) => x.body === body)) continue; // relaunched
        world.backend.writeBody(body, initialWords(body));
      }
    }
    const initialWords = (body) => initial.bodies.slice(body * 28, body * 28 + 28);
    function fireShell() {
      if (range) return fireVolley();
      if (!street || !lastChassis) return;
      lastShell = world.steps;
      const out = street.blast(lastChassis.p[0], lastChassis.p[2], lastChassis.v[2]);
      for (let k = 0, o = 4; k < out[3]; k++, o += 7) {
        // The static block becomes dynamic at its launch velocity and spin.
        const b = blocks.layout[out[o]], body = blocks.first + out[o];
        const words = new Uint32Array(world.bodyWords.buffer, body * 112, 28).slice();
        const f = new Float32Array(words.buffer);
        f[3] = 1 / b.mass; f.set(boxInv(b.mass, ...b.half), 8); words[11] = 1 | 8;
        f.set(out.subarray(o + 1, o + 4), 12); f[15] = 0; f.set(out.subarray(o + 4, o + 7), 16); words[19] = world.steps;
        world.backend.writeBody(body, words);
      }
      return { centre: [out[0], out[1], out[2]], blocks: out[3] };
    }
    let guideBusy = false, guideStatsStep = -1;
    function pollGuide() {
      if (range && !guideBusy && world.steps - guideStatsStep >= 6) {
        guideStatsStep = world.steps;
        guideBusy = true;
        trackMeteors().then(() => {
          guideBusy = false;
          const [a, b] = meteors.score;
          guideStatsEl.innerHTML = `<b>On target</b> · steered lane (left, x &gt; 0): <b>${a[0]}/${a[1]}</b> · unsteered lane (right): <b>${b[0]}/${b[1]}</b>`
            + (guideOn.checked ? '' : ' · steering off');
        }).catch(fail);
        return;
      }
      if (street && !chassisRest && world.steps > 90 && lastChassis) {
        chassisRest = lastChassis.p[1];
        applyGuidance(false);
      }
      if (!street || guideBusy || world.steps - guideStatsStep < 30) return;
      guideStatsStep = world.steps;
      guideBusy = true;
      Promise.all([world.guideStates(), world.guideClaims(guideZoneCount)]).then(([s, claims]) => {
        guideBusy = false;
        const cars = claims.slice(2).reduce((a, b) => a + b, 0);
        guideStatsEl.textContent = guideOn.checked
          ? `steering ${s.steering} · steered so far ${s.done} (arrived ${s.ended.arrived}, knocked off course ${s.ended.pushed}) · aimed: around car ${claims[0]}, behind ${claims[1]}, parked cars ${cars}`
          : 'directed debris off: blocks fly as thrown';
      }).catch(fail);
    }
    // The controlled vehicle (Tab cycles; __record act 'player:<i>').
    let player = 0;
    statusEl.textContent = `scene ready · ${world.bodyCount} bodies · ${world.vehicles.vehicleCount} vehicles`;

    // ---------------------------------------------------------------- renderer
    // Lighting shared with the dune buggy mesh (buggy-render.mjs); needs `frame`.
    const LIGHT_WGSL = BUGGY_SHADE_WGSL;
    // Hide bitset: bodies first, then vehicles from bit HIDE_VEHICLES.
    const HIDE_VEHICLES = Math.ceil(world.cap.maxBodies / 32) * 32;
    const SHADER = /* wgsl */`
struct Body { position: vec3f, invMass: f32, orientation: vec4f, invInertia: vec3f, flags: u32,
  linearVel: vec3f, sleepTimer: f32, angularVel: vec3f, generation: u32, initialPos: vec3f, initialPad: f32, initialRot: vec4f };
struct Collider { body: u32, shape: u32, material: u32, generation: u32, localPos: vec3f, density: f32, localRot: vec4f, params: vec4f };
struct Frame { viewProj: mat4x4f, eye: vec4f, light: vec4f };
@group(0) @binding(0) var<storage, read> bodies: array<Body>;
@group(0) @binding(1) var<uniform> frame: Frame;
@group(0) @binding(2) var<storage, read> cols: array<Collider>;
@group(0) @binding(3) var<storage, read> vdata: array<vec4u>;

${LIGHT_WGSL}
fn hash(n: u32) -> f32 { var x = n * 747796405u + 2891336453u; x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u; return f32((x >> 22u) ^ x) / 4294967295.0; }
// Bodies / vehicles drawn by a detailed mesh instead (buggy-render.mjs): bitsets.
@group(0) @binding(4) var<storage, read> hide: array<u32>;
fn bodyHidden(b: u32) -> bool { return (hide[b >> 5u] & (1u << (b & 31u))) != 0u; }
fn vehicleHidden(v: u32) -> bool { let i = ${HIDE_VEHICLES}u + v; return (hide[i >> 5u] & (1u << (i & 31u))) != 0u; }

struct Out { @builtin(position) clip: vec4f, @location(0) n: vec3f, @location(1) c: vec3f, @location(2) w: vec3f, @location(3) center: vec3f, @location(4) r: f32, @location(5) m: vec3f };

@vertex fn vsCol(@location(0) corner: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> Out {
  let ci = inst + 1u;
  let col = cols[ci];
  let b = bodies[col.body];
  var o: Out;
  o.r = 0.0; o.m = corner;
  let hidden = col.material == ${WHEEL_RIM_MATERIAL}u || b.position.y < -1000.0 || bodyHidden(col.body);
  var half = col.params.xyz;
  if (col.shape == 0u) { half = vec3f(col.params.x); o.r = col.params.x; }
  let q = vec4f(b.orientation);
  let lq = col.localRot;
  let local = col.localPos + qrot(lq, corner * half * 2.0);
  let w = b.position + qrot(q, local);
  o.w = w;
  o.center = b.position + qrot(q, col.localPos);
  o.n = qrot(q, qrot(lq, normal));
  o.clip = select(frame.viewProj * vec4f(w, 1.0), vec4f(0.0, 0.0, 2.0, 1.0), hidden);
  let dyn = b.invMass > 0.0 && (b.flags & 1u) != 0u;
  if ((b.flags & 32u) != 0u) { // BODY_VEHICLE
    let hue = hash(col.body * 3u + 1u);
    o.c = mix(vec3f(0.85, 0.12, 0.10), vec3f(0.10, 0.35, 0.85), step(0.5, hue));
    if (col.localPos.y > 0.15) { o.c = o.c * 1.15; }
  } else if (!dyn) {
    o.c = select(vec3f(0.55, 0.56, 0.6), vec3f(0.62, 0.8, 0.95), col.material == 2u);
    // Meteor range: target pads, and touchdown markers on target / off it.
    if (col.material == 4u) { o.c = vec3f(1.0, 0.55, 0.12); }
    if (col.material == 5u) { o.c = vec3f(0.2, 0.9, 0.3); }
    if (col.material == 6u) { o.c = vec3f(0.95, 0.15, 0.15); }
  } else if (col.shape == 0u) {
    o.c = vec3f(0.2, 0.22, 0.25);
  } else {
    let h = hash(col.body);
    o.c = mix(vec3f(0.85, 0.55, 0.25), vec3f(0.9, 0.78, 0.4), h);
    if ((b.flags & 4u) != 0u) { o.c = o.c * 0.7; }
  }
  return o;
}

@fragment fn fsCol(i: Out) -> @location(0) vec4f {
  var n = normalize(i.n);
  if (i.r > 0.0) {
    let rd = normalize(i.w - frame.eye.xyz);
    let oc = frame.eye.xyz - i.center;
    let b = dot(oc, rd);
    let h = b * b - (dot(oc, oc) - i.r * i.r);
    if (h < 0.0) { discard; }
    n = normalize(frame.eye.xyz + rd * (-b - sqrt(h)) - i.center);
  }
  return vec4f(shade(i.c, n, i.w), 1.0);
}

fn vf(i: u32) -> vec4f { return bitcast<vec4f>(vdata[i]); }

@vertex fn vsWheel(@location(0) mesh: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> Out {
  let bases = vdata[1u];
  let wr = bases.y + inst * ${L.WHEEL_STRIDE}u;
  let cfg = vdata[wr];
  let dynFlags = vdata[wr + ${L.W_C0}u].z;
  let vr = bases.x + cfg.x * ${L.VEH_STRIDE}u;
  let up = normalize(vf(vr + ${L.V_UP}u).xyz);
  let fwd = normalize(vf(vr + ${L.V_FWD}u).xyz);

    let mounts = { last: null };
    // Hybrid buggies: bolted parts whose joints all broke, and detached frame pieces
    // (break groups), from the joint and beam break events.
    const hybridParts = vehicles.filter((v) => v.soft !== undefined).flatMap((v) => world.soft.entries[v.soft].rigidParts.map((r) => ({ ...r, broken: 0 })));
    const jointOwner = new Map(hybridParts.flatMap((r) => Array.from({ length: r.joints[1] - r.joints[0] }, (_, k) => [r.joints[0] + k, r])));
    const brokenGroups = new Set();
    const softGroupNames = ['', 'front_bumper', 'rear_bumper', 'nose'];
    let mountPollStep = -1, mountPolling = false;
    function pollMounts() {
      if (!breakable || mountPolling || world.steps - mountPollStep < 15) return;
      mountPollStep = world.steps;
      mountPolling = true;
      if (hybrid) {
        world.pollJointBreaks().then((list) => {
          for (const j of list) {
            const r = jointOwner.get(j.joint);
            if (r && ++r.broken === r.joints[1] - r.joints[0]) mounts.last = `${r.name} at ${(j.force / 1000).toFixed(0)} kN`;
          }
          return world.pollBeamBreaks();
        }).then((list) => {
          for (const b of list || []) {
            const e = world.soft.entries[b.softBody];
            const v = vehicles.find((x) => x.soft === b.softBody);
            const g = v?.softDesc.beams[b.beam - e.firstBeam]?.break_group;
            if (g && !brokenGroups.has(`${b.softBody}:${g}`)) { brokenGroups.add(`${b.softBody}:${g}`); mounts.last = `${softGroupNames[g]} torn off`; }
          }
        }).catch(fail);
      }
      world.pollMountBreaks().then((list) => {
        mountPolling = false;
        for (const m of list) {
          const desc = world.vehicles.entries[m.vehicle]?.desc;
          mounts.last = `${m.wheel ? `wheel ${m.index}` : desc?.parts[m.index]?.name ?? `part ${m.index}`} at ${(m.force / 1000).toFixed(0)} kN`;
        }
      }).catch(fail);
    }
    // Counts from the buggies' latched masks (the event ring is shared with sleep and
    // wake events and may wrap between polls); the events name the latest break.
    const mountText = () => {
      if (!breakable) return '';
      const n = buggyMesh ? buggyMesh.broken() : { parts: 0, wheels: 0 };
      n.parts += hybridParts.filter((r) => r.broken === r.joints[1] - r.joints[0]).length + brokenGroups.size;
      return ` · broken off: ${n.parts} parts, ${n.wheels} wheels${mounts.last ? ` (last ${mounts.last})` : ''}`;
    };
    const boltText = () => bridgeBolts ? ` · bolts broken ${bolts.broken}/${bridgeBolts}${bolts.broken ? ` (last at ${(bolts.lastForce / 1000).toFixed(0)} kN)` : ''}` : '';
    function updateHud() {
      pollGuide();
      pollBolts();
      pollMounts();
      const st = lastState;
      if (!st) return;
      speedEl.innerHTML = `${Math.abs(st.forwardSpeed * 3.6).toFixed(0)} <small>km/h</small>`;
      gearEl.textContent = maxRpm ? (st.gear < 0 ? 'R' : st.gear === 0 ? 'N' : String(st.gear)) : 'D';
      rpmEl.style.width = maxRpm ? `${Math.min(100, (100 * st.engineRpm) / maxRpm)}%` : '0';
      rpmText.textContent = maxRpm ? `${st.engineRpm.toFixed(0)} rpm · clutch ${(st.clutch * 100).toFixed(0)}%${st.engineConnected ? '' : ' · ENGINE LOST'}` : `direct drive${st.engineConnected ? '' : ' · ENGINE LOST'}`;
      wheelsEl.innerHTML = st.wheels.map((w, i) => {
        const cls = w.detached || w.disabled ? 'gone' : w.sliding ? 'slide' : w.inContact ? 'contact' : '';
        return `<div class="wheel ${cls}">#${i} ${w.detached ? 'severed' : w.disabled ? 'removed' : `${(w.suspensionForce / 1000).toFixed(1)}kN · κ${w.slipRatio.toFixed(2)}`}</div>`;
      }).join('');
      const k = `${st.partsLost}/${st.wheels.map((w) => +w.detached + 2 * +w.disabled).join('')}`;
      if (k !== lastPartsKey) { lastPartsKey = k; renderParts(); }
      if (lastLoads) {
        // Each mount's heaviest load so far, as a share of its limit.
        for (const el of partList.querySelectorAll('.load')) {
          const l = el.dataset.part !== undefined ? lastLoads.find((x) => !x.wheel && x.index === +el.dataset.part) : lastLoads.find((x) => x.wheel && x.index === +el.dataset.wheel);
          el.textContent = l && l.breakForce < 1e29 ? `peak ${(100 * l.peakRatio).toFixed(0)}%` : '';
        }
      }
    }

    function updateCamera(dt, snap) {
      if (lastChassis) {
        const pos = lastChassis.p;
        const f = qrot(lastChassis.q, [0, 0, 1]);
        const flat = norm3([f[0], 0, f[2]]);
        const desiredT = [pos[0], pos[1] + 1.0, pos[2]];
        let desiredE;
        if (camMode === 'chase') {
          const d = chaseDist;
          desiredE = [pos[0] - flat[0] * d, pos[1] + d * 0.38, pos[2] - flat[2] * d];
        } else {
          const cp = Math.cos(orbit.pitch);
          desiredE = [pos[0] + orbit.dist * cp * Math.sin(orbit.yaw), pos[1] + orbit.dist * Math.sin(orbit.pitch), pos[2] + orbit.dist * cp * Math.cos(orbit.yaw)];
        }
        // Smooth the eye's offset from the target (not its world position) so a fast
        // vehicle stays the same size on screen instead of pulling away from the camera.
        const k = snap ? 1 : 1 - Math.pow(0.0015, dt);
        const off = sub3(camEye, camTarget), wantOff = sub3(desiredE, desiredT);
        camTarget = camTarget.map((x, i) => x + (desiredT[i] - x) * Math.min(1, k * 4));
        camEye = camTarget.map((x, i) => x + off[i] + (wantOff[i] - off[i]) * k);
      }
      if (!depth || depth.width !== canvas.width || depth.height !== canvas.height) {
        depth?.destroy();
        depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
      }
      frameF.set(viewProj(camEye, camTarget, canvas.width / canvas.height), 0);
      frameF.set([...camEye, 0], 16);
      frameF.set([0.4, 0.85, 0.3, 0], 20);
      device.queue.writeBuffer(frameBuf, 0, frameF);
    }
    function drawScene(enc) {
      const rp = enc.beginRenderPass({
        colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.55, 0.62, 0.72, 1], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      rp.setPipeline(groundPipe); rp.setBindGroup(0, groundBind); rp.setVertexBuffer(0, groundVbo); rp.draw(6);
      rp.setPipeline(colPipe); rp.setBindGroup(0, colBind); rp.setVertexBuffer(0, cubeVbo); rp.draw(36, world.colliderCount - 1);
      rp.setPipeline(wheelPipe); rp.setBindGroup(0, wheelBind); rp.setVertexBuffer(0, cylVbo); rp.draw(cyl.length / 6, world.vehicles.wheelCount);
      buggyMesh?.draw(rp);
      rp.end();
    }

    // ---------------------------------------------------------------- loop
    const stopAt = Number(qs.get('stopAt')) || 0;
    let inFlight = 0;
    let lastT = performance.now();
    let fpsAcc = 0, fpsN = 0, fpsShow = 0;
    const frameF = new Float32Array(24);
    function frame(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      fpsAcc += dt; fpsN++;
      if (fpsAcc > 0.5) { fpsShow = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
      if (rbFree.length === 0) { requestAnimationFrame(frame); return; }
      if (manual) {
        // Scripted via __step(): render only, never overwrite the scripted input.
        updateCamera(dt, false);
        const enc = device.createCommandEncoder();
        drawScene(enc);
        device.queue.submit([enc.finish()]);
        requestAnimationFrame(frame);
        return;
      }
      const input = readInput(dt);
      world.vehicles.setInput(world.backend, player, input);

      updateCamera(dt, false);
      const enc = device.createCommandEncoder();
      const frozen = stopAt > 0 && world.steps >= stopAt;
      if (range && shellOn.checked && !frozen && world.steps - lastShell >= 120) fireVolley();
      if (street && shellOn.checked && !frozen && lastChassis && lastChassis.p[2] > -12 && lastChassis.p[2] < 150 && world.steps - lastShell >= 70) fireShell();
      if (!frozen) for (let k = 0; k < STEPS_PER_FRAME; k++) world.encodeStep(enc);
      drawScene(enc);
      const rb = rbFree.pop();
      encodeReadback(enc, rb);
      const buggyRb = buggyMesh?.encodeReadback(enc);
      device.queue.submit([enc.finish()]);
      buggyMesh?.consume(buggyRb).catch(fail);
      inFlight++;
      rb.mapAsync(GPUMapMode.READ).then(() => { decode(rb); rbFree.push(rb); inFlight--; updateHud(); }).catch(fail);
      statusEl.textContent = `${world.bodyCount} bodies · ${world.vehicles.vehicleCount} vehicles · step ${world.steps}${frozen ? ' (stopAt)' : ''} · ${fpsShow.toFixed(0)} fps`
        + (lastCounters ? ` · contacts ${lastCounters.contact} · awake ${lastCounters.awake}` : '') + ` · ${camMode} cam` + boltText() + mountText();
      requestAnimationFrame(frame);
    }

    // Debug / automation hooks. __step(n, input) advances n physics steps without
    // rendering (rAF is throttled in background tabs) and returns the player state.
    let manual = false;
    window.__step = async (n = 1, input = null) => {
      manual = true;
      if (input) world.vehicles.setInput(world.backend, player, input);
      for (let i = 0; i < n; i++) {
        const enc = device.createCommandEncoder();
        world.encodeStep(enc);
        device.queue.submit([enc.finish()]);
        if (i % 30 === 29) await device.queue.onSubmittedWorkDone();
      }
      while (rbFree.length === 0) await new Promise((r) => setTimeout(r, 5));
      const rb = rbFree.pop();
      const enc = device.createCommandEncoder();
      encodeReadback(enc, rb);
      const buggyRb = buggyMesh?.encodeReadback(enc);
      device.queue.submit([enc.finish()]);
      await buggyMesh?.consume(buggyRb);
      await rb.mapAsync(GPUMapMode.READ);
      decode(rb);
      rbFree.push(rb);
      updateHud();
      updateCamera(0, true);
      const renc = device.createCommandEncoder();
      drawScene(renc);
      device.queue.submit([renc.finish()]);
      return { steps: world.steps, chassis: lastChassis, state: lastState, counters: lastCounters };
    };
    // __record(script, {name, every, width, upload}) plays a scripted drive frame-locked
    // (one physics step per video frame at 60 Hz, independent of rAF timing) and PUTs
    // each composited frame (canvas + caption) as JPEG to `${upload}/${name}/f00000.jpg`.
    // Script items: {n, input?, act?: 'wheel:<i>'|'remove:<i>'|'part'|'cannon'|'reset',
    // cam?: 'chase' | {orbit: [yaw, pitch, dist], spin?}, caption?}.
    window.__record = async (script, opts = {}) => {
      manual = true;
      const name = opts.name || 'take';
      const every = opts.every || 1;
      const upload = opts.upload || '/rec';
      const W = Math.min(opts.width || 1280, canvas.width);
      const H = Math.round((W * canvas.height) / canvas.width / 2) * 2;
      const out = new OffscreenCanvas(W, H);
      const g = out.getContext('2d');
      let frameNo = 0, caption = '', spin = 0;
      const pending = new Set();
      const t0 = performance.now();
      for (const seg of script) {
        if (seg.input) world.vehicles.setInput(world.backend, player, seg.input);
        if (seg.caption !== undefined) caption = seg.caption;
        if (seg.cam === 'chase') { camMode = 'chase'; spin = 0; }
        else if (seg.cam && seg.cam.orbit) { camMode = 'orbit'; [orbit.yaw, orbit.pitch, orbit.dist] = seg.cam.orbit; spin = seg.cam.spin || 0; }
        if (seg.act) {
          const [a, arg] = seg.act.split(':');
          if (a === 'wheel') world.vehicles.detachWheel(world.backend, player, Number(arg));
          else if (a === 'remove') world.vehicles.disableWheel(world.backend, player, Number(arg));
          else if (a === 'part') severPart();
          else if (a === 'cannon') fireCannon();
          else if (a === 'reset') resetScene();
          else if (a === 'player') { world.vehicles.setInput(world.backend, player, { forward: 0, steer: 0, brake: 1 }); selectPlayer(Number(arg)); }
        }
        for (let i = 0; i < (seg.n || 0); i++) {
          orbit.yaw += spin;
          if (seg.cruise !== undefined && lastState) {
            // Hold a target forward speed (m/s) with throttle / brake.
            const e = seg.cruise - lastState.forwardSpeed;
            world.vehicles.setInput(world.backend, player, { ...(seg.input || {}), forward: Math.max(0, Math.min(1, e * 0.4)), brake: e < -1 ? Math.min(1, -e * 0.2) : 0 });
          }
          // Frames the render loop queued before the take may still hold the readbacks.
          while (rbFree.length === 0) await new Promise((r) => setTimeout(r, 5));
          const enc = device.createCommandEncoder();
          for (let k = 0; k < STEPS_PER_FRAME; k++) world.encodeStep(enc);
          const rb = rbFree.pop();
          encodeReadback(enc, rb);
          const buggyRb = buggyMesh?.encodeReadback(enc);
          device.queue.submit([enc.finish()]);
          await buggyMesh?.consume(buggyRb);
          await rb.mapAsync(GPUMapMode.READ);
          decode(rb);
          rbFree.push(rb);
          if (world.steps % every !== 0) continue;
          updateHud();
          updateCamera(1 / 60, frameNo === 0);
          const renc = device.createCommandEncoder();
          drawScene(renc);
          device.queue.submit([renc.finish()]);
          g.drawImage(canvas, 0, 0, W, H);
          const st = lastState;
          g.fillStyle = 'rgba(10,14,22,0.62)';
          g.fillRect(12, H - 74, Math.min(W - 24, 720), 62);
          g.fillStyle = '#fff';
          g.font = '600 22px system-ui, sans-serif';
          g.fillText(caption || playerDesc.name.replaceAll('_', ' '), 24, H - 46);
          g.font = '16px ui-monospace, monospace';
          if (st) {
            const gear = maxRpm ? (st.gear < 0 ? 'R' : st.gear === 0 ? 'N' : String(st.gear)) : 'D';
            g.fillText(bridgeBolts
              ? `${playerDesc.name.replaceAll('_', ' ')}  ${Math.abs(st.forwardSpeed * 3.6).toFixed(0).padStart(3)} km/h  bolts broken ${bolts.broken}/${bridgeBolts}  step ${world.steps}`
              : `${Math.abs(st.forwardSpeed * 3.6).toFixed(0).padStart(3)} km/h  gear ${gear}  ${maxRpm ? st.engineRpm.toFixed(0) + ' rpm' : ''}  yaw ${st.yawRate.toFixed(2)}  contacts ${st.contacts}  step ${world.steps}`, 24, H - 22);
          }
          const blob = await out.convertToBlob({ type: 'image/jpeg', quality: 0.88 });
          const p = fetch(`${upload}/${name}/f${String(frameNo++).padStart(5, '0')}.jpg`, { method: 'PUT', body: blob }).then(() => pending.delete(p));
          pending.add(p);
          if (pending.size > 16) await Promise.race(pending);
        }
      }
      await Promise.all(pending);
      return { name, frames: frameNo, width: W, height: H, seconds: (performance.now() - t0) / 1000, state: lastState, chassis: lastChassis };
    };
    // Chassis poses of every vehicle: [{name, p, up, speed}] (one GPU readback).
    window.__chassisPoses = async () => {
      const n = world.bodyCount * 112;
      const buf = device.createBuffer({ size: n, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(world.bufs[0], 0, buf, 0, n);
      device.queue.submit([enc.finish()]);
      await buf.mapAsync(GPUMapMode.READ);
      const f = new Float32Array(buf.getMappedRange().slice(0));
      buf.destroy();
      return vehicles.map((v) => {
        const o = world.vehicles.chassisBody(v.h) * 28;
        const q = [f[o + 4], f[o + 5], f[o + 6], f[o + 7]];
        return { name: v.name, p: [f[o], f[o + 1], f[o + 2]], up: qrot(q, [0, 1, 0]), speed: Math.hypot(f[o + 12], f[o + 13], f[o + 14]) };
      });
    };
    window.__vehicleState = () => lastState;
    window.__cannon = (p, v) => fireCannonAt(p, v);
    // Gauntlet A/B take: from a reset, drive down the street at `cruise` m/s holding
    // its lane, shelling every `every` steps, with directed debris on or off. Each
    // launched block's first touchdown (sampled every 6 steps) is measured from
    // the car at that moment: `landings` histograms the plan-view distances (m),
    // `near` counts those within `near` m and `close` those within 2 m.
    window.__gauntletTake = async ({ steps = 720, guided = true, strength = 1, cruise = 11, every = 70, near = 6 } = {}) => {
      if (!street) throw new Error('not the gauntlet scene');
      guideOn.checked = guided; guideStrength.value = String(strength);
      resetScene();
      manual = true;
      const chassis = world.vehicles.chassisBody(vehicles[0].h);
      const n = world.bodyCount * 112;
      const buf = device.createBuffer({ size: n, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      const landed = new Map(); // block -> distance from the car at touchdown
      let shells = 0;
      const trace = [];
      for (let s = 0; s < steps; s += 6) {
        const enc = device.createCommandEncoder();
        enc.copyBufferToBuffer(world.bufs[0], 0, buf, 0, n);
        device.queue.submit([enc.finish()]);
        await buf.mapAsync(GPUMapMode.READ);
        const f = new Float32Array(buf.getMappedRange().slice(0));
        buf.unmap();
        const c = chassis * 28;
        lastChassis = { p: [f[c], f[c + 1], f[c + 2]], q: [f[c + 4], f[c + 5], f[c + 6], f[c + 7]], v: [f[c + 12], f[c + 13], f[c + 14]] };
        for (let i = 0; i < blocks.count; i++) {
          const o = (blocks.first + i) * 28;
          if (landed.has(i) || f[o + 3] === 0 || f[o + 1] > 0.6) continue;
          landed.set(i, Math.hypot(f[o] - f[c], f[o + 2] - f[c + 2]));
        }
        const fw = qrot(lastChassis.q, [0, 0, 1]);
        const speed = fw[0] * lastChassis.v[0] + fw[2] * lastChassis.v[2];
        if (s % 60 === 0) trace.push([Math.round(lastChassis.p[0] * 10) / 10, Math.round(lastChassis.p[2]), Math.round(speed * 10) / 10]);
        const steerIn = Math.max(-1, Math.min(1, 0.25 * (lastChassis.p[0] + 2.5) + 2.5 * fw[0]));
        const e = cruise - speed;
        world.vehicles.setInput(world.backend, player, { forward: Math.max(0, Math.min(1, e * 0.4)), steer: steerIn, brake: e < -1 ? Math.min(1, -e * 0.2) : 0, handbrake: 0 });
        if (lastChassis.p[2] > -12 && lastChassis.p[2] < 150 && world.steps - lastShell >= every) { fireShell(); shells++; }
        // One submit per step: each step stages its own host uploads.
        for (let k = 0; k < 6; k++) {
          const step = device.createCommandEncoder();
          world.encodeStep(step);
          device.queue.submit([step.finish()]);
        }
      }
      buf.destroy();
      manual = false;
      const states = await world.guideStates();
      const d = [...landed.values()];
      const landings = [2, 4, 6, 8, 12, 20, Infinity].map((r, k, a) => d.filter((x) => x < r && x >= (a[k - 1] ?? 0)).length);
      return { guided, strength, shells, landed: d.length, near: d.filter((x) => x < near).length, close: d.filter((x) => x < 2).length, landings, z: lastChassis.p[2], trace, states, claims: await world.guideClaims(guideZoneCount) };
    };
    // Parts / wheels broken off under load over every buggy, and the latest break.
    window.__mounts = () => {
      const n = buggyMesh ? buggyMesh.broken() : { parts: 0, wheels: 0 };
      return { ...n, loose: hybridParts.filter((r) => r.broken === r.joints[1] - r.joints[0]).map((r) => r.name), groups: [...brokenGroups], last: mounts.last };
    };
    window.__setVehicleInput = (h, input) => world.vehicles.setInput(world.backend, h, input);
    window.__world = world;
    // Meteor range take: from a reset, `volleys` volleys two seconds apart with
    // steering on or off; returns each lane's [on target, landed].
    window.__meteorTake = async ({ volleys = 10, guided = true, strength = 1 } = {}) => {
      if (!range) throw new Error('not the meteor range');
      guideOn.checked = guided; guideStrength.value = String(strength);
      resetScene();
      manual = true;
      meteors.log = [];
      for (let s = 0; s < volleys * 120 + 240; s++) {
        if (s % 120 === 0 && s < volleys * 120) fireVolley();
        const enc = device.createCommandEncoder();
        world.encodeStep(enc);
        device.queue.submit([enc.finish()]);
        if (s % 6 === 5) await trackMeteors();
      }
      manual = false;
      return { guided, strength, steered: meteors.score[0], unsteered: meteors.score[1], log: meteors.log };
    };
    renderParts();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
