<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>engine — WebGPU AVBD wall</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12141a; color: #d7dbe6; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; top: 12px; left: 14px; max-width: 42rem; }
    h1 { font: 600 15px/1.3 ui-sans-serif, system-ui, sans-serif; margin: 0 0 4px; }
    .muted { color: #8b93a7; }
    #err { color: #ff8b8b; white-space: pre-wrap; margin-top: 4px; }
    #warn { color: #e6c07b; white-space: pre-wrap; margin-top: 4px; display: none; }
    #sceneRow { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
    #sceneRow label { color: #8b93a7; }
    #sceneSelect {
      background: #1c2030; color: #d7dbe6; border: 1px solid #3a4158;
      border-radius: 4px; padding: 3px 8px; font: inherit; max-width: 28rem;
    }
    #sceneSelect:focus { outline: 1px solid #6b7a9e; }
    #sleepLabel { display: flex; align-items: center; gap: 5px; margin-left: 10px; color: #d7dbe6; cursor: pointer; }
    #sleepLabel.locked { color: #8b93a7; cursor: default; }
    #resetBtn {
      background: #1c2030; color: #d7dbe6; border: 1px solid #3a4158;
      border-radius: 4px; padding: 3px 10px; font: inherit; cursor: pointer;
    }
    #resetBtn:hover { border-color: #6b7a9e; }
    #resetBtn:disabled { color: #8b93a7; cursor: default; }
    #rates {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 1.75rem;
      row-gap: 2px;
      margin: 0 0 8px;
      font: 600 13px/1.35 ui-sans-serif, system-ui, sans-serif;
      color: #d7dbe6;
    }
    #rates .lbl { color: #8b93a7; font-weight: 500; min-width: 4.5rem; }
    #rates .val { font-variant-numeric: tabular-nums; min-width: 2.5rem; }
    #rates .sub { color: #8b93a7; font-weight: 500; font-size: 11px; margin-left: 6px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>Slang → WGSL · wall smash, same scene size as three-avbd</h1>
    <div id="sceneRow">
      <label for="sceneSelect">Scene</label>
      <select id="sceneSelect"></select>
      <label id="sleepLabel" for="sleepToggle" title="Let resting bodies fall asleep (URL: sleep=on|off)">
        <input type="checkbox" id="sleepToggle"> Sleep
      </label>
      <button id="resetBtn" type="button" title="Restart this scene from its first step (R)" disabled>Reset</button>
      <a href="./" style="color:#b8d7ff;margin-left:10px">All demos</a>
      <a href="./vehicle.html" style="color:#b8d7ff;margin-left:10px">Drive a vehicle →</a>
    </div>
    <div id="rates">
      <div><span class="lbl">TPS</span> <strong class="val" id="tpsVal">—</strong><span class="sub" id="stepMsVal"></span></div>
      <div title="1000 ÷ physics step cost: GPU pass time with timestamp queries, otherwise an estimate from submission busy time"><span class="lbl">Max TPS</span> <strong class="val" id="maxTpsVal">—</strong><span class="sub" id="maxTpsSub"></span></div>
      <div><span class="lbl">FPS</span> <strong class="val" id="fpsVal">—</strong><span class="sub" id="frameMsVal"></span></div>
      <div><span class="lbl">Max FPS</span> <strong class="val" id="maxFpsVal">—</strong><span class="sub">uncapped</span></div>
    </div>
    <div id="status" class="muted">starting…</div>
    <div id="mode" class="muted" hidden></div>
    <div id="legend" class="muted">Keys 1 position tint, 2 awake/sleep, 3 speed. Friction μ 0.5. Drag to orbit, scroll to zoom, right-drag to pan.</div>
    <div id="warn"></div>
    <div id="err"></div>
  </div>
  <script type="importmap">{ "imports": { "rubble-gpu-wait": "./fracture/gpu-wait.mjs" } }</script>
  <script type="module">
    // The physics is rubble's World (engine-world-wasm) on the browser's WebGPU:
    // the host native and Unreal run. The step is `World::step` (engine-exec's
    // rigid_plan); this page builds the scene through World, renders the world's
    // body and collider buffers in place, and keeps the camera, input, HUD,
    // benchmark protocol and checks.
    import { createWorld, pollFrame, stepFrames, drain, macrotask, saveState, errorText } from './rubble-world.mjs';
    import { parseDemoQuery, demoSolver, sceneCap, SLEEP_OFF_TIME } from './demo-config.mjs';
    import { buildDemoScene, packDemoBodies } from './demo-scene.mjs';
    import { restoreSceneOrder } from './spatial-order.mjs';
    import { runRingRegression } from './ring-regression.mjs';
    import { runGablesRegression } from './gables-regression.mjs';
    import { measurePhysicsBatches, assertBenchmarkWorkload } from './physics-benchmark.mjs?v=3';
    import { installJointControls } from './joint-interaction.mjs';
    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const warnEl = document.getElementById('warn');
    const canvas = document.getElementById('c');
    const fail = (e) => { errEl.textContent = errorText(e); statusEl.textContent = 'stopped'; window.__failed = String(e); };
    // Setup runs at module top level (scene snapshots, world, pipelines); show
    // its failures on the page instead of only in the console.
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });
    addEventListener('error', (e) => fail(e.error || e.message));
    const warnOnce = (() => {
      const seen = new Set();
      return (msg) => {
        if (seen.has(msg)) return;
        seen.add(msg);
        warnEl.style.display = 'block';
        warnEl.textContent = (warnEl.textContent ? warnEl.textContent + '\n' : '') + msg;
      };
    })();

    // Scene, World configuration and page switches (demo-config.mjs): every
    // kernel switch maps onto World's ContactStorage / EngineFeatures.
    const Q = parseDemoQuery(location.search);
    const { qs, scene, cfg } = Q;
    const benchmarkOnly = Q.benchOnly, benchmarkEnabled = Q.bench;
    const regressionKind = Q.check;
    const regressionEnabled = !!regressionKind;
    const regressionSteps = regressionKind === 'gables' ? 240 : 480;
    if (regressionEnabled || benchmarkEnabled) {
      const modeEl = document.getElementById('mode');
      modeEl.hidden = false;
      modeEl.append(regressionEnabled
        ? `Automated check: rendering pauses during ${regressionSteps} physics steps, then stops after the result. `
        : benchmarkOnly ? 'Physics benchmark: fixed lead-in and timing window, then stops. '
        : 'Benchmark mode: playback pauses for measurement, then restarts. ');
      const liveLink = document.createElement('a');
      const liveUrl = new URL(location.href);
      liveUrl.searchParams.delete('check');
      liveUrl.searchParams.delete('bench');
      liveLink.href = liveUrl.href;
      liveLink.textContent = 'Open uninterrupted live demo';
      liveLink.style.color = '#b8d7ff';
      modeEl.append(liveLink);
    }
    const sceneSelect = document.getElementById('sceneSelect');
    for (const [id, s] of Object.entries(Q.scenes)) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = s.title;
      if (id === scene) opt.selected = true;
      sceneSelect.appendChild(opt);
    }
    sceneSelect.addEventListener('change', () => {
      const next = new URL(location.href);
      next.searchParams.set('scene', sceneSelect.value);
      next.searchParams.delete('check');
      if (sceneSelect.value !== 'pyramid') next.searchParams.delete('levels');
      location.href = next.href;
    });

    // RUBSNAP1 scenes (engine-scenes scene_export): the records go to World,
    // which builds them (`importSnapshot`); the page reads the metadata and the
    // collider radii it picks with.
    async function loadSnapshot(id) {
      const base = `./generated/scenes/${id}`;
      const metaRes = await fetch(`${base}.json`);
      if (!metaRes.ok) throw new Error(`missing ${base}.json; run: cargo run -p engine-scenes --release --bin scene_export`);
      const meta = await metaRes.json();
      const bytes = new Uint8Array(await (await fetch(`${base}.bin`)).arrayBuffer());
      const [nb, nc, nm, nj] = new Uint32Array(bytes.buffer, 8, 4);
      const view = (off, n) => bytes.subarray(off, off + n);
      const bodiesAt = 24, collidersAt = bodiesAt + nb * 112, jointsAt = collidersAt + nc * 64 + nm * 16;
      return {
        meta, bytes,
        bodies: view(bodiesAt, nb * 112), colliders: view(collidersAt, nc * 64), joints: view(jointsAt, nj * meta.jointLayout.stride),
        counts: { bodies: nb, colliders: nc, joints: nj },
      };
    }
    const snap = cfg.snapshot ? await loadSnapshot(cfg.snapshot) : null;
    if (snap) {
      cfg.iterations = cfg.iterations ?? snap.meta.iterations;
      cfg.cap = sceneCap(snap.counts.bodies, { maxJoints: Math.max(64, snap.counts.joints + 1) });
      cfg.title = `${cfg.title}, ${cfg.iterations} iterations`;
    }
    const lead = cfg.lead;
    const eye0 = cfg.eye;
    const look0 = cfg.look;
    document.querySelector('h1').textContent = `Slang → WGSL · ${cfg.title}`;
    let target = look0.slice();
    const toEye = [eye0[0] - look0[0], eye0[1] - look0[1], eye0[2] - look0[2]];
    let orbitDist = Math.hypot(...toEye);
    let orbitYaw = Math.atan2(toEye[0], toEye[2]);
    let orbitPitch = Math.asin(Math.max(-1, Math.min(1, toEye[1] / orbitDist)));
    function cameraEye() {
      const cp = Math.cos(orbitPitch), sp = Math.sin(orbitPitch);
      const sy = Math.sin(orbitYaw), cy = Math.cos(orbitYaw);
      return [target[0] + orbitDist * cp * sy, target[1] + orbitDist * sp, target[2] + orbitDist * cp * cy];
    }
    let drag = null;
    let jointControls = null;
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('pointerdown', (e) => {
      if (jointControls && (e.ctrlKey || e.altKey || e.metaKey) && e.button === 0) {
        try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events have no capture */ }
        jointControls.startGrab(e).catch(fail);
        return;
      }
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey || e.button === 1 };
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events have no capture */ }
    });
    canvas.addEventListener('pointerup', (e) => {
      if (jointControls && jointControls.endGrab(e)) return;
      if (drag && drag.id === e.pointerId) drag = null;
    });
    canvas.addEventListener('pointermove', (e) => {
      if (jointControls && jointControls.moveGrab(e)) return;
      if (!drag || drag.id !== e.pointerId) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      if (drag.pan) {
        const eyeNow = cameraEye();
        const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((v) => v / l); };
        const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
        const z = norm(sub(eyeNow, target));
        const x = norm(cross([0, 1, 0], z));
        const y = cross(z, x);
        const s = orbitDist * 0.0016;
        target = target.map((v, i) => v - (x[i] * dx + y[i] * dy) * s);
      } else {
        orbitYaw -= dx * 0.005;
        orbitPitch = Math.max(-1.2, Math.min(1.2, orbitPitch + dy * 0.005));
      }
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      orbitDist = Math.max(2, Math.min(cfg.far, orbitDist * Math.exp(e.deltaY * 0.0012)));
    }, { passive: false });

    // Sleep toggle. Scenes matching three-avbd (no sleeping) default to a 1e6 s
    // timer; ?sleep=on|off overrides the scene default and stays in the URL.
    // Changes apply from the next step; turning sleep off keeps already-sleeping
    // bodies asleep until something wakes them.
    let sleepTime = Q.sleepOn ? Q.sleepEnabledTime : SLEEP_OFF_TIME;
    const solver = demoSolver(cfg, sleepTime, snap?.meta);
    const dt = solver.dt;

    // The world. Live play times each step on the GPU (timestamp queries) when the
    // adapter has them, as the JS host's HUD did.
    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    const probe = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!probe) throw new Error('no WebGPU adapter');
    const wantTimestamps = probe.features.has('timestamp-query');
    const info = probe.info || {};
    const liveTiming = wantTimestamps ? 'step' : 'off';
    statusEl.textContent = `building ${scene}…`;
    const killParam = new URLSearchParams(location.search).get('kill');
    const killBelow = killParam === 'off' ? null : Number(killParam ?? -50);
    if (killBelow !== null && !Number.isFinite(killBelow)) throw new Error(`kill=${killParam}: a height or off`);
    const world = await createWorld({
      gravity: [0, snap?.meta.params?.gravityY ?? -10, 0],
      capacity: cfg.cap,
      contacts: Q.contacts,
      features: Q.features,
      solver,
      gpuTiming: liveTiming,
      // Where the world ends: bodies thrown off the ground fall forever and never
      // sleep, so a fully settled scene could never stop stepping. Below this they
      // are destroyed (reported in each frame's leftWorld). ?kill=<y>, ?kill=off.
      ...(killBelow === null ? {} : { killBelow }),
    });
    const device = world.device();
    device.lost.then((i) => fail('device lost: ' + i.message));
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + (e.error && e.error.message || e.error)));

    // Bodies: slot k draws with collider k (body 0 and collider 0: the ground).
    let handles, sceneBodies = null, order = null;
    if (snap) {
      handles = world.importSnapshot(snap.bytes);
      jointControls = installJointControls({
        world, snap, handles, canvas, ccd: Q.ccd,
        camera: { eye: cameraEye, target: () => target, fovY: Math.PI / 5 },
      });
    } else {
      sceneBodies = buildDemoScene(scene, cfg, { ccd: Q.ccd });
      if (scene === 'pyramid')
        document.querySelector('h1').textContent = `Slang → WGSL · settled pyramid ${cfg.levels} levels (~${sceneBodies.length - 1}), 10 iterations`;
      if (sceneBodies.length > cfg.cap.maxBodies) throw new Error(`${sceneBodies.length} bodies exceed capacity ${cfg.cap.maxBodies}`);
      const packed = packDemoBodies(sceneBodies, { spatialOrder: Q.spatialOrder });
      order = Q.spatialOrder ? packed : null;
      handles = { bodies: Float64Array.from(world.createBodies(packed.records, { material: { friction: cfg.friction } })) };
    }
    const bodyCount = world.bodyCount();
    const drawCount = world.colliderCount() - 1;
    const projectileSlot = jointControls ? jointControls.projectileSlot : 0xffffffff;
    // The scene's first state: reset (R), and the benchmark's and checks' restarts.
    const initialState = await saveState(world);
    const initialMaxY = sceneBodies ? sceneBodies.reduce((m, b, i) => (i > 0 ? Math.max(m, b.p[1]) : m), 0) : 0;

    // Frames: counters (named as the JS host's), GPU step times, overflow.
    let last = { contact: 0, candidate: 0, awake: bodyCount - 1, color: 0, manifold: 0, overflow: 0, colorRounds: 0 };
    const submitted = new Map();
    let lastCompletion = 0;
    let leftWorld = 0;
    function onFrame(f) {
      leftWorld += f.leftWorld().length / 5;
      const c = f.counters();
      if (c) last = { contact: c.contacts, candidate: c.candidates, awake: c.awake, color: c.colors, manifold: c.manifolds, overflow: c.overflow, colorRounds: c.colorRounds };
      if (f.empty) return;
      const completedAt = performance.now();
      const times = f.gpuTimes();
      for (const t of times) {
        addStepCost(liveStepSample({ gpuMs: t.totalMs, submittedAt: submitted.get(t.step), completedAt, previousCompletedAt: lastCompletion }));
        frameTimes.push(t);
      }
      if (!times.length && submitted.has(f.lastStep))
        addStepCost(liveStepSample({ gpuMs: 0, submittedAt: submitted.get(f.lastStep), completedAt, previousCompletedAt: lastCompletion }));
      for (const s of submitted.keys()) if (s <= f.lastStep) submitted.delete(s);
      lastCompletion = completedAt;
    }
    let frameTimes = [];
    const simStep = () => world.simSteps();
    // One step as soon as a readback slot is free (benchmarks and checks).
    async function stepOne() {
      while (!world.canStep()) { await macrotask(); pollFrame(world, onFrame); }
      if (jointControls) jointControls.beforeStep(simStep() * dt);
      world.step();
      pollFrame(world, onFrame);
    }
    const drainAll = () => drain(world, onFrame);

    const sleepToggle = document.getElementById('sleepToggle');
    const sleepLabel = document.getElementById('sleepLabel');
    function setSleepEnabled(on) {
      sleepTime = on ? Q.sleepEnabledTime : SLEEP_OFF_TIME;
      world.setSolver({ sleepTime });
    }
    function syncSleepToggle(locked) {
      sleepToggle.checked = sleepTime < SLEEP_OFF_TIME;
      sleepToggle.disabled = !!locked;
      sleepLabel.classList.toggle('locked', !!locked);
    }
    syncSleepToggle(false);
    sleepToggle.addEventListener('change', () => {
      setSleepEnabled(sleepToggle.checked);
      const next = new URL(location.href);
      next.searchParams.set('sleep', sleepToggle.checked ? 'on' : 'off');
      history.replaceState(null, '', next.href);
    });

    function lookAt(eye, at, up) {
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((x) => x / l); };
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const z = norm(sub(eye, at));
      const x = norm(cross(up, z));
      const y = cross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]),
        -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]),
        -(z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2]),
        1,
      ]);
    }

    function perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, far / (near - far), -1,
        0, 0, (near * far) / (near - far), 0,
      ]);
    }

    function mul(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
        o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
      }
      return o;
    }

    const RENDER = `
struct Body {
  position: vec3f, invMass: f32,
  orientation: vec4f,
  invInertia: vec3f, flags: u32,
  linearVel: vec3f, sleepTimer: f32,
  angularVel: vec3f, generation: u32,
  initialPos: vec3f, initialPad: f32,
  initialRot: vec4f,
};
struct Collider {
  body: u32, shape: u32, material: u32, generation: u32,
  localPos: vec3f, density: f32,
  localRot: vec4f,
  params: vec4f,
};
struct Frame { viewProj: mat4x4<f32>, mode: u32, projectile: u32 };
struct Eye { pos: vec3f, _pad: f32 };
@group(0) @binding(0) var<storage, read> bodies: array<Body>;
@group(0) @binding(1) var<uniform> frame: Frame;
@group(0) @binding(2) var<storage, read> cols: array<Collider>;
@group(0) @binding(3) var<uniform> eye: Eye;

fn quatRotate(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}

struct VsOut {
  @builtin(position) clip: vec4f,
  @location(0) normal: vec3f,
  @location(1) color: vec3f,
  @location(2) world: vec3f,
  @location(3) center: vec3f,
  @location(4) radius: f32,
  // Capsule: world-space half segment (axis · half length); zero for spheres.
  @location(5) axis: vec3f,
};

@vertex fn vs(@location(0) corner: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> VsOut {
  let b = bodies[inst + 1u];
  let col = cols[inst + 1u];
  var half = col.params.xyz;
  var radius = 0.0;
  var axis = vec3f(0.0);
  if (col.shape == 0u) {
    // Bounds cube of half-extent r; fragment ray-hits the sphere so corners do not stick out.
    half = vec3f(col.params.x);
    radius = col.params.x;
  } else if (col.shape == 1u) {
    // Capsule along local Y (radius, half length): bounds box, ray-hit in the fragment.
    half = vec3f(col.params.x, col.params.y + col.params.x, col.params.x);
    radius = col.params.x;
    axis = quatRotate(b.orientation, vec3f(0.0, col.params.y, 0.0));
  }
  let world = b.position + quatRotate(b.orientation, corner * (half / 0.5));
  var o: VsOut;
  o.clip = frame.viewProj * vec4f(world, 1.0);
  o.normal = quatRotate(b.orientation, normal);
  o.world = world;
  o.center = b.position;
  o.radius = radius;
  o.axis = axis;
  // 0 position tint, 1 awake/sleep, 2 speed. The ball stays gray: the projectile when
  // the scene names one (frame.projectile), else every sphere.
  let isBall = col.shape == 0u && (frame.projectile == 0xffffffffu || col.body == frame.projectile);
  if (isBall) {
    o.color = vec3f(0.75, 0.78, 0.82);
  } else if (frame.mode == 1u) {
    let sleeping = (b.flags & 4u) != 0u;
    o.color = select(vec3f(0.95, 0.58, 0.16), vec3f(0.28, 0.48, 0.82), sleeping);
  } else if (frame.mode == 2u) {
    let t = clamp(length(b.linearVel) / 3.0, 0.0, 1.0);
    o.color = mix(vec3f(0.22, 0.32, 0.48), vec3f(0.95, 0.22, 0.16), t);
  } else {
    let t = fract(b.position.y * 0.08 + b.position.x * 0.05);
    o.color = vec3f(0.72, 0.38 + 0.35 * t, 0.22);
  }
  return o;
}

@fragment fn fs(i: VsOut) -> @location(0) vec4f {
  var n = normalize(i.normal);
  if (i.radius > 0.0 && dot(i.axis, i.axis) > 0.0) {
    // Ray vs capsule (segment center ± axis, radius).
    let rd = normalize(i.world - eye.pos);
    let pa = i.center - i.axis;
    let ba = 2.0 * i.axis;
    let oa = eye.pos - pa;
    let baba = dot(ba, ba);
    let bard = dot(ba, rd);
    let baoa = dot(ba, oa);
    let rdoa = dot(rd, oa);
    let oaoa = dot(oa, oa);
    let qa = baba - bard * bard;
    let qb = baba * rdoa - baoa * bard;
    let qc = baba * oaoa - baoa * baoa - i.radius * i.radius * baba;
    var tHit = -1.0;

        const dyn = bodyCount - 1;
        const settleLabel = cfg.settled && settle.sampleStep
          ? ` · sleep ${settle.sleeping}/${dyn} · KE ${settle.ke.toFixed(1)} · max|v| ${settle.maxV.toFixed(3)} · h ${settle.maxY.toFixed(2)}/${initialMaxY.toFixed(2)}`
          : '';
        // Sleep on: the production configuration, not the all-awake three-avbd comparison.
        const sleepLabel = sleepTime < SLEEP_OFF_TIME ? ' (sleep on, not comparable to three-avbd)' : '';
        const timingLabel = wallMs > 0 ? `wall ${wallMs.toFixed(2)} ms${sleepLabel} ${phases}`
          : benchmarkEnabled ? (cfg.settled ? 'timing after settle…' : 'timing after impact…')
          : 'live playback';
        statusEl.textContent = statusLine(timingLabel, settleLabel);

        // Smash: watch impact first. Settled: watch lead-in settle, then fair wall timing.
        // After measuring, restore so playback continues from the start again.
        if (benchmarkEnabled && !benchStarted && simStep() >= lead) {
          benchStarted = true;
          measuring = true;
          showMeasuring();
          await drainAll();
          lastCompletion = 0;
          statusEl.textContent = cfg.settled
            ? `settled · measuring wall time (${dyn} bodies)…`
            : `impact shown · measuring wall time (${dyn} bodies)…`;
          try {
            if (cfg.settled) await sampleSettle();
            const pre = { ...settle };
            restoreScene();
            wallMs = await benchWall();
            phases = await profilePhases();
            if (cfg.settled) await sampleSettle();
            const report = {
              scene, bodies: dyn, iterations: solver.iterations, wallMs, phases, timingSamples, phaseSamples,
              host: 'World (engine-world-wasm)', ...Q.modes, colors: last.color,
              contacts: last.contact, awake: last.awake, overflow: last.overflow,
              settle: pre, initialMaxY,
            };
            window.__BENCH__ = report;
            console.log('BENCH', JSON.stringify(report));
            restoreScene();
            drawWorld();
            const ok = !cfg.settled || (pre.ke < dyn * 0.05 && pre.maxV < 0.5 && pre.maxY > initialMaxY * 0.7);
            statusEl.textContent = `wall ${wallMs.toFixed(2)} ms ${phases}${cfg.settled ? ` · settle KE ${pre.ke.toFixed(1)} sleep ${pre.sleeping}/${dyn} h ${pre.maxY.toFixed(2)}/${initialMaxY.toFixed(2)} ${ok ? 'STABLE' : 'UNSTABLE'}` : ''} · replaying…`;
          } finally {
            measuring = false;
            lastCompletion = 0;
            resetRates();
          }
        }
        requestAnimationFrame(frame);
      } catch (e) { running = false; measuring = false; fail(e); }
    }

    // Automation: n steps, frame-locked, then the counters (tools/page-bench.mjs).
    window.__step = async (n = 1) => {
      manual = true;
      await stepFrames(world, n, onFrame, jointControls ? () => jointControls.beforeStep(simStep() * dt) : null);
      drawWorld();
      return { steps: simStep(), counters: { ...last } };
    };
    window.__world = world;

    if (regressionEnabled) {
      const expectedScene = regressionKind === 'gables' ? 'gables506k' : 'ring110k';
      if (scene !== expectedScene) throw new Error(`${regressionKind} regression requires scene=${expectedScene}`);
      setSleepEnabled(false);
      syncSleepToggle(true); // regression oracles assume no sleeping
      const readSnapshot = async () => {
        await drainAll();
        return { bytes: await readSceneBodies(), counters: { ...last } };
      };
      const runRegression = regressionKind === 'gables' ? runGablesRegression : runRingRegression;
      const report = await runRegression({
        initial: sceneBodies, submit: stepOne, read: readSnapshot,
        batchSize: Q.batchSize,
        progress: async n => { statusEl.textContent = `checking active ${scene} · step ${n}/${regressionSteps}`; await macrotask(); },
      });
      Object.assign(report, { host: 'World (engine-world-wasm)', ...Q.modes, sleepTime });
      // Exercise reset too: stale warm-start data from the completed run must not
      // contaminate the first frame or the benchmark's lead-in.
      restoreScene();
      await stepOne();
      const reset = await readSnapshot();
      const resetContactsOk = regressionKind === 'gables' ? reset.counters.contact === 3916802 : reset.counters.contact >= 1_250_000;
      if (!resetContactsOk || reset.counters.overflow)
        throw new Error(`${regressionKind} reset lost first-frame contacts or overflowed (${reset.counters.contact} contacts)`);
      restoreScene();
      if (benchmarkEnabled) {
        report.wallMs = await benchWall();
        report.timingSamples = timingSamples;
        report.phases = await profilePhases();
        report.phaseSamples = phaseSamples;
      }
      window.__CHECK__ = report;
      console.log('REGRESSION', JSON.stringify(report));
      statusEl.textContent = `PASS · ${report.bodies} active bodies · ${report.steps} steps${benchmarkEnabled ? ` · wall ${report.wallMs.toFixed(2)} ms · ${report.phases}` : ''}`;
      drawWorld();
    } else if (benchmarkOnly) {
      const wallMs = await benchWall();
      const phases = await profilePhases();
      const report = {
        scene, bodies: bodyCount - 1, iterations: solver.iterations, wallMs, phases, timingSamples, phaseSamples,
        host: 'World (engine-world-wasm)', ...Q.modes, colors: last.color,
        contacts: last.contact, awake: last.awake, overflow: last.overflow,
      };
      window.__BENCH__ = report;
      console.log('BENCH', JSON.stringify(report));
      statusEl.textContent = `Measured · ${report.bodies} active bodies · physics wall ${wallMs.toFixed(2)} ms/step · ${phases}`;
      drawWorld();
    } else {
      statusEl.textContent = `playing ${bodyCount - 1} bodies from the start…`;
      resetBtn.disabled = false;
      window.__ready = true;
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
