<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>engine — WebGPU AVBD wall</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12141a; color: #d7dbe6; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; top: 12px; left: 14px; max-width: 46rem; }
    h1 { font: 600 15px/1.3 ui-sans-serif, system-ui, sans-serif; margin: 0 0 4px; }
    .muted { color: #8b93a7; }
    #err { color: #ff8b8b; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>Slang → WGSL · wall smash, same scene size as three-avbd</h1>
    <div id="status" class="muted">starting…</div>
    <div id="legend" class="muted">Keys 1 position tint, 2 awake/sleep, 3 speed. Friction μ 0.5. Drag to orbit, scroll to zoom, right-drag to pan.</div>
    <div id="err"></div>
  </div>
  <script type="module">
    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const canvas = document.getElementById('c');
    const fail = (e) => { errEl.textContent = String(e && e.stack || e); statusEl.textContent = 'stopped'; };
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });

    const qs = new URLSearchParams(location.search);
    const scene = qs.get('scene') || 'wall';
    // Capacities mirror three-avbd bench-cases tiers (small / paper / large / steady).
    const SCENES = {
      wall: {
        title: 'wall smash 2k, 10 iterations',
        lead: 30, iterations: 10, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [0, 16, -42], look: [0, 8, 0], far: 400, ground: 48,
        cap: { maxBodies: 4096, maxColliders: 4096, maxContacts: 32768, maxJoints: 64, maxCandidates: 65536, maxColors: 32, maxCommands: 64, maxHull: 64 },
      },
      ring: {
        title: 'brick ring 9k, 4 iterations',
        lead: 60, iterations: 4, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [32, 22, 14], look: [0, 5, 0], far: 400, ground: 48,
        cap: { maxBodies: 16384, maxColliders: 16384, maxContacts: 131072, maxJoints: 64, maxCandidates: 262144, maxColors: 32, maxCommands: 64, maxHull: 64 },
      },
      gables: {
        title: 'brick gables 6.7k, 3 iterations',
        lead: 60, iterations: 3, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [0, 28, -40], look: [0, 6, 0], far: 400, ground: 80,
        cap: { maxBodies: 16384, maxColliders: 16384, maxContacts: 131072, maxJoints: 64, maxCandidates: 262144, maxColors: 32, maxCommands: 64, maxHull: 64 },
      },
      pyramid: {
        // levels via ?levels=N (default 30). Match three-avbd: reuseContacts + full 4-pt faces.
        title: 'settled pyramid',
        lead: 180, iterations: 10, settled: true, sleepRounds: 8, friction: 0.5,
        eye: [28, 22, 28], look: [0, 6, 0], far: 400, ground: 64,
        levels: Math.max(2, Math.min(50, Number(qs.get('levels') || 30) || 30)),
        flags: 1, // FLAG_REUSE_CONTACTS — three-avbd default
        cap: { maxBodies: 16384, maxColliders: 16384, maxContacts: 262144, maxJoints: 64, maxCandidates: 524288, maxColors: 32, maxCommands: 64, maxHull: 64 },
      },
      pile: {
        title: 'settled pile 32k, 4 iterations',
        lead: 180, iterations: 4, settled: true, sleepRounds: 1, friction: 0.7,
        eye: [48, 36, 48], look: [0, 8, 0], far: 800, ground: 96,
        // Box Pile scene defaults (DECISIONS 8af–8av)
        flags: 1, alpha: 0.95, betaLin: 2000, sleepLin: 0.5, sleepAng: 0.5, sleepTime: 0.25,
        cap: { maxBodies: 65536, maxColliders: 65536, maxContacts: 524288, maxJoints: 64, maxCandidates: 1048576, maxColors: 32, maxCommands: 64, maxHull: 64 },
      },
      columns: {
        title: 'box columns 100k, 4 iterations',
        lead: 180, iterations: 4, settled: true, sleepRounds: 8, friction: 0.5,
        eye: [90, 40, 90], look: [0, 6, 0], far: 1200, ground: 200,
        flags: 1, // three-avbd reuseContacts default
        cap: { maxBodies: 131072, maxColliders: 131072, maxContacts: 1048576, maxJoints: 64, maxCandidates: 2097152, maxColors: 32, maxCommands: 64, maxHull: 64 },
      },
      ring110k: {
        title: 'brick ring 110k, 4 iterations',
        lead: 60, iterations: 4, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [140, 60, 40], look: [0, 12, 0], far: 2000, ground: 220,
        cap: { maxBodies: 131072, maxColliders: 131072, maxContacts: 1048576, maxJoints: 64, maxCandidates: 2097152, maxColors: 32, maxCommands: 64, maxHull: 64 },
      },
      gables506k: {
        title: 'brick gables 506k, 3 iterations',
        lead: 60, iterations: 3, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [0, 80, -120], look: [0, 10, 0], far: 4000, ground: 600,
        cap: { maxBodies: 524288, maxColliders: 524288, maxContacts: 2097152, maxJoints: 64, maxCandidates: 4194304, maxColors: 32, maxCommands: 64, maxHull: 64 },
      },
    };
    const cfg = SCENES[scene];
    if (!cfg) throw new Error(`unknown scene ${scene}; try ${Object.keys(SCENES).join(', ')}`);
    const cap = cfg.cap;
    const lead = cfg.lead;
    const eye0 = cfg.eye;
    const look0 = cfg.look;
    document.querySelector('h1').textContent = `Slang → WGSL · ${cfg.title}`;
    let target = look0.slice();
    const toEye = [eye0[0] - look0[0], eye0[1] - look0[1], eye0[2] - look0[2]];
    let orbitDist = Math.hypot(...toEye);
    let orbitYaw = Math.atan2(toEye[0], toEye[2]);
    let orbitPitch = Math.asin(Math.max(-1, Math.min(1, toEye[1] / orbitDist)));
    function cameraEye() {
      const cp = Math.cos(orbitPitch), sp = Math.sin(orbitPitch);
      const sy = Math.sin(orbitYaw), cy = Math.cos(orbitYaw);
      return [target[0] + orbitDist * cp * sy, target[1] + orbitDist * sp, target[2] + orbitDist * cp * cy];
    }
    let drag = null;
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('pointerdown', (e) => {
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey || e.button === 1 };
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events have no capture */ }
    });
    canvas.addEventListener('pointerup', (e) => { if (drag && drag.id === e.pointerId) drag = null; });
    canvas.addEventListener('pointermove', (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      if (drag.pan) {
        const eyeNow = cameraEye();
        const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((v) => v / l); };
        const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
        const z = norm(sub(eyeNow, target));
        const x = norm(cross([0, 1, 0], z));
        const y = cross(z, x);
        const s = orbitDist * 0.0016;
        target = target.map((v, i) => v - (x[i] * dx + y[i] * dy) * s);
      } else {
        orbitYaw -= dx * 0.005;
        orbitPitch = Math.max(-1.2, Math.min(1.2, orbitPitch + dy * 0.005));
      }
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      orbitDist = Math.max(2, Math.min(cfg.far, orbitDist * Math.exp(e.deltaY * 0.0012)));
    }, { passive: false });
    const PASS_ALIGN = 256;
    const nextPow2 = (n) => { let p = 1; while (p < n) p <<= 1; return p; };
    const constraintIdWords = nextPow2(Math.max(32768, 2 * (cap.maxContacts + cap.maxJoints)));
    const csrBase = Math.max(constraintIdWords, 131072);

    function bufferSizes() {
      const b = (n, stride) => n * stride;
      const s = new Array(27).fill(256);
      s[0] = b(cap.maxBodies * 2, 112);
      s[1] = b(cap.maxBodies, 112);
      s[2] = b(cap.maxColliders, 64);
      s[3] = b(64, 16);
      s[4] = b(cap.maxContacts * 2, 128);
      s[5] = b(cap.maxJoints, 256);
      s[6] = 256;
      s[7] = 256;
      s[8] = b(cap.maxCommands, 64);
      s[9] = b(cap.maxBodies + cap.maxColliders, 32);
      s[10] = b(cap.maxCandidates, 16);
      s[11] = b(cap.maxBodies, 4);
      s[12] = b(cap.maxBodies, 4);
      s[13] = b(cap.maxBodies + 1, 4);
      s[14] = (csrBase + cap.maxBodies + 1) * 4;
      s[15] = b(cap.maxBodies * cap.maxColors, 4);
      s[16] = b(cap.maxColors, 4);
      s[17] = b(cap.maxColors, 4);
      s[18] = b(cap.maxHull, 16);
      s[19] = 65536 * 4;
      s[20] = b(cap.maxBodies, 4);
      s[21] = 64 * 4;
      s[22] = 96 * PASS_ALIGN;
      s[23] = b(Math.max(cap.maxColors, 64) * 3, 4);
      s[24] = b(cap.maxColliders, 80);
      s[25] = b(cap.maxCandidates, 32);
      s[26] = b(cap.maxBodies, 32);
      return s;
    }

    const K = [
      'build_aabbs', 'broadphase_clear', 'broadphase_insert', 'broadphase_query',
      'update_refs', 'narrowphase', 'contact_hash_clear', 'contact_hash_insert', 'persist_contacts',
      'build_awake_list', 'csr_clear', 'csr_degree_contacts', 'csr_prefix',
      'csr_prefix_init', 'csr_prefix_scan', 'csr_prefix_finalize',
      'csr_scatter_contacts', 'csr_sort', 'init_colors', 'color_bodies',
      'pack_color_lists', 'write_color_args', 'predict_bodies', 'solve_primal_color',
      'solve_dual', 'extract_velocity_sleep', 'sleep_island_gate', 'sleep_island_commit',
    ];

    function bindingsOf(wgsl) {
      const out = [];
      for (const line of wgsl.split('\n')) {
        const i = line.indexOf('@binding(');
        if (i < 0) continue;
        const rest = line.slice(i + '@binding('.length);
        const n = Number(rest.slice(0, rest.indexOf(')')));
        if (out.some((b) => b.index === n)) continue;
        out.push({ index: n, uniform: line.includes('var<uniform') });
      }
      out.sort((a, b) => a.index - b.index);
      return out;
    }

    function f32(view, o, v) { view.setFloat32(o, v, true); }
    function u32(view, o, v) { view.setUint32(o, v, true); }

    function writeBody(buf, index, body) {
      const o = index * 112;
      const v = new DataView(buf);
      const q = body.q || [0, 0, 0, 1];
      const w = body.w || [0, 0, 0];
      f32(v, o + 0, body.p[0]); f32(v, o + 4, body.p[1]); f32(v, o + 8, body.p[2]); f32(v, o + 12, body.invMass);
      f32(v, o + 16, q[0]); f32(v, o + 20, q[1]); f32(v, o + 24, q[2]); f32(v, o + 28, q[3]);
      f32(v, o + 32, body.invI[0]); f32(v, o + 36, body.invI[1]); f32(v, o + 40, body.invI[2]); u32(v, o + 44, body.flags);
      const vel = body.v || [0, 0, 0];
      f32(v, o + 48, vel[0]); f32(v, o + 52, vel[1]); f32(v, o + 56, vel[2]); f32(v, o + 60, 0);
      f32(v, o + 64, w[0]); f32(v, o + 68, w[1]); f32(v, o + 72, w[2]); u32(v, o + 76, 0);
      // initialPos/Rot = pose so frame-0 x⁻ / warm-start match Metal (zeros left a 0-quat).
      f32(v, o + 80, body.p[0]); f32(v, o + 84, body.p[1]); f32(v, o + 88, body.p[2]); f32(v, o + 92, 0);
      f32(v, o + 96, q[0]); f32(v, o + 100, q[1]); f32(v, o + 104, q[2]); f32(v, o + 108, q[3]);
    }

    function writeCollider(buf, index, c) {
      const o = index * 64;
      const v = new DataView(buf);
      u32(v, o + 0, c.body); u32(v, o + 4, c.shape); u32(v, o + 8, 0); u32(v, o + 12, 0);
      f32(v, o + 16, 0); f32(v, o + 20, 0); f32(v, o + 24, 0); f32(v, o + 28, c.density);
      f32(v, o + 32, 0); f32(v, o + 36, 0); f32(v, o + 40, 0); f32(v, o + 44, 1);
      f32(v, o + 48, c.params[0]); f32(v, o + 52, c.params[1]); f32(v, o + 56, c.params[2]); f32(v, o + 60, c.params[3]);
    }

    const params = {
      dt: 1 / 60, gravityY: -10, iterations: cfg.iterations, flags: cfg.flags || 0,
      alpha: cfg.alpha ?? 0.99, gamma: 0.999, betaLin: cfg.betaLin ?? 10000, betaAng: 100,
      kStart: 1000, kMaxN: 1e10, kMaxT: 1e6, contactOffset: 0.01,
      sleepLin: cfg.sleepLin ?? 0.15, sleepAng: cfg.sleepAng ?? 0.15, sleepTime: cfg.sleepTime ?? 0.5, residualExit: 1e-4,
      trustLin: 0.35, trustAng: 0.5, pivotFloor: 1e-6, gridCellSize: 2,
    };

    const packHostBytes = new ArrayBuffer(208);
    const packHostView = new DataView(packHostBytes);
    const packHostU8 = new Uint8Array(packHostBytes);
    function packHost(scratch) {
      const v = packHostView;
      const nums = [
        params.dt, params.gravityY, params.iterations, params.flags,
        params.alpha, params.gamma, params.betaLin, params.betaAng,
        params.kStart, params.kMaxN, params.kMaxT, params.contactOffset,
        params.sleepLin, params.sleepAng, params.sleepTime, params.residualExit,
        params.trustLin, params.trustAng, params.pivotFloor, params.gridCellSize,
      ];
      const uintFields = new Set([2, 3]);
      nums.forEach((n, i) => uintFields.has(i) ? u32(v, i * 4, n) : f32(v, i * 4, n));
      for (let i = 0; i < 32; i++) u32(v, 80 + i * 4, scratch[i] || 0);
      return packHostBytes;
    }

    function lookAt(eye, at, up) {
      const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
      const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((x) => x / l); };
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const z = norm(sub(eye, at));
      const x = norm(cross(up, z));
      const y = cross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]),
        -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]),
        -(z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2]),
        1,
      ]);
    }

    function perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, far / (near - far), -1,
        0, 0, (near * far) / (near - far), 0,
      ]);
    }

    function mul(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
        o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
      }
      return o;
    }

    const RENDER = `
struct Body {
  position: vec3f, invMass: f32,
  orientation: vec4f,
  invInertia: vec3f, flags: u32,
  linearVel: vec3f, sleepTimer: f32,
  angularVel: vec3f, generation: u32,
  initialPos: vec3f, initialPad: f32,
  initialRot: vec4f,
};
struct Collider {
  body: u32, shape: u32, material: u32, generation: u32,
  localPos: vec3f, density: f32,
  localRot: vec4f,
  params: vec4f,
};
struct Frame { viewProj: mat4x4<f32>, mode: u32 };
struct Eye { pos: vec3f, _pad: f32 };
@group(0) @binding(0) var<storage, read> bodies: array<Body>;
@group(0) @binding(1) var<uniform> frame: Frame;
@group(0) @binding(2) var<storage, read> cols: array<Collider>;
@group(0) @binding(3) var<uniform> eye: Eye;

fn quatRotate(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}

struct VsOut {
  @builtin(position) clip: vec4f,
  @location(0) normal: vec3f,
  @location(1) color: vec3f,
  @location(2) world: vec3f,
  @location(3) center: vec3f,
  @location(4) radius: f32,
};

@vertex fn vs(@location(0) corner: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> VsOut {
  let b = bodies[inst + 1u];
  let col = cols[inst + 1u];
  var half = col.params.xyz;
  var radius = 0.0;
  if (col.shape == 0u) {
    // Bounds cube of half-extent r; fragment ray-hits the sphere so corners do not stick out.
    half = vec3f(col.params.x);
    radius = col.params.x;
  }
  let world = b.position + quatRotate(b.orientation, corner * (half / 0.5));
  var o: VsOut;
  o.clip = frame.viewProj * vec4f(world, 1.0);
  o.normal = quatRotate(b.orientation, normal);
  o.world = world;
  o.center = b.position;
  o.radius = radius;
  // 0 position tint, 1 awake/sleep, 2 speed. The ball stays gray.
  if (col.shape == 0u) {
    o.color = vec3f(0.75, 0.78, 0.82);
  } else if (frame.mode == 1u) {
    let sleeping = (b.flags & 4u) != 0u;
    o.color = select(vec3f(0.95, 0.58, 0.16), vec3f(0.28, 0.48, 0.82), sleeping);
  } else if (frame.mode == 2u) {
    let t = clamp(length(b.linearVel) / 3.0, 0.0, 1.0);
    o.color = mix(vec3f(0.22, 0.32, 0.48), vec3f(0.95, 0.22, 0.16), t);
  } else {
    let t = fract(b.position.y * 0.08 + b.position.x * 0.05);
    o.color = vec3f(0.72, 0.38 + 0.35 * t, 0.22);
  }
  return o;
}

@fragment fn fs(i: VsOut) -> @location(0) vec4f {
  var n = normalize(i.normal);
  if (i.radius > 0.0) {
    let rd = normalize(i.world - eye.pos);
    let oc = eye.pos - i.center;
    let b = dot(oc, rd);
    let c = dot(oc, oc) - i.radius * i.radius;
    let h = b * b - c;
    if (h < 0.0) { discard; }
    var tHit = -b - sqrt(h);
    if (tHit < 0.0) { tHit = -b + sqrt(h); }
    if (tHit < 0.0) { discard; }
    n = normalize((eye.pos + rd * tHit) - i.center);
  }
  let light = normalize(vec3f(0.35, 0.85, 0.4));
  let ndl = max(dot(n, light), 0.0);
  return vec4f(i.color * (0.28 + 0.72 * ndl), 1.0);
}

@vertex fn vsGround(@location(0) corner: vec3f) -> VsOut {
  var o: VsOut;
  o.clip = frame.viewProj * vec4f(corner, 1.0);
  o.normal = vec3f(0.0, 1.0, 0.0);
  // Keep bodies live in this entry point so auto-layout still binds slot 0.
  o.color = vec3f(0.22, 0.24, 0.28) + bodies[0].position * 0.0;
  o.world = corner;
  o.center = corner;
  o.radius = 0.0;
  return o;
}

@fragment fn fsGround(i: VsOut) -> @location(0) vec4f {
  let n = normalize(i.normal);
  let light = normalize(vec3f(0.35, 0.85, 0.4));
  let ndl = max(dot(n, light), 0.0);
  return vec4f(i.color * (0.28 + 0.72 * ndl), 1.0);
}
`;

    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('no WebGPU adapter');
    if (adapter.limits.minUniformBufferOffsetAlignment > PASS_ALIGN) {
      throw new Error('uniform offset alignment exceeds 256');
    }
    const wantTimestamps = adapter.features.has('timestamp-query');
    const device = await adapter.requestDevice({
      requiredFeatures: wantTimestamps ? ['timestamp-query'] : [],
      requiredLimits: {
        maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,

    });
    device.lost.then((info) => fail('device lost: ' + info.message));
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    const configure = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, canvas.clientWidth * dpr);
      canvas.height = Math.max(1, canvas.clientHeight * dpr);
      context.configure({ device, format, alphaMode: 'opaque' });
    };
    configure();
    addEventListener('resize', configure);

    const sizes = bufferSizes();
    const usage = (i) => {
      let u = GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC;
      u |= (i === 6 || i === 22) ? GPUBufferUsage.UNIFORM : GPUBufferUsage.STORAGE;
      if (i === 23) u |= GPUBufferUsage.INDIRECT;
      return u;
    };
    const bufs = sizes.map((size, i) => device.createBuffer({ label: 'b' + i, size, usage: usage(i) }));

    const pass = new Uint8Array(96 * PASS_ALIGN);
    const passView = new DataView(pass.buffer);
    for (let i = 0; i < 96; i++) {
      let v = i;

    }
    device.queue.writeBuffer(bufs[22], 0, pass);

    const mats = new ArrayBuffer(64 * 16);
    const mv = new DataView(mats);
    for (let i = 0; i < 64; i++) {
      f32(mv, i * 16, cfg.friction); f32(mv, i * 16 + 4, 0); f32(mv, i * 16 + 8, 0.01); f32(mv, i * 16 + 12, 0);
    }
    device.queue.writeBuffer(bufs[3], 0, mats);

    const bodyBytes = new ArrayBuffer(sizes[0]);
    const colBytes = new ArrayBuffer(sizes[2]);
    const bodies = [];
    const colliders = [];
    const half = [0.5, 0.25, 0.25];
    const brickR = Math.hypot(...half);
    let maxSmallR = brickR;
    const brickInertia = (mass) => {
      const inv = (a, b) => 1 / ((mass / 12) * (a * a + b * b));
      return [inv(0.5, 0.5), inv(1, 0.5), inv(1, 0.5)];
    };
    const boxInertia = (mass, hx, hy, hz) => {
      const inv = (a, b) => 1 / ((mass / 12) * (a * a + b * b));
      return [inv(hy * 2, hz * 2), inv(hx * 2, hz * 2), inv(hx * 2, hy * 2)];
    };
    bodies.push({ p: [0, 0, 0], invMass: 0, invI: [0, 0, 0], flags: 0 });
    colliders.push({ body: 0, shape: 4, density: 0, params: [0, 1, 0, 0.5] });
    const addBrick = (pos, angle, mass, density) => {
      const id = bodies.length;
      const s = Math.sin(angle / 2), c = Math.cos(angle / 2);
      bodies.push({ p: pos, invMass: 1 / mass, invI: brickInertia(mass), flags: 1 | 8, q: [0, s, 0, c] });
      colliders.push({ body: id, shape: 2, density, params: [half[0], half[1], half[2], brickR] });
    };
    const addBox = (pos, hx, hy, hz, mass, q) => {
      const id = bodies.length;
      const r = Math.hypot(hx, hy, hz);
      maxSmallR = Math.max(maxSmallR, r);
      bodies.push({ p: pos, invMass: 1 / mass, invI: boxInertia(mass, hx, hy, hz), flags: 1 | 8, q: q || [0, 0, 0, 1] });
      colliders.push({ body: id, shape: 2, density: 1, params: [hx, hy, hz, r] });
    };
    const addBall = (pos, radius, density, vel, ang) => {
      const mass = density * (4 / 3) * Math.PI * radius ** 3;
      const inertia = 0.4 * mass * radius * radius;
      const id = bodies.length;
      bodies.push({ p: pos, invMass: 1 / mass, invI: [1 / inertia, 1 / inertia, 1 / inertia], flags: 1 | 8, v: vel, w: ang });
      colliders.push({ body: id, shape: 0, density, params: [radius, 0, 0, radius] });
    };
    const buildRing = (radius, courses, tier, rows) => {
      const mass = 0.25;
      for (let c = 0; c < courses; c++) {
        const depth = Math.max(1, rows - Math.floor(c / tier));
        for (let j = 0; j < depth; j++) {
          const r = radius + 0.25 + 0.52 * j;
          const n = Math.floor((2 * Math.PI * (r - 0.25)) / 1.02);
          for (let i = 0; i < n; i++) {
            const a = ((i + (c % 2) * 0.5) / n) * 2 * Math.PI;
            addBrick([r * Math.cos(a), 0.75 + 0.5 * c, r * Math.sin(a)], a + Math.PI / 2, mass, 1);
          }
        }
      }
      const ballR = courses / 5;
      addBall([0, 0.5 + ballR, -(radius + 0.52 * rows + ballR + 2)], ballR, 10, [0, 0, 30], [-30 / ballR, 0, 0]);
    };
    const buildGables = (columns, rows, base) => {
      const pitchX = base + 2, pitchY = 5, mass = 0.25;
      for (let cx = 0; cx < columns; cx++) {
        for (let cy = 0; cy < rows; cy++) {
          const x0 = (cx - (columns - 1) / 2) * pitchX;
          const z = (cy - (rows - 1) / 2) * pitchY;
          for (let k = 0; k < base; k++) {
            const m = base - k;
            for (let i = 0; i < m; i++) {
              addBrick([x0 + (i - (m - 1) / 2) * 1.01, 0.75 + 0.5 * k, z], 0, mass, 1);
            }
          }
        }
      }
      const ballR = base / 7;
      for (const cx of [columns / 2 - 2, columns / 2 + 1]) {
        const x = (cx - (columns - 1) / 2) * pitchX;
        const z = -((rows - 1) / 2) * pitchY - ballR - 12;
        addBall([x, 0.5 + ballR, z], ballR, 50, [0, 0, 30], [-30 / ballR, 0, 0]);
      }
    };
    statusEl.textContent = `building ${scene}…`;
    if (scene === 'ring') {
      buildRing(12, 20, 2, 10);
    } else if (scene === 'ring110k') {
      buildRing(80, 40, 4, 10);
    } else if (scene === 'gables') {
      buildGables(4, 8, 20);
    } else if (scene === 'gables506k') {
      buildGables(16, 68, 30);
    } else if (scene === 'pyramid') {
      const levels = cfg.levels, mass = 0.25;
      const nBodies = (levels * (levels + 1) * (2 * levels + 1)) / 6;
      document.querySelector('h1').textContent = `Slang → WGSL · settled pyramid ${levels} levels (~${Math.round(nBodies)}), 10 iterations`;
      for (let level = 0; level < levels; level++) {
        const n = levels - level;
        for (let x = 0; x < n; x++) {
          for (let z = 0; z < n; z++) {
            addBrick([
              (x - (n - 1) / 2) * 1.05,
              0.75 + level * 0.5,
              (z - (n - 1) / 2) * 0.55,
            ], 0, mass, 1);
          }
        }
      }
    } else if (scene === 'pile') {
      // three-avbd boxPile(40, 20); generate (z,x,y) then Morton-upload.
      let seed = 12345;
      const rand = () => { seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; return seed / 2 ** 32; };
      const n = 40, h = 20;
      const specs = [];
      for (let z = 0; z < h; z++) {
        for (let x = 0; x < n; x++) {
          for (let y = 0; y < n; y++) {
            const hx = 0.25 + rand() * 0.35, hy = 0.25 + rand() * 0.35, hz = 0.25 + rand() * 0.35;
            const pos = [(x - n / 2) * 1.6, 2 + z * 1.6, (y - n / 2) * 1.6];
            let qx = rand() - 0.5, qy = rand() - 0.5, qz = rand() - 0.5, qw = rand() - 0.5;
            const ql = Math.hypot(qx, qy, qz, qw) || 1;
            specs.push({ pos, hx, hy, hz, q: [qx / ql, qy / ql, qz / ql, qw / ql] });
          }
        }
      }
      let lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
      for (const s of specs) for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], s.pos[k]); hi[k] = Math.max(hi[k], s.pos[k]); }
      const spread = (x) => {
        x &= 0x3ff;
        x = (x | (x << 16)) & 0x30000ff;
        x = (x | (x << 8)) & 0x300f00f;
        x = (x | (x << 4)) & 0x30c30c3;
        x = (x | (x << 2)) & 0x9249249;
        return x;
      };
      const order = specs.map((_, i) => i).sort((ia, ib) => {
        const morton = (p) => {
          const q = (k) => Math.max(0, Math.min(1023, Math.floor((p[k] - lo[k]) / Math.max(hi[k] - lo[k], 1e-9) * 1024)));
          return spread(q(0)) | (spread(q(1)) << 1) | (spread(q(2)) << 2);
        };
        return morton(specs[ia].pos) - morton(specs[ib].pos);
      });
      for (const i of order) {
        const s = specs[i];
        addBox(s.pos, s.hx, s.hy, s.hz, 8 * s.hx * s.hy * s.hz, s.q);
      }
    } else if (scene === 'columns') {
      const n = 100, h = 10;
      for (let x = 0; x < n; x++) {
        for (let z = 0; z < n; z++) {
          for (let y = 0; y < h; y++) {
            addBox([(x - n / 2) * 1.5, 1 + y, (z - n / 2) * 1.5], 0.5, 0.5, 0.5, 1);
          }
        }
      }
    } else {
      const mass = 0.6 * 0.25;
      const w = 40, courses = 25;
      for (let course = 0; course < courses; course++) {
        const offset = course % 2 === 0 ? 0 : 0.5;
        for (let x = 0; x < w; x++) {
          for (let depth = 0; depth < 2; depth++) {
            addBrick([(x - w / 2) + offset, 0.75 + course * 0.5, depth * 0.5], 0, mass, 0.6);
          }
        }
      }
      addBall([0, 5, -25], 2, 20, [0, 4, 30], [0, 0, 0]);
    }
    if (bodies.length > cap.maxBodies) throw new Error(`${bodies.length} bodies exceed capacity ${cap.maxBodies}`);
    params.gridCellSize = Math.max(0.5, 2 * maxSmallR * 1.0001);
    bodies.forEach((b, i) => {
      writeBody(bodyBytes, i, b);
      writeBody(bodyBytes, cap.maxBodies + i, b);
    });
    colliders.forEach((c, i) => writeCollider(colBytes, i, c));
    device.queue.writeBuffer(bufs[0], 0, bodyBytes);
    device.queue.writeBuffer(bufs[2], 0, colBytes);

    const sources = {};
    for (const name of K) {
      statusEl.textContent = 'compiling ' + name;
      const src = await (await fetch(`./generated/wgsl/${name}.wgsl`)).text();
      const module = device.createShaderModule({ label: name, code: src });
      // Force frontend validation now so createComputePipeline cannot hang forever
      // on a deferred compile error (Chrome async path has been wedging here).
      if (module.getCompilationInfo) {
        const info = await module.getCompilationInfo();
        const err = info.messages.find((m) => m.type === 'error');
        if (err) throw new Error(`${name}: ${err.message}`);
      }
      sources[name] = { src, module };
    }

    statusEl.textContent = 'creating pipelines…';
    const pipes = {};
    for (const name of K) {
      const binds = bindingsOf(sources[name].src);
      const layout = device.createBindGroupLayout({
        label: name,
        entries: binds.map((b) => ({
          binding: b.index,
          visibility: GPUShaderStage.COMPUTE,
          buffer: b.uniform
            ? { type: 'uniform', hasDynamicOffset: b.index === 22, minBindingSize: b.index === 22 ? 16 : undefined }
            : { type: 'storage' },
        })),
      });
      statusEl.textContent = 'pipeline ' + name;
      const tPipe = performance.now();
      // Sync create: createComputePipelineAsync was hanging on sleep_island_commit
      // after the large narrowphase / solve_primal modules on Chrome Metal.
      device.pushErrorScope('validation');
      const pipeline = device.createComputePipeline({
        label: name,
        layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }),
        compute: { module: sources[name].module, entryPoint: name },
      });
      const pipeErr = await device.popErrorScope();
      if (pipeErr) throw new Error(`${name}: ${pipeErr.message}`);
      const bind = device.createBindGroup({
        label: name,
        layout,
        entries: binds.map((b) => ({
          binding: b.index,
          resource: b.index === 22 ? { buffer: bufs[22], size: 16 } : { buffer: bufs[b.index] },
        })),
      });
      pipes[name] = { pipeline, bind, dynamic: binds.some((b) => b.index === 22) };
      statusEl.textContent = `pipeline ${name} ${(performance.now() - tPipe).toFixed(0)}ms`;
      // setTimeout — not rAF: background tabs throttle rAF and freeze load between kernels.
      await new Promise((r) => setTimeout(r, 0));
    }

    statusEl.textContent = 'pipelines ready · building renderer…';
    await new Promise((r) => setTimeout(r, 0));

    const staging = device.createBuffer({ size: 64, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const bodyRead = device.createBuffer({ size: 16, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    // Full body buffer for settle KE / height samples (settled scenes only).
    const bodySnap = cfg.settled
      ? device.createBuffer({ size: sizes[0], usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST })
      : null;
    let bodyCount = bodies.length;
    let colliderCount = bodies.length;
    let last = { contact: 0, candidate: 0, awake: 0, color: 0, manifold: 0, overflow: 0 };
    let parity = 0;
    let steps = 0;
    const sleepRounds = cfg.sleepRounds;
    let settle = { ke: 0, maxV: 0, maxY: 0, minY: 0, sleeping: 0, sampleStep: 0 };
    const initialMaxY = (() => {
      let m = 0;
      for (let i = 1; i < bodies.length; i++) m = Math.max(m, bodies[i].p[1]);
      return m;
    })();

    // Reused every step — allocating these in writeHost showed up as wall−GPU gap on ring.
    const scratchU32 = new Uint32Array(64);
    // Must match bufs[17] size from bufferSizes (maxColors × 4), not a larger pad.
    const colorCountWords = cap.maxColors;
    const colorCountsBytes = colorCountWords * 4;
    // One queue upload + GPU copies into the four step buffers (cheaper than 4 writeBuffers).
    const hostUpload = device.createBuffer({
      size: 256 + 256 + 64 + colorCountsBytes,
      usage: GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
    });
    const hostUploadCpu = new ArrayBuffer(256 + 256 + 64 + colorCountsBytes);
    const hostScratchView = new Uint32Array(hostUploadCpu, 0, 64);
    const hostParamsView = new Uint8Array(hostUploadCpu, 256, 208);
    const hostCountersView = new Uint32Array(hostUploadCpu, 512, 16);
    const hostColorsView = new Uint32Array(hostUploadCpu, 576, colorCountWords);

    function scratchWords() {
      const idsLen = csrBase;
      const prevN = Math.min(Math.max(last.contact, 256), cap.maxContacts);
      const s = scratchU32;
      s.fill(0);
      s[1] = cap.maxBodies;
      s[2] = cap.maxCandidates;
      s[3] = cap.maxContacts;
      s[7] = Math.min(last.contact, cap.maxContacts);
      s[8] = parity === 0 ? cap.maxContacts : 0;
      const hash = Math.min(nextPow2(Math.max(prevN * 4, 1024)), idsLen);
      s[9] = hash;
      s[10] = cap.maxCandidates;
      s[11] = parity === 0 ? 0 : cap.maxContacts;
      let log = 0;
      while ((1 << log) < Math.max(bodyCount, 1) && log < 20) log++;
      s[12] = log === 0 ? 0 : (log - 1) & 1;
      s[17] = steps;
      s[24] = csrBase;
      return s;
    }

    function writeHost(enc) {
      const s = scratchWords();
      packHost(s);
      hostScratchView.set(s);
      hostParamsView.set(packHostU8);
      hostCountersView.fill(0);
      hostCountersView[0] = bodyCount;
      hostCountersView[1] = colliderCount;
      hostColorsView.fill(0);
      device.queue.writeBuffer(hostUpload, 0, hostUploadCpu);
      // Prefer GPU copies from one upload — four tiny writeBuffers were ~0.3 ms of ring wall.
      enc.copyBufferToBuffer(hostUpload, 0, bufs[21], 0, 256);
      enc.copyBufferToBuffer(hostUpload, 256, bufs[6], 0, 208);
      enc.copyBufferToBuffer(hostUpload, 512, bufs[7], 0, 64);
      enc.copyBufferToBuffer(hostUpload, 576, bufs[17], 0, colorCountsBytes);
    }

    function groups(threads) { return Math.ceil(Math.max(threads, 1) / 64); }
    function disp(pass, name, threads, passIdx) {
      const p = pipes[name];
      pass.setPipeline(p.pipeline);
      if (p.dynamic) pass.setBindGroup(0, p.bind, [(passIdx || 0) * PASS_ALIGN]);
      else pass.setBindGroup(0, p.bind);
      pass.dispatchWorkgroups(groups(threads), 1, 1);
    }

    function encodeStep(enc, readback, beginPass) {
      const nBodies = Math.max(bodyCount, 1);
      const nCols = Math.max(colliderCount, 1);
      const awake = last.awake === 0 ? nBodies : Math.max(1, Math.min(nBodies, last.awake * 2 + 256));
      const prevContacts = Math.max(last.contact, 256);
      const prevCand = Math.max(last.candidate, 256);
      const narrowN = Math.min(cap.maxCandidates,
        Math.max(prevCand + Math.floor(prevCand / 2) + 2048, nCols * 4, prevContacts + Math.floor(prevContacts / 4) + 1024));
      const contactN = Math.min(cap.maxContacts,
        Math.max(prevContacts + Math.floor(prevContacts / 4) + 1024, nCols * 4));
      const manifoldN = Math.max(narrowN, Math.max(last.manifold, 256) + Math.floor(Math.max(last.manifold, 256) / 4) + 1024);
      const idsLen = nextPow2(Math.max(32768, 2 * (cap.maxContacts + cap.maxJoints)));
      const hashN = Math.min(nextPow2(Math.max(Math.max(prevContacts, 256) * 4, 1024)), idsLen);

      writeHost(enc);
      let pass = beginPass ? beginPass() : enc.beginComputePass();
      const nextPhase = () => {
        if (!beginPass) return;
        pass.end();
        pass = beginPass();
      };
      disp(pass, 'build_aabbs', nCols);
      disp(pass, 'broadphase_clear', 131072);
      nextPhase();
      disp(pass, 'broadphase_insert', nCols);
      disp(pass, 'broadphase_query', nCols);
      nextPhase();
      const reuse = (params.flags & 1) !== 0;
      if (reuse) {
        disp(pass, 'update_refs', nBodies);
        disp(pass, 'contact_hash_clear', hashN);
        disp(pass, 'contact_hash_insert', Math.max(prevContacts, 1));
      }
      disp(pass, 'narrowphase', narrowN);
      nextPhase();
      if (!reuse) {
        disp(pass, 'contact_hash_clear', hashN);
        disp(pass, 'contact_hash_insert', Math.max(prevContacts, 1));
      }
      disp(pass, 'persist_contacts', contactN);
      nextPhase();
      disp(pass, 'build_awake_list', nBodies);
      disp(pass, 'csr_clear', nBodies + 1);
      disp(pass, 'csr_degree_contacts', manifoldN);
      if (bodyCount <= 512) {
        disp(pass, 'csr_prefix', 1);
      } else {
        disp(pass, 'csr_prefix_init', nBodies);
        let log = 0;
        while ((1 << log) < bodyCount && log < 20) {
          disp(pass, 'csr_prefix_scan', nBodies, 48 + log);
          log++;
        }
        disp(pass, 'csr_prefix_finalize', nBodies + 1);
      }
      disp(pass, 'csr_scatter_contacts', manifoldN);
      disp(pass, 'csr_sort', awake);
      disp(pass, 'init_colors', awake);
      // three-avbd defaults to 16 JP rounds. Floor 16 (was color+1 → 4 on frame 0).
      const colorRounds = Math.min(cap.maxColors, Math.max(16, last.color + 1));
      for (let round = 0; round < colorRounds; round++) disp(pass, 'color_bodies', awake, round % 16);
      disp(pass, 'pack_color_lists', awake);
      disp(pass, 'write_color_args', 64);
      disp(pass, 'predict_bodies', nBodies);
      nextPhase();
      const colors = Math.min(Math.min(cap.maxColors, 32), Math.max(4, last.color + 1));
      for (let iter = 0; iter < params.iterations; iter++) {
        if (beginPass && iter > 0) nextPhase();
        const primal = pipes.solve_primal_color;
        for (let color = 0; color < colors; color++) {
          pass.setPipeline(primal.pipeline);
          pass.setBindGroup(0, primal.bind, [color * PASS_ALIGN]);
          pass.dispatchWorkgroupsIndirect(bufs[23], color * 12);
        }
        if (beginPass) nextPhase();
        disp(pass, 'solve_dual', contactN);
      }
      disp(pass, 'extract_velocity_sleep', nBodies);
      nextPhase();
      if (last.manifold > 0) {
        for (let i = 0; i < sleepRounds; i++) disp(pass, 'sleep_island_gate', manifoldN);
      }
      disp(pass, 'sleep_island_commit', nBodies);
      pass.end();
      if (readback) {
        enc.copyBufferToBuffer(bufs[7], 0, staging, 0, 64);
        enc.copyBufferToBuffer(bufs[0], 112, bodyRead, 0, 16);
      }
    }

    function submitPhysics() {
      const enc = device.createCommandEncoder();
      encodeStep(enc, false);
      device.queue.submit([enc.finish()]);
      parity ^= 1;
      steps++;
    }

    async function readCounters() {
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(bufs[7], 0, staging, 0, 64);
      device.queue.submit([enc.finish()]);
      await staging.mapAsync(GPUMapMode.READ);
      const c = new Uint32Array(staging.getMappedRange().slice(0));
      staging.unmap();
      last = { contact: c[2], candidate: c[4], awake: c[5], color: c[6], manifold: c[12], overflow: c[7] };
    }

    function restoreScene() {
      device.queue.writeBuffer(bufs[0], 0, bodyBytes);
      device.queue.writeBuffer(bufs[2], 0, colBytes);
      parity = 0;
      steps = 0;
      last = { contact: 0, candidate: 0, awake: 0, color: 0, manifold: 0, overflow: 0 };
    }

    // Fair three-avbd protocol (blind lead-in + median of 10-step batches). Runs only
    // after the user has watched the impact, then restores for continued viewing.
    async function benchWall() {
      for (let i = 0; i < lead; i++) {
        submitPhysics();
        if (i % 10 === 9) {
          await device.queue.onSubmittedWorkDone();
          await readCounters();
          statusEl.textContent = `timing lead-in ${i + 1}/${lead} · contacts ${last.contact}`;
        }
      }
      await device.queue.onSubmittedWorkDone();
      let best = Infinity;
      for (let round = 0; round < 2; round++) {
        const samples = [];
        for (let batch = 0; batch < 5; batch++) {
          const t = performance.now();
          for (let i = 0; i < 10; i++) submitPhysics();
          await device.queue.onSubmittedWorkDone();
          samples.push((performance.now() - t) / 10);
        }
        samples.sort((a, b) => a - b);
        best = Math.min(best, samples[2]);
      }
      await readCounters();
      return best;
    }

    async function profilePhases() {
      if (!wantTimestamps) return '';
      const n = 5 + params.iterations * 2 + 1;
      const querySet = device.createQuerySet({ type: 'timestamp', count: n * 2 });
      const resolve = device.createBuffer({ size: n * 16, usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC });
      const read = device.createBuffer({ size: n * 16, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      const enc = device.createCommandEncoder();
      let i = 0;
      encodeStep(enc, false, () => {
        const pass = enc.beginComputePass({
          timestampWrites: { querySet, beginningOfPassWriteIndex: i * 2, endOfPassWriteIndex: i * 2 + 1 },
        });
        i++;
        return pass;
      });
      enc.resolveQuerySet(querySet, 0, n * 2, resolve, 0);
      enc.copyBufferToBuffer(resolve, 0, read, 0, n * 16);
      device.queue.submit([enc.finish()]);
      parity ^= 1;
      steps++;
      await read.mapAsync(GPUMapMode.READ);
      const stamps = new BigUint64Array(read.getMappedRange().slice(0));
      read.unmap();
      const ms = (a, b) => Number(stamps[b] - stamps[a]) / 1e6;
      const parts = ['aabbs', 'grid', 'narrowphase', 'warm', 'graph'];
      let primal = 0, dual = 0;
      for (let iter = 0; iter < params.iterations; iter++) {
        primal += ms((5 + iter * 2) * 2, (5 + iter * 2) * 2 + 1);
        dual += ms((6 + iter * 2) * 2, (6 + iter * 2) * 2 + 1);
      }
      const sleep = ms((5 + params.iterations * 2) * 2, (5 + params.iterations * 2) * 2 + 1);
      return parts.map((name, k) => `${name} ${ms(k * 2, k * 2 + 1).toFixed(2)}`).join(' · ')
        + ` · primal ${primal.toFixed(2)} · dual ${dual.toFixed(2)} · sleep ${sleep.toFixed(2)}`;
    }

    async function sampleSettle() {
      if (!bodySnap) return settle;
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(bufs[0], 0, bodySnap, 0, bodies.length * 112);
      device.queue.submit([enc.finish()]);
      await bodySnap.mapAsync(GPUMapMode.READ);
      const dv = new DataView(bodySnap.getMappedRange().slice(0, bodies.length * 112));
      bodySnap.unmap();
      let ke = 0, maxV = 0, maxY = -Infinity, minY = Infinity, sleeping = 0;
      for (let i = 1; i < bodies.length; i++) {
        const o = i * 112;
        const invM = dv.getFloat32(o + 12, true);
        if (!(invM > 0)) continue;
        const y = dv.getFloat32(o + 4, true);
        const flags = dv.getUint32(o + 44, true);
        const vx = dv.getFloat32(o + 48, true), vy = dv.getFloat32(o + 52, true), vz = dv.getFloat32(o + 56, true);
        const wx = dv.getFloat32(o + 64, true), wy = dv.getFloat32(o + 68, true), wz = dv.getFloat32(o + 72, true);
        const speed = Math.hypot(vx, vy, vz);
        const mass = 1 / invM;
        ke += 0.5 * mass * (vx * vx + vy * vy + vz * vz + wx * wx + wy * wy + wz * wz);
        maxV = Math.max(maxV, speed);
        maxY = Math.max(maxY, y);
        minY = Math.min(minY, y);
        if (flags & 4) sleeping++;
      }
      settle = { ke, maxV, maxY, minY, sleeping, sampleStep: steps };
      return settle;
    }

    const cube = [];
    const axes = [[0, 1, 2], [1, 2, 0], [2, 0, 1]];
    for (const [u, v, w] of axes) for (const sign of [-1, 1]) {
      const n = [0, 0, 0]; n[w] = sign;
      const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => {
        const p = [0, 0, 0]; p[u] = a * 0.5; p[v] = b * 0.5; p[w] = sign * 0.5; return p;
      });
      // Negative faces reverse (u, v) order. The same walk is clockwise from
      // outside, and cullMode 'back' would drop those faces.
      const wind = sign > 0 ? [[0, 1, 2], [0, 2, 3]] : [[0, 2, 1], [0, 3, 2]];
      for (const tri of wind) for (const idx of tri) cube.push(...corners[idx], ...n);
    }
    const ground = [];
    const G = cfg.ground;
    const gy = 0.5;
    for (const [x, z] of [[-G, -G], [G, -G], [G, G], [-G, -G], [G, G], [-G, G]]) ground.push(x, gy, z);
    const boxVbo = device.createBuffer({ size: cube.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    const groundVbo = device.createBuffer({ size: ground.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(boxVbo, 0, new Float32Array(cube));
    device.queue.writeBuffer(groundVbo, 0, new Float32Array(ground));
    const frameBuf = device.createBuffer({ size: 256, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const frameScratch = new ArrayBuffer(80);
    const frameF = new Float32Array(frameScratch);
    const frameU = new Uint32Array(frameScratch);
    const eyeBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const eyeScratch = new Float32Array(4);
    let colorMode = 1;
    function writeCamera(aspect) {
      const cam = cameraEye();
      const view = mul(perspective(Math.PI / 5, aspect, 0.2, cfg.far), lookAt(cam, target, [0, 1, 0]));
      frameF.set(view);
      frameU[16] = colorMode;
      device.queue.writeBuffer(frameBuf, 0, frameScratch);
      eyeScratch[0] = cam[0]; eyeScratch[1] = cam[1]; eyeScratch[2] = cam[2]; eyeScratch[3] = 0;
      device.queue.writeBuffer(eyeBuf, 0, eyeScratch);
    }
    const colorNames = ['position tint (red −X/down, yellow +X/up)', 'awake amber, sleeping blue', 'speed: blue still, red above 3 m/s'];
    function showLegend() {
      document.getElementById('legend').textContent = `Color: ${colorNames[colorMode]}. Keys 1 position, 2 awake/sleep, 3 speed. Friction μ ${cfg.friction}. Drag to orbit, scroll to zoom, right-drag to pan. Scenes: ?scene=wall|ring|gables|pyramid|pile|columns|ring110k|gables506k`;
    }
    showLegend();
    addEventListener('keydown', (e) => {
      if (e.key === '1') colorMode = 0;
      else if (e.key === '2') colorMode = 1;
      else if (e.key === '3') colorMode = 2;
      else return;
      showLegend();
    });
    statusEl.textContent = 'render shader…';
    const boxMod = device.createShaderModule({ label: 'render-boxes', code: RENDER });
    const groundMod = device.createShaderModule({ label: 'render-ground', code: RENDER });
    for (const mod of [boxMod, groundMod]) {
      if (!mod.getCompilationInfo) continue;
      const info = await mod.getCompilationInfo();
      const err = info.messages.find((m) => m.type === 'error');
      if (err) throw new Error(`render: ${err.message}`);
    }
    statusEl.textContent = 'render pipeline…';
    device.pushErrorScope('validation');
    const boxPipe = device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: boxMod, entryPoint: 'vs',
        buffers: [{ arrayStride: 24, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x3' }] }],
      },
      fragment: { module: boxMod, entryPoint: 'fs', targets: [{ format }] },
      primitive: { cullMode: 'back' },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
    });
    const groundPipe = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: groundMod, entryPoint: 'vsGround', buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }] },
      fragment: { module: groundMod, entryPoint: 'fsGround', targets: [{ format }] },
      primitive: { cullMode: 'none' },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
    });
    const renderErr = await device.popErrorScope();
    if (renderErr) throw new Error(`render pipeline: ${renderErr.message}`);
    device.pushErrorScope('validation');
    const boxBind = device.createBindGroup({ layout: boxPipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: bufs[0] } },
      { binding: 1, resource: { buffer: frameBuf } },
      { binding: 2, resource: { buffer: bufs[2] } },
      { binding: 3, resource: { buffer: eyeBuf } },
    ] });
    const groundBind = device.createBindGroup({ layout: groundPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: bufs[0] } }, { binding: 1, resource: { buffer: frameBuf } }] });
    const bindErr = await device.popErrorScope();
    if (bindErr) throw new Error(`render bind: ${bindErr.message}`);
    let depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + (e.error && e.error.message || e.error)));

    function drawWorld() {
      if (depth.width !== canvas.width || depth.height !== canvas.height) {
        depth.destroy();
        depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
      }
      const aspect = canvas.width / Math.max(1, canvas.height);
      writeCamera(aspect);
      const enc = device.createCommandEncoder();
      const rp = enc.beginRenderPass({
        colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.12, 0.16, 0.22, 1], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      rp.setPipeline(groundPipe); rp.setBindGroup(0, groundBind); rp.setVertexBuffer(0, groundVbo); rp.draw(6);
      rp.setPipeline(boxPipe); rp.setBindGroup(0, boxBind); rp.setVertexBuffer(0, boxVbo); rp.draw(36, bodies.length - 1);
      rp.end();
      device.queue.submit([enc.finish()]);
    }
    drawWorld();

    const info = adapter.info || {};
    let running = true;
    let wallMs = 0;
    let phases = '';
    let benchStarted = false;
    let measuring = false;
    async function frame(now) {
      if (!running) return;
      // Skip overlapping rAF ticks while benchWall awaits — concurrent mapAsync on
      // staging hung the replay at step 1 after measuring.
      if (measuring) { requestAnimationFrame(frame); return; }
      try {
        if (depth.width !== canvas.width || depth.height !== canvas.height) {
          depth.destroy();
          depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
        }
        const aspect = canvas.width / canvas.height;
        writeCamera(aspect);
        const enc = device.createCommandEncoder();
        encodeStep(enc, true);
        const rp = enc.beginRenderPass({
          colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.12, 0.16, 0.22, 1], loadOp: 'clear', storeOp: 'store' }],
          depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
        });
        rp.setPipeline(groundPipe); rp.setBindGroup(0, groundBind); rp.setVertexBuffer(0, groundVbo); rp.draw(6);
        rp.setPipeline(boxPipe); rp.setBindGroup(0, boxBind); rp.setVertexBuffer(0, boxVbo); rp.draw(36, bodies.length - 1);
        rp.end();
        device.queue.submit([enc.finish()]);
        await staging.mapAsync(GPUMapMode.READ);
        await bodyRead.mapAsync(GPUMapMode.READ);
        const c = new Uint32Array(staging.getMappedRange().slice(0));
        staging.unmap();
        bodyRead.unmap();
        last = { contact: c[2], candidate: c[4], awake: c[5], color: c[6], manifold: c[12], overflow: c[7] };
        parity ^= 1;
        steps++;
        if (cfg.settled && (steps === 1 || steps % 30 === 0 || steps === lead)) {
          await sampleSettle();
        }
        const dyn = bodies.length - 1;
        const settleLabel = cfg.settled && settle.sampleStep
          ? ` · sleep ${settle.sleeping}/${dyn} · KE ${settle.ke.toFixed(1)} · max|v| ${settle.maxV.toFixed(3)} · h ${settle.maxY.toFixed(2)}/${initialMaxY.toFixed(2)}`
          : '';
        const wallLabel = wallMs > 0 ? `${wallMs.toFixed(2)} ms` : (cfg.settled ? 'timing after settle…' : 'timing after impact…');
        statusEl.textContent = `${info.vendor || 'gpu'} · ${scene} · ${dyn} bodies · ${params.iterations} iters · ${wallLabel} ${phases} · step ${steps} · contacts ${last.contact} · awake ${last.awake}${settleLabel} · ov 0x${last.overflow.toString(16)} · frame ${(performance.now() - now).toFixed(1)} ms`;
        if (last.overflow) { running = false; fail('overflow flags 0x' + last.overflow.toString(16)); return; }

        // Smash: watch impact first. Settled: watch lead-in settle, then fair wall timing.
        // After measuring, restore so playback continues from the start again.
        if (!benchStarted && steps >= lead) {
          benchStarted = true;
          measuring = true;
          statusEl.textContent = cfg.settled
            ? `settled · measuring wall time (${dyn} bodies)…`
            : `impact shown · measuring wall time (${dyn} bodies)…`;
          try {
            if (cfg.settled) await sampleSettle();
            const pre = { ...settle };
            restoreScene();
            await device.queue.onSubmittedWorkDone();
            wallMs = await benchWall();
            phases = await profilePhases();
            if (cfg.settled) await sampleSettle();
            const report = {
              scene, bodies: dyn, iterations: params.iterations, wallMs, phases,
              contacts: last.contact, awake: last.awake, overflow: last.overflow,
              settle: pre, initialMaxY,
            };
            window.__BENCH__ = report;
            console.log('BENCH', JSON.stringify(report));
            restoreScene();
            await device.queue.onSubmittedWorkDone();
            drawWorld();
            const ok = !cfg.settled || (pre.ke < dyn * 0.05 && pre.maxV < 0.5 && pre.maxY > initialMaxY * 0.7);
            statusEl.textContent = `wall ${wallMs.toFixed(2)} ms ${phases}${cfg.settled ? ` · settle KE ${pre.ke.toFixed(1)} sleep ${pre.sleeping}/${dyn} h ${pre.maxY.toFixed(2)}/${initialMaxY.toFixed(2)} ${ok ? 'STABLE' : 'UNSTABLE'}` : ''} · replaying…`;
          } finally {
            measuring = false;
          }
        }
        requestAnimationFrame(frame);
      } catch (e) { running = false; measuring = false; fail(e); }
    }
    statusEl.textContent = `playing ${bodies.length - 1} bodies from the start…`;
    requestAnimationFrame(frame);
  </script>
</body>
</html>
