<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>engine — WebGPU AVBD wall</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12141a; color: #d7dbe6; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { position: fixed; top: 12px; left: 14px; max-width: 42rem; }
    h1 { font: 600 15px/1.3 ui-sans-serif, system-ui, sans-serif; margin: 0 0 4px; }
    .muted { color: #8b93a7; }
    #err { color: #ff8b8b; white-space: pre-wrap; margin-top: 4px; }
    #warn { color: #e6c07b; white-space: pre-wrap; margin-top: 4px; display: none; }
    #sceneRow { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
    #sceneRow label { color: #8b93a7; }
    #sceneSelect {
      background: #1c2030; color: #d7dbe6; border: 1px solid #3a4158;
      border-radius: 4px; padding: 3px 8px; font: inherit; max-width: 28rem;
    }
    #sceneSelect:focus { outline: 1px solid #6b7a9e; }
    #sleepLabel { display: flex; align-items: center; gap: 5px; margin-left: 10px; color: #d7dbe6; cursor: pointer; }
    #sleepLabel.locked { color: #8b93a7; cursor: default; }
    #rates {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 1.75rem;
      row-gap: 2px;
      margin: 0 0 8px;
      font: 600 13px/1.35 ui-sans-serif, system-ui, sans-serif;
      color: #d7dbe6;
    }
    #rates .lbl { color: #8b93a7; font-weight: 500; min-width: 4.5rem; }
    #rates .val { font-variant-numeric: tabular-nums; min-width: 2.5rem; }
    #rates .sub { color: #8b93a7; font-weight: 500; font-size: 11px; margin-left: 6px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <h1>Slang → WGSL · wall smash, same scene size as three-avbd</h1>
    <div id="sceneRow">
      <label for="sceneSelect">Scene</label>
      <select id="sceneSelect"></select>
      <label id="sleepLabel" for="sleepToggle" title="Let resting bodies fall asleep (URL: sleep=on|off)">
        <input type="checkbox" id="sleepToggle"> Sleep
      </label>
    </div>
    <div id="rates">
      <div><span class="lbl">TPS</span> <strong class="val" id="tpsVal">—</strong><span class="sub" id="stepMsVal"></span></div>
      <div><span class="lbl">Max TPS</span> <strong class="val" id="maxTpsVal">—</strong><span class="sub">uncapped</span></div>
      <div><span class="lbl">FPS</span> <strong class="val" id="fpsVal">—</strong><span class="sub" id="frameMsVal"></span></div>
      <div><span class="lbl">Max FPS</span> <strong class="val" id="maxFpsVal">—</strong><span class="sub">uncapped</span></div>
    </div>
    <div id="status" class="muted">starting…</div>
    <div id="mode" class="muted" hidden></div>
    <div id="legend" class="muted">Keys 1 position tint, 2 awake/sleep, 3 speed. Friction μ 0.5. Drag to orbit, scroll to zoom, right-drag to pan.</div>
    <div id="warn"></div>
    <div id="err"></div>
  </div>
  <script type="module">
    import { brickQuaternion, groundHalfExtent, boxInvInertia, sphereMassProperties, buildRing, buildGables } from "./scene-builders.mjs";
    import { mortonSceneOrder, restoreSceneOrder } from "./spatial-order.mjs";
    import { runRingRegression } from "./ring-regression.mjs";
    import { runGablesRegression } from "./gables-regression.mjs";
    import { measurePhysicsBatches, assertBenchmarkWorkload } from "./physics-benchmark.mjs?v=2";
    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const warnEl = document.getElementById('warn');
    const canvas = document.getElementById('c');
    const fail = (e) => { errEl.textContent = String(e && e.stack || e); statusEl.textContent = 'stopped'; };
    const warnOnce = (() => {
      const seen = new Set();
      return (msg) => {
        if (seen.has(msg)) return;
        seen.add(msg);
        warnEl.style.display = 'block';
        warnEl.textContent = (warnEl.textContent ? warnEl.textContent + '\n' : '') + msg;
      };
    })();
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });

    const qs = new URLSearchParams(location.search);
    const scene = qs.get('scene') || 'wall';
    const benchmarkOnly = qs.get('bench') === 'only';
    const benchmarkEnabled = qs.get('bench') === '1' || benchmarkOnly;
    // Diagnostic switches retain identical scenes and solver iteration counts.
    const incrementalColors = qs.get('coloring') !== 'rebuild';
    // Ring-only measured default; sparse=32 retains the separate-color control.
    const sparseStart = qs.has('sparse') ? Number(qs.get('sparse')) : scene === 'ring110k' ? 10 : 32;
    if (!Number.isInteger(sparseStart) || sparseStart < 0 || sparseStart > 32)
      throw new Error('sparse must be an integer color index from 0 through 32');
    // One workgroup/color avoids the serial scan across thousands of tiles.
    // Keep prefix=serial as an identical-order performance control.
    const parallelColorPrefix = qs.get('prefix') !== 'serial';
    const stablePacking = qs.get('packing') !== 'atomic';
    // Full ring persistent/control/persistent: 12.76/14.75/12.71 ms on M3 Max.
    // Persistent 64-byte hot + 32-byte cold history saves 256 MiB at ring capacity.
    // Gables persistent/canonical: 35.87/47.47 ms; browser gables240 passes. The
    // native persistent gables gate fails only through column-9 debris striking
    // column 10 (decision 8ea), so native keeps canonical. Other scenes opt in;
    // compact/canonical retain comparison controls.
    const persistentByDefault = ['ring110k', 'gables506k'].includes(scene) && !qs.has('contacts');
    const persistentContacts = qs.get('contacts') === 'persistent' || persistentByDefault;
    const compactContacts = persistentContacts || qs.get('contacts') === 'compact';
    const manifoldPersistence = qs.get('persistence') === 'manifold';
    const fusedPersistence = compactContacts && qs.get('persistence') === 'fused';
    // three-avbd hashInsert shape: one warm-hash thread per previous manifold
    // rather than per previous contact. Same published heads; ring/gables
    // checkpoints are bit-identical. Ring A/B/A 11.85/11.64/11.87 ms (repeat
    // 11.68), insert 0.39->0.13 ms. hashInsert=contact keeps the control.
    // Record slots (8ed) resolve the pair key and previous run without loading
    // previous contacts: ring manifold/record 11.42/11.21/11.83/11.35 ms, gables
    // 34.41/32.68/35.05/32.74 ms, bit-identical workloads.
    const hashInsertMode = qs.get('hashInsert') || (['ring110k', 'gables506k'].includes(scene) ? 'record' : 'contact');
    if (!['contact', 'manifold', 'record'].includes(hashInsertMode))
      throw new Error('hashInsert must be contact, manifold or record');
    // record: per-manifold insert of 16-byte slots holding the pair key and its
    // previous run, so lookups never load previous contacts to compare keys.
    const warmRecordHash = hashInsertMode === 'record';
    const manifoldHashInsert = hashInsertMode === 'manifold' || warmRecordHash;
    // Narrowphase finishes reused copies for moving pairs; persistence skips
    // points tagged final (8eh). Gables pass/copy 30.95/30.19/30.98/30.21 ms,
    // ring 11.37/11.27/11.38/11.27 ms. reuse=pass keeps the separate-pass control.
    const reuseMode = qs.get('reuse') || (['ring110k', 'gables506k'].includes(scene) && persistentContacts
      && !manifoldPersistence && !fusedPersistence ? 'copy' : 'pass');
    if (!['pass', 'copy'].includes(reuseMode)) throw new Error('reuse must be pass or copy');
    if (reuseMode === 'copy' && (!persistentContacts || manifoldPersistence || fusedPersistence))
      throw new Error('reuse=copy requires persistent contacts with per-contact persistence');
    const reuseCopy = reuseMode === 'copy';
    // np=split (8ek): the reuse pass compacts fresh pairs into the candidate
    // tail, then a shape-test pass runs SAT without reuse-copy lanes idling it.
    // Ring fused/split 11.04/10.70/11.01/10.67 ms; gables 29.57/27.48,
    // 29.11/27.25 ms (narrowphase 7.60->4.92), identical workload snapshots.
    const npMode = qs.get('np') || (reuseCopy ? 'split' : 'fused');
    if (!['fused', 'split'].includes(npMode)) throw new Error('np must be fused or split');
    if (npMode === 'split' && !reuseCopy) throw new Error('np=split requires reuse=copy');
    const npSplit = npMode === 'split';
    // rest=carry (8ep): pairs whose bodies are both at rest (static or asleep)
    // are re-emitted from last step's manifolds, so their warm start survives
    // sleep and a woken body does not restart its resting contacts cold.
    const restMode = qs.get('rest') || 'carry';
    if (!['carry', 'drop'].includes(restMode)) throw new Error('rest must be carry or drop');
    const carryRest = restMode === 'carry';
    // repair=local (8en): one workgroup loops JP rounds over a small incremental
    // repair list instead of 32 global color_bodies dispatches.
    // Graph detail colorRepair 0.26 -> 0.13 ms on ring and gables; colors are
    // identical (JP is schedule-independent).
    const repairMode = qs.get('repair') || (incrementalColors ? 'local' : 'rounds');
    if (!['rounds', 'local'].includes(repairMode)) throw new Error('repair must be rounds or local');
    if (repairMode === 'local' && !incrementalColors) throw new Error('repair=local requires incremental coloring');
    const localRepair = repairMode === 'local';
    // persist=list (8em): narrowphase lists the contacts that still need the
    // persistence pass, so it skips the per-contact scan of finished copies.
    // Gables scan/list warm 1.97/1.44 ms (wall 26.66/26.13); ring 10.44/10.19.
    const persistMode = qs.get('persist') || (reuseCopy ? 'list' : 'scan');
    if (!['scan', 'list'].includes(persistMode)) throw new Error('persist must be scan or list');
    if (persistMode === 'list' && !reuseCopy) throw new Error('persist=list requires reuse=copy');
    const persistList = persistMode === 'list';
    // endpoints=pairs (8el): solver pairs are packed before the graph, so CSR
    // degree and scatter read body ids from the 32-byte pair instead of
    // manifold -> two colliders (three-avbd TopoItem shape). Manifold
    // persistence packs pairs itself; the separate pack moves ahead otherwise.
    const endpointsMode = qs.get('endpoints') || (persistentContacts ? 'pairs' : 'manifold');
    if (!['manifold', 'pairs'].includes(endpointsMode)) throw new Error('endpoints must be manifold or pairs');
    if (endpointsMode === 'pairs' && !persistentContacts) throw new Error('endpoints=pairs requires persistent contacts');
    const pairEndpoints = endpointsMode === 'pairs';
    const earlyPairPack = pairEndpoints && !fusedPersistence && !manifoldPersistence;
    // Broadphase grid table scaled to >=2x colliders (three-avbd sizes its grid
    // at 2x body capacity); scenes up to 65536 colliders keep 131072 heads.
    // Gables fixed/scaled: 36.92/35.00/36.34/34.50 ms, grid 3.28->1.90 ms, with
    // unchanged workload snapshots. grid=fixed keeps the old table as control.
    // grid=split (8ej) gives awake dynamics their own table, so awake queriers
    // walk their own cell plus 13 forward cells; sleepers and small statics stay
    // in a second, fully walked table. Ring scaled/split 11.04/10.92/11.05/10.86/
    // 11.02/10.82 ms (grid 1.11->0.92) with identical workload snapshots; gables
    // was neutral (29.34/29.15/29.37 ms), so it keeps scaled.
    const gridMode = qs.get('grid') || (scene === 'ring110k' ? 'split' : 'scaled');
    if (!['fixed', 'scaled', 'split'].includes(gridMode)) throw new Error('grid must be fixed, scaled or split');
    const gridSplit = gridMode === 'split';
    const detailedProfile = qs.get('profile') === 'detail';
    const graphProfile = qs.get('profile') === 'graph';
    // Diagnostic: one timestamped pass per primal color (and the sparse tail).
    const colorProfile = qs.get('profile') === 'colors';
    const spatialOrder = qs.get('order') === 'morton';
    const physicalAdjacency = qs.get('adjacency') !== 'append';
    const regressionKind = qs.get('check');
    const regressionEnabled = ['ring', 'gables'].includes(regressionKind);
    const regressionSteps = regressionKind === 'gables' ? 240 : 480;
    if (regressionEnabled || benchmarkEnabled) {
      const modeEl = document.getElementById('mode');
      modeEl.hidden = false;
      modeEl.append(regressionEnabled
        ? `Automated check: rendering pauses during ${regressionSteps} physics steps, then stops after the result. `
        : benchmarkOnly ? 'Physics benchmark: fixed lead-in and timing window, then stops. '
        : 'Benchmark mode: playback pauses for measurement, then restarts. ');
      const liveLink = document.createElement('a');
      const liveUrl = new URL(location.href);
      liveUrl.searchParams.delete('check');
      liveUrl.searchParams.delete('bench');
      liveLink.href = liveUrl.href;
      liveLink.textContent = 'Open uninterrupted live demo';
      liveLink.style.color = '#b8d7ff';
      modeEl.append(liveLink);
    }
    // Allocate enough contacts for the benchmark, independently of dispatch size.
    // Large dispatches tile across Y; the 2M default bounds memory for smaller scenes.
    const DEFAULT_CONTACT_CAP = 1 << 21;
    const MAX_WARM_HASH = 1 << 21; // ample slots for one entry per manifold
    const nextPow2Cap = (n) => { let p = 1; while (p < n) p <<= 1; return p; };
    const sceneCap = (bodies, extras = {}) => {
      const b = nextPow2Cap(Math.max(bodies, 4096));
      return {
        maxBodies: b,
        maxColliders: nextPow2Cap(Math.max(bodies * 2, 8192)),
        maxContacts: Math.min(nextPow2Cap(Math.max(bodies * 16, 32768)), DEFAULT_CONTACT_CAP),
        maxJoints: extras.maxJoints ?? 64,
        maxCandidates: Math.min(nextPow2Cap(Math.max(bodies * 32, 65536)), DEFAULT_CONTACT_CAP),
        maxColors: 32,
        maxCommands: 64,
        maxHull: 64,
      };
    };
    // Capacities mirror three-avbd bench-cases tiers (small / paper / large / steady).
    const SCENES = {
      wall: {
        title: 'wall smash 2k, 10 iterations',
        lead: 30, iterations: 10, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [0, 16, -42], look: [0, 8, 0], far: 400, ground: 48,
        cap: sceneCap(4096),
      },
      ring: {
        title: 'brick ring 9k, 4 iterations',
        lead: 60, iterations: 4, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [32, 22, 14], look: [0, 5, 0], far: 400, ground: 22, flags: 1, sleepTime: 1e6,
        cap: sceneCap(16384), // contacts 262144 — was 131072 (overflow mid-smash)
      },
      gables: {
        title: 'brick gables 6.7k, 3 iterations',
        lead: 60, iterations: 3, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [0, 28, -40], look: [0, 6, 0], far: 400, ground: 44, flags: 1,
        cap: sceneCap(16384),
      },
      pyramid: {
        // levels via ?levels=N (default 30). Match three-avbd: reuseContacts + full 4-pt faces.
        title: 'settled pyramid',
        lead: 180, iterations: 10, settled: true, sleepRounds: 8, friction: 0.5,
        eye: [28, 22, 28], look: [0, 6, 0], far: 400, ground: 64,
        levels: Math.max(2, Math.min(50, Number(qs.get('levels') || 30) || 30)),
        flags: 1, // FLAG_REUSE_CONTACTS — three-avbd default
        cap: sceneCap(16384),
      },
      pile: {
        title: 'settled pile 32k, 4 iterations',
        lead: 180, iterations: 4, settled: true, sleepRounds: 1, friction: 0.7,
        eye: [48, 36, 48], look: [0, 8, 0], far: 800, ground: 96,
        // Box Pile scene defaults (DECISIONS 8af–8av)
        flags: 1, alpha: 0.95, betaLin: 2000, sleepLin: 0.5, sleepAng: 0.5, sleepTime: 0.25,
        cap: sceneCap(65536),
      },
      columns: {
        title: 'box columns 100k, 4 iterations',
        lead: 180, iterations: 4, settled: true, sleepRounds: 8, friction: 0.5,
        eye: [90, 40, 90], look: [0, 6, 0], far: 1200, ground: 200,
        flags: 1, // three-avbd reuseContacts default
        cap: sceneCap(131072),
      },
      ring110k: {
        title: 'brick ring 110k, 4 iterations',
        lead: 60, iterations: 4, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [140, 60, 40], look: [0, 12, 0], far: 2000, ground: 90, flags: 1, sleepTime: 1e6,
        cap: sceneCap(131072),
      },
      gables506k: {
        title: 'brick gables 506k, 3 iterations',
        lead: 60, iterations: 3, settled: false, sleepRounds: 8, friction: 0.5,
        eye: [0, 80, -120], look: [0, 10, 0], far: 4000, ground: 256, flags: 1, sleepTime: 1e6,
        cap: { ...sceneCap(524288), maxContacts: 6 * 1048576, maxCandidates: 4 * 1048576 },
      },
    };
    const cfg = SCENES[scene];
    if (!cfg) throw new Error(`unknown scene ${scene}; try ${Object.keys(SCENES).join(', ')}`);
    const sceneSelect = document.getElementById('sceneSelect');
    for (const [id, s] of Object.entries(SCENES)) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = s.title;
      if (id === scene) opt.selected = true;
      sceneSelect.appendChild(opt);
    }
    sceneSelect.addEventListener('change', () => {
      const next = new URL(location.href);
      next.searchParams.set('scene', sceneSelect.value);
      next.searchParams.delete('check');
      if (sceneSelect.value !== 'pyramid') next.searchParams.delete('levels');
      location.href = next.href;
    });
    const cap = cfg.cap;
    const lead = cfg.lead;
    const eye0 = cfg.eye;
    const look0 = cfg.look;
    document.querySelector('h1').textContent = `Slang → WGSL · ${cfg.title}`;
    let target = look0.slice();
    const toEye = [eye0[0] - look0[0], eye0[1] - look0[1], eye0[2] - look0[2]];
    let orbitDist = Math.hypot(...toEye);
    let orbitYaw = Math.atan2(toEye[0], toEye[2]);
    let orbitPitch = Math.asin(Math.max(-1, Math.min(1, toEye[1] / orbitDist)));
    function cameraEye() {
      const cp = Math.cos(orbitPitch), sp = Math.sin(orbitPitch);
      const sy = Math.sin(orbitYaw), cy = Math.cos(orbitYaw);
      return [target[0] + orbitDist * cp * sy, target[1] + orbitDist * sp, target[2] + orbitDist * cp * cy];
    }
    let drag = null;
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('pointerdown', (e) => {
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, pan: e.button === 2 || e.shiftKey || e.button === 1 };
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events have no capture */ }
    });
    canvas.addEventListener('pointerup', (e) => { if (drag && drag.id === e.pointerId) drag = null; });
    canvas.addEventListener('pointermove', (e) => {
      if (!drag || drag.id !== e.pointerId) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      if (drag.pan) {
        const eyeNow = cameraEye();
        const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((v) => v / l); };
        const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
        const z = norm(sub(eyeNow, target));
        const x = norm(cross([0, 1, 0], z));
        const y = cross(z, x);
        const s = orbitDist * 0.0016;
        target = target.map((v, i) => v - (x[i] * dx + y[i] * dy) * s);
      } else {
        orbitYaw -= dx * 0.005;
        orbitPitch = Math.max(-1.2, Math.min(1.2, orbitPitch + dy * 0.005));
      }
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      orbitDist = Math.max(2, Math.min(cfg.far, orbitDist * Math.exp(e.deltaY * 0.0012)));
    }, { passive: false });
    const PASS_ALIGN = 256;
    const nextPow2 = (n) => { let p = 1; while (p < n) p <<= 1; return p; };
    const prevPow2 = (n) => { let p = 1; while (p * 2 <= n) p <<= 1; return p; };
    const constraintIdWords = nextPow2(Math.max(32768, 2 * (cap.maxContacts + cap.maxJoints)));
    const csrBase = Math.max(constraintIdWords, 131072);

    function bufferSizes() {
      const b = (n, stride) => n * stride;
      const s = new Array(29).fill(256);
      s[0] = b(cap.maxBodies * 2, 112);
      s[1] = b(cap.maxBodies, 112);
      s[2] = b(cap.maxColliders, 64);
      s[3] = b(64, 16);
      s[4] = b(cap.maxContacts * 2, persistentContacts ? 32 : 128);
      s[5] = b(cap.maxJoints, 256);
      s[6] = 256;
      s[7] = 256;
      s[8] = b(cap.maxCommands, 64);
      s[9] = b(cap.maxBodies + cap.maxColliders, 32);
      s[10] = b(cap.maxCandidates, 16);
      s[11] = b(cap.maxBodies, 4);
      s[12] = b(cap.maxBodies, 4);
      s[13] = b(cap.maxBodies + 1, 4);
      s[14] = (csrBase + cap.maxBodies + 1) * 4;
      s[15] = b(cap.maxBodies * (cap.maxColors + 2), 4);
      s[16] = b(cap.maxColors * Math.max(1, Math.ceil(cap.maxBodies / 64)), 4);
      s[17] = b(cap.maxColors, 4);
      s[18] = b(cap.maxHull, 16);
      s[19] = 65536 * 4;
      s[20] = b(cap.maxBodies, 4);
      s[21] = 96 * 4; // scratch: host-reset words 0..63, uniform-grid large list 64..79
      s[22] = 96 * PASS_ALIGN;
      s[23] = b(Math.max(cap.maxColors, 73) * 3, 4);
      s[24] = b(cap.maxColliders, 80);
      s[25] = b(cap.maxCandidates, 32);
      s[26] = b(cap.maxBodies, 32);
      s[27] = compactContacts ? b(cap.maxContacts * (persistentContacts ? 2 : 1), 64) : 64;
      s[28] = compactContacts ? b(cap.maxCandidates, 32) : 32;
      return s;
    }

    const K = [
      'build_aabbs', 'broadphase_clear', 'broadphase_insert', 'broadphase_query',
      'update_refs', 'narrowphase', 'contact_hash_clear', 'contact_hash_insert', 'persist_contacts', 'persist_manifolds',
      ...(manifoldHashInsert ? ['contact_hash_insert_manifolds'] : []),
      ...(reuseCopy ? ['narrowphase_copy_persistent', 'persist_contacts_copy_persistent'] : []),
      ...(npSplit ? ['narrowphase_defer_copy_persistent', 'narrowphase_fresh_copy_persistent'] : []),
      ...(persistList ? ['persist_list_copy_persistent'] : []),
      ...(localRepair ? ['color_bodies_local'] : []),
      ...(carryRest ? ['carry_rest_pairs'] : []),
      'build_awake_list', 'csr_clear', 'csr_degree_contacts', 'csr_prefix',
      'csr_prefix_blocks', 'csr_prefix_block_sums', 'csr_prefix_add',
      'csr_prefix_init', 'csr_prefix_scan', 'csr_prefix_finalize', 'csr_prefix_swap',
      'csr_scatter_contacts', 'csr_sort', 'csr_sort_append', 'init_colors', 'color_bodies',
      'pack_color_lists', 'write_color_args', 'write_work_args', 'predict_bodies', 'solve_primal_color',
      ...(sparseStart < 32 ? [compactContacts ? 'solve_primal_sparse_compact' : 'solve_primal_sparse'] : []),
      'count_color_tiles', 'prefix_color_tiles', 'prefix_color_tiles_parallel', 'scatter_color_tiles',
      ...(compactContacts ? ['clear_solver_contacts', 'pack_solver_contacts', 'persist_manifolds_compact', 'solve_primal_color_compact', 'solve_dual_compact'] : []),
      'solve_dual', 'extract_velocity_sleep', 'write_sleep_args', 'sleep_island_gate', 'sleep_island_commit',
    ];

    function bindingsOf(wgsl) {
      const out = [];
      for (const line of wgsl.split('\n')) {
        const i = line.indexOf('@binding(');
        if (i < 0) continue;

    let timingSamples;

    let phaseSamples;
    function preSolveProfileParts() {

    async function profileOneStep() {

    async function sampleSettle() {
      if (!bodySnap) return settle;
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(bufs[0], 0, bodySnap, 0, bodies.length * 112);
      device.queue.submit([enc.finish()]);
      await bodySnap.mapAsync(GPUMapMode.READ);
      const dv = new DataView(bodySnap.getMappedRange().slice(0, bodies.length * 112));
      bodySnap.unmap();
      let ke = 0, maxV = 0, maxY = -Infinity, minY = Infinity, sleeping = 0;
      for (let i = 1; i < bodies.length; i++) {
        const o = i * 112;
        const invM = dv.getFloat32(o + 12, true);
        if (!(invM > 0)) continue;
        const y = dv.getFloat32(o + 4, true);
        const flags = dv.getUint32(o + 44, true);
        const vx = dv.getFloat32(o + 48, true), vy = dv.getFloat32(o + 52, true), vz = dv.getFloat32(o + 56, true);
        const wx = dv.getFloat32(o + 64, true), wy = dv.getFloat32(o + 68, true), wz = dv.getFloat32(o + 72, true);
        const speed = Math.hypot(vx, vy, vz);
        const mass = 1 / invM;
        ke += 0.5 * mass * (vx * vx + vy * vy + vz * vz + wx * wx + wy * wy + wz * wz);
        maxV = Math.max(maxV, speed);
        maxY = Math.max(maxY, y);
        minY = Math.min(minY, y);
        if (flags & 4) sleeping++;
      }
      settle = { ke, maxV, maxY, minY, sleeping, sampleStep: steps };
      return settle;
    }

    const cube = [];
    const axes = [[0, 1, 2], [1, 2, 0], [2, 0, 1]];
    for (const [u, v, w] of axes) for (const sign of [-1, 1]) {
      const n = [0, 0, 0]; n[w] = sign;
      const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => {
        const p = [0, 0, 0]; p[u] = a * 0.5; p[v] = b * 0.5; p[w] = sign * 0.5; return p;
      });
      // Negative faces reverse (u, v) order. The same walk is clockwise from
      // outside, and cullMode 'back' would drop those faces.
      const wind = sign > 0 ? [[0, 1, 2], [0, 2, 3]] : [[0, 2, 1], [0, 3, 2]];
      for (const tri of wind) for (const idx of tri) cube.push(...corners[idx], ...n);
    }
    const ground = [];
    const G = cfg.ground;
    const gy = 0.5;
    for (const [x, z] of [[-G, -G], [G, -G], [G, G], [-G, -G], [G, G], [-G, G]]) ground.push(x, gy, z);
    const boxVbo = device.createBuffer({ size: cube.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    const groundVbo = device.createBuffer({ size: ground.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(boxVbo, 0, new Float32Array(cube));
    device.queue.writeBuffer(groundVbo, 0, new Float32Array(ground));
    const frameBuf = device.createBuffer({ size: 256, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const frameScratch = new ArrayBuffer(80);
    const frameF = new Float32Array(frameScratch);
    const frameU = new Uint32Array(frameScratch);
    const eyeBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const eyeScratch = new Float32Array(4);
    let colorMode = 1;
    function writeCamera(aspect) {
      const cam = cameraEye();
      const view = mul(perspective(Math.PI / 5, aspect, 0.2, cfg.far), lookAt(cam, target, [0, 1, 0]));
      frameF.set(view);
      frameU[16] = colorMode;
      device.queue.writeBuffer(frameBuf, 0, frameScratch);
      eyeScratch[0] = cam[0]; eyeScratch[1] = cam[1]; eyeScratch[2] = cam[2]; eyeScratch[3] = 0;
      device.queue.writeBuffer(eyeBuf, 0, eyeScratch);
    }
    const colorNames = ['position tint (red −X/down, yellow +X/up)', 'awake amber, sleeping blue', 'speed: blue still, red above 3 m/s'];
    function showLegend() {
      document.getElementById('legend').textContent = `Color: ${colorNames[colorMode]}. Keys 1 position, 2 awake/sleep, 3 speed. Friction μ ${cfg.friction}. Drag to orbit, scroll to zoom, right-drag to pan.`;
    }
    showLegend();
    addEventListener('keydown', (e) => {
      if (e.key === '1') colorMode = 0;
      else if (e.key === '2') colorMode = 1;
      else if (e.key === '3') colorMode = 2;
      else return;
      showLegend();
    });
    statusEl.textContent = 'render shader…';
    const boxMod = device.createShaderModule({ label: 'render-boxes', code: RENDER });
    const groundMod = device.createShaderModule({ label: 'render-ground', code: RENDER });
    for (const mod of [boxMod, groundMod]) {
      if (!mod.getCompilationInfo) continue;
      const info = await mod.getCompilationInfo();
      const err = info.messages.find((m) => m.type === 'error');
      if (err) throw new Error(`render: ${err.message}`);
    }
    statusEl.textContent = 'render pipeline…';
    device.pushErrorScope('validation');
    const boxPipe = device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: boxMod, entryPoint: 'vs',
        buffers: [{ arrayStride: 24, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x3' }] }],
      },
      fragment: { module: boxMod, entryPoint: 'fs', targets: [{ format }] },
      primitive: { cullMode: 'back' },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
    });
    const groundPipe = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: groundMod, entryPoint: 'vsGround', buffers: [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }] },
      fragment: { module: groundMod, entryPoint: 'fsGround', targets: [{ format }] },
      primitive: { cullMode: 'none' },
      depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
    });
    const renderErr = await device.popErrorScope();
    if (renderErr) throw new Error(`render pipeline: ${renderErr.message}`);
    device.pushErrorScope('validation');
    const boxBind = device.createBindGroup({ layout: boxPipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: bufs[0] } },
      { binding: 1, resource: { buffer: frameBuf } },
      { binding: 2, resource: { buffer: bufs[2] } },
      { binding: 3, resource: { buffer: eyeBuf } },
    ] });
    const groundBind = device.createBindGroup({ layout: groundPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: bufs[0] } }, { binding: 1, resource: { buffer: frameBuf } }] });
    const bindErr = await device.popErrorScope();
    if (bindErr) throw new Error(`render bind: ${bindErr.message}`);
    let depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + (e.error && e.error.message || e.error)));

    function drawWorld() {
      if (depth.width !== canvas.width || depth.height !== canvas.height) {
        depth.destroy();
        depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
      }
      const aspect = canvas.width / Math.max(1, canvas.height);
      writeCamera(aspect);
      const enc = device.createCommandEncoder();
      const rp = enc.beginRenderPass({
        colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.12, 0.16, 0.22, 1], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      rp.setPipeline(groundPipe); rp.setBindGroup(0, groundBind); rp.setVertexBuffer(0, groundVbo); rp.draw(6);
      rp.setPipeline(boxPipe); rp.setBindGroup(0, boxBind); rp.setVertexBuffer(0, boxVbo); rp.draw(36, bodies.length - 1);
      rp.end();
      device.queue.submit([enc.finish()]);
    }
    drawWorld();

    const info = adapter.info || {};
    const tpsVal = document.getElementById('tpsVal');
    const fpsVal = document.getElementById('fpsVal');
    const maxTpsVal = document.getElementById('maxTpsVal');
    const maxFpsVal = document.getElementById('maxFpsVal');
    const stepMsVal = document.getElementById('stepMsVal');
    const frameMsVal = document.getElementById('frameMsVal');
    let running = true;
    let wallMs = 0;
    let phases = '';
    let benchStarted = false;
    let measuring = false;
    // Rolling 1 s windows: TPS = physics steps/s, FPS = rAF presents/s (can diverge if
    // measuring pauses steps, or if multiple steps per frame are added later).
    // Max TPS/FPS = 1000/ms — headroom if uncapped by display refresh / rAF.
    let rateWindowStart = performance.now();
    let rateSteps = 0;
    let rateFrames = 0;
    let rateStepMsSum = 0;
    let rateFrameMsSum = 0;
    let showTps = 0;
    let showFps = 0;
    let showMaxTps = 0;
    let showMaxFps = 0;
    let showStepMs = 0;
    let showFrameMs = 0;
    function bumpRates(didStep, stepMs, frameMs) {
      rateFrames++;
      rateFrameMsSum += frameMs;
      if (didStep) {
        rateSteps++;
        rateStepMsSum += stepMs;
      }
      const elapsed = performance.now() - rateWindowStart;
      if (elapsed >= 1000) {
        const sec = elapsed / 1000;
        showTps = rateSteps / sec;
        showFps = rateFrames / sec;
        showStepMs = rateSteps > 0 ? rateStepMsSum / rateSteps : 0;
        showFrameMs = rateFrames > 0 ? rateFrameMsSum / rateFrames : 0;
        showMaxTps = showStepMs > 1e-6 ? 1000 / showStepMs : 0;
        showMaxFps = showFrameMs > 1e-6 ? 1000 / showFrameMs : 0;
        tpsVal.textContent = showTps.toFixed(0);
        fpsVal.textContent = showFps.toFixed(0);
        maxTpsVal.textContent = showMaxTps > 0 ? showMaxTps.toFixed(0) : '—';
        maxFpsVal.textContent = showMaxFps > 0 ? showMaxFps.toFixed(0) : '—';
        stepMsVal.textContent = showStepMs > 0 ? `${showStepMs.toFixed(1)} ms/step` : '';
        frameMsVal.textContent = showFrameMs > 0 ? `${showFrameMs.toFixed(1)} ms/frame` : '';
        window.__RATES__ = {
          tps: showTps, fps: showFps, maxTps: showMaxTps, maxFps: showMaxFps,
          stepMs: showStepMs, frameMs: showFrameMs,
        };
        rateWindowStart = performance.now();
        rateSteps = 0;
        rateFrames = 0;
        rateStepMsSum = 0;
        rateFrameMsSum = 0;
      }
    }
    // Live playback pipelines counter readback instead of draining the GPU every
    // frame: up to LIVE_IN_FLIGHT frames stay queued and counters arrive one or two
    // frames late. Dispatch sizes are GPU-driven; host sizing tolerates stale
    // counts (benchmarks already run ten-step batches between readbacks).
    // ?stopAt=N freezes live playback at step N (still rendering) so runs can be
    // compared at the same step, e.g. sleep=on vs sleep=off screenshots.
    const stopAt = Math.max(0, Number(qs.get('stopAt')) || 0);
    // Diagnostic: current body positions (x, y, z per body), for run comparisons.
    window.__bodyPositions = async () => {
      const bytes = bodies.length * 112;
      const snap = device.createBuffer({ size: bytes, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(bufs[0], 0, snap, 0, bytes);
      device.queue.submit([enc.finish()]);
      await snap.mapAsync(GPUMapMode.READ);
      const f = new Float32Array(snap.getMappedRange().slice(0));
      snap.unmap(); snap.destroy();
      const out = new Float32Array(bodies.length * 3);
      for (let i = 0; i < bodies.length; i++) out.set(f.subarray(i * 28, i * 28 + 3), i * 3);
      return { step: steps, positions: Array.from(out), initial: bodies.map((b) => b.p) };
    };

    const LIVE_IN_FLIGHT = 2;
    const liveFree = Array.from({ length: LIVE_IN_FLIGHT }, () =>
      device.createBuffer({ size: 64, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }));
    const livePending = new Set();
    let liveError = null;
    let lastCompletion = 0;
    let liveStepMs = 0;
    async function drainLive() {
      await Promise.all([...livePending]);
      if (liveError) throw liveError;
    }
    function readLiveCounters(buf) {
      const c = new Uint32Array(buf.getMappedRange().slice(0));
      buf.unmap();
      last = { contact: c[2], candidate: c[4], awake: c[5], color: c[6], manifold: c[12], overflow: c[7] };
      if (last.overflow & 8) throw new Error('Graph coloring is incomplete or exceeds the palette; refusing to solve connected bodies concurrently.');
    }

    async function frame(now) {
      if (!running) return;
      if (liveError) { running = false; fail(liveError); return; }
      // Bound latency: wait for a readback slot instead of queueing more steps.
      // Nothing is drawn on these ticks, so they do not count as frames.
      if (!measuring && liveFree.length === 0) {
        requestAnimationFrame(frame);
        return;
      }
      // Skip overlapping rAF ticks while benchWall awaits — concurrent mapAsync on
      // staging hung the replay at step 1 after measuring. Still count FPS.
      if (measuring) {
        bumpRates(false, 0, performance.now() - now);
        requestAnimationFrame(frame);
        return;
      }
      try {
        if (depth.width !== canvas.width || depth.height !== canvas.height) {
          depth.destroy();
          depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
        }
        const aspect = canvas.width / canvas.height;
        writeCamera(aspect);
        const enc = device.createCommandEncoder();
        const frozen = stopAt > 0 && steps >= stopAt;
        if (frozen) {
          const rpFrozen = enc.beginRenderPass({
            colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.12, 0.16, 0.22, 1], loadOp: 'clear', storeOp: 'store' }],
            depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
          });
          rpFrozen.setPipeline(groundPipe); rpFrozen.setBindGroup(0, groundBind); rpFrozen.setVertexBuffer(0, groundVbo); rpFrozen.draw(6);
          rpFrozen.setPipeline(boxPipe); rpFrozen.setBindGroup(0, boxBind); rpFrozen.setVertexBuffer(0, boxVbo); rpFrozen.draw(36, bodies.length - 1);
          rpFrozen.end();
          device.queue.submit([enc.finish()]);
          statusEl.textContent = `${info.vendor || 'gpu'} · ${scene} · ${bodies.length - 1} bodies · stopped at step ${steps} (stopAt) · contacts ${last.contact} · awake ${last.awake} · ov 0x${last.overflow.toString(16)}`;
          requestAnimationFrame(frame);
          return;
        }
        encodeStep(enc, false);
        const rp = enc.beginRenderPass({
          colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.12, 0.16, 0.22, 1], loadOp: 'clear', storeOp: 'store' }],
          depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
        });
        rp.setPipeline(groundPipe); rp.setBindGroup(0, groundBind); rp.setVertexBuffer(0, groundVbo); rp.draw(6);
        rp.setPipeline(boxPipe); rp.setBindGroup(0, boxBind); rp.setVertexBuffer(0, boxVbo); rp.draw(36, bodies.length - 1);
        rp.end();
        const readback = liveFree.pop();
        enc.copyBufferToBuffer(bufs[7], 0, readback, 0, 64);
        device.queue.submit([enc.finish()]);
        parity ^= 1;
        steps++;
        const pending = readback.mapAsync(GPUMapMode.READ).then(() => {
          readLiveCounters(readback);
          liveFree.push(readback);
          // Completion interval: per-step GPU throughput while the queue stays busy.
          const t = performance.now();
          if (lastCompletion > 0) liveStepMs = t - lastCompletion;
          lastCompletion = t;
        }).catch(e => { liveError = liveError || e; });
        livePending.add(pending);
        pending.finally(() => livePending.delete(pending));
        bumpRates(true, liveStepMs, performance.now() - now);
        if (cfg.settled && (steps === 1 || steps % 30 === 0 || steps === lead)) {
          await sampleSettle();
        }
        const dyn = bodies.length - 1;
        const settleLabel = cfg.settled && settle.sampleStep
          ? ` · sleep ${settle.sleeping}/${dyn} · KE ${settle.ke.toFixed(1)} · max|v| ${settle.maxV.toFixed(3)} · h ${settle.maxY.toFixed(2)}/${initialMaxY.toFixed(2)}`
          : '';
        const timingLabel = wallMs > 0 ? `wall ${wallMs.toFixed(2)} ms ${phases}`
          : benchmarkEnabled ? (cfg.settled ? 'timing after settle…' : 'timing after impact…')
          : 'live playback';
        statusEl.textContent = `${info.vendor || 'gpu'} · ${scene} · ${dyn} bodies · ${params.iterations} iters · ${timingLabel} · step ${steps} · contacts ${last.contact} · awake ${last.awake}${settleLabel} · ov 0x${last.overflow.toString(16)}`;
        // Overflow used to hard-stop the page mid-smash. Caps now match Metal; still warn
        // without freezing so a residual spike is visible and replay continues.
        if (last.overflow) {
          const bits = [];
          if (last.overflow & 1) bits.push('contacts');
          if (last.overflow & 2) bits.push('candidates');
          if (last.overflow & 64) bits.push('manifolds');
          if (last.overflow & 128) bits.push('bp_chain');
          warnOnce(`overflow 0x${last.overflow.toString(16)} (${bits.join('|') || 'flags'}) · contacts ${last.contact}/${cap.maxContacts} · continuing`);
        }

        // Smash: watch impact first. Settled: watch lead-in settle, then fair wall timing.
        // After measuring, restore so playback continues from the start again.
        if (benchmarkEnabled && !benchStarted && steps >= lead) {
          benchStarted = true;
          measuring = true;
          await drainLive();
          lastCompletion = 0;
          statusEl.textContent = cfg.settled
            ? `settled · measuring wall time (${dyn} bodies)…`
            : `impact shown · measuring wall time (${dyn} bodies)…`;
          try {
            if (cfg.settled) await sampleSettle();
            const pre = { ...settle };
            restoreScene();
            await device.queue.onSubmittedWorkDone();
            wallMs = await benchWall();
            phases = await profilePhases();
            if (cfg.settled) await sampleSettle();
            const report = {
              scene, bodies: dyn, iterations: params.iterations, wallMs, phases, timingSamples, phaseSamples,
              coloring: incrementalColors ? "reuse" : "rebuild",
              sparseStart, colorPrefix: parallelColorPrefix ? "parallel" : "serial", packing: stablePacking ? "stable" : "atomic", contactLayout: persistentContacts ? "persistent64+32" : compactContacts ? "compact64" : "canonical128", adjacency: physicalAdjacency ? "physical" : "append", order: spatialOrder ? "morton" : "construction", persistence: fusedPersistence ? "fused" : manifoldPersistence ? "manifold" : "contact", hashInsert: hashInsertMode, reuse: reuseMode, np: npMode, persist: persistMode, repair: repairMode, rest: restMode, endpoints: endpointsMode, grid: gridMode, colors: last.color,
              contacts: last.contact, awake: last.awake, overflow: last.overflow,
              settle: pre, initialMaxY,
            };
            window.__BENCH__ = report;
            console.log('BENCH', JSON.stringify(report));
            restoreScene();
            await device.queue.onSubmittedWorkDone();
            drawWorld();
            const ok = !cfg.settled || (pre.ke < dyn * 0.05 && pre.maxV < 0.5 && pre.maxY > initialMaxY * 0.7);
            statusEl.textContent = `wall ${wallMs.toFixed(2)} ms ${phases}${cfg.settled ? ` · settle KE ${pre.ke.toFixed(1)} sleep ${pre.sleeping}/${dyn} h ${pre.maxY.toFixed(2)}/${initialMaxY.toFixed(2)} ${ok ? 'STABLE' : 'UNSTABLE'}` : ''} · replaying…`;
          } finally {
            measuring = false;
          }
        }
        requestAnimationFrame(frame);
      } catch (e) { running = false; measuring = false; fail(e); }
    }
    if (regressionEnabled) {
      const expectedScene = regressionKind === 'gables' ? 'gables506k' : 'ring110k';
      if (scene !== expectedScene) throw new Error(`${regressionKind} regression requires scene=${expectedScene}`);
      params.sleepTime = SLEEP_OFF_TIME;
      syncSleepToggle(true); // regression oracles assume no sleeping
      const readSnapshot = async () => {
        await readCounters();
        const enc = device.createCommandEncoder();
        enc.copyBufferToBuffer(bufs[0], 0, bodySnap, 0, bodies.length * 112);
        device.queue.submit([enc.finish()]);
        await bodySnap.mapAsync(GPUMapMode.READ);
        const bytes = bodySnap.getMappedRange().slice(0);
        bodySnap.unmap();
        return { bytes: storageOrder ? restoreSceneOrder(bytes, storageOrder.gpuToScene) : bytes, counters: { ...last } };
      };
      const runRegression = regressionKind === 'gables' ? runGablesRegression : runRingRegression;
      const report = await runRegression({
        initial: bodies, submit: submitPhysics, read: readSnapshot,
        batchSize: qs.get('batch') === '1' ? 1 : 10,
        progress: async n => { statusEl.textContent = `checking active ${scene} · step ${n}/${regressionSteps}`; await device.queue.onSubmittedWorkDone(); },
      });
      report.coloring = incrementalColors ? "reuse" : "rebuild";
      report.sparseStart = sparseStart;
      report.colorPrefix = parallelColorPrefix ? "parallel" : "serial";
      report.packing = stablePacking ? "stable" : "atomic";
      report.contactLayout = persistentContacts ? "persistent64+32" : compactContacts ? "compact64" : "canonical128";
      report.adjacency = physicalAdjacency ? "physical" : "append";
      report.order = spatialOrder ? "morton" : "construction";
      report.persistence = fusedPersistence ? "fused" : manifoldPersistence ? "manifold" : "contact";
      report.hashInsert = hashInsertMode;
      report.reuse = reuseMode;
      report.grid = gridMode;
      report.sleepTime = params.sleepTime;
      report.np = npMode;
      report.persist = persistMode;
      report.repair = repairMode;
      report.rest = restMode;
      report.endpoints = endpointsMode;
      // Exercise reset too: stale warm-start data from the completed run must not
      // contaminate the first frame or the benchmark's lead-in.
      restoreScene();
      submitPhysics();
      const reset = await readSnapshot();
      const resetContactsOk = regressionKind === 'gables' ? reset.counters.contact === 3916802 : reset.counters.contact >= 1_250_000;
      if (!resetContactsOk || reset.counters.overflow)
        throw new Error(`${regressionKind} reset lost first-frame contacts or overflowed`);
      restoreScene();
      if (benchmarkEnabled) {
        report.wallMs = await benchWall();
        report.timingSamples = timingSamples;
        report.phases = await profilePhases();
        report.phaseSamples = phaseSamples;
      }
      console.log('REGRESSION', JSON.stringify(report));
      statusEl.textContent = `PASS · ${report.bodies} active bodies · ${report.steps} steps${benchmarkEnabled ? ` · wall ${report.wallMs.toFixed(2)} ms · ${report.phases}` : ""}`;
      drawWorld();
    } else if (benchmarkOnly) {
      const wallMs = await benchWall();
      const phases = await profilePhases();
      const report = {
        scene, bodies: bodies.length - 1, iterations: params.iterations, wallMs, phases, timingSamples, phaseSamples,
        coloring: incrementalColors ? "reuse" : "rebuild",
        sparseStart, colorPrefix: parallelColorPrefix ? "parallel" : "serial", packing: stablePacking ? "stable" : "atomic", contactLayout: persistentContacts ? "persistent64+32" : compactContacts ? "compact64" : "canonical128", adjacency: physicalAdjacency ? "physical" : "append", order: spatialOrder ? "morton" : "construction", persistence: fusedPersistence ? "fused" : manifoldPersistence ? "manifold" : "contact", hashInsert: hashInsertMode, reuse: reuseMode, np: npMode, persist: persistMode, repair: repairMode, rest: restMode, endpoints: endpointsMode, grid: gridMode, colors: last.color,
        contacts: last.contact, awake: last.awake, overflow: last.overflow,
      };
      console.log('BENCH', JSON.stringify(report));
      statusEl.textContent = `Measured · ${report.bodies} active bodies · physics wall ${wallMs.toFixed(2)} ms/step · ${phases}`;
      drawWorld();
    } else {
      statusEl.textContent = `playing ${bodies.length - 1} bodies from the start…`;
      requestAnimationFrame(frame);
    }
  </script>
</body>
