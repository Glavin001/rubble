<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Rubble showcase — meteors on deformable ground</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e8ecf2; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 12px; top: 12px; background: rgba(10, 12, 18, 0.62); border: 1px solid #2c3346; border-radius: 8px; padding: 8px 10px; max-width: 30rem; }
    #hud b { font-size: 14px; }
    #stats { font-variant-numeric: tabular-nums; color: #b9c2d6; white-space: pre; margin-top: 4px; }
    #err { color: #ff8e8e; white-space: pre-wrap; }
    .muted { color: #8d96aa; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <b>Meteor run</b> <span class="muted">· deformable terrain (GPU MPM), third person</span>
    <div class="muted">The ground over a strike is rebuilt every frame from the simulated sand; only what leaves it flies as debris. <kbd>R</kbd> restarts.</div>
    <div id="status" class="muted">starting…</div>
    <div id="stats"></div>
    <div id="err"></div>
  </div>
  <script type="module">
    import { createWorld, sceneCapacity } from './world-host.mjs';
    import { M, WHEEL_RIM_MATERIAL, L, heightFieldArena } from './vehicle.mjs';
    import { createTerrain, TerrainStep, T } from './terrain-host.mjs';
    import { GROUND_WGSL, surfaceSwitchError } from './terrain-render.mjs';
    import { createBuggyRenderer } from './buggy-render.mjs';

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    let failed = false;
    const fail = (e) => { failed = true; $('err').textContent = String((e && e.message) || e) + (e && e.stack ? '\n' + e.stack.split('\n').slice(1, 4).join('\n') : ''); window.__failed = String((e && e.message) || e); };
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });
    addEventListener('error', (e) => fail(e.error || e.message));
    const qs = new URLSearchParams(location.search);
    const num = (k, d) => (qs.has(k) && Number.isFinite(Number(qs.get(k))) ? Number(qs.get(k)) : d);
    if (qs.get('hud') === '0') $('hud').hidden = true;

    // ================================================================ terrain settings
    // The one place the terrain is configured. The engine's game profile (a
    // TerrainConfig preset for real time) replaces `settings` when it lands.
    const G = 9.81;
    const TERRAIN = {
      // A stony meteor: π-scaling gives a 15 m transient crater, a 20 m final rim.
      meteor: { radius: num('radius', 0.5), density: 3000, speed: num('speed', 20) * 1000 },
      settings: {
        config: {
          max_particles: 1 << 20, max_blocks: 8192, max_parcels: 1 << 17, max_substeps: 1024,
          max_columns: 1 << 16, max_field_samples: 1 << 19, max_coupled: 64,
          // Cells across the transient radius: 6 gives 2.5 m cells.
          cells_per_radius: num('cpr', 6),
        },
        // 1 R past the transient radius (the final rim is at 1.3 R): a 60 m
        // box of ~55k particles, which the car's track can pass close to.
        region_margin: num('margin', 1.0),
        settle_speed: null, // 1% of the crater's √(gR), set below
        settle_frames: 60, // 0.5 s at 120 Hz
        surface_cells: 1 << 21,
      },
    };

    // ================================================================ device
    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('no WebGPU adapter');
    const timestamps = adapter.features.has('timestamp-query');
    const device = await adapter.requestDevice({
      requiredFeatures: timestamps ? ['timestamp-query'] : [],
      requiredLimits: {
        maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        maxBufferSize: adapter.limits.maxBufferSize,
      },
    });
    device.lost.then((i) => fail('device lost: ' + i.message));
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + ((e.error && e.error.message) || e.error)));
    const canvas = $('c');
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    // ?w=&h= fix the drawing size (recording); otherwise the window's.
    const fixedSize = qs.has('w') && qs.has('h');
    const configure = () => {
      if (fixedSize) { canvas.width = num('w', 1280); canvas.height = num('h', 720); }
      else {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.max(320, Math.floor((canvas.clientWidth || 1280) * dpr));
        canvas.height = Math.max(180, Math.floor((canvas.clientHeight || 720) * dpr));
      }
      context.configure({ device, format, alphaMode: 'opaque', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    };
    configure();
    addEventListener('resize', () => { if (!fixedSize) configure(); });

    // ================================================================ the crater (Rust: π-scaling)
    const probe = new TerrainStep(JSON.stringify({ ...TERRAIN.settings, settle_speed: 0.05 }));
    const pred = JSON.parse(probe.predict_impact(TERRAIN.meteor.radius, TERRAIN.meteor.density, TERRAIN.meteor.speed, G));
    const sandInfo = JSON.parse(probe.settings());
    probe.free();
    const R = pred.crater.radius, RIM = pred.crater.final_rim_radius;
    TERRAIN.settings.settle_speed = num('settle', 0.01 * Math.sqrt(G * R));
    const DX = pred.dx;
    // How far an open region's box reaches from its strike: R(1 + margin),
    // rounded out to whole 4-cell blocks.
    const REACH = R * (1 + TERRAIN.settings.region_margin) + 4 * DX;

    // ================================================================ the ground
    // Heightfield samples are the region's cells. Dunes, flattened over the
    // strike field (π-scaling assumes level ground).
    const SP = DX;
    const HALF = 320;
    const NX = 2 * Math.ceil(HALF / SP) + 1, NZ = NX;
    const X0 = -0.5 * (NX - 1) * SP, Z0 = X0;
    // The track: a stadium loop along x (straights at z = ±TURN joined by
    // half circles), driven clockwise seen from above, the strike field inside
    // on the car's left. Straights line up with the regions' boxes, so a strike
    // can sit close beside one.
    const STRAIGHT = num('straight', 70), TURN = num('turn', 58);
    const TRACK = (() => {
      const pts = [];
      for (let x = -STRAIGHT; x < STRAIGHT; x += 1) pts.push([x, TURN]);
      for (let a = 0; a < Math.PI; a += 1 / TURN) pts.push([STRAIGHT + TURN * Math.sin(a), TURN * Math.cos(a)]);
      for (let x = STRAIGHT; x > -STRAIGHT; x -= 1) pts.push([x, -TURN]);
      for (let a = 0; a < Math.PI; a += 1 / TURN) pts.push([-STRAIGHT - TURN * Math.sin(a), -TURN * Math.cos(a)]);
      return pts;
    })();
    // Distance from the loop's spine (the segment between the turns' centres).
    const spine = (x, z) => Math.hypot(x - Math.max(-STRAIGHT, Math.min(STRAIGHT, x)), z);
    const dune = (x, z) => {
      const r = spine(x, z);
      const field = Math.min(1, Math.max(0, (r - TURN - 14) / 40)); // flat inside the loop
      const big = 2.6 * Math.sin(x / 47 + 0.7) * Math.cos(z / 61 - 0.4) + 1.6 * Math.sin((x + 1.7 * z) / 37);
      const ridge = 1.2 * Math.sin((0.8 * x - 0.6 * z) / 11 + Math.sin(z / 29) * 2.0);
      const far = Math.min(1, Math.max(0, (r - TURN - 30) / 80)) * 9 * (0.6 + 0.4 * Math.sin(x / 53) * Math.cos(z / 71));
      return field * (big + 0.35 * ridge) * 0.6 + far;
    };
    const initialHeights = new Float32Array(NX * NZ);
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) initialHeights[j * NX + i] = dune(X0 + i * SP, Z0 + j * SP);
    let heights = initialHeights.slice();
    const field = { nx: NX, nz: NZ, dx: SP, dz: SP, origin: [0, 0, 0] };
    const arena0 = heightFieldArena(NX, NZ, SP, SP, initialHeights);
    const groundAt = (x, z) => {
      const fx = Math.min(Math.max((x - X0) / SP, 0), NX - 1.001), fz = Math.min(Math.max((z - Z0) / SP, 0), NZ - 1.001);
      const i = Math.floor(fx), j = Math.floor(fz), u = fx - i, v = fz - j;
      const h = (a, b) => heights[(j + b) * NX + i + a];
      return (1 - v) * ((1 - u) * h(0, 0) + u * h(1, 0)) + v * ((1 - u) * h(0, 1) + u * h(1, 1));
    };

    // ================================================================ world
    const cap = { ...sceneCapacity(256, 512), maxHull: arena0.records.length / 4 + 4096 };
    const world = await createWorld(device, { cap, vehicleCap: { maxVehicles: 4, maxWheels: 16, maxCurvePoints: 512, maxDiffs: 8, maxAntiRolls: 8, maxParts: 64, maxRays: 16 },
      status: (s) => { statusEl.textContent = s; } });
    // 120 Hz: physics and render every frame.
    const DT = 1 / 120;
    Object.assign(world.params, { dt: DT, iterations: 8, gravityY: -G, flags: M.FLAG_SPEC_VELOCITY });
    world.setMaterial(0, 0.9);
    world.setMaterial(WHEEL_RIM_MATERIAL, 0.9);
    const groundBody = world.addBody({ p: [0, 0, 0], flags: 0 });
    world.setHullRecords(arena0.records);
    const GROUND = world.addCollider({ body: groundBody, shape: 5, material: 0, params: arena0.params });
    const HF_BASE = arena0.base;

    statusEl.textContent = 'building terrain kernels…';
    const terrain = await createTerrain(world, TERRAIN.settings, { status: (s) => { statusEl.textContent = s; }, surface: true });
    const maxParticles = terrain.settings.config.max_particles, maxParcels = terrain.settings.config.max_parcels;
    // A second strike while a region is open: the engine's multi-region API
    // when it is there (max_regions > 1); until then each region bakes first.
    const canOverlap = () => (terrain.settings.config.max_regions ?? 1) > 1;

    // ---- the car: the dune buggy on an autopilot loop around the strike field
    const presets = Object.fromEntries((await (await fetch('./generated/vehicle_presets.json', { cache: 'no-store' })).json()).map((p) => [p.name, p]));
    const CAR = qs.get('car') || 'dune_buggy';
    const SPEED = num('kmh', 45) / 3.6;
    const qYaw = (yaw) => [0, Math.sin(yaw / 2), 0, Math.cos(yaw / 2)];
    const startCar = () => {
      const [x, z] = TRACK[0];
      // Facing +x along the first straight.
      return world.vehicles.addVehicle(world.backend, presets[CAR], [x, groundAt(x, z) + 1.4, z], qYaw(Math.PI / 2));
    };

    // ================================================================ the strikes
    // Sim seconds (LEAD is the run-up before the recording starts). `x`: beside
    // the first straight, as close as its region's box allows; `rimOf`: on
    // that strike's rim, turned `rimTurn` from +x toward the field; `at`: a
    // point. `overlapT`: when the strike is due once regions may overlap (the
    // second then lands while the first still moves).
    const LEAD = num('lead', 1.5);
    const SCHEDULE = [
      { t: LEAD + num('t1', 1.2), x: num('x1', -10) },
      { t: LEAD + num('t2', 7.0), overlapT: LEAD + 3.2, rimOf: 0, rimTurn: num('turn2', 0.45) },
      { t: LEAD + num('t3', 13.5), at: [STRAIGHT, 0] },
    ];
    const APPROACH = 1.35; // s of fireball before contact (cosmetic)
    const VIS_SPEED = 520; // m/s along its path (cosmetic: the real 20 km/s is one frame)
    const MAX_FX = 16;

    // ================================================================ rendering
    const SAMPLES = 4;
    const LIGHT_WGSL = /* wgsl */`
fn qrot(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}
fn toLinear(c: vec3f) -> vec3f { return pow(max(c, vec3f(0.0)), vec3f(2.2)); }
fn tonemap(c: vec3f) -> vec3f {
  let x = c * 0.8;
  let m = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
  return pow(m, vec3f(1.0 / 2.2));
}
fn sunDir() -> vec3f { return normalize(frame.light.xyz); }
const SUN = vec3f(1.0, 0.86, 0.68) * 2.1;
fn skyBase(d: vec3f) -> vec3f {
  let up = clamp(d.y, -1.0, 1.0);
  let zen = vec3f(0.07, 0.18, 0.46);
  let hor = vec3f(0.56, 0.58, 0.62);
  var c = mix(hor, zen, pow(clamp(up, 0.0, 1.0), 0.5));
  if (up < 0.0) { c = mix(hor, vec3f(0.42, 0.36, 0.30), clamp(-up * 3.0, 0.0, 1.0)); }
  return c;
}
fn skyColor(d: vec3f) -> vec3f {
  let up = clamp(d.y, -1.0, 1.0);
  let zen = vec3f(0.07, 0.18, 0.46);
  let hor = vec3f(0.56, 0.58, 0.62);
  var c = mix(hor, zen, pow(clamp(up, 0.0, 1.0), 0.5));
  if (up < 0.0) { c = mix(hor, vec3f(0.42, 0.36, 0.30), clamp(-up * 3.0, 0.0, 1.0)); }
  let s = max(dot(d, sunDir()), 0.0);
  c += vec3f(1.0, 0.86, 0.62) * (pow(s, 1500.0) * 60.0 + pow(s, 24.0) * 0.45 + pow(s, 4.0) * 0.12);
  return c;
}
// Haze toward the horizon (aerial perspective), and the strike's flash.
fn fogged(c: vec3f, w: vec3f) -> vec3f {
  let v = w - frame.eye.xyz;
  let d = length(v);
  let dir = v / max(d, 1e-3);
  let f = 1.0 - exp(-d / frame.fog.x);
  let hz = skyBase(normalize(vec3f(dir.x, max(dir.y, 0.03), dir.z)));
  return mix(c, hz, clamp(f, 0.0, 1.0)) + vec3f(1.0, 0.92, 0.80) * frame.misc.y * 0.35;
}
// The car's soft shadow on what is under it (sun from above).
fn carShadow(w: vec3f) -> f32 {
  if (frame.car.w < 0.5 || w.y > frame.car.y + 0.5) { return 1.0; }
  let l = sunDir();
  let p = frame.car.xyz - l * ((frame.car.y - w.y) / max(l.y, 0.2));
  let d = length((w - p).xz * vec2f(1.0, 0.7));
  return mix(0.35, 1.0, smoothstep(1.2, 2.8, d));
}
fn ev0(k: u32) -> vec4f { return events[2u * k]; }
fn ev1(k: u32) -> vec4f { return events[2u * k + 1u]; }
// Light from the strikes: the contact flash, then the fireball's glow.
fn strikeLight(w: vec3f, n: vec3f) -> vec3f {
  var c = vec3f(0.0);
  for (var k = 0u; k < ${MAX_FX}u; k++) {
    let a = ev0(k); let b = ev1(k);
    if (b.z < 0.5) { continue; }
    let tau = frame.misc.x - a.w;
    if (tau < 0.0 || tau > 4.0) { continue; }
    let lp = a.xyz + vec3f(0.0, 0.6 * b.x, 0.0);
    let v = lp - w;
    let d2 = dot(v, v);
    let i = 90.0 * exp(-tau / 0.08) + 7.0 * exp(-tau / 0.9);
    c += vec3f(1.0, 0.62, 0.30) * i * max(dot(n, normalize(v)), 0.0) / (1.0 + d2 / (b.x * b.x));
  }
  return c;
}
fn lit(albedo: vec3f, n: vec3f, w: vec3f) -> vec3f {
  let a = toLinear(albedo);
  let ndl = max(dot(n, sunDir()), 0.0);
  let sky = mix(vec3f(0.10, 0.08, 0.07), vec3f(0.16, 0.22, 0.36), n.y * 0.5 + 0.5);
  return a * (SUN * ndl * carShadow(w) + sky + strikeLight(w, n));
}
`;
    // The buggy mesh's lighting (buggy-render.mjs, whose Frame holds only the
    // view, eye and light): the same sun, sky and haze as the scene.
    const BUGGY_WGSL = /* wgsl */`
fn qrot(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}
fn shade(c: vec3f, n: vec3f, w: vec3f) -> vec3f {
  let l = normalize(frame.light.xyz);
  let a = pow(max(c, vec3f(0.0)), vec3f(2.2));
  let sky = mix(vec3f(0.30, 0.26, 0.22), vec3f(0.34, 0.44, 0.62), n.y * 0.5 + 0.5);
  let v = normalize(frame.eye.xyz - w);
  let spec = pow(max(dot(reflect(-l, n), v), 0.0), 48.0) * 0.5;
  var col = a * (vec3f(1.0, 0.90, 0.76) * 3.0 * max(dot(n, l), 0.0) + sky) + vec3f(spec);
  let d = length(w - frame.eye.xyz);
  col = mix(col, vec3f(0.62, 0.62, 0.62), 1.0 - exp(-d / ${num('haze', 900).toFixed(1)}));
  let x = col * 0.9;
  return pow(clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0)), vec3f(1.0 / 2.2));
}
`;
    const SHADER = /* wgsl */`
struct Frame {
  viewProj: mat4x4f, eye: vec4f, light: vec4f, invViewProj: mat4x4f,
  right: vec4f, up: vec4f,
  misc: vec4f,  // time (s), flash, volume quantum (m³), time since the last strike
  car: vec4f,   // chassis position, present
  fog: vec4f,   // haze distance
};
struct Particle { xm: vec4f, vj: vec4f, c0: vec4f, c1: vec4f, c2: vec4f, f0: vec4f, f1: vec4f, f2: vec4f };
@group(0) @binding(1) var<uniform> frame: Frame;
@group(0) @binding(3) var<storage, read> hulls: array<vec4u>;
@group(0) @binding(4) var<storage, read> parts: array<Particle>;
@group(0) @binding(6) var<storage, read> parcels: array<vec4f>;
@group(0) @binding(7) var<storage, read> counters: array<u32>;
@group(0) @binding(9) var<storage, read> h0: array<f32>;
// Strikes: (point, contact time), (crater radius, approach yaw, active, approach pitch).
@group(0) @binding(11) var<uniform> events: array<vec4f, ${2 * MAX_FX}>;
${GROUND_WGSL({ hfBase: HF_BASE, surfaceBinding: 10 })}
${LIGHT_WGSL}
fn hash(n: u32) -> f32 { var x = n * 747796405u + 2891336453u; x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u; return f32((x >> 22u) ^ x) / 4294967295.0; }
fn h21(p: vec2f) -> f32 { let q = fract(p * vec2f(0.1031, 0.1030)); let r = q + dot(q, q.yx + 33.33); return fract((r.x + r.y) * r.x); }
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); let u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2f(1.0, 0.0)), u.x), mix(h21(i + vec2f(0.0, 1.0)), h21(i + vec2f(1.0, 1.0)), u.x), u.y);
}
fn fbm(p: vec2f) -> f32 {
  var a = 0.5; var s = 0.0; var q = p;
  for (var k = 0; k < 4; k++) { s += a * vnoise(q); q = q * 2.03 + vec2f(1.7, 9.2); a *= 0.5; }
  return s / 0.9375;
}
const HIDE = vec4f(0.0, 0.0, 2.0, 1.0);
const QUAD = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0));

// ---- sky
struct SOut { @builtin(position) clip: vec4f, @location(0) ndc: vec2f };
@vertex fn vsSky(@builtin(vertex_index) vi: u32) -> SOut {
  let p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0))[vi];
  var o: SOut; o.clip = vec4f(p, 0.0, 1.0); o.ndc = p; return o;
}
@fragment fn fsSky(i: SOut) -> @location(0) vec4f {
  let a = frame.invViewProj * vec4f(i.ndc, 1.0, 1.0);
  let d = normalize(a.xyz / a.w - frame.eye.xyz);
  return vec4f(tonemap(skyColor(d) + vec3f(1.0, 0.92, 0.80) * frame.misc.y * 0.6), 1.0);
}

// ---- the ground: the heightfield, and the live surface over an open region
struct GOut { @builtin(position) clip: vec4f, @location(0) w: vec3f, @location(1) n: vec3f, @location(2) d: f32 };
@vertex fn vsGround(@builtin(vertex_index) vi: u32) -> GOut {
  let hd = hfDims();
  let cell = vi / 6u;
  let ci = cell % (hd.nx - 1u); let cj = cell / (hd.nx - 1u);
  let corner = array<vec2u, 6>(vec2u(0u, 0u), vec2u(1u, 1u), vec2u(1u, 0u), vec2u(0u, 0u), vec2u(0u, 1u), vec2u(1u, 1u))[vi % 6u];
  let i = ci + corner.x; let j = cj + corner.y;
  let h = groundHeight(i, j, true);
  var o: GOut;
  o.w = vec3f(hd.x0 + f32(i) * hd.dx, h, hd.z0 + f32(j) * hd.dz);
  o.n = groundNormal(i, j, true);
  o.d = h - h0[j * hd.nx + i];
  o.clip = frame.viewProj * vec4f(o.w, 1.0);
  return o;
}
// The fresh crater floor glows for a few seconds (cosmetic).
fn hotGround(w: vec3f, grain: f32) -> vec3f {
  var c = vec3f(0.0);
  for (var k = 0u; k < ${MAX_FX}u; k++) {
    let a = ev0(k); let b = ev1(k);
    if (b.z < 0.5) { continue; }
    let tau = frame.misc.x - a.w;
    if (tau < 0.0 || tau > 10.0) { continue; }
    let r = length(w.xz - a.xz) / b.x;
    let g = exp(-tau / 1.6) * smoothstep(0.75, 0.0, r) * (0.4 + 0.9 * grain * grain);
    c += vec3f(5.0, 1.3, 0.25) * g;
  }
  return c;
}
@fragment fn fsGround(i: GOut) -> @location(0) vec4f {
  let p = i.w.xz;
  let dist = length(i.w - frame.eye.xyz);
  let big = fbm(p * 0.021);
  let fine = fbm(p * 0.55 + vec2f(big * 3.0));

      if (tsOn && (kind === 1 || render)) {
        tsRb = ts.rbs.pop();
        // Resolve offsets are 256-byte aligned: terrain and surface, then the render.
        if (kind === 1) enc.resolveQuerySet(ts.qs, 6 * slot, 4, ts.res, 512 * slot);
        if (render) enc.resolveQuerySet(ts.qs, 6 * slot + 4, 2, ts.res, 512 * slot + 256);
        enc.copyBufferToBuffer(ts.res, 512 * slot, tsRb, 0, 32);
        enc.copyBufferToBuffer(ts.res, 512 * slot + 256, tsRb, 32, 16);
      }
      const t0 = performance.now();
      device.queue.submit([enc.finish()]);
      terrain.afterSubmit();
      const entry = { t: +st.t.toFixed(4), car: st.carPose && st.frame % 30 === 0 ? st.carPose.p.map((v) => +v.toFixed(1)) : undefined, kind, substeps: kind === 1 ? terrain.lastSubsteps : 0, particles: terrain.report?.particles ?? 0, airborne: terrain.report?.airborne ?? 0 };
      const done = [];
      if (carRb) done.push(carRb.mapAsync(GPUMapMode.READ).then(() => {
        const f = new Float32Array(carRb.getMappedRange(0, 112).slice(0));
        carRb.unmap(); carRbs.push(carRb);
        const q = [f[4], f[5], f[6], f[7]];
        const rot = (v) => { const [x, y, z, w] = q, d = 2 * (x * v[0] + y * v[1] + z * v[2]), s = w * w - (x * x + y * y + z * z); const c = cross3([x, y, z], v); return [x * d + v[0] * s + c[0] * 2 * w, y * d + v[1] * s + c[1] * 2 * w, z * d + v[2] * s + c[2] * 2 * w]; };
        st.carPose = { p: [f[0], f[1], f[2]], fwd: rot([0, 0, 1]) };
        st.carSpeed = Math.hypot(f[12], f[13], f[14]);
      }));
      if (buggyRb) done.push(buggy.consume(buggyRb));
      if (tsRb) done.push(tsRb.mapAsync(GPUMapMode.READ).then(() => {
        const t = new BigUint64Array(tsRb.getMappedRange().slice(0)); tsRb.unmap(); ts.rbs.push(tsRb);
        const a = Number(t[1] - t[0]) / 1e6, b = Number(t[3] - t[2]) / 1e6, c = Number(t[5] - t[4]) / 1e6;
        if (a > 0 && a < 1e4) entry.terrainMs = +a.toFixed(3);
        if (b > 0 && b < 1e4) entry.surfaceMs = +b.toFixed(3);
        if (c > 0 && c < 1e4) entry.renderMs = +c.toFixed(3);
      }));
      if (wait) {
        await device.queue.onSubmittedWorkDone();
        entry.ms = +(performance.now() - t0).toFixed(3);
        await Promise.all(done);
        await terrain.settle();
        if (st.pendingBake) { await st.pendingBake; st.pendingBake = null; }
        if (terrain.error) throw terrain.error;
      } else done.forEach((p) => p.catch(fail));
      log.push(entry);
      if (log.length > 20000) log.shift();
      last = entry;
      st.t += DT; st.frame++;
      return entry;
    }

    // ---- HUD
    function hud() {
      if ($('hud').hidden) return;
      const recent = log.slice(-120);
      const mean = (k) => { const v = recent.map((e) => e[k]).filter((x) => x !== undefined); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
      $('stats').textContent = [
        `t ${st.t.toFixed(2)} s · ${st.carPose ? (st.carSpeed * 3.6).toFixed(0) : '–'} km/h · region ${terrain.region ? 'open' : '—'}`,
        `frame ${mean('ms').toFixed(2)} ms (budget 8.33) · terrain ${mean('terrainMs').toFixed(2)} ms · surface ${mean('surfaceMs').toFixed(2)} ms`,
        `particles ${(terrain.report?.particles ?? 0).toLocaleString()} · substeps ${last?.substeps ?? 0} · in flight ${(terrain.report?.airborne ?? 0).toLocaleString()}`,
        `crater R ${R.toFixed(1)} m · rim ${RIM.toFixed(1)} m · cells ${DX.toFixed(2)} m (${TERRAIN.settings.config.cells_per_radius}/R, margin ${TERRAIN.settings.region_margin})`,
      ].join('\n');
      statusEl.textContent = canOverlap() ? 'overlapping strikes (multi-region engine)' : 'one region at a time: each crater bakes before the next strike';
    }

    // ---- interactive loop (rAF), off while frames are stepped by hand
    let manual = false;
    async function loop() {
      if (failed) return;
      try {
        if (!manual) { await stepFrame({ render: true, wait: true }); hud(); }
      } catch (e) { fail(e); return; }
      requestAnimationFrame(loop);
    }
    addEventListener('keydown', (e) => { if (e.code === 'KeyR') reset(); });

    // ================================================================ automation and recording
    // frames(n): n frames, each waited for on the GPU (no rAF: it runs in a
    // hidden page too). Each entry's `ms` is encode-to-GPU-done wall time,
    // rendering included; terrainMs / surfaceMs are GPU timestamps.
    async function frames(n, { render = true } = {}) {
      manual = true;
      if (failed) throw new Error(window.__failed);
      const out = [];
      for (let i = 0; i < n && !failed; i++) out.push(await stepFrame({ render, wait: true }));
      hud();
      return out;
    }
    const post = async (name, data, append = false) => {
      const r = await fetch(`/upload?name=${encodeURIComponent(name)}${append ? '&append=1' : ''}`, { method: 'POST', body: data });
      if (!r.ok) throw new Error(`upload ${name}: HTTP ${r.status}`);
    };
    // Record `seconds` of the run from the start: physics at 120 Hz, every
    // other frame encoded (60 fps) with explicit timestamps, H.264 Annex B
    // chunks uploaded as they come. `stills`: sim times to save PNGs at.
    async function record({ seconds = 20, fps = 60, name = 'showcase.h264', bitrate = 24e6, stills = [] } = {}) {
      manual = true;
      if (st.frame !== 0) throw new Error('record() runs from a fresh load (reload the page)');
      // The run-up: the car gets to speed before the first frame.
      while (st.t < LEAD - 1e-9) await stepFrame({ render: false, wait: true });
      const every = Math.round(1 / DT / fps);
      const W = canvas.width, H = canvas.height;
      const config = { codec: 'avc1.640033', width: W, height: H, bitrate, framerate: fps, avc: { format: 'annexb' }, latencyMode: 'quality' };
      const sup = await VideoEncoder.isConfigSupported(config);
      if (!sup.supported) throw new Error('H.264 encoding not supported: ' + JSON.stringify(config));
      let pending = [], bytes = 0, encErr = null;
      const enc = new VideoEncoder({ output: (chunk) => { const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); pending.push(b); bytes += b.byteLength; }, error: (e) => { encErr = e; } });
      enc.configure(config);
      await post(name, new Uint8Array(0));
      const flush = async () => {
        if (!pending.length) return;
        const parts = pending; pending = [];
        await post(name, new Blob(parts), true);
      };
      const total = Math.round(seconds / DT);
      const stillQ = stills.map((t) => Math.round(t / DT)); // video seconds
      // Each encoded frame from the canvas texture's own pixels (a copy in the
      // frame's submission), not from the canvas element: no race with its
      // presentation, also in a hidden page.
      const bytesPerRow = Math.ceil((W * 4) / 256) * 256;
      const capture = { bytesPerRow, buffer: device.createBuffer({ size: bytesPerRow * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }) };
      const pixFormat = format === 'bgra8unorm' ? 'BGRA' : 'RGBA';
      let k = 0;
      const t0 = performance.now();
      for (let f = 0; f < total && !failed; f++) {
        const show = f % every === 0;
        await stepFrame({ render: show || stillQ.includes(f), wait: true, capture: show ? capture : null });
        if (show) {
          await capture.buffer.mapAsync(GPUMapMode.READ);
          const pixels = new Uint8Array(capture.buffer.getMappedRange()).slice();
          capture.buffer.unmap();
          const frame = new VideoFrame(pixels, { format: pixFormat, codedWidth: W, codedHeight: H, layout: [{ offset: 0, stride: bytesPerRow }],
            timestamp: Math.round((k * 1e6) / fps), duration: Math.round(1e6 / fps) });
          enc.encode(frame, { keyFrame: k % (2 * fps) === 0 });
          frame.close();
          k++;
          if (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 1));
          if (pending.length > 30) await flush();
        }
        if (stillQ.includes(f)) {
          const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
          await post(`still_${(f * DT).toFixed(1)}s.png`, blob);
        }
        if (encErr) throw encErr;
      }
      await enc.flush();
      await flush();
      enc.close();
      capture.buffer.destroy();
      hud();
      return { frames: k, bytes, wallS: (performance.now() - t0) / 1000, size: [W, H] };
    }
    // Still PNG of the current frame (re-rendered).
    async function still(name) {
      writeFrame();
      const e = device.createCommandEncoder(); draw(e); device.queue.submit([e.finish()]);
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
      await post(name, blob);
      return blob.size;
    }
    function timings(from = 0) {
      const v = log.filter((e) => e.t >= from);
      const stat = (k, f = () => true) => {
        const a = v.filter(f).map((e) => e[k]).filter((x) => x !== undefined).sort((x, y) => x - y);
        if (!a.length) return null;
        const q = (p) => a[Math.min(a.length - 1, Math.floor(p * a.length))];
        return { n: a.length, mean: +(a.reduce((s, x) => s + x, 0) / a.length).toFixed(3), p50: q(0.5), p95: q(0.95), max: a[a.length - 1] };
      };
      return { frameMs: stat('ms'), frameMsOpen: stat('ms', (e) => e.kind === 1), frameMsIdle: stat('ms', (e) => e.kind === 0), terrainMs: stat('terrainMs'), surfaceMs: stat('surfaceMs'), renderMs: stat('renderMs'), renderMsOpen: stat('renderMs', (e) => e.kind === 1), substeps: stat('substeps', (e) => e.kind === 1), over8_3: v.filter((e) => e.ms > 8.333).length, frames: v.length };
    }
    window.__showcase = {
      frames, record, still, reset, timings, log,
      state: () => ({ t: st.t, frame: st.frame, car: st.carPose, carKmh: st.carSpeed * 3.6, region: terrain.region, report: terrain.report, strikes: st.strikes, switches: st.switches, canOverlap: canOverlap(), schedule: SCHEDULE.map((s) => ({ state: s.state, t0: s.t0, point: s.point })), error: terrain.error && String(terrain.error) }),
      settings: { TERRAIN, R, RIM, DX, REACH, NX, STRAIGHT, TURN, SPEED, LEAD, sand: sandInfo.sand, prediction: pred },
      resume: () => { manual = false; },
      camera: (o) => { cam.override = o; },
    };
    window.__world = world; window.__terrain = terrain;
    window.__ready = true;
    statusEl.textContent = 'ready';
    if (qs.get('manual') === '1') manual = true;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
