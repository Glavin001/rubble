<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Rubble showcase — meteors on deformable ground</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e8ecf2; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 12px; top: 12px; background: rgba(10, 12, 18, 0.62); border: 1px solid #2c3346; border-radius: 8px; padding: 8px 10px; max-width: 30rem; }
    #hud b { font-size: 14px; }
    #stats { font-variant-numeric: tabular-nums; color: #b9c2d6; white-space: pre; margin-top: 4px; }
    #err { color: #ff8e8e; white-space: pre-wrap; }
    .muted { color: #8d96aa; }
    /* scene=play: the score, the game-over card and the touch controls */
    #play { position: fixed; right: 12px; top: 12px; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #play .big { font-size: 26px; font-weight: 700; }
    #over { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    #over > div { background: rgba(10, 12, 18, 0.78); border: 1px solid #4a3030; border-radius: 12px; padding: 18px 26px; text-align: center; font-size: 16px; }
    #over b { font-size: 28px; color: #ff9a6a; }
    #touch { position: fixed; left: 0; right: 0; bottom: 0; height: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    #touch button { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); background: rgba(20, 24, 34, 0.45); color: #fff; font-size: 26px; touch-action: none; -webkit-tap-highlight-color: transparent; }
    #touch button.on { background: rgba(255, 150, 90, 0.55); }
    canvas { touch-action: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <b>Meteor run</b> <span class="muted">· deformable terrain (GPU MPM), third person</span>
    <div class="muted" id="hint">The ground over a strike is rebuilt every frame from the simulated sand; only what leaves it flies as debris. <kbd>R</kbd> restarts.</div>
    <div id="status" class="muted">starting…</div>
    <div id="stats"></div>
    <div id="err"></div>
  </div>
  <div id="play" hidden><div class="big" id="pTime">0.0 s</div><div id="pInfo"></div></div>
  <div id="over" hidden><div><b id="oWhy"></b><div id="oScore"></div><div class="muted">Tap or press R to drive again</div></div></div>
  <div id="touch" hidden>
    <button id="tLeft" style="left: 16px">◀</button>
    <button id="tRight" style="left: 100px">▶</button>
    <button id="tStrike" style="right: 184px; font-size: 22px">☄</button>
    <button id="tBrake" style="right: 100px">▼</button>
    <button id="tGas" style="right: 16px">▲</button>
  </div>
  <script type="module">
    import { createWorld, sceneCapacity } from './world-host.mjs';
    import { M, WHEEL_RIM_MATERIAL, L, heightFieldArena, fbits, bitsf } from './vehicle.mjs';
    import { createTerrain, TerrainStep, T } from './terrain-host.mjs';
    import { GROUND_WGSL, surfaceSwitchError } from './terrain-render.mjs';
    import { createBuggyRenderer } from './buggy-render.mjs';

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    let failed = false;
    const fail = (e) => { failed = true; $('err').textContent = String((e && e.message) || e) + (e && e.stack ? '\n' + e.stack.split('\n').slice(1, 4).join('\n') : ''); window.__failed = String((e && e.message) || e); };
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });
    addEventListener('error', (e) => fail(e.error || e.message));
    const qs = new URLSearchParams(location.search);
    const num = (k, d) => (qs.has(k) && Number.isFinite(Number(qs.get(k))) ? Number(qs.get(k)) : d);
    if (qs.get('hud') === '0') $('hud').hidden = true;

    // ================================================================ terrain settings
    // The one place the terrain is configured. The engine's game profile (a
    // TerrainConfig preset for real time) replaces `settings` when it lands.
    const G = 9.81;
    const TERRAIN = {
      // A stony meteor: π-scaling gives a 27 m transient crater, a 35 m final rim.
      meteor: { radius: num('radius', 1.0), density: 3000, speed: num('speed', 20) * 1000 },
      settings: {
        config: {
          max_particles: 1 << 20, max_blocks: 8192, max_parcels: 1 << 17, max_substeps: 1024,
          max_columns: 1 << 16, max_field_samples: 1 << 19,
          // The dune buggy drives into open regions: its 17 parts' colliders couple.
          max_coupled: 256,
          // Cells across the transient radius: 6 gives 4.5 m cells.
          cells_per_radius: num('cpr', 6),
          // The engine's game profile (TerrainProfile::Game: Courant 0.45,
          // speed growth 1.0, bed 1.25 R) under these limits, the default for
          // demos; ?profile=physical keeps the validation profile.
          profile: qs.get('profile') ?? 'game',
        },
        // 1 R past the transient radius (the final rim is at 1.3 R): a box of
        // ~100k particles, which the car's track can pass close to.
        region_margin: num('margin', 1.0),
        settle_speed: null, // 1% of the crater's √(gR), set below
        settle_frames: 60, // 0.5 s at 120 Hz
        surface_cells: 1 << 21,
      },
    };

    // ================================================================ scenes
    // drive (default): a barrage, strikes on both sides of the road, some
    // close enough that the car drives up over a fresh rim, near misses just
    // ahead of and just behind the car, several areas open at once. drive1:
    // the earlier cut, three strikes beside the road. pass: the first cut,
    // strikes kept clear of the track. bts: behind the scenes, slowed, the
    // engine's view and the game's side by side from one state.
    // play: you drive (keys or touch); a director drops meteors around you,
    // near misses ahead, beside and on your line, faster as you last; click or
    // tap the ground to drop one yourself. Endless (see playTick).
    const SCENE = ['drive', 'drive1', 'pass', 'bts', 'play'].includes(qs.get('scene')) ? qs.get('scene') : 'drive';
    const PLAY = SCENE === 'play';
    // The barrage keeps several areas open at once (overlapping strikes grow
    // one area): explicit, so a schedule that needs more fails by name.
    if (SCENE === 'drive') TERRAIN.settings.config.max_regions = num('regions', 8);
    if (PLAY) TERRAIN.settings.config.max_regions = num('regions', 12);

    // ================================================================ device
    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('no WebGPU adapter');
    const timestamps = adapter.features.has('timestamp-query');
    const device = await adapter.requestDevice({
      requiredFeatures: timestamps ? ['timestamp-query'] : [],
      requiredLimits: {
        maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        maxBufferSize: adapter.limits.maxBufferSize,
      },
    });
    device.lost.then((i) => fail('device lost: ' + i.message));
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + ((e.error && e.error.message) || e.error)));
    const canvas = $('c');
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    // ?w=&h= fix the drawing size (recording); otherwise the window's.
    const fixedSize = qs.has('w') && qs.has('h');
    const configure = () => {
      if (fixedSize) { canvas.width = num('w', 1280); canvas.height = num('h', 720); }
      else {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.max(320, Math.floor((canvas.clientWidth || 1280) * dpr));
        canvas.height = Math.max(180, Math.floor((canvas.clientHeight || 720) * dpr));
      }
      context.configure({ device, format, alphaMode: 'opaque', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    };
    configure();
    addEventListener('resize', () => { if (!fixedSize) configure(); });

    // ================================================================ the crater (Rust: π-scaling)
    const probe = new TerrainStep(JSON.stringify({ ...TERRAIN.settings, settle_speed: 0.05 }));
    const pred = JSON.parse(probe.predict_impact(TERRAIN.meteor.radius, TERRAIN.meteor.density, TERRAIN.meteor.speed, G));
    const sandInfo = JSON.parse(probe.settings());
    probe.free();
    const R = pred.crater.radius, RIM = pred.crater.final_rim_radius;
    TERRAIN.settings.settle_speed = num('settle', 0.01 * Math.sqrt(G * R));
    const DX = pred.dx;
    // How far an open region's box reaches from its strike: R(1 + margin),
    // rounded out to whole 4-cell blocks.
    const REACH = R * (1 + TERRAIN.settings.region_margin) + 4 * DX;

    // ================================================================ the ground
    // Heightfield samples are the region's cells. Dunes, flattened over the
    // strike field (π-scaling assumes level ground).
    const SP = DX;
    // play: a wide basin, 1.2 km across, rimmed by hills.
    const HALF = PLAY ? num('half', 600) : 320;
    const NX = 2 * Math.ceil(HALF / SP) + 1, NZ = NX;
    const X0 = -0.5 * (NX - 1) * SP, Z0 = X0;
    // The track: a stadium loop along x (straights at z = ±TURN joined by
    // half circles), driven clockwise seen from above, the strike field inside
    // on the car's left. Straights line up with the regions' boxes, so a strike
    // can sit close beside one.
    // The straights sit just outside a line of the regions' block lattice
    // (4-cell blocks, which round a box out), so a strike beside them comes
    // as close as its box allows.
    // Clear of a box by more than a cell plus the buggy's reach: closer, its
    // colliders' padded bounds (mpmColliderBounds) fall in the region's block
    // cells and couple, and its parts overflow a cell's 8 slots (an error).
    const CLEAR = num('clear', 9);
    const BLOCK = 4 * DX;
    const STRAIGHT = num('straight', 90);
    const TURN = num('turn', Math.floor((58 * R / 15.1 - CLEAR) / BLOCK) * BLOCK + CLEAR + 0.5);
    const TRACK = (() => {
      const pts = [];
      for (let x = -STRAIGHT; x < STRAIGHT; x += 1) pts.push([x, TURN]);
      for (let a = 0; a < Math.PI; a += 1 / TURN) pts.push([STRAIGHT + TURN * Math.sin(a), TURN * Math.cos(a)]);
      for (let x = STRAIGHT; x > -STRAIGHT; x -= 1) pts.push([x, -TURN]);
      for (let a = 0; a < Math.PI; a += 1 / TURN) pts.push([-STRAIGHT - TURN * Math.sin(a), -TURN * Math.cos(a)]);
      return pts;
    })();
    // Distance from the loop's spine (the segment between the turns' centres).
    const spine = (x, z) => Math.hypot(x - Math.max(-STRAIGHT, Math.min(STRAIGHT, x)), z);
    // Flat this far outside the track too: the barrage strikes outside it.
    const FLAT_OUT = SCENE === 'drive' ? num('flatout', 75) : 14;
    const dune = (x, z) => {
      if (PLAY) {
        // Low dunes everywhere (π-scaling assumes level ground: kept gentle),
        // the basin's hills past HALF - 140 m.
        const big = 2.6 * Math.sin(x / 47 + 0.7) * Math.cos(z / 61 - 0.4) + 1.6 * Math.sin((x + 1.7 * z) / 37);
        const ridge = 1.2 * Math.sin((0.8 * x - 0.6 * z) / 11 + Math.sin(z / 29) * 2.0);
        const edge = Math.min(1, Math.max(0, (Math.max(Math.abs(x), Math.abs(z)) - (HALF - 140)) / 90));
        return 0.3 * (big + 0.35 * ridge) + edge * edge * 30 * (0.7 + 0.3 * Math.sin(x / 41) * Math.cos(z / 37));
      }
      const r = spine(x, z);
      const field = Math.min(1, Math.max(0, (r - TURN - FLAT_OUT) / 40)); // flat inside the loop
      const big = 2.6 * Math.sin(x / 47 + 0.7) * Math.cos(z / 61 - 0.4) + 1.6 * Math.sin((x + 1.7 * z) / 37);
      const ridge = 1.2 * Math.sin((0.8 * x - 0.6 * z) / 11 + Math.sin(z / 29) * 2.0);
      const far = Math.min(1, Math.max(0, (r - TURN - FLAT_OUT - 16) / 80)) * 9 * (0.6 + 0.4 * Math.sin(x / 53) * Math.cos(z / 71));
      return field * (big + 0.35 * ridge) * 0.6 + far;
    };
    const initialHeights = new Float32Array(NX * NZ);
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) initialHeights[j * NX + i] = dune(X0 + i * SP, Z0 + j * SP);
    let heights = initialHeights.slice();
    const field = { nx: NX, nz: NZ, dx: SP, dz: SP, origin: [0, 0, 0] };
    const arena0 = heightFieldArena(NX, NZ, SP, SP, initialHeights);
    // The surface patches (engine_terrain::surface::SurfacePatch): one more
    // heightfield per area slot (max_regions of them), which the surface pass
    // keeps on that area's live sand over its open window, so the wheels'
    // rays meet the sand, not the lowered bed under it. Out of reach (10 km
    // down) while its area is not open. Overlapping strikes grow one area to
    // cover them both (49 × 25 samples for the drive scene's first two), so a
    // patch takes the grown window plus its ring.
    const REGIONS = (() => {
      const p = new TerrainStep(JSON.stringify(TERRAIN.settings));
      try { return JSON.parse(p.settings()).config.max_regions; } finally { p.free(); }
    })();
    // The barrage's strikes chain along the road into longer grown windows.
    const PN = num('patch', SCENE === 'drive' || PLAY ? 128 : 72);
    const patchArena = heightFieldArena(PN, PN, SP, SP, new Float32Array(PN * PN).fill(-1e4));
    const ALL_RECORDS = new Uint32Array(arena0.records.length + REGIONS * patchArena.records.length);
    ALL_RECORDS.set(arena0.records, 0);
    const patchParams = Array.from({ length: REGIONS }, (_, k) => {
      const at = arena0.records.length + k * patchArena.records.length;
      ALL_RECORDS.set(patchArena.records, at);
      return [bitsf((fbits(patchArena.params[0]) & ~0x1FFFFFFF) | (at / 4 + patchArena.base)), ...patchArena.params.slice(1)];
    });
    const groundAt = (x, z) => {
      const fx = Math.min(Math.max((x - X0) / SP, 0), NX - 1.001), fz = Math.min(Math.max((z - Z0) / SP, 0), NZ - 1.001);
      const i = Math.floor(fx), j = Math.floor(fz), u = fx - i, v = fz - j;
      const h = (a, b) => heights[(j + b) * NX + i + a];
      return (1 - v) * ((1 - u) * h(0, 0) + u * h(1, 0)) + v * ((1 - u) * h(0, 1) + u * h(1, 1));
    };

    // ================================================================ world
    const cap = { ...sceneCapacity(256, 512), maxHull: ALL_RECORDS.length / 4 + 4096 };
    const world = await createWorld(device, { cap, vehicleCap: { maxVehicles: 4, maxWheels: 16, maxCurvePoints: 512, maxDiffs: 8, maxAntiRolls: 8, maxParts: 64, maxRays: 16 },
      status: (s) => { statusEl.textContent = s; } });
    // 120 Hz: physics and render every frame (behind the scenes: 300 Hz, so
    // each recorded frame can be a finer slice of the strike).
    const DT = SCENE === 'bts' ? 1 / 300 : 1 / 120;
    Object.assign(world.params, { dt: DT, iterations: 8, gravityY: -G, flags: M.FLAG_SPEC_VELOCITY });
    world.setMaterial(0, 0.9);
    world.setMaterial(WHEEL_RIM_MATERIAL, 0.9);
    const groundBody = world.addBody({ p: [0, 0, 0], flags: 0 });
    world.setHullRecords(ALL_RECORDS);
    const GROUND = world.addCollider({ body: groundBody, shape: 5, material: 0, params: arena0.params });
    const HF_BASE = arena0.base;
    const PATCHES = patchParams.map((params) => world.addCollider({ body: world.addBody({ p: [0, 0, 0], flags: 0 }), shape: 5, material: 0, params }));

    statusEl.textContent = 'building terrain kernels…';
    const terrain = await createTerrain(world, TERRAIN.settings, { status: (s) => { statusEl.textContent = s; }, surface: true,
      patches: PATCHES.map((collider) => ({ collider, nx: PN, nz: PN })) });
    const maxParticles = terrain.settings.config.max_particles, maxParcels = terrain.settings.config.max_parcels;
    // A second strike while a region is open: the engine's multi-region API
    // when it is there (max_regions > 1); until then each region bakes first.
    const canOverlap = () => (terrain.settings.config.max_regions ?? 1) > 1;

    // ---- the car: the dune buggy on an autopilot loop around the strike field
    const presets = Object.fromEntries((await (await fetch('./generated/vehicle_presets.json', { cache: 'no-store' })).json()).map((p) => [p.name, p]));
    const CAR = qs.get('car') || 'dune_buggy';
    const SPEED = num('kmh', 60) / 3.6;
    const qYaw = (yaw) => [0, Math.sin(yaw / 2), 0, Math.cos(yaw / 2)];
    const startCar = () => {
      const [x, z] = PLAY ? [0, 0] : TRACK[0];
      // Facing +x along the first straight.
      return world.vehicles.addVehicle(world.backend, presets[CAR], [x, groundAt(x, z) + 1.4, z], qYaw(Math.PI / 2));
    };

    // ================================================================ the strikes
    // Sim seconds (LEAD is the run-up before the recording starts). `pass`:
    // beside where the car will be then, as close to the track as the
    // strike's region box allows; `rimOf`: on that strike's rim, turned
    // `rimTurn` from +x toward the field. `overlapT`: when the strike is due
    // once regions may overlap (the second then lands on the first crater's
    // rim while it still moves).
    const LEAD = num('lead', SCENE === 'bts' ? 0 : 1.5);
    // drive: `beside` m between the crater's rim and the track where the car
    // passes (near misses: the car rides the rim's flank and the blanket).
    const GAP = num('gap', 3);
    const SCHEDULES = {
      pass: [
        { t: LEAD + num('t1', 1.2), pass: LEAD + num('pass1', 5.0) },
        { t: LEAD + num('t2', 7.0), overlapT: LEAD + 3.4, rimOf: 0, rimTurn: num('turn2', 0.45) },
        { t: LEAD + num('t3', 13.5), pass: LEAD + num('pass3', 17.0) },
      ],
      // The barrage. `side`: 1 inside the loop, -1 outside it. `beside` < 0:
      // the track runs inside the rim, so the car drives up over its crest
      // and down. A strike with t > pass lands just behind the car, one with
      // t a little before pass just ahead of it.
      drive: [
        { t: LEAD + 0.5, pass: LEAD + 2.9, side: 1, beside: 2 },
        { t: LEAD + 1.9, pass: LEAD + 3.9, side: -1, beside: -1 },
        { t: LEAD + 4.4, pass: LEAD + 4.8, side: 1, beside: 4 }, // just ahead
        { t: LEAD + 6.5, pass: LEAD + 5.2, side: -1, beside: 9 }, // just behind
        { t: LEAD + 6.5, pass: LEAD + 8.9, side: 1, beside: -1 },
        { t: LEAD + 8.0, pass: LEAD + 10.1, side: -1, beside: 3 },
        { t: LEAD + 11.1, pass: LEAD + 11.5, side: 1, beside: 3 }, // just ahead
        { t: LEAD + 12.5, pass: LEAD + 14.7, side: -1, beside: 2 },
        { t: LEAD + 14.7, pass: LEAD + 13.7, side: 1, beside: 3 }, // just behind
        { t: LEAD + 15.5, pass: LEAD + 17.9, side: 1, beside: 4 },
        { t: LEAD + 17.1, pass: LEAD + 17.5, side: -1, beside: 2 }, // just ahead
      ],
      drive1: [
        { t: LEAD + num('t1', 1.0), pass: LEAD + num('pass1', 4.6), beside: GAP },
        { t: LEAD + num('t2', 7.0), overlapT: LEAD + 3.0, pass: LEAD + num('pass2', 10.6), beside: GAP },
        { t: LEAD + num('t3', 13.0), pass: LEAD + num('pass3', 16.6), beside: GAP },
      ],
      // Filled as you play: the director's strikes and yours ({ t, at }).
      play: [],
      bts: [
        { t: num('t1', 1.5), at: [0, 20] },
        { t: num('t2', 5.6), overlapT: 2.6, rimOf: 0, rimTurn: num('turn2', 0.45) },
      ],
    };
    const SCHEDULE = SCHEDULES[SCENE];
    // Where the car is at sim time t (it reaches SPEED about 1.8 s in).
    // The barrage's near misses need it closer: measured, the car is 0.75 s
    // behind that from the start.
    const RUNUP = SCENE === 'drive' ? 1.65 : 0.9;
    const trackAt = (t) => TRACK[Math.min(TRACK.length - 1, Math.max(0, Math.round(SPEED * Math.max(0, t - RUNUP))))];
    const APPROACH = 1.35; // s of fireball before contact (cosmetic)
    const VIS_SPEED = 520; // m/s along its path (cosmetic: the real 20 km/s is one frame)
    const MAX_FX = 16;

    // ================================================================ rendering
    const SAMPLES = 4;
    const LIGHT_WGSL = /* wgsl */`
fn qrot(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}
fn toLinear(c: vec3f) -> vec3f { return pow(max(c, vec3f(0.0)), vec3f(2.2)); }
fn tonemap(c: vec3f) -> vec3f {
  let x = c * 0.8;
  let m = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
  return pow(m, vec3f(1.0 / 2.2));
}
fn sunDir() -> vec3f { return normalize(frame.light.xyz); }
const SUN = vec3f(1.0, 0.86, 0.68) * 2.1;
fn skyBase(d: vec3f) -> vec3f {
  let up = clamp(d.y, -1.0, 1.0);
  let zen = vec3f(0.07, 0.18, 0.46);
  let hor = vec3f(0.56, 0.58, 0.62);
  var c = mix(hor, zen, pow(clamp(up, 0.0, 1.0), 0.5));
  if (up < 0.0) { c = mix(hor, vec3f(0.42, 0.36, 0.30), clamp(-up * 3.0, 0.0, 1.0)); }
  return c;
}
fn skyColor(d: vec3f) -> vec3f {
  let up = clamp(d.y, -1.0, 1.0);
  let zen = vec3f(0.07, 0.18, 0.46);
  let hor = vec3f(0.56, 0.58, 0.62);
  var c = mix(hor, zen, pow(clamp(up, 0.0, 1.0), 0.5));
  if (up < 0.0) { c = mix(hor, vec3f(0.42, 0.36, 0.30), clamp(-up * 3.0, 0.0, 1.0)); }
  let s = max(dot(d, sunDir()), 0.0);
  c += vec3f(1.0, 0.86, 0.62) * (pow(s, 1500.0) * 60.0 + pow(s, 24.0) * 0.45 + pow(s, 4.0) * 0.12);
  return c;
}
// Haze toward the horizon (aerial perspective), and the strike's flash.
fn fogged(c: vec3f, w: vec3f) -> vec3f {
  let v = w - frame.eye.xyz;
  let d = length(v);
  let dir = v / max(d, 1e-3);
  let f = 1.0 - exp(-d / frame.fog.x);
  let hz = skyBase(normalize(vec3f(dir.x, max(dir.y, 0.03), dir.z)));
  return mix(c, hz, clamp(f, 0.0, 1.0)) + vec3f(1.0, 0.92, 0.80) * frame.misc.y * 0.35;
}
// The car's soft shadow on what is under it (sun from above).
fn carShadow(w: vec3f) -> f32 {
  if (frame.car.w < 0.5 || w.y > frame.car.y + 0.5) { return 1.0; }
  let l = sunDir();

    // ---- frame uniforms and the draw

    // ---- HUD

        `frame ${mean('ms').toFixed(2)} ms (budget 8.33) · terrain ${mean('terrainMs').toFixed(2)} ms · surface ${mean('surfaceMs').toFixed(2)} ms`,
        `particles ${(terrain.report?.particles ?? 0).toLocaleString()} · substeps ${last?.substeps ?? 0} · in flight ${(terrain.report?.airborne ?? 0).toLocaleString()} · wheels on sand ${terrain.report?.wheels ?? 0}`,
        `crater R ${R.toFixed(1)} m · rim ${RIM.toFixed(1)} m · cells ${DX.toFixed(2)} m (${TERRAIN.settings.config.cells_per_radius}/R, margin ${TERRAIN.settings.region_margin})`,
      ].join('\n');
      if (PLAY) {
        const t = game.over ? game.survived : st.t;
        $('pTime').textContent = `${t.toFixed(1)} s`;
        $('pInfo').innerHTML = [`${(st.carSpeed * 3.6).toFixed(0)} km/h · ${game.near} near misses · ${game.dropped} yours`,
          `best ${Math.max(game.best, game.over ? 0 : st.t).toFixed(1)} s · ${terrain.areas.length} craters moving`,
          game.lull ? 'the sky is reloading…' : '', st.t - game.msgT < 2 ? `<b>${game.msg}</b>` : ''].filter(Boolean).join('<br>');
      }
      statusEl.textContent = PLAY ? `play · seed ${num('seed', 0) || 'random'} · areas baked by the page: ${game.closed}` : canOverlap() ? 'overlapping strikes (multi-region engine)' : 'one region at a time: each crater bakes before the next strike';
    }

    // ---- interactive loop (rAF), off while frames are stepped by hand
    let manual = false;
    async function loop() {
      if (failed) return;
      try {
        if (!manual) { await stepFrame({ render: true, wait: true }); hud(); }
      } catch (e) { fail(e); return; }
      requestAnimationFrame(loop);
    }
    addEventListener('keydown', (e) => { if (e.code === 'KeyR') reset(); });

    // ================================================================ automation and recording
    // frames(n): n frames, each waited for on the GPU (no rAF: it runs in a
    // hidden page too). Each entry's `ms` is encode-to-GPU-done wall time,
    // rendering included; terrainMs / surfaceMs are GPU timestamps.
    async function frames(n, { render = true } = {}) {
      manual = true;
      if (failed) throw new Error(window.__failed);
      const out = [];
      for (let i = 0; i < n && !failed; i++) out.push(await stepFrame({ render, wait: true }));
      hud();
      return out;
    }
    const post = async (name, data, append = false) => {
      const r = await fetch(`/upload?name=${encodeURIComponent(name)}${append ? '&append=1' : ''}`, { method: 'POST', body: data });
      if (!r.ok) throw new Error(`upload ${name}: HTTP ${r.status}`);
    };
    // Record `seconds` of the run from the start: physics at 120 Hz, every
    // other frame encoded (60 fps) with explicit timestamps, H.264 Annex B
    // chunks uploaded as they come. `stills`: sim times to save PNGs at.
    // `pace(t)`: physics frames per recorded frame at sim time t (default: the
    // frames of 1/fps of sim time, real time; 1 behind the scenes at 300 Hz
    // and 60 fps is 5x slow motion).
    async function record({ seconds = 20, fps = 60, name = 'showcase.h264', bitrate = 24e6, stills = [], pace = null } = {}) {
      manual = true;
      if (st.frame !== 0) throw new Error('record() runs from a fresh load (reload the page)');
      // The run-up: the car gets to speed before the first frame.
      while (st.t < LEAD - 1e-9) await stepFrame({ render: false, wait: true });
      const every = Math.round(1 / DT / fps);
      const W = canvas.width, H = canvas.height;
      const config = { codec: 'avc1.640033', width: W, height: H, bitrate, framerate: fps, avc: { format: 'annexb' }, latencyMode: 'quality' };
      const sup = await VideoEncoder.isConfigSupported(config);
      if (!sup.supported) throw new Error('H.264 encoding not supported: ' + JSON.stringify(config));
      let pending = [], bytes = 0, encErr = null;
      const enc = new VideoEncoder({ output: (chunk) => { const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); pending.push(b); bytes += b.byteLength; }, error: (e) => { encErr = e; } });
      enc.configure(config);
      await post(name, new Uint8Array(0));
      const flush = async () => {
        if (!pending.length) return;
        const parts = pending; pending = [];
        await post(name, new Blob(parts), true);
      };
      const frames = Math.round(seconds * fps);
      const stillK = stills.map((t) => Math.round(t * fps)); // video seconds
      const paceAt = pace ?? (() => every);
      const times = [];
      // Each encoded frame from the canvas texture's own pixels (a copy in the
      // frame's submission), not from the canvas element: no race with its
      // presentation, also in a hidden page.
      const bytesPerRow = Math.ceil((W * 4) / 256) * 256;
      const capture = { bytesPerRow, buffer: device.createBuffer({ size: bytesPerRow * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ }) };
      const pixFormat = format === 'bgra8unorm' ? 'BGRA' : 'RGBA';
      let k = 0;
      const t0 = performance.now();
      while (k < frames && !failed) {
        const n = Math.max(1, Math.round(paceAt(st.t)));
        for (let i = 1; i < n; i++) await stepFrame({ render: false, wait: true });
        times.push(+st.t.toFixed(4));
        await stepFrame({ render: true, wait: true, capture });
        {
          await capture.buffer.mapAsync(GPUMapMode.READ);
          const pixels = new Uint8Array(capture.buffer.getMappedRange()).slice();
          capture.buffer.unmap();
          if (stillK.includes(k)) {
            // A PNG from the same pixels (RGBA for the 2D canvas).
            const rgba = new Uint8ClampedArray(W * H * 4);
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
              const a = y * bytesPerRow + 4 * x, b = 4 * (y * W + x);
              if (pixFormat === 'BGRA') { rgba[b] = pixels[a + 2]; rgba[b + 1] = pixels[a + 1]; rgba[b + 2] = pixels[a]; } else { rgba[b] = pixels[a]; rgba[b + 1] = pixels[a + 1]; rgba[b + 2] = pixels[a + 2]; }
              rgba[b + 3] = 255;
            }
            const oc = new OffscreenCanvas(W, H);
            oc.getContext('2d').putImageData(new ImageData(rgba, W, H), 0, 0);
            await post(`${name.replace(/\.h264$/, '')}_still_${(k / fps).toFixed(1)}s.png`, await oc.convertToBlob({ type: 'image/png' }));
          }
          const frame = new VideoFrame(pixels, { format: pixFormat, codedWidth: W, codedHeight: H, layout: [{ offset: 0, stride: bytesPerRow }],
            timestamp: Math.round((k * 1e6) / fps), duration: Math.round(1e6 / fps) });
          enc.encode(frame, { keyFrame: k % (2 * fps) === 0 });
          frame.close();
          k++;
          if (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 1));
          if (pending.length > 30) await flush();
        }
        if (encErr) throw encErr;
      }
      // Sim time of each recorded frame (labels, and the slow motion's pace).
      await post(`${name}.times.json`, JSON.stringify({ fps, dt: DT, times }));
      await enc.flush();
      await flush();
      enc.close();
      capture.buffer.destroy();
      hud();
      return { frames: k, bytes, wallS: (performance.now() - t0) / 1000, size: [W, H] };
    }
    // Still PNG of the current frame (re-rendered).
    async function still(name) {
      writeFrame();
      const e = device.createCommandEncoder(); draw(e); device.queue.submit([e.finish()]);
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
      await post(name, blob);
      return blob.size;
    }
    function timings(from = 0) {
      const v = log.filter((e) => e.t >= from);
      const stat = (k, f = () => true) => {
        const a = v.filter(f).map((e) => e[k]).filter((x) => x !== undefined).sort((x, y) => x - y);
        if (!a.length) return null;
        const q = (p) => a[Math.min(a.length - 1, Math.floor(p * a.length))];
        return { n: a.length, mean: +(a.reduce((s, x) => s + x, 0) / a.length).toFixed(3), p50: q(0.5), p95: q(0.95), max: a[a.length - 1] };
      };
      return { frameMs: stat('ms'), frameMsOpen: stat('ms', (e) => e.kind === 1 || e.kind === 3), frameMsIdle: stat('ms', (e) => e.kind === 0), terrainMs: stat('terrainMs'), surfaceMs: stat('surfaceMs'), renderMs: stat('renderMs'), renderMsOpen: stat('renderMs', (e) => e.kind === 1 || e.kind === 3), substeps: stat('substeps', (e) => e.kind === 1 || e.kind === 3), over8_3: v.filter((e) => e.ms > 8.333).length, frames: v.length };
    }
    window.__showcase = {
      frames, record, still, reset, timings, log,
      state: () => ({ t: st.t, frame: st.frame, car: st.carPose, carKmh: st.carSpeed * 3.6, region: terrain.region, report: terrain.report, strikes: st.strikes, switches: st.switches, canOverlap: canOverlap(), schedule: SCHEDULE.map((s) => ({ state: s.state, t0: s.t0, point: s.point })), error: terrain.error && String(terrain.error) }),
      settings: { TERRAIN, R, RIM, DX, REACH, NX, STRAIGHT, TURN, SPEED, LEAD, sand: sandInfo.sand, prediction: pred },
      resume: () => { manual = false; },
      camera: (o) => { cam.override = o; },
    };
    window.__world = world; window.__terrain = terrain;
    window.__ready = true;
    statusEl.textContent = 'ready';
    if (qs.get('manual') === '1') manual = true;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
