[package]
name = "engine-webgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebGPU / wgpu submission of the shared Slang phase graph (SPIR-V → naga → WGSL)"

[dependencies]
engine-schema.workspace = true
engine-gpu-wait.workspace = true
web-time.workspace = true
engine-exec.workspace = true
engine-vehicle.workspace = true
engine-softbody.workspace = true
glam.workspace = true
serde_json.workspace = true
engine-slang-build.workspace = true
bytemuck.workspace = true
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
naga = { version = "24", features = ["spv-in", "wgsl-in", "wgsl-out"] }

[features]
# The wgpu world, its device and the soft-body skinner. Without it the crate builds the
# Slang → WGSL tables only, which is all `wgsl_export` needs (the web build's host tool,
# so it does not compile the native wgpu stack).
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster"]

[build-dependencies]
engine-slang-build.workspace = true
anyhow.workspace = true

[[bin]]
name = "wgsl_smoke"
path = "src/bin/wgsl_smoke.rs"
required-features = ["gpu"]

[[bin]]
name = "wgsl_export"
path = "src/bin/wgsl_export.rs"

[[bin]]
name = "wg_drop"
path = "src/bin/wg_drop.rs"
required-features = ["gpu"]

[[bin]]
name = "soft_bench"
path = "src/bin/soft_bench.rs"
required-features = ["gpu"]

[[bin]]
name = "soft_calibrate"
path = "src/bin/soft_calibrate.rs"
required-features = ["gpu"]

[[bin]]
name = "soft_crash"
path = "src/bin/soft_crash.rs"
required-features = ["gpu"]

[[bin]]
name = "gpu_dispatch_probe"
path = "src/bin/gpu_dispatch_probe.rs"
required-features = ["gpu"]
