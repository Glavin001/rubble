<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubble vehicle designer</title>
<link rel="icon" href="data:,">
<!-- Live vehicle designer: every slider rebuilds the car with the Rust
     generator (engine-vehiclegen, compiled to wasm by engine-vehiclegen-wasm)
     in a worker (vehicle-designer-worker.mjs); this page only draws the
     buffers it returns (three.js). "Download .glb" builds the art-spec
     delivery (with panel UVs) in the same module.
     Build the wasm first (engine/scripts/build-web.sh does it):
       wasm-pack build crates/engine-vehiclegen-wasm --release --target web \
         --out-dir ../engine-webgpu/generated/vehiclegen-wasm --no-typescript -->
<style>
 :root { --bg: #15181d; --panel: #11141a; --line: #2c3340; --fg: #e7eaef; --muted: #9aa3b2; --accent: #5aa9ff; --err: #ff8e8e; }
 * { box-sizing: border-box; }
 html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
 #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
 #side { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 12px 14px 20px; }
 h1 { font-size: 15px; margin: 0 0 2px; }
 .sub { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
 h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
 .ctl { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 6px 0; align-items: center; }
 .ctl label { color: #cdd3dd; }
 .ctl output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
 .ctl input[type=range] { grid-column: 1 / 3; width: 100%; accent-color: var(--accent); }
 .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
 button, select { background: #232936; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
 button:hover, select:hover { border-color: #46526a; }
 button.primary { background: #1f3552; border-color: #2f5e93; }
 #stage { position: relative; min-width: 0; }
 canvas { display: block; width: 100%; height: 100%; touch-action: none; }
 #hud { position: absolute; left: 12px; top: 12px; background: rgba(17, 20, 26, .82); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-variant-numeric: tabular-nums; max-width: calc(100% - 24px); }
 #hud b { font-size: 14px; }
 #hud .m { color: var(--muted); }
 #err { color: var(--err); white-space: pre-wrap; }
 #busy { position: absolute; right: 12px; top: 12px; color: var(--muted); background: rgba(17,20,26,.7); padding: 3px 8px; border-radius: 6px; display: none; }
 @media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 46%; }
  #side { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
 }
</style>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
 <aside id="side">
  <h1>Vehicle designer</h1>
  <p class="sub">Each change rebuilds the car in Rust (engine-vehiclegen, WebAssembly): body surface, panels with shut lines and hems, glass, lamps, wheels, interior and markers, to the vehicle art spec.</p>
  <div class="row" id="presets"></div>
  <div id="controls"></div>
  <h2>Paint</h2>
  <div class="row"><input type="color" id="paint"> <span class="m" style="color:var(--muted)">colour</span></div>
  <div class="ctl"><label for="metallic">Metallic</label><output id="o_metallic"></output><input type="range" id="metallic" min="0" max="1" step="0.01"></div>
  <div class="ctl"><label for="roughness">Roughness</label><output id="o_roughness"></output><input type="range" id="roughness" min="0.02" max="1" step="0.01"></div>
  <h2>View</h2>
  <div class="row">
   <label><input type="checkbox" id="spin"> Turntable</label>
   <label><input type="checkbox" id="wire"> Wireframe</label>
  </div>
  <div class="row"><button class="primary" id="download">Download .glb</button> <button id="reset">Reset</button></div>
 </aside>
 <main id="stage">
  <canvas id="c"></canvas>
  <div id="hud"><b>Sedan</b> <span class="m" id="dims"></span><div class="m" id="stats">starting the Rust module…</div><div id="err"></div></div>
  <div id="busy">building…</div>
 </main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const DESIGN = 'sedan';

// -- controls: one slider per design parameter --------------------------------------
const SLIDERS = [
  ['Proportions'],
  ['wheelbase', 'Wheelbase', 2.3, 3.3, 0.01, 'm'],
  ['front_overhang', 'Front overhang', 0.70, 1.25, 0.01, 'm'],
  ['rear_overhang', 'Rear overhang', 0.75, 1.35, 0.01, 'm'],
  ['width', 'Body width', 1.62, 2.05, 0.005, 'm'],
  ['height', 'Roof height', 1.25, 1.75, 0.005, 'm'],
  ['Stance'],
  ['ride', 'Ride height', -0.02, 0.18, 0.005, 'm'],
  ['track', 'Track', 1.40, 1.80, 0.005, 'm'],
  ['Wheels'],
  ['tyre_d', 'Tyre diameter', 0.58, 0.82, 0.002, 'm'],
  ['tyre_w', 'Tyre width', 0.175, 0.315, 0.005, 'm'],
  ['rim_in', 'Rim diameter', 14, 21, 1, 'in'],
  ['rim_w_in', 'Rim width', 5.5, 10.5, 0.5, 'in'],
];
const PRESETS = {
  'Reference': {},
  'Compact': { wheelbase: 2.55, front_overhang: 0.80, rear_overhang: 0.85, width: 1.78, height: 1.42, track: 1.53, tyre_d: 0.64, tyre_w: 0.205, rim_in: 16, rim_w_in: 6.5 },
  'Executive': { wheelbase: 3.10, front_overhang: 0.95, rear_overhang: 1.15, width: 1.92, height: 1.48, track: 1.64, tyre_d: 0.70, tyre_w: 0.255, rim_in: 19, rim_w_in: 8.5 },
  'Low & wide': { wheelbase: 2.80, width: 2.00, height: 1.30, ride: -0.02, track: 1.76, tyre_d: 0.68, tyre_w: 0.295, rim_in: 20, rim_w_in: 10 },
  'Lifted': { ride: 0.15, height: 1.52, tyre_d: 0.78, tyre_w: 0.265, rim_in: 17, rim_w_in: 8, track: 1.66, width: 1.90, rim_style: 'steel' },
};
let defaults = null;
let params = null;

function fmt(v, unit) { return unit === 'in' ? `${(+v).toFixed(v % 1 ? 1 : 0)} in` : `${(+v).toFixed(3)} m`; }
function buildControls() {
  const box = $('controls');
  for (const s of SLIDERS) {
    if (s.length === 1) { const h = document.createElement('h2'); h.textContent = s[0]; box.appendChild(h); continue; }
    const [key, label, min, max, step, unit] = s;
    const d = document.createElement('div');
    d.className = 'ctl';
    d.innerHTML = `<label for="${key}">${label}</label><output id="o_${key}"></output><input type="range" id="${key}" min="${min}" max="${max}" step="${step}">`;
    box.appendChild(d);
    $(key).oninput = () => { params[key] = +$(key).value; $('o_' + key).textContent = fmt(params[key], unit); request(); };
  }
  const r = document.createElement('div');
  r.className = 'ctl';
  r.innerHTML = '<label for="rim_style">Rim style</label><select id="rim_style"><option value="alloy">Alloy five-spoke</option><option value="steel">Steel</option><option value="magnum">Polished five-window</option></select>';
  box.appendChild(r);
  $('rim_style').onchange = () => { params.rim_style = $('rim_style').value; request(); };
  for (const name of Object.keys(PRESETS)) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { params = { ...defaults, ...PRESETS[name], paint: params.paint, metallic: params.metallic, roughness: params.roughness }; syncControls(); request(); };
    $('presets').appendChild(b);
  }
}
function syncControls() {
  for (const s of SLIDERS) {
    if (s.length === 1) continue;
    $(s[0]).value = params[s[0]];
    $('o_' + s[0]).textContent = fmt(params[s[0]], s[5]);
  }
  $('rim_style').value = params.rim_style;
  $('paint').value = '#' + new THREE.Color().setRGB(...params.paint, THREE.LinearSRGBColorSpace).getHexString(THREE.SRGBColorSpace);
  $('metallic').value = params.metallic; $('o_metallic').textContent = (+params.metallic).toFixed(2);
  $('roughness').value = params.roughness; $('o_roughness').textContent = (+params.roughness).toFixed(2);
}

// -- three.js scene ------------------------------------------------------------------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f26);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;   // a dim studio: deep paint, not a milky sheen
const sun = new THREE.DirectionalLight(0xffffff, 2.8);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 25 });
sun.shadow.bias = -0.0004;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x2a2f38, roughness: 0.9 }));
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(12, 24, 0x3a4252, 0x2f3542);
grid.position.y = 0.001;
scene.add(grid);
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 200);
camera.position.set(6.2, 2.2, 7.2);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
controls.autoRotateSpeed = 0.8;
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// the art spec's ten materials (glTF factors, as export.rs writes them)
let mats = [];
function makeMaterials(names) {
  const spec = {
    paint: () => new THREE.MeshPhysicalMaterial({ clearcoat: 1, clearcoatRoughness: 0.03 }),
    chrome: () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(0.92, 0.92, 0.94, THREE.LinearSRGBColorSpace), metalness: 1, roughness: 0.06 }),
    trim_black: () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(0.018, 0.018, 0.02, THREE.LinearSRGBColorSpace), roughness: 0.72 }),
    rubber: () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(0.016, 0.016, 0.017, THREE.LinearSRGBColorSpace), roughness: 0.78 }),
    glass: () => new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.06, 0.075, 0.08, THREE.LinearSRGBColorSpace), roughness: 0.02, transparent: true, opacity: 0.22, depthWrite: false }),
    lamp_lens: () => new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.03, transparent: true, opacity: 0.45, depthWrite: false }),
    lamp_emissive: () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(0.9, 0.9, 0.88, THREE.LinearSRGBColorSpace), metalness: 0.6, roughness: 0.2 }),
    interior_fabric: () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(0.035, 0.035, 0.037, THREE.LinearSRGBColorSpace), roughness: 0.9 }),
    interior_plastic: () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(0.03, 0.03, 0.032, THREE.LinearSRGBColorSpace), roughness: 0.55 }),
    metal_bare: () => new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(0.30, 0.30, 0.31, THREE.LinearSRGBColorSpace), metalness: 1, roughness: 0.55 }),
  };
  mats = names.map((n) => { const m = spec[n](); m.name = n; return m; });
}
function applyPaint() {
  const m = mats[0];
  m.color.setRGB(...params.paint, THREE.LinearSRGBColorSpace);
  m.metalness = params.metallic;
  m.roughness = params.roughness;
}
function applyWire() { mats.forEach((m) => { m.wireframe = $('wire').checked; }); }

// -- building ------------------------------------------------------------------------
const worker = new Worker(new URL('./vehicle-designer-worker.mjs', import.meta.url), { type: 'module' });
let car = null;
let seq = 0, shown = 0, lastBuild = 0, framed = false;
function request() {
  $('busy').style.display = 'block';
  lastBuild = ++seq;
  worker.postMessage({ type: 'build', id: lastBuild, design: DESIGN, params, uv: false });
}
function show(msg) {
  const g = new THREE.Group();
  const box = new THREE.Box3();
  const bodyBox = new THREE.Box3();
  for (const p of msg.parts) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(p.positions, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(p.normals, 3));
    if (p.colors.length) geo.setAttribute('color', new THREE.BufferAttribute(p.colors, 4));
    geo.setIndex(new THREE.BufferAttribute(p.indices, 1));
    for (let k = 0; k < p.groups.length; k += 3) geo.addGroup(p.groups[k + 1], p.groups[k + 2], p.groups[k]);
    const mesh = new THREE.Mesh(geo, mats);
    mesh.name = p.name;
    mesh.castShadow = mesh.receiveShadow = true;
    if (/^glass|_lens$/.test(p.name)) mesh.renderOrder = 2;
    g.add(mesh);
    geo.computeBoundingBox();
    box.union(geo.boundingBox);
    if (!/^(mirror_|rim_|tyre_|brake_disc_)/.test(p.name)) bodyBox.union(geo.boundingBox);
  }
  if (car) { scene.remove(car); car.traverse((o) => o.geometry && o.geometry.dispose()); }
  car = g;
  scene.add(car);
  const s = bodyBox.getSize(new THREE.Vector3());
  $('dims').textContent = `${s.z.toFixed(2)} × ${s.x.toFixed(2)} × ${box.max.y.toFixed(2)} m`;
  $('stats').textContent = `built in ${msg.ms.toFixed(0)} ms (Rust → wasm) · ${msg.parts.length} parts · ${msg.markers.length} markers · ${msg.triangles.toLocaleString()} triangles`;
  if (!framed) { framed = true; controls.target.set(0, box.getCenter(new THREE.Vector3()).y, 0); }
}
worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === 'hello') {
    makeMaterials(m.materials);
    defaults = m.defaults;
    params = { ...defaults };
    buildControls();
    syncControls();
    applyPaint();
    request();
  } else if (m.type === 'build') {
    if (m.id < shown) return;
    shown = m.id;
    $('err').textContent = '';
    show(m);
    if (m.id === lastBuild) $('busy').style.display = 'none';
  } else if (m.type === 'glb') {
    const url = URL.createObjectURL(new Blob([m.glb], { type: 'model/gltf-binary' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `${DESIGN}.glb` });
    a.click();
    URL.revokeObjectURL(url);
    $('download').disabled = false;
    $('download').textContent = 'Download .glb';
  } else if (m.type === 'error') {
    $('err').textContent = m.error;
    if (m.id === lastBuild) $('busy').style.display = 'none';
    $('download').disabled = false;
    $('download').textContent = 'Download .glb';
  }
};
worker.onerror = (e) => { $('err').textContent = 'worker: ' + (e.message || e); };
worker.postMessage({ type: 'hello', design: DESIGN });

$('paint').oninput = () => {
  const c = new THREE.Color($('paint').value);
  const lin = c.clone().convertSRGBToLinear();
  params.paint = [lin.r, lin.g, lin.b];
  applyPaint();
};
for (const k of ['metallic', 'roughness']) {
  $(k).oninput = () => { params[k] = +$(k).value; $('o_' + k).textContent = params[k].toFixed(2); applyPaint(); };
}
$('wire').onchange = applyWire;
$('spin').onchange = () => { controls.autoRotate = $('spin').checked; };
$('reset').onclick = () => { params = { ...defaults }; syncControls(); applyPaint(); request(); };
$('download').onclick = () => {
  $('download').disabled = true;
  $('download').textContent = 'Building…';
  worker.postMessage({ type: 'glb', id: ++seq, design: DESIGN, params, uv: true });
};

resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__DESIGNER__ = { scene, get params() { return params; }, set(p) { params = { ...params, ...p }; syncControls(); request(); }, get car() { return car; } };
</script>
</body>
</html>
