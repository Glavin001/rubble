<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rubble motion — CCD, characters, projectiles</title>
  <!-- The motion demo is the playground's ccd, character and bullets presets (play.html,
       play-motion.mjs): this URL redirects there, its switches kept (?scene= picks it). -->
  <script>
    const q = new URLSearchParams(location.search);
    const scene = ['ccd', 'character', 'bullets'].includes(q.get('scene')) ? q.get('scene') : 'ccd';
    q.set('preset', scene);
    location.replace(`play.html?${q}`);
  </script>
</head>
<body><a href="play.html?preset=ccd">Rubble motion</a></body>
</html>
