<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Rubble motion — CCD, characters, projectiles (WebGPU AVBD)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; color: #dfe4ee; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: fixed; background: rgba(16, 19, 26, 0.8); border: 1px solid #2c3346; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px); }
    #hud { top: 12px; left: 12px; width: 24rem; max-width: calc(100vw - 48px); }
    #hud h1 { font-size: 15px; margin: 0 0 6px; font-weight: 650; }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
    .muted { color: #8d96aa; }
    select, button { background: #1d2333; color: #dfe4ee; border: 1px solid #3a4360; border-radius: 5px; padding: 3px 8px; font: inherit; cursor: pointer; }
    button:hover { border-color: #6c7aa6; }
    #err { color: #ff8e8e; white-space: pre-wrap; }
    #stats { right: 12px; top: 12px; width: 22rem; font-variant-numeric: tabular-nums; max-height: 70vh; overflow: auto; }
    table { border-collapse: collapse; width: 100%; }
    td, th { padding: 2px 4px; text-align: left; border-bottom: 1px solid #262d40; }
    .ok { color: #7fe08f; } .bad { color: #ff8e8e; } .warn { color: #ffcf6e; }
    kbd { background: #252c3d; border: 1px solid #3a4360; border-radius: 3px; padding: 0 4px; font-size: 11px; }
    #log { margin-top: 6px; max-height: 9rem; overflow: auto; font: 11px ui-monospace, monospace; color: #b5bdd0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" class="panel">
    <h1>Rubble motion · CCD, characters, projectiles</h1>
    <div class="row">
      <label class="muted" for="sceneSel">Scene</label><select id="sceneSel"></select>
      <label class="muted" for="speedSel">Shot</label><select id="speedSel"></select>
      <label class="muted"><input type="checkbox" id="lookahead" checked /> look-ahead</label>
    </div>
    <div class="row muted" id="help"></div>
    <div id="status" class="muted">starting…</div>
    <div id="err"></div>
  </div>
  <div id="stats" class="panel"><div id="statsBody"></div><div id="log"></div></div>
  <script type="module">
    import { createWorld, sceneCapacity } from './world-host.mjs';
    import { M } from './vehicle.mjs';

    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const fail = (e) => { errEl.textContent = String((e && e.stack) || e); statusEl.textContent = 'stopped'; window.__failed = String(e); };
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });
    addEventListener('error', (e) => fail(e.error || e.message));

    const qs = new URLSearchParams(location.search);
    const SCENES = {
      ccd: 'Tunnelling gallery: CCD off vs on',
      character: 'Character playground',
      bullets: 'Bullets through walls',
    };
    const scene = SCENES[qs.get('scene')] ? qs.get('scene') : 'ccd';
    const SPEEDS = [60, 140, 250];
    const shotSpeed = Number(qs.get('speed')) || 250;
    const lookAhead = qs.get('lookahead') !== '0';
    const sceneSel = document.getElementById('sceneSel');
    for (const [id, t] of Object.entries(SCENES)) sceneSel.add(new Option(t, id, false, id === scene));
    const speedSel = document.getElementById('speedSel');
    for (const v of SPEEDS) speedSel.add(new Option(`${v} m/s`, v, false, v === shotSpeed));
    document.getElementById('lookahead').checked = lookAhead;
    const go = (k, v) => { const u = new URL(location.href); u.searchParams.set(k, v); location.href = u.href; };
    sceneSel.onchange = () => go('scene', sceneSel.value);
    speedSel.onchange = () => go('speed', speedSel.value);
    document.getElementById('lookahead').onchange = (e) => go('lookahead', e.target.checked ? '1' : '0');
    document.getElementById('help').innerHTML = {
      ccd: '<span><kbd>F</kbd> fire a volley · <kbd>R</kbd> reset · drag to orbit · scroll to zoom</span>',
      character: '<span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Space</kbd> jump · <kbd>F</kbd> bullet · <kbd>B</kbd> CCD rocket · <kbd>R</kbd> reset · drag to look</span>',
      bullets: '<span><kbd>F</kbd> fire · <kbd>R</kbd> reset · drag to orbit</span>',
    }[scene];

    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('no WebGPU adapter');
    const device = await adapter.requestDevice({
      requiredLimits: {
        maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage,
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        maxBufferSize: adapter.limits.maxBufferSize,
      },
    });
    device.lost.then((i) => fail('device lost: ' + i.message));
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + ((e.error && e.error.message) || e.error)));
    const canvas = document.getElementById('c');
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    const configure = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      context.configure({ device, format, alphaMode: 'opaque' });
    };
    configure();
    addEventListener('resize', configure);

    // ---------------------------------------------------------------- world
    const cap = sceneCapacity(4000, 8000);
    const world = await createWorld(device, { cap, status: (s) => { statusEl.textContent = s; } });
    const DT = 1 / 60;
    world.params.dt = DT;
    world.params.iterations = 10;
    world.params.gravityY = -10;
    world.params.flags = lookAhead ? M.FLAG_SPEC_VELOCITY : 0;
    const MAT_GROUND = 0, MAT_PROP = 1;
    world.setMaterial(MAT_GROUND, 0.9);
    world.setMaterial(MAT_PROP, 0.6);

    const qAxis = (ax, ang) => { const s = Math.sin(ang / 2); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(ang / 2)]; };
    const boxInv = (m, hx, hy, hz) => [3 / (m * (hy * hy + hz * hz)), 3 / (m * (hx * hx + hz * hz)), 3 / (m * (hx * hx + hy * hy))];
    const staticBox = (p, half, q = [0, 0, 0, 1], material = MAT_PROP) => {
      const body = world.addBody({ p, q, flags: 0 });
      world.addCollider({ body, shape: 2, material, params: [...half, Math.hypot(...half)] });
      return body;
    };
    const kinematicBox = (p, half, q = [0, 0, 0, 1]) => {
      const body = world.addBody({ p, q, flags: M.BODY_KINEMATIC | 8 });
      world.addCollider({ body, shape: 2, material: MAT_GROUND, params: [...half, Math.hypot(...half)] });
      return body;
    };
    const dynBox = (p, half, mass, q = [0, 0, 0, 1], flags = 0) => {
      const body = world.addBody({ p, q, invMass: 1 / mass, invI: boxInv(mass, ...half), flags: 1 | 8 | flags });
      world.addCollider({ body, shape: 2, material: MAT_PROP, params: [...half, Math.hypot(...half)] });
      return body;
    };
    const dynBall = (p, r, mass, v = [0, 0, 0], flags = 0) => {
      const i = 2.5 / (mass * r * r);
      const body = world.addBody({ p, invMass: 1 / mass, invI: [i, i, i], flags: 1 | 8 | flags, v });
      world.addCollider({ body, shape: 0, material: MAT_PROP, params: [r, 0, 0, r] });
      return body;
    };
    // Ground slab: collider 0, drawn as the grid plane.
    staticBox([0, -5, 0], [400, 5, 400], [0, 0, 0, 1], MAT_GROUND);

    // Scene state the HUD and the checks read.
    const S = { lanes: [], shower: null, player: -1, npcs: [], platform: null, lift: null, walls: [], targets: [], log: [] };
    const say = (m) => { S.log.unshift(`${world.steps}: ${m}`); S.log.length = Math.min(S.log.length, 40); };

    if (scene === 'ccd') {
      // Each lane: a control ball (no CCD) and a CCD ball (BODY_CCD), 2 m apart,
      // fired along +z at a wall whose near face is at z = 30.
      const WALL_Z = 30;
      var BALL_R = 0.15;
      const laneDefs = [
        { name: '5 cm slab', x: -16, build: (x) => staticBox([x, 1.5, WALL_Z + 0.025], [2.5, 1.5, 0.025]), depth: 0.05 },
        { name: '20 cm slab', x: -8, build: (x) => staticBox([x, 1.5, WALL_Z + 0.1], [2.5, 1.5, 0.1]), depth: 0.2 },
        { name: '1 m wall', x: 0, build: (x) => staticBox([x, 1.5, WALL_Z + 0.5], [2.5, 1.5, 0.5]), depth: 1.0 },
        { name: 'brick wall (grid)', x: 8, build: (x) => {
          for (let iy = 0; iy < 15; iy++) for (let ix = 0; ix < 25; ix++) staticBox([x - 2.4 + ix * 0.2, 0.1 + iy * 0.2, WALL_Z + 0.1], [0.1, 0.1, 0.1]);
        }, depth: 0.2 },
        { name: 'brick wall (dynamic)', x: 16, dynamic: true, build: (x) => {
          const bricks = [];
          for (let iy = 0; iy < 12; iy++) for (let ix = 0; ix < 20; ix++) {
            const p = [x - 1.9 + ix * 0.2, 0.1 + iy * 0.2, WALL_Z + 0.1];
            bricks.push({ body: dynBox(p, [0.1, 0.1, 0.1], 4), p });
          }
          return bricks;
        }, depth: 0.2 },
      ];
      for (const L of laneDefs) {
        const bricks = L.build(L.x);
        // Dynamic wall: the bricks in each ball's path. A ball that passes the
        // wall without moving them tunnelled; one that knocked them out smashed through.
        if (L.dynamic) for (const [side, dx] of [['control', -1.0], ['ccd', 1.0]])
          L[side + 'Bricks'] = bricks.filter((b) => Math.abs(b.p[0] - (L.x + dx)) < 0.25).map((b) => b.body);
        // Parked far below until fired (static until then).
        const ball = (dx, ccd) => {
          const body = world.addBody({ p: [L.x + dx, -500, 0], invMass: 1 / 5, invI: [250, 250, 250], flags: ccd ? M.BODY_CCD : 0 });
          world.addCollider({ body, shape: 0, material: MAT_PROP, params: [BALL_R, 0, 0, BALL_R] });
          return body;
        };
        S.lanes.push({ ...L, wallZ: WALL_Z, control: ball(-1.0, false), ccd: ball(1.0, true), result: { control: '—', ccd: '—' }, tally: { control: 0, ccd: 0, shots: 0 } });
      }
      // Debris shower: 0.1 m chunks at 40 m/s onto a 0.2 m slab, CCD off (left) / on (right).
      staticBox([-6, 0.1 + 6, -14], [2.5, 0.1, 2.5], [0, 0, 0, 1], MAT_GROUND);
      staticBox([6, 0.1 + 6, -14], [2.5, 0.1, 2.5], [0, 0, 0, 1], MAT_GROUND);
      S.shower = { control: [], ccd: [] };
      for (const [side, x0, ccd] of [['control', -6, false], ['ccd', 6, true]]) {
        for (let i = 0; i < 49; i++) {
          const body = world.addBody({ p: [x0 + (i % 7) * 0.6 - 1.8, -600, -14 + Math.floor(i / 7) * 0.6 - 1.8], invMass: 1 / 0.3, invI: boxInv(0.3, 0.05, 0.05, 0.05), flags: ccd ? M.BODY_CCD : 0 });
          world.addCollider({ body, shape: 2, material: MAT_PROP, params: [0.05, 0.05, 0.05, 0.0866] });
          S.shower[side].push({ body, x: x0 + (i % 7) * 0.6 - 1.8, z: -14 + Math.floor(i / 7) * 0.6 - 1.8, y: 9 + 0.13 * (i % 5) });
        }
      }
    } else if (scene === 'character') {
      // Stairs: six 0.3 m steps (0.5 m run) from x = 4.
      for (let k = 0; k < 6; k++) {
        const top = 0.3 * (k + 1);
        staticBox([4 + 0.5 * k + 3, top / 2, 6], [3, top / 2, 2]);
      }
      // A walkable 30° ramp and a 55° slide.
      staticBox([-6, 1.0, 8], [3, 0.2, 2], qAxis([0, 0, 1], -Math.PI / 6));
      staticBox([-6, 2.2, 14], [2.4, 0.2, 2], qAxis([0, 0, 1], -55 * Math.PI / 180));
      // Moving platform (kinematic) and a lift.
      S.platform = kinematicBox([10, 0.25, -6], [2, 0.25, 2]);
      S.lift = kinematicBox([-10, 0.25, -4], [1.6, 0.25, 1.6]);
      staticBox([-10, 2.5, -7], [2, 2.5, 1]);
      // Light crates (push through) and a heavy crate (blocks).
      for (let i = 0; i < 5; i++) dynBox([2 + i * 0.7, 0.25, -3], [0.25, 0.25, 0.25], 8);
      dynBox([2, 0.6, -8], [0.6, 0.6, 0.6], 2500);
      // Seesaw plank on a pivot.
      staticBox([-2, 0.25, -14], [0.15, 0.25, 1.2]);
      dynBox([-2, 0.6, -14], [2.5, 0.06, 0.8], 25);
      // Brick wall for CCD rockets and a debris pile.
      for (let iy = 0; iy < 10; iy++) for (let ix = 0; ix < 16; ix++) dynBox([14 + ix * 0.4 - 3, 0.1 + iy * 0.2, 14], [0.2, 0.1, 0.1], 6);
      for (let i = 0; i < 120; i++) dynBox([-12 + (i % 6) * 0.3, 0.15 + Math.floor(i / 36) * 0.3, 4 + (Math.floor(i / 6) % 6) * 0.3], [0.12, 0.12, 0.12], 2);
      // The player and three NPCs.
      S.player = world.addCharacter({ radius: 0.3, half_height: 0.6 }, [0, 1.0, 0]);
      for (let k = 0; k < 3; k++) S.npcs.push({ h: world.addCharacter({ radius: 0.28, half_height: 0.55 }, [-4 + 2 * k, 1.0, -2]), phase: k * 2.1 });
      // Rockets: parked CCD balls.
      S.rockets = [];
      for (let i = 0; i < 8; i++) {
        const body = world.addBody({ p: [-3000 - i * 5, -3000, -3000], invMass: 1 / 4, invI: [250, 250, 250], flags: M.BODY_CCD });
        world.addCollider({ body, shape: 0, material: MAT_PROP, params: [0.12, 0, 0, 0.12] });
        S.rockets.push(body);
      }
    } else {
      // Five 5 cm walls, then three dynamic targets.
      for (let k = 0; k < 5; k++) S.walls.push(staticBox([0, 1.5, 10 + 2 * k + 0.025], [2, 1.5, 0.025]));
      for (let k = 0; k < 3; k++) S.targets.push(dynBox([(k - 1) * 1.2, 0.4, 24], [0.4, 0.4, 0.4], 3));
    }
    const initial = world.snapshot();
    statusEl.textContent = `scene ready · ${world.bodyCount} bodies · ${world.colliderCount} colliders`;

    // ---------------------------------------------------------------- body writes
    const bodyRecord = (body) => new Uint32Array(world.bodyWords.buffer, body * 112, 28).slice();
    function launch(body, p, v, keepCcd = true) {
      const words = bodyRecord(body);
      const f = new Float32Array(words.buffer);
      const ccd = words[11] & M.BODY_CCD;
      f.set(p, 0); f.set([0, 0, 0, 1], 4); words[11] = 1 | 8 | (keepCcd ? ccd : 0);
      f.set(v, 12); f[15] = 0; f.set([0, 0, 0], 16); words[19] = world.steps;
      f.set(p, 20); f.set([0, 0, 0, 1], 24);
      world.backend.writeBody(body, words);
    }
    function park(body, p) {
      const words = bodyRecord(body);
      const f = new Float32Array(words.buffer);
      const ccd = words[11] & M.BODY_CCD;
      f.set(p, 0); f.set([0, 0, 0, 1], 4); words[11] = ccd; f.set([0, 0, 0], 12); f.set([0, 0, 0], 16); f.set(p, 20);
      world.backend.writeBody(body, words);
    }
    function fireVolley() {
      for (const L of S.lanes) {
        L.fired = world.steps;
        L.result = { control: 'flying', ccd: 'flying' };
        L.tally.shots++;
        launch(L.control, [L.x - 1.0, 1.4, 4], [0, 0, shotSpeed]);
        launch(L.ccd, [L.x + 1.0, 1.4, 4], [0, 0, shotSpeed]);
      }
      if (S.shower) {
        for (const side of ['control', 'ccd']) for (const c of S.shower[side]) launch(c.body, [c.x, c.y, c.z], [0, -40, 0]);
        S.shower.fired = world.steps;
      }
      say(`volley at ${shotSpeed} m/s`);
    }

    // ---------------------------------------------------------------- renderer
    const SHADER = /* wgsl */`
struct Body { position: vec3f, invMass: f32, orientation: vec4f, invInertia: vec3f, flags: u32,
  linearVel: vec3f, sleepTimer: f32, angularVel: vec3f, generation: u32, initialPos: vec3f, initialPad: f32, initialRot: vec4f };
struct Collider { body: u32, shape: u32, material: u32, generation: u32, localPos: vec3f, density: f32, localRot: vec4f, params: vec4f };
struct Frame { viewProj: mat4x4f, eye: vec4f, light: vec4f };
@group(0) @binding(0) var<storage, read> bodies: array<Body>;
@group(0) @binding(1) var<uniform> frame: Frame;
@group(0) @binding(2) var<storage, read> cols: array<Collider>;
@group(0) @binding(3) var<storage, read> pool: array<vec4f>;

fn qrot(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}
fn hash(n: u32) -> f32 { var x = n * 747796405u + 2891336453u; x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u; return f32((x >> 22u) ^ x) / 4294967295.0; }
fn shade(c: vec3f, n: vec3f, w: vec3f) -> vec3f {
  let l = normalize(frame.light.xyz);
  let diff = max(dot(n, l), 0.0);
  let v = normalize(frame.eye.xyz - w);
  let spec = pow(max(dot(reflect(-l, n), v), 0.0), 32.0) * 0.25;
  let sky = 0.5 + 0.5 * n.y;
  let fog = clamp(length(frame.eye.xyz - w) / 220.0, 0.0, 1.0);
  return mix(c * (0.22 + 0.18 * sky + 0.75 * diff) + spec, vec3f(0.55, 0.62, 0.72), fog * fog);
}

struct Out { @builtin(position) clip: vec4f, @location(0) n: vec3f, @location(1) c: vec3f, @location(2) w: vec3f,
  @location(3) center: vec3f, @location(4) r: f32, @location(5) axis: vec3f, @location(6) hh: f32 };

@vertex fn vsCol(@location(0) corner: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> Out {
  let ci = inst + 1u;
  let col = cols[ci];
  let b = bodies[col.body];
  var o: Out;
  o.r = 0.0; o.hh = 0.0;
  let hidden = b.position.y < -100.0;
  var half = col.params.xyz;
  if (col.shape == 0u) { half = vec3f(col.params.x); o.r = col.params.x; }
  if (col.shape == 1u) { half = vec3f(col.params.x, col.params.y + col.params.x, col.params.x); o.r = col.params.x; o.hh = col.params.y; }
  let q = b.orientation;
  let lq = col.localRot;
  let local = col.localPos + qrot(lq, corner * half * 2.02);
  let w = b.position + qrot(q, local);
  o.w = w;
  o.center = b.position + qrot(q, col.localPos);
  o.axis = qrot(q, qrot(lq, vec3f(0.0, 1.0, 0.0)));
  o.n = qrot(q, qrot(lq, normal));
  o.clip = select(frame.viewProj * vec4f(w, 1.0), vec4f(0.0, 0.0, 2.0, 1.0), hidden);
  let dyn = b.invMass > 0.0 && (b.flags & 1u) != 0u;
  let kin = (b.flags & 3u) == 2u;
  let ccd = (b.flags & 64u) != 0u;
  if (col.shape == 1u && kin) {
    o.c = vec3f(0.2, 0.75, 0.95);               // characters
  } else if (kin) {
    o.c = vec3f(0.35, 0.45, 0.85);              // kinematic platforms
  } else if (ccd) {
    o.c = vec3f(0.95, 0.25, 0.2);               // CCD bodies
  } else if (!dyn && col.shape == 0u) {
    o.c = vec3f(0.12, 0.12, 0.14);              // parked balls
  } else if (!dyn) {
    o.c = vec3f(0.6, 0.61, 0.65);
  } else if (col.shape == 0u) {
    o.c = vec3f(0.15, 0.16, 0.18);              // control balls (no CCD)
  } else {
    let h = hash(col.body);
    o.c = mix(vec3f(0.85, 0.55, 0.25), vec3f(0.9, 0.78, 0.4), h);
    if ((b.flags & 4u) != 0u) { o.c = o.c * 0.7; }
  }
  return o;
}

fn capsuleHit(ro: vec3f, rd: vec3f, pa: vec3f, pb: vec3f, r: f32) -> f32 {
  let ba = pb - pa; let oa = ro - pa;
  let baba = dot(ba, ba); let bard = dot(ba, rd); let baoa = dot(ba, oa); let rdoa = dot(rd, oa); let oaoa = dot(oa, oa);
  let a = baba - bard * bard; let b = baba * rdoa - baoa * bard; let c = baba * oaoa - baoa * baoa - r * r * baba;
  var h = b * b - a * c;
  if (h >= 0.0 && a > 1e-9) {
    let t = (-b - sqrt(h)) / a;
    let y = baoa + t * bard;
    if (y > 0.0 && y < baba) { return t; }
    let oc = select(ro - pb, oa, y <= 0.0);
    let b2 = dot(rd, oc); let c2 = dot(oc, oc) - r * r;
    h = b2 * b2 - c2;
    if (h > 0.0) { return -b2 - sqrt(h); }
  }
  return -1.0;
}

@fragment fn fsCol(i: Out) -> @location(0) vec4f {
  var n = normalize(i.n);
  if (i.r > 0.0) {
    let rd = normalize(i.w - frame.eye.xyz);
    let pa = i.center - i.axis * i.hh;
    let pb = i.center + i.axis * i.hh;
    let t = capsuleHit(frame.eye.xyz, rd, pa, pb, i.r);
    if (t < 0.0) { discard; }
    let p = frame.eye.xyz + rd * t;
    let s = clamp(dot(p - pa, i.axis), 0.0, 2.0 * i.hh);
    n = normalize(p - (pa + i.axis * s));
  }
  return vec4f(shade(i.c, n, i.w), 1.0);
}

// Projectiles: tracers from the pool records (alive ones only).

      await walk([3, 0, 0], 200);
      const top = S.motion.characters[S.player];
      jumpSeq++;
      await walk([0, 0, 0], 60);
      return { scene, atLane, top: { position: top.position, ground: top.ground }, grounds: ground, events: S.log.slice(0, 12), counters: lastCounters };
    };
    window.__world = world;
    window.__scene = S;
    window.__ready = true;
    requestAnimationFrame(frame);
  </script>
</body>
