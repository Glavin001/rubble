<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Rubble motion — CCD, characters, projectiles (WebGPU AVBD)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; color: #dfe4ee; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: fixed; background: rgba(16, 19, 26, 0.8); border: 1px solid #2c3346; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px); }
    #hud { top: 12px; left: 12px; width: 24rem; max-width: calc(100vw - 48px); }
    #hud h1 { font-size: 15px; margin: 0 0 6px; font-weight: 650; }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
    .muted { color: #8d96aa; }
    select, button { background: #1d2333; color: #dfe4ee; border: 1px solid #3a4360; border-radius: 5px; padding: 3px 8px; font: inherit; cursor: pointer; }
    button:hover { border-color: #6c7aa6; }
    #err { color: #ff8e8e; white-space: pre-wrap; }
    #stats { right: 12px; top: 12px; width: 22rem; font-variant-numeric: tabular-nums; max-height: 70vh; overflow: auto; }
    table { border-collapse: collapse; width: 100%; }
    td, th { padding: 2px 4px; text-align: left; border-bottom: 1px solid #262d40; }
    .ok { color: #7fe08f; } .bad { color: #ff8e8e; } .warn { color: #ffcf6e; }
    kbd { background: #252c3d; border: 1px solid #3a4360; border-radius: 3px; padding: 0 4px; font-size: 11px; }
    #log { margin-top: 6px; max-height: 9rem; overflow: auto; font: 11px ui-monospace, monospace; color: #b5bdd0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" class="panel">
    <h1>Rubble motion · CCD, characters, projectiles</h1>
    <div class="row">
      <label class="muted" for="sceneSel">Scene</label><select id="sceneSel"></select>
      <label class="muted" for="speedSel">Shot</label><select id="speedSel"></select>
      <label class="muted"><input type="checkbox" id="lookahead" checked /> look-ahead</label>
    </div>
    <div class="row muted" id="help"></div>
    <div id="status" class="muted">starting…</div>
    <div id="err"></div>
  </div>
  <div id="stats" class="panel"><div id="statsBody"></div><div id="log"></div></div>
  <script type="importmap">{ "imports": { "rubble-gpu-wait": "./fracture/gpu-wait.mjs" } }</script>
  <script type="module">
    import { createScene, sceneFromQuery, Poses, pollFrame as poll, stepFrames, errorText } from './rubble-world.mjs';

    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const fail = (e) => { errEl.textContent = errorText(e); statusEl.textContent = 'stopped'; window.__failed = String(e); };
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });
    addEventListener('error', (e) => fail(e.error || e.message));

    const qs = new URLSearchParams(location.search);
    const SCENES = {
      ccd: 'Tunnelling gallery: CCD off vs on',
      character: 'Character playground',
      bullets: 'Bullets through walls',
    };
    // The scene (rubble::play::motion, engine-world): its world, solver, bodies and script.
    const sceneDef = await sceneFromQuery('motion', location.search);
    const scene = sceneDef.scene;
    const SPEEDS = [60, 140, 250];
    const shotSpeed = sceneDef.speed;
    const lookAhead = sceneDef.lookAhead;
    const sceneSel = document.getElementById('sceneSel');
    for (const [id, t] of Object.entries(SCENES)) sceneSel.add(new Option(t, id, false, id === scene));
    const speedSel = document.getElementById('speedSel');
    for (const v of SPEEDS) speedSel.add(new Option(`${v} m/s`, v, false, v === shotSpeed));
    document.getElementById('lookahead').checked = lookAhead;
    const go = (k, v) => { const u = new URL(location.href); u.searchParams.set(k, v); location.href = u.href; };
    sceneSel.onchange = () => go('scene', sceneSel.value);
    speedSel.onchange = () => go('speed', speedSel.value);
    document.getElementById('lookahead').onchange = (e) => go('lookahead', e.target.checked ? '1' : '0');
    document.getElementById('help').innerHTML = {
      ccd: '<span><kbd>F</kbd> fire a volley · <kbd>R</kbd> reset · drag to orbit · scroll to zoom</span>',
      character: '<span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Space</kbd> jump · <kbd>F</kbd> bullet · <kbd>B</kbd> CCD rocket · <kbd>R</kbd> reset · drag to look</span>',
      bullets: '<span><kbd>F</kbd> fire · <kbd>R</kbd> reset · drag to orbit</span>',
    }[scene];

    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    // The world opens the device; the page renders on it and reads the world's buffers in place.
    const world = await createScene(sceneDef);
    const device = world.device();
    device.lost.then((i) => fail('device lost: ' + i.message));
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + ((e.error && e.error.message) || e.error)));
    const canvas = document.getElementById('c');
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    const configure = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      context.configure({ device, format, alphaMode: 'opaque' });
    };
    configure();
    addEventListener('resize', configure);

    // ---------------------------------------------------------------- world
    const DT = 1 / 60; // the scene's step (rubble::play::motion), in f64 for the page's clocks
    const placed = world.placeScene(sceneDef);
    // Characters: handle -> { start, jumps sent }.
    const characters = new Map(placed.characters.map((c) => [c.h, { start: c.start, jumps: 0 }]));
    // Input with a jump counter (a new value jumps once), as the HUD keys count jumps.
    const setCharacterInput = (h, v, jumpSeq) => {
      const c = characters.get(h);
      world.characterSetInput(h, v, jumpSeq !== c.jumps);
      c.jumps = jumpSeq;
    };

    // Scene state the HUD and the checks read.
    const S = {
      lanes: placed.lanes.map((L) => ({ ...L, result: { control: '—', ccd: '—' }, tally: { control: 0, ccd: 0, shots: 0 } })),
      shower: placed.shower, player: placed.player ?? -1, npcs: placed.npcs, platform: placed.platform, lift: placed.lift,
      rockets: placed.rockets, walls: placed.walls, targets: placed.targets, log: [],
    };
    const say = (m) => { S.log.unshift(`${world.stepCount()}: ${m}`); S.log.length = Math.min(S.log.length, 40); };
    statusEl.textContent = `scene ready · ${world.bodyCount()} bodies · ${world.colliderCount()} colliders`;

    // ---------------------------------------------------------------- body writes
    // The script (rubble::play::director) fires volleys and bursts on its cadence and the
    // player's actions; the HUD follows what it reports.
    function onEvent(e) {
      if (e.what === 'volley') {
        for (const L of S.lanes) {
          L.fired = e.step;
          L.result = { control: 'flying', ccd: 'flying' };
          L.tally.shots++;
        }
        if (S.shower) S.shower.fired = e.step;
        say(`volley at ${shotSpeed} m/s`);
      } else if (e.what === 'burst') say('3 bullets at 900 m/s (5,000 J/m to cross a wall)');
      else if (e.what === 'bullet') say('bullet at 600 m/s');
      else if (e.what === 'rocket') say('CCD rocket at 150 m/s');
    }
    const takeEvents = () => { for (const e of world.takeEvents()) onEvent(e); };

    // ---------------------------------------------------------------- renderer
    const SHADER = /* wgsl */`
struct Body { position: vec3f, invMass: f32, orientation: vec4f, invInertia: vec3f, flags: u32,
  linearVel: vec3f, sleepTimer: f32, angularVel: vec3f, generation: u32, initialPos: vec3f, initialPad: f32, initialRot: vec4f };
struct Collider { body: u32, shape: u32, material: u32, generation: u32, localPos: vec3f, density: f32, localRot: vec4f, params: vec4f };
struct Frame { viewProj: mat4x4f, eye: vec4f, light: vec4f };
@group(0) @binding(0) var<storage, read> bodies: array<Body>;
@group(0) @binding(1) var<uniform> frame: Frame;
@group(0) @binding(2) var<storage, read> cols: array<Collider>;
@group(0) @binding(3) var<storage, read> pool: array<vec4f>;

fn qrot(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}
fn hash(n: u32) -> f32 { var x = n * 747796405u + 2891336453u; x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u; return f32((x >> 22u) ^ x) / 4294967295.0; }
fn shade(c: vec3f, n: vec3f, w: vec3f) -> vec3f {
  let l = normalize(frame.light.xyz);
  let diff = max(dot(n, l), 0.0);
  let v = normalize(frame.eye.xyz - w);
  let spec = pow(max(dot(reflect(-l, n), v), 0.0), 32.0) * 0.25;
  let sky = 0.5 + 0.5 * n.y;
  let fog = clamp(length(frame.eye.xyz - w) / 220.0, 0.0, 1.0);
  return mix(c * (0.22 + 0.18 * sky + 0.75 * diff) + spec, vec3f(0.55, 0.62, 0.72), fog * fog);
}

struct Out { @builtin(position) clip: vec4f, @location(0) n: vec3f, @location(1) c: vec3f, @location(2) w: vec3f,
  @location(3) center: vec3f, @location(4) r: f32, @location(5) axis: vec3f, @location(6) hh: f32 };

@vertex fn vsCol(@location(0) corner: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> Out {
  let ci = inst + 1u;
  let col = cols[ci];
  let b = bodies[col.body];
  var o: Out;
  o.r = 0.0; o.hh = 0.0;
  let hidden = b.position.y < -100.0;
  var half = col.params.xyz;
  if (col.shape == 0u) { half = vec3f(col.params.x); o.r = col.params.x; }
  if (col.shape == 1u) { half = vec3f(col.params.x, col.params.y + col.params.x, col.params.x); o.r = col.params.x; o.hh = col.params.y; }
  let q = b.orientation;
  let lq = col.localRot;
  let local = col.localPos + qrot(lq, corner * half * 2.02);
  let w = b.position + qrot(q, local);
  o.w = w;
  o.center = b.position + qrot(q, col.localPos);
  o.axis = qrot(q, qrot(lq, vec3f(0.0, 1.0, 0.0)));
  o.n = qrot(q, qrot(lq, normal));
  o.clip = select(frame.viewProj * vec4f(w, 1.0), vec4f(0.0, 0.0, 2.0, 1.0), hidden);
  let dyn = b.invMass > 0.0 && (b.flags & 1u) != 0u;
  let kin = (b.flags & 3u) == 2u;
  let ccd = (b.flags & 64u) != 0u;
  if (col.shape == 1u && kin) {
    o.c = vec3f(0.2, 0.75, 0.95);               // characters
  } else if (kin) {
    o.c = vec3f(0.35, 0.45, 0.85);              // kinematic platforms
  } else if (ccd) {
    o.c = vec3f(0.95, 0.25, 0.2);               // CCD bodies
  } else if (!dyn && col.shape == 0u) {
    o.c = vec3f(0.12, 0.12, 0.14);              // parked balls
  } else if (!dyn) {
    o.c = vec3f(0.6, 0.61, 0.65);
  } else if (col.shape == 0u) {
    o.c = vec3f(0.15, 0.16, 0.18);              // control balls (no CCD)
  } else {
    let h = hash(col.body);
    o.c = mix(vec3f(0.85, 0.55, 0.25), vec3f(0.9, 0.78, 0.4), h);
    if ((b.flags & 4u) != 0u) { o.c = o.c * 0.7; }
  }
  return o;
}

fn capsuleHit(ro: vec3f, rd: vec3f, pa: vec3f, pb: vec3f, r: f32) -> f32 {
  let ba = pb - pa; let oa = ro - pa;
  let baba = dot(ba, ba); let bard = dot(ba, rd); let baoa = dot(ba, oa); let rdoa = dot(rd, oa); let oaoa = dot(oa, oa);
  let a = baba - bard * bard; let b = baba * rdoa - baoa * bard; let c = baba * oaoa - baoa * baoa - r * r * baba;
  var h = b * b - a * c;
  if (h >= 0.0 && a > 1e-9) {
    let t = (-b - sqrt(h)) / a;
    let y = baoa + t * bard;
    if (y > 0.0 && y < baba) { return t; }
    let oc = select(ro - pb, oa, y <= 0.0);
    let b2 = dot(rd, oc); let c2 = dot(oc, oc) - r * r;
    h = b2 * b2 - c2;
    if (h > 0.0) { return -b2 - sqrt(h); }
  }
  return -1.0;
}

@fragment fn fsCol(i: Out) -> @location(0) vec4f {
  var n = normalize(i.n);
  if (i.r > 0.0) {
    let rd = normalize(i.w - frame.eye.xyz);
    let pa = i.center - i.axis * i.hh;
    let pb = i.center + i.axis * i.hh;
    let t = capsuleHit(frame.eye.xyz, rd, pa, pb, i.r);
    if (t < 0.0) { discard; }
    let p = frame.eye.xyz + rd * t;
    let s = clamp(dot(p - pa, i.axis), 0.0, 2.0 * i.hh);
    n = normalize(p - (pa + i.axis * s));
  }
  return vec4f(shade(i.c, n, i.w), 1.0);
}

// Projectiles: tracers from the pool records (alive ones only).
@vertex fn vsShot(@location(0) corner: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> Out {
  let rec = ${world.projectileLayout().projectileBase}u + inst * ${world.projectileLayout().projectileStride}u;
  let p = pool[rec];
  let v = pool[rec + 1u];
  let alive = (bitcast<u32>(pool[rec + 2u].x) & 1u) != 0u;
  var o: Out;
  let dir = normalize(v.xyz + vec3f(0.0, 1e-6, 0.0));
  let len = clamp(length(v.xyz) * 0.004, 0.2, 3.0);
  // A stretched box along the velocity.
  let up = select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(dir.y) > 0.9);
  let x = normalize(cross(up, dir)); let y = cross(dir, x);
  let w = p.xyz + x * corner.x * 0.06 + y * corner.y * 0.06 - dir * (corner.z + 0.5) * len;
  o.w = w; o.n = qrot(vec4f(0.0, 0.0, 0.0, 1.0), normal); o.c = vec3f(1.0, 0.85, 0.3);
  o.center = p.xyz; o.r = 0.0; o.axis = dir; o.hh = 0.0;
  o.clip = select(vec4f(0.0, 0.0, 2.0, 1.0), frame.viewProj * vec4f(w, 1.0), alive);
  return o;
}
@fragment fn fsShot(i: Out) -> @location(0) vec4f { return vec4f(i.c, 1.0); }

@vertex fn vsGround(@location(0) p: vec3f) -> Out {
  var o: Out;
  o.w = p; o.n = vec3f(0.0, 1.0, 0.0); o.c = vec3f(0.3); o.center = p; o.r = 0.0; o.axis = vec3f(0.0); o.hh = 0.0;
  o.clip = frame.viewProj * vec4f(p, 1.0) + vec4f(0.0) * bodies[0].position.x;
  return o;
}
@fragment fn fsGround(i: Out) -> @location(0) vec4f {
  let g = abs(fract(i.w.xz / 2.0) - 0.5);
  let line = smoothstep(0.47, 0.5, max(g.x, g.y));
  let checker = step(0.0, sin(i.w.x * 0.785) * sin(i.w.z * 0.785));
  let base = mix(vec3f(0.26, 0.29, 0.27), vec3f(0.3, 0.33, 0.31), checker);
  return vec4f(shade(mix(base, vec3f(0.45, 0.48, 0.46), line * 0.6), vec3f(0.0, 1.0, 0.0), i.w), 1.0);
}
`;
    const mod = device.createShaderModule({ label: 'motion-render', code: SHADER });
    const info = await mod.getCompilationInfo();
    const err = info.messages.find((m) => m.type === 'error');
    if (err) throw new Error(`render shader: ${err.message} @${err.lineNum}`);

    const cube = [];
    for (const [u, v, w] of [[0, 1, 2], [1, 2, 0], [2, 0, 1]]) for (const s of [-1, 1]) {
      const n = [0, 0, 0]; n[w] = s;
      const cs = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => { const p = [0, 0, 0]; p[u] = a * 0.5; p[v] = b * 0.5; p[w] = s * 0.5; return p; });
      const tris = s > 0 ? [[0, 1, 2], [0, 2, 3]] : [[0, 2, 1], [0, 3, 2]];
      for (const t of tris) for (const k of t) cube.push(...cs[k], ...n);
    }
    const G = 400;
    const groundTri = [[-G, -G], [G, -G], [G, G], [-G, -G], [G, G], [-G, G]].flatMap(([x, z]) => [x, 0.001, z]);
    const vbo = (arr) => { const b = device.createBuffer({ size: arr.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(b, 0, new Float32Array(arr)); return b; };
    const cubeVbo = vbo(cube), groundVbo = vbo(groundTri);
    const frameBuf = device.createBuffer({ size: 96, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const vtx6 = [{ arrayStride: 24, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x3' }] }];
    const depthStencil = { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' };
    const pipe = (vs, fs, buffers, cull = 'back') => device.createRenderPipeline({
      layout: 'auto', vertex: { module: mod, entryPoint: vs, buffers }, fragment: { module: mod, entryPoint: fs, targets: [{ format }] },
      primitive: { cullMode: cull }, depthStencil,
    });
    const colPipe = pipe('vsCol', 'fsCol', vtx6, 'none');
    const shotPipe = pipe('vsShot', 'fsShot', vtx6, 'none');
    const groundPipe = pipe('vsGround', 'fsGround', [{ arrayStride: 12, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }] }], 'none');
    const bind = (p, entries) => device.createBindGroup({ layout: p.getBindGroupLayout(0), entries: entries.map(([b, buf]) => ({ binding: b, resource: { buffer: buf } })) });
    // The world's buffers can be replaced when they grow: rebind when one is a new object.
    let colBind = null, shotBind = null, groundBind = null, bound = [];
    const rebind = () => {
      const bufs = [world.bodyBuffer(), world.colliderBuffer(), world.motionBuffer()];
      if (bufs.every((b, i) => b === bound[i])) return;
      bound = bufs;
      colBind = bind(colPipe, [[0, bufs[0]], [1, frameBuf], [2, bufs[1]]]);
      shotBind = bind(shotPipe, [[1, frameBuf], [3, bufs[2]]]);
      groundBind = bind(groundPipe, [[0, bufs[0]], [1, frameBuf]]);
    };
    let depth = null;

    // ---------------------------------------------------------------- camera / input
    const cam = { yaw: scene === 'ccd' ? 2.75 : scene === 'bullets' ? 2.3 : 0.6, pitch: scene === 'ccd' ? 0.42 : 0.4, dist: scene === 'ccd' ? 30 : scene === 'bullets' ? 18 : 9, target: [0, 1, scene === 'ccd' ? 24 : scene === 'bullets' ? 16 : 0] };
    let drag = null;
    canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
    addEventListener('pointerup', () => { drag = null; });
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      cam.yaw -= (e.clientX - drag.x) * 0.005;
      cam.pitch = Math.max(-0.1, Math.min(1.4, cam.pitch + (e.clientY - drag.y) * 0.005));
      drag = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.max(3, Math.min(160, cam.dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });
    const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const norm3 = (a) => { const l = Math.hypot(...a) || 1; return a.map((x) => x / l); };
    const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const eyeOf = () => {
      const cp = Math.cos(cam.pitch);
      return [cam.target[0] + cam.dist * cp * Math.sin(cam.yaw), cam.target[1] + cam.dist * Math.sin(cam.pitch), cam.target[2] + cam.dist * cp * Math.cos(cam.yaw)];
    };
    function viewProj(eye, at, aspect) {
      const z = norm3(sub3(eye, at)), x = norm3(cross3([0, 1, 0], z)), y = cross3(z, x);
      const view = [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
        -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]), -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]), -(z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2]), 1];
      const f = 1 / Math.tan(Math.PI / 6), near = 0.05, far = 900;
      const proj = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, far / (near - far), -1, 0, 0, (near * far) / (near - far), 0];
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = proj[r] * view[c * 4] + proj[4 + r] * view[c * 4 + 1] + proj[8 + r] * view[c * 4 + 2] + proj[12 + r] * view[c * 4 + 3];
      return o;
    }
    const keys = new Set();
    let jumpSeq = 0;
    addEventListener('keydown', (e) => {
      if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
      keys.add(e.code);
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (e.repeat) return;
      if (e.code === 'KeyR') resetScene();
      else if (e.code === 'KeyF') fire();
      else if (e.code === 'KeyB') rocket();
      else if (e.code === 'Space') jumpSeq++;
    });
    addEventListener('keyup', (e) => keys.delete(e.code));
    addEventListener('blur', () => keys.clear());
    const key = (...c) => c.some((k) => keys.has(k));

    const aim = () => { const eye = eyeOf(); return { eye, dir: norm3(sub3(cam.target, eye)) }; };
    function fire() {
      world.act({ action: 'fire', aim: scene === 'character' ? aim() : undefined });
      takeEvents();
    }
    function rocket() {
      if (scene !== 'character') return;
      world.act({ action: 'cannon', aim: aim() });
      takeEvents();
    }
    function resetScene() {
      // Every body and character back to its start, at rest (parked bodies asleep again).
      world.act({ action: 'reset' });
      takeEvents();
      for (const L of S.lanes) { L.result = { control: '—', ccd: '—' }; L.tally = { control: 0, ccd: 0, shots: 0 }; }
      S.log.length = 0;
      jumpSeq = 0;
    }

    // ---------------------------------------------------------------- per-step logic
    // The player's input; the NPCs, platform and lift are the scene's script.
    function driveScene() {
      if (scene !== 'character') return;
      // Player: WASD relative to the camera.
      const fwd = (key('KeyW', 'ArrowUp') ? 1 : 0) - (key('KeyS', 'ArrowDown') ? 1 : 0);
      const side = (key('KeyD', 'ArrowRight') ? 1 : 0) - (key('KeyA', 'ArrowLeft') ? 1 : 0);
      const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
      const speed = key('ShiftLeft') ? 6 : 3.5;
      let vx = (fx * fwd - fz * side), vz = (fz * fwd + fx * side);
      const l = Math.hypot(vx, vz) || 1;
      if (fwd || side) { vx = (vx / l) * speed; vz = (vz / l) * speed; } else { vx = 0; vz = 0; }
      if (!S.scripted) setCharacterInput(S.player, [vx, 0, vz], jumpSeq);
    }
    // One step if it can be taken without waiting on a readback (its inputs first).
    function tryStep() {
      if (!world.canStep()) return false;
      driveScene();
      return world.step();
    }

    // ---------------------------------------------------------------- frames
    const poses = new Poses(4096);
    let lastCounters = null;
    const bodyState = { get: (id) => ({ p: poses.position(world.bodySlot(id)) }) };
    function onFrame(f) {
      takeEvents();
      if (f.empty) return;
      poses.apply(f);
      const c = f.counters();
      if (c) {
        lastCounters = { contact: c.contacts, candidate: c.candidates, awake: c.awake, overflow: c.overflow };
        if (c.overflow) say(`overflow flags 0x${c.overflow.toString(16)}`);
      }
      const motion = { characters: f.characters(), projectiles: f.projectiles() };
      if (motion.characters.length || motion.projectiles.length || !S.motion) {
        // Characters by handle (the HUD and checks look them up by S.player).
        motion.characters = Object.fromEntries(motion.characters.map((c) => [c.id, c]));
        S.motion = { ...S.motion, ...motion };
      }
      for (const e of f.projectileEvents()) {
        let collider = '?';
        try { collider = world.shapeCollider(e.shape); } catch {}
        say(`projectile ${e.id % 2 ** 32} hit collider ${collider}${e.type === 'stopped' ? ' and stopped' : ` (${e.thickness.toFixed(2)} m through)`}`);
      }
      for (const e of f.characterEvents()) say(`character ${e.id % 2 ** 32} ${e.type}`);
      judge();
    }
    const pollFrame = () => poll(world, onFrame);
    // Lanes: a ball past the wall's far face tunnelled; one stopped short of it held.
    function judge() {
      for (const L of S.lanes) {
        if (L.fired === undefined) continue;
        for (const side of ['control', 'ccd']) {
          const st = bodyState.get(L[side]);
          if (!st || L.result[side] !== 'flying') continue;
          const far = L.wallZ + L.depth;
          const r = 0.15;
          if (st.p[2] - r > far + 0.05) {
            const moved = (L[side + 'Bricks'] || []).some((b) => { const q = bodyState.get(b); return q && q.p[2] > L.wallZ + 0.15; });
            L.result[side] = L.dynamic && moved ? 'smashed through' : 'TUNNELLED';
            if (side === 'ccd' && L.result[side] === 'TUNNELLED') say(`${L.name}: CCD ball tunnelled`);
          }
          else if (world.stepCount() - L.fired > 30 && st.p[2] < far) { L.result[side] = st.p[2] + r <= L.wallZ + 0.03 ? 'stopped at wall' : 'embedded'; }
        }
      }
      if (S.shower && S.shower.fired !== undefined) {
        for (const side of ['control', 'ccd']) S.shower[side + 'Through'] = S.shower[side].filter((c) => (bodyState.get(c.body)?.p[1] ?? 99) < 5.9 && (bodyState.get(c.body)?.p[1] ?? 99) > -100).length;
      }
    }

    // ---------------------------------------------------------------- HUD
    const statsBody = document.getElementById('statsBody');
    const logEl = document.getElementById('log');
    const cls = (r) => r === 'TUNNELLED' ? 'bad' : r === 'flying' || r === '—' ? 'muted' : r === 'embedded' ? 'warn' : 'ok';
    function updateHud() {
      let h = '';
      if (scene === 'ccd') {
        h += `<table><tr><th>wall</th><th>CCD off</th><th>CCD on</th></tr>`;
        for (const L of S.lanes) h += `<tr><td>${L.name}</td><td class="${cls(L.result.control)}">${L.result.control}</td><td class="${cls(L.result.ccd)}">${L.result.ccd}</td></tr>`;
        h += `</table>`;
        if (S.shower?.fired !== undefined) h += `<div class="row">40 m/s debris through the slab: <span class="bad">off ${S.shower.controlThrough ?? 0}/49</span> · <span class="ok">on ${S.shower.ccdThrough ?? 0}/49</span></div>`;
        h += `<div class="muted">0.1 m balls at ${shotSpeed} m/s (${(shotSpeed * DT).toFixed(2)} m per step) · look-ahead ${lookAhead ? 'on' : 'off'}</div>`;
      } else if (S.motion) {
        const c = S.motion.characters[S.player];
        if (c) h += `<div>player: <b class="${c.ground === 'ground' ? 'ok' : c.ground === 'steep' ? 'warn' : ''}">${c.ground}</b> · (${c.position.map((x) => x.toFixed(2)).join(', ')}) · ${Math.hypot(c.velocity[0], c.velocity[2]).toFixed(2)} m/s${c.push[1] < 0 ? ` · ${(-c.push[1]).toFixed(0)} N on body ${c.groundBody}` : ''}</div>`;
        const alive = S.motion.projectiles.filter((p) => p.alive).length;
        h += `<div class="muted">${characters.size} characters · ${alive}/${S.motion.projectiles.length} projectiles in flight</div>`;
      }
      if (lastCounters) h += `<div class="muted">bodies ${world.bodyCount()} · contacts ${lastCounters.contact} · awake ${lastCounters.awake}${lastCounters.overflow ? ` · <span class="bad">overflow 0x${lastCounters.overflow.toString(16)}</span>` : ''}</div>`;
      statsBody.innerHTML = h;
      logEl.textContent = S.log.join('\n');
    }
    function updateCamera(dt) {
      if (scene === 'character' && S.motion?.characters[S.player]) {
        const p = S.motion.characters[S.player].position;
        const k = Math.min(1, dt * 8);
        cam.target = cam.target.map((x, i) => x + ([p[0], p[1] + 0.8, p[2]][i] - x) * k);
      }
      if (!depth || depth.width !== canvas.width || depth.height !== canvas.height) {
        depth?.destroy();
        depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
      }
      const eye = eyeOf();
      frameF.set(viewProj(eye, cam.target, canvas.width / canvas.height), 0);
      frameF.set([...eye, 0], 16);
      frameF.set([0.4, 0.85, 0.3, 0], 20);
      device.queue.writeBuffer(frameBuf, 0, frameF);
    }
    function drawScene(enc) {
      rebind();
      const rp = enc.beginRenderPass({
        colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.55, 0.62, 0.72, 1], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      rp.setPipeline(groundPipe); rp.setBindGroup(0, groundBind); rp.setVertexBuffer(0, groundVbo); rp.draw(6);
      rp.setPipeline(colPipe); rp.setBindGroup(0, colBind); rp.setVertexBuffer(0, cubeVbo); rp.draw(36, world.colliderCount() - 1);
      const shots = world.projectileLayout().projectileSlots;
      if (shots) { rp.setPipeline(shotPipe); rp.setBindGroup(0, shotBind); rp.setVertexBuffer(0, cubeVbo); rp.draw(36, shots); }
      rp.end();
    }

    // ---------------------------------------------------------------- loop
    let lastT = performance.now();
    let fpsAcc = 0, fpsN = 0, fpsShow = 0;
    const frameF = new Float32Array(24);
    let manual = false;
    function frame(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      fpsAcc += dt; fpsN++;
      if (fpsAcc > 0.5) { fpsShow = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
      if (manual) { updateCamera(dt); const e = device.createCommandEncoder(); drawScene(e); device.queue.submit([e.finish()]); requestAnimationFrame(frame); return; }
      tryStep();
      pollFrame();
      updateHud();
      updateCamera(dt);
      const enc = device.createCommandEncoder();
      drawScene(enc);
      device.queue.submit([enc.finish()]);
      statusEl.textContent = `step ${world.stepCount()} · ${fpsShow.toFixed(0)} fps`;
      requestAnimationFrame(frame);
    }

    // ---------------------------------------------------------------- automation
    // __step(n): n physics steps without rendering; returns counters and tracked bodies.
    window.__step = async (n = 1) => {
      manual = true;
      await stepFrames(world, n, onFrame, driveScene);
      updateHud();
      updateCamera(0);
      const e3 = device.createCommandEncoder();
      drawScene(e3);
      device.queue.submit([e3.finish()]);
      return { steps: world.stepCount(), counters: lastCounters };
    };
    // __check(): the scene's end-to-end script, run frame-locked; returns metrics.
    window.__check = async () => {
      manual = true;
      world.setAutofire(false);
      if (scene === 'ccd') {
        await window.__step(5);
        fire();
        await window.__step(90);
        const lanes = S.lanes.map((L) => {
          const st = (side) => bodyState.get(L[side]);
          return { name: L.name, control: L.result.control, ccd: L.result.ccd, controlZ: st('control').p[2], ccdZ: st('ccd').p[2] };
        });
        return { scene, speed: shotSpeed, lookAhead, lanes, showerThrough: { control: S.shower.controlThrough, ccd: S.shower.ccdThrough }, counters: lastCounters };
      }
      if (scene === 'bullets') {
        await window.__step(5);
        fire();
        await window.__step(10);
        const hits = S.log.filter((l) => l.includes('hit collider'));
        const st = await world.readBodies(S.targets.map((t) => world.bodySlot(t)));
        const targets = S.targets.map((t, k) => ({ p: Array.from(st.subarray(k * 14, k * 14 + 3)), v: Array.from(st.subarray(k * 14 + 7, k * 14 + 10)) }));
        return { scene, projectiles: S.motion.projectiles, hitLines: hits, targets };
      }
      // Character: walk to the stairs and up them, jump on top, ride the platform.
      S.scripted = true;
      const ground = [];
      const walk = async (v, n) => { setCharacterInput(S.player, v, jumpSeq); for (let i = 0; i < n; i += 4) { await window.__step(4); ground.push(S.motion.characters[S.player].ground); } };
      await walk([0, 0, 0], 30);
      // From (0, 0) to the stairs' lane (z = 6), then up the stairs along +x.
      await walk([0, 0, 3], 120);
      const atLane = S.motion.characters[S.player].position.slice();
      await walk([3, 0, 0], 200);
      const top = S.motion.characters[S.player];
      jumpSeq++;
      await walk([0, 0, 0], 60);
      return { scene, atLane, top: { position: top.position, ground: top.ground }, grounds: ground, events: S.log.slice(0, 12), counters: lastCounters };
    };
    window.__world = world;
    window.__scene = S;
    window.__ready = true;
    requestAnimationFrame(frame);
  </script>
</body>
</html>
