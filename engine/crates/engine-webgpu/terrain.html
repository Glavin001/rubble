<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rubble terrain — heightfield collider</title>
  <!-- The terrain demo is the playground's `terrain` preset (play.html, play-terrain.mjs):
       this URL redirects there, its switches (?n=) kept. -->
  <script>
    const q = new URLSearchParams(location.search);
    q.set('preset', 'terrain');
    location.replace(`play.html?${q}`);
  </script>
</head>
<body><a href="play.html?preset=terrain">Rubble terrain</a></body>
</html>
