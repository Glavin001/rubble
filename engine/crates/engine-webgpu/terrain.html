<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Rubble terrain — heightfield collider (WebGPU AVBD)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; color: #dfe4ee; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .panel { position: fixed; background: rgba(16, 19, 26, 0.8); border: 1px solid #2c3346; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px); }
    #hud { top: 12px; left: 12px; width: 25rem; max-width: calc(100vw - 48px); }
    #hud h1 { font-size: 15px; margin: 0 0 6px; font-weight: 650; }
    .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
    .muted { color: #8d96aa; }
    select, button { background: #1d2333; color: #dfe4ee; border: 1px solid #3a4360; border-radius: 5px; padding: 3px 8px; font: inherit; cursor: pointer; }
    button:hover { border-color: #6c7aa6; }
    #err { color: #ff8e8e; white-space: pre-wrap; }
    kbd { background: #252c3d; border: 1px solid #3a4360; border-radius: 3px; padding: 0 4px; font-size: 11px; }
    .bad { color: #ff8e8e; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" class="panel">
    <h1>Rubble terrain · heightfield collider</h1>
    <div class="row">
      <label class="muted" for="countSel">Bodies</label><select id="countSel"></select>
      <button id="rainBtn">Rain <kbd>B</kbd></button>
      <button id="craterBtn">Crater <kbd>C</kbd></button>
      <button id="resetBtn">Reset <kbd>R</kbd></button>
    </div>
    <div class="row muted">Drag to orbit · scroll to zoom. The crater is an authored height edit plus a blast impulse (T1); computed cratering comes with the granular solver (T2).</div>
    <div id="stats" class="muted"></div>
    <div id="status" class="muted">starting…</div>
    <div id="err"></div>
  </div>
  <script type="importmap">{ "imports": { "rubble-gpu-wait": "./fracture/gpu-wait.mjs" } }</script>
  <script type="module">
    import { createScene, sceneFromQuery, Poses, pollFrame, stepFrames, errorText } from './rubble-world.mjs';

    const statusEl = document.getElementById('status');
    const errEl = document.getElementById('err');
    const fail = (e) => { errEl.textContent = errorText(e); statusEl.textContent = 'stopped'; window.__failed = String(e); };
    addEventListener('unhandledrejection', (e) => { fail(e.reason); e.preventDefault(); });
    addEventListener('error', (e) => fail(e.error || e.message));

    const qs = new URLSearchParams(location.search);
    const COUNTS = [500, 2000, 5000, 10000];
    const N = COUNTS.includes(Number(qs.get('n'))) ? Number(qs.get('n')) : 2000;
    const countSel = document.getElementById('countSel');
    for (const n of COUNTS) countSel.add(new Option(n.toLocaleString(), n, false, n === N));
    countSel.onchange = () => { const u = new URL(location.href); u.searchParams.set('n', countSel.value); location.href = u.href; };

    if (!navigator.gpu) throw new Error('WebGPU is not available in this browser');
    // The world opens the device; the page renders on it and reads the world's buffers in place.
    // The scene (rubble::play::hills, engine-world): its world, solver, heightfield and bodies.
    const sceneDef = await sceneFromQuery('terrain', location.search);
    const world = await createScene(sceneDef);
    const device = world.device();
    device.lost.then((i) => fail('device lost: ' + i.message));
    device.addEventListener('uncapturederror', (e) => fail('gpu: ' + ((e.error && e.error.message) || e.error)));
    const canvas = document.getElementById('c');
    const context = canvas.getContext('webgpu');
    const format = navigator.gpu.getPreferredCanvasFormat();
    const configure = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      context.configure({ device, format, alphaMode: 'opaque' });
    };
    configure();
    addEventListener('resize', configure);

    // ---------------------------------------------------------------- world
    const placed = world.placeScene(sceneDef);
    // The terrain: a static heightfield (collider 0), 161 × 161 samples, 0.25 m cells: 40 m
    // square of rolling hills and a ridge.
    const terrain = placed.terrain;
    const NX = placed.nx, NZ = placed.nz, DX = placed.dx, DZ = placed.dz;
    const X0 = -0.5 * (NX - 1) * DX, Z0 = -0.5 * (NZ - 1) * DZ;
    // Bodies: boxes, spheres and capsules on a jittered grid above the hills ({ id, slot, p, q }).
    const bodies = placed.bodies;
    // Every body's pose as the last polled frame left it.
    const poses = new Poses(N + 8);
    for (const b of bodies) poses.pose.set([...b.p, ...b.q], b.slot * 7);
    let lastCounters = null;
    const onFrame = (f) => {
      poses.apply(f);
      const c = f.counters();
      if (c) lastCounters = { contact: c.contacts, awake: c.awake, overflow: c.overflow };
    };
    const surfaceAt = (x, z) => { const h = world.heightFieldSurface(terrain, x, z); return Number.isNaN(h) ? null : h; };

    // ---------------------------------------------------------------- renderer
    const SHADER = /* wgsl */`
struct Body { position: vec3f, invMass: f32, orientation: vec4f, invInertia: vec3f, flags: u32,
  linearVel: vec3f, sleepTimer: f32, angularVel: vec3f, generation: u32, initialPos: vec3f, initialPad: f32, initialRot: vec4f };
struct Collider { body: u32, shape: u32, material: u32, generation: u32, localPos: vec3f, density: f32, localRot: vec4f, params: vec4f };
struct Frame { viewProj: mat4x4f, eye: vec4f, light: vec4f };
@group(0) @binding(0) var<storage, read> bodies: array<Body>;
@group(0) @binding(1) var<uniform> frame: Frame;
@group(0) @binding(2) var<storage, read> cols: array<Collider>;
@group(0) @binding(3) var<storage, read> hulls: array<vec4u>;

fn qrot(q: vec4f, v: vec3f) -> vec3f {
  let u = q.xyz;
  return u * (2.0 * dot(u, v)) + v * (q.w * q.w - dot(u, u)) + cross(u, v) * (2.0 * q.w);
}
fn hash(n: u32) -> f32 { var x = n * 747796405u + 2891336453u; x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u; return f32((x >> 22u) ^ x) / 4294967295.0; }
fn shade(c: vec3f, n: vec3f, w: vec3f) -> vec3f {
  let l = normalize(frame.light.xyz);
  let diff = max(dot(n, l), 0.0);
  let v = normalize(frame.eye.xyz - w);
  let spec = pow(max(dot(reflect(-l, n), v), 0.0), 32.0) * 0.2;
  let sky = 0.5 + 0.5 * n.y;
  let fog = clamp(length(frame.eye.xyz - w) / 160.0, 0.0, 1.0);
  return mix(c * (0.22 + 0.18 * sky + 0.75 * diff) + spec, vec3f(0.55, 0.62, 0.72), fog * fog);
}

struct Out { @builtin(position) clip: vec4f, @location(0) n: vec3f, @location(1) c: vec3f, @location(2) w: vec3f,
  @location(3) center: vec3f, @location(4) r: f32, @location(5) axis: vec3f, @location(6) hh: f32 };

@vertex fn vsCol(@location(0) corner: vec3f, @location(1) normal: vec3f, @builtin(instance_index) inst: u32) -> Out {
  let ci = inst + 1u;
  let col = cols[ci];
  let b = bodies[col.body];
  var o: Out;
  o.r = 0.0; o.hh = 0.0;
  var half = col.params.xyz;
  if (col.shape == 0u) { half = vec3f(col.params.x); o.r = col.params.x; }
  if (col.shape == 1u) { half = vec3f(col.params.x, col.params.y + col.params.x, col.params.x); o.r = col.params.x; o.hh = col.params.y; }
  let q = b.orientation;
  let local = col.localPos + qrot(col.localRot, corner * half * 2.02);
  let w = b.position + qrot(q, local);
  o.w = w;
  o.center = b.position + qrot(q, col.localPos);
  o.axis = qrot(q, qrot(col.localRot, vec3f(0.0, 1.0, 0.0)));
  o.n = qrot(q, qrot(col.localRot, normal));
  o.clip = frame.viewProj * vec4f(w, 1.0);
  let h = hash(col.body);
  let asleep = (b.flags & 8u) == 0u;
  if (col.shape == 0u) { o.c = mix(vec3f(0.25, 0.45, 0.8), vec3f(0.35, 0.6, 0.9), h); }
  else if (col.shape == 1u) { o.c = mix(vec3f(0.75, 0.3, 0.3), vec3f(0.9, 0.45, 0.35), h); }
  else { o.c = mix(vec3f(0.85, 0.6, 0.25), vec3f(0.95, 0.8, 0.45), h); }
  if (asleep) { o.c = o.c * 0.65; }
  return o;
}

fn capsuleHit(ro: vec3f, rd: vec3f, pa: vec3f, pb: vec3f, r: f32) -> f32 {
  let ba = pb - pa; let oa = ro - pa;
  let baba = dot(ba, ba); let bard = dot(ba, rd); let baoa = dot(ba, oa); let rdoa = dot(rd, oa); let oaoa = dot(oa, oa);
  let a = baba - bard * bard; let b = baba * rdoa - baoa * bard; let c = baba * oaoa - baoa * baoa - r * r * baba;
  var hh = b * b - a * c;
  if (hh >= 0.0 && a > 1e-9) {
    let t = (-b - sqrt(hh)) / a;
    let y = baoa + t * bard;
    if (y > 0.0 && y < baba) { return t; }
    let oc = select(ro - pb, oa, y <= 0.0);
    let b2 = dot(rd, oc); let c2 = dot(oc, oc) - r * r;
    hh = b2 * b2 - c2;
    if (hh > 0.0) { return -b2 - sqrt(hh); }
  } else if (a <= 1e-9) {
    let b2 = dot(rd, oa); let c2 = oaoa - r * r; let h2 = b2 * b2 - c2;
    if (h2 > 0.0) { return -b2 - sqrt(h2); }
  }
  return -1.0;
}

@fragment fn fsCol(i: Out) -> @location(0) vec4f {
  var n = normalize(i.n);
  if (i.r > 0.0) {
    let rd = normalize(i.w - frame.eye.xyz);
    let pa = i.center - i.axis * i.hh;
    let pb = i.center + i.axis * i.hh;
    let t = capsuleHit(frame.eye.xyz, rd, pa, pb, i.r);
    if (t < 0.0) { discard; }
    let p = frame.eye.xyz + rd * t;
    let s = clamp(dot(p - pa, i.axis), 0.0, 2.0 * i.hh);
    n = normalize(p - (pa + i.axis * s));
  }
  return vec4f(shade(i.c, n, i.w), 1.0);
}

// The terrain straight from the physics records (engine_schema::heightfield):
// header (magic, nx, nz, flags), (dx, dz, min, max), then heights, four per record.
const HF_BASE = ${world.shapeArenaBase(terrain)}u;
fn hfH(i: u32, j: u32, nx: u32) -> f32 {
  let k = j * nx + i;
  let r = hulls[HF_BASE + 2u + (k >> 2u)];
  return bitcast<f32>(r[k & 3u]);
}
@vertex fn vsTerrain(@builtin(vertex_index) vi: u32) -> Out {
  let head = hulls[HF_BASE];
  let nx = head.y; let nz = head.z;
  let d = bitcast<vec4f>(hulls[HF_BASE + 1u]);
  let cell = vi / 6u;
  let ci = cell % (nx - 1u); let cj = cell / (nx - 1u);
  // Triangles (00, 11, 10) and (00, 01, 11): the collider's diagonal split.
  let corner = array<vec2u, 6>(vec2u(0u, 0u), vec2u(1u, 1u), vec2u(1u, 0u), vec2u(0u, 0u), vec2u(0u, 1u), vec2u(1u, 1u))[vi % 6u];
  let i = ci + corner.x; let j = cj + corner.y;
  let x0 = -0.5 * f32(nx - 1u) * d.x; let z0 = -0.5 * f32(nz - 1u) * d.y;
  let h = hfH(i, j, nx);
  let hx0 = hfH(max(i, 1u) - 1u, j, nx); let hx1 = hfH(min(i + 1u, nx - 1u), j, nx);
  let hz0 = hfH(i, max(j, 1u) - 1u, nx); let hz1 = hfH(i, min(j + 1u, nz - 1u), nx);
  var o: Out;
  o.w = vec3f(x0 + f32(i) * d.x, h, z0 + f32(j) * d.y);
  o.n = normalize(vec3f(-(hx1 - hx0) / (2.0 * d.x), 1.0, -(hz1 - hz0) / (2.0 * d.y)));
  o.c = vec3f(0.0); o.center = o.w; o.r = 0.0; o.axis = vec3f(0.0); o.hh = 0.0;
  o.clip = frame.viewProj * vec4f(o.w, 1.0);
  return o;
}
@fragment fn fsTerrain(i: Out) -> @location(0) vec4f {
  let n = normalize(i.n);
  let g = abs(fract(i.w.xz) - 0.5);
  let line = smoothstep(0.47, 0.5, max(g.x, g.y));
  let slope = 1.0 - n.y;
  let grass = mix(vec3f(0.33, 0.42, 0.25), vec3f(0.42, 0.37, 0.27), clamp(slope * 4.0, 0.0, 1.0));
  let low = clamp(-i.w.y * 0.4, 0.0, 1.0);
  let base = mix(grass, vec3f(0.38, 0.3, 0.22), low);
  return vec4f(shade(mix(base, base * 1.25, line * 0.4), n, i.w), 1.0);
}
`;
    const mod = device.createShaderModule({ label: 'terrain-render', code: SHADER });
    const info = await mod.getCompilationInfo();
    const err = info.messages.find((m) => m.type === 'error');
    if (err) throw new Error(`render shader: ${err.message} @${err.lineNum}`);

    const cube = [];
    for (const [u, v, w] of [[0, 1, 2], [1, 2, 0], [2, 0, 1]]) for (const s of [-1, 1]) {
      const n = [0, 0, 0]; n[w] = s;
      const cs = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => { const p = [0, 0, 0]; p[u] = a * 0.5; p[v] = b * 0.5; p[w] = s * 0.5; return p; });
      const tris = s > 0 ? [[0, 1, 2], [0, 2, 3]] : [[0, 2, 1], [0, 3, 2]];
      for (const t of tris) for (const k of t) cube.push(...cs[k], ...n);
    }
    const cubeVbo = device.createBuffer({ size: cube.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(cubeVbo, 0, new Float32Array(cube));
    const frameBuf = device.createBuffer({ size: 96, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    const vtx6 = [{ arrayStride: 24, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x3' }] }];
    const depthStencil = { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' };
    const pipe = (vs, fs, buffers) => device.createRenderPipeline({
      layout: 'auto', vertex: { module: mod, entryPoint: vs, buffers }, fragment: { module: mod, entryPoint: fs, targets: [{ format }] },
      primitive: { cullMode: 'none' }, depthStencil,
    });
    const colPipe = pipe('vsCol', 'fsCol', vtx6);
    const terrainPipe = pipe('vsTerrain', 'fsTerrain', []);
    const bind = (p, entries) => device.createBindGroup({ layout: p.getBindGroupLayout(0), entries: entries.map(([b, buf]) => ({ binding: b, resource: { buffer: buf } })) });
    // The world's buffers can be replaced when they grow: rebind when one is a new object.
    let colBind = null, terrainBind = null, bound = [];
    const rebind = () => {
      const bufs = [world.bodyBuffer(), world.colliderBuffer(), world.hullArenaBuffer()];
      if (bufs.every((b, i) => b === bound[i])) return;
      bound = bufs;
      colBind = bind(colPipe, [[0, bufs[0]], [1, frameBuf], [2, bufs[1]]]);
      terrainBind = bind(terrainPipe, [[1, frameBuf], [3, bufs[2]]]);
    };
    let depth = null;

    // ---------------------------------------------------------------- camera / input
    const cam = { yaw: 0.7, pitch: 0.45, dist: 42, target: [0, 0, 0] };
    let drag = null;
    canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
    addEventListener('pointerup', () => { drag = null; });
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      cam.yaw -= (e.clientX - drag.x) * 0.005;
      cam.pitch = Math.max(0.05, Math.min(1.4, cam.pitch + (e.clientY - drag.y) * 0.005));
      drag = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.max(4, Math.min(120, cam.dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });
    const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const norm3 = (a) => { const l = Math.hypot(...a) || 1; return a.map((x) => x / l); };
    const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const eyeOf = () => {
      const cp = Math.cos(cam.pitch);
      return [cam.target[0] + cam.dist * cp * Math.sin(cam.yaw), cam.target[1] + cam.dist * Math.sin(cam.pitch), cam.target[2] + cam.dist * cp * Math.cos(cam.yaw)];
    };
    function viewProj(eye, at, aspect) {
      const z = norm3(sub3(eye, at)), x = norm3(cross3([0, 1, 0], z)), y = cross3(z, x);
      const view = [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
        -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]), -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]), -(z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2]), 1];
      const f = 1 / Math.tan(Math.PI / 6), near = 0.05, far = 600;
      const proj = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, far / (near - far), -1, 0, 0, (near * far) / (near - far), 0];
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = proj[r] * view[c * 4] + proj[4 + r] * view[c * 4 + 1] + proj[8 + r] * view[c * 4 + 2] + proj[12 + r] * view[c * 4 + 3];
      return o;
    }
    addEventListener('keydown', (e) => {
      if (e.target.tagName === 'SELECT' || e.repeat) return;
      if (e.code === 'KeyR') reset();
      else if (e.code === 'KeyC') crater();
      else if (e.code === 'KeyB') rain();
    });
    document.getElementById('resetBtn').onclick = () => reset();
    document.getElementById('craterBtn').onclick = () => crater();
    document.getElementById('rainBtn').onclick = () => rain();

    // ---------------------------------------------------------------- edits
    // Craters, rain and reset are the scene's actions (rubble::play::director): random
    // spots continue placement's sequence; the blast and the lift read the last polled poses.
    let craters = 0;
    const act = (a) => { world.act(a); for (const e of world.takeEvents()) { if (e.what === 'crater') craters++; else if (e.what === 'reset') craters = 0; } };
    const crater = (at) => act({ action: 'crater', at });
    const rain = () => act({ action: 'rain' });
    const reset = () => act({ action: 'reset' });

    // ---------------------------------------------------------------- loop
    function updateCamera() {
      if (!depth || depth.width !== canvas.width || depth.height !== canvas.height) {
        depth?.destroy();
        depth = device.createTexture({ size: [canvas.width, canvas.height], format: 'depth24plus', usage: GPUTextureUsage.RENDER_ATTACHMENT });
      }
      const eye = eyeOf();
      frameF.set(viewProj(eye, cam.target, canvas.width / canvas.height), 0);
      frameF.set([...eye, 0], 16);
      frameF.set([0.45, 0.8, 0.35, 0], 20);
      device.queue.writeBuffer(frameBuf, 0, frameF);
    }
    function drawScene(enc) {
      rebind();
      const rp = enc.beginRenderPass({
        colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: [0.55, 0.62, 0.72, 1], loadOp: 'clear', storeOp: 'store' }],
        depthStencilAttachment: { view: depth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' },
      });
      rp.setPipeline(terrainPipe); rp.setBindGroup(0, terrainBind); rp.draw((NX - 1) * (NZ - 1) * 6);
      rp.setPipeline(colPipe); rp.setBindGroup(0, colBind); rp.setVertexBuffer(0, cubeVbo); rp.draw(36, world.colliderCount() - 1);
      rp.end();
    }
    function draw() {
      updateCamera();
      const enc = device.createCommandEncoder();
      drawScene(enc);
      device.queue.submit([enc.finish()]);
    }
    const frameF = new Float32Array(24);
    let manual = false;
    let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fpsShow = 0, physMs = 0;
    const statsEl = document.getElementById('stats');
    function frame(now) {
      const dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      fpsAcc += dt; fpsN++;
      if (fpsAcc > 0.5) { fpsShow = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
      if (manual) { requestAnimationFrame(frame); return; }
      const t0 = performance.now();
      world.step();
      pollFrame(world, onFrame);
      physMs = performance.now() - t0;
      draw();
      const c = lastCounters;
      statsEl.innerHTML = `${bodies.length} bodies · ${craters} craters` + (c ? ` · contacts ${c.contact} · awake ${c.awake}${c.overflow ? ` · <span class="bad">overflow 0x${c.overflow.toString(16)}</span>` : ''}` : '');
      statusEl.textContent = `step ${world.stepCount()} · ${fpsShow.toFixed(0)} fps · host ${physMs.toFixed(1)} ms`;
      requestAnimationFrame(frame);
    }

    // ---------------------------------------------------------------- automation
    // __step(n): n physics steps, frame-locked; then counters and every pose.
    window.__step = async (n = 1) => {
      manual = true;
      await stepFrames(world, n, onFrame);
      draw();
      return { steps: world.stepCount(), counters: lastCounters };
    };
    // __check(): settle, dig a crater under the pile, settle again; every body
    // must stay on or above the terrain (centre above the surface under it).
    window.__check = async () => {
      // Off the field: rolled or tumbled past its edge (there is no ground beyond).
      // Near the edge a body falling past it is not under the terrain either.
      const margin = 1.0;
      const below = () => {
        let n = 0, off = 0, deepest = 0;
        const cases = [];
        for (const b of bodies) {
          const [x, y, z] = poses.position(b.slot);
          const h = Math.abs(x) < -X0 - margin && Math.abs(z) < -Z0 - margin ? surfaceAt(x, z) : null;
          if (h === null) { off++; continue; }
          const d = h - y;
          if (d > 0) {
            n++; deepest = Math.max(deepest, d);
            if (cases.length < 6) cases.push({ slot: b.slot, p: [x, y, z].map((v) => +v.toFixed(2)), surface: +h.toFixed(2) });
          }
        }
        return { below: n, off, deepest, cases };
      };
      await window.__step(300);
      const settled = { ...below(), counters: lastCounters };
      crater([0, 0]);
      await window.__step(240);
      const afterCrater = { ...below(), counters: lastCounters };
      return { bodies: bodies.length, settled, afterCrater };
    };
    window.__world = world;
    window.__ready = true;
    requestAnimationFrame(frame);
  </script>
</body>
