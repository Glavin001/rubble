[workspace]
resolver = "2"
members = [
    "crates/engine-schema",
    "crates/engine-exec",
    "crates/engine-metal",
    "crates/engine-webgpu",
    "crates/engine-cuda",
    "crates/engine-viewer",
    "crates/engine-fracture",
    "crates/engine-slang-build",
    "crates/engine-scenes",
    "crates/engine-oracles",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
metal = "0.31"
objc = "0.2"
cocoa = "0.26"
core-graphics-types = "0.1"
wgpu = "24"
pollster = "0.4"
winit = "0.30"
env_logger = "0.11"
log = "0.4"
engine-schema = { path = "crates/engine-schema" }
engine-exec = { path = "crates/engine-exec" }
engine-slang-build = { path = "crates/engine-slang-build" }
engine-metal = { path = "crates/engine-metal" }
engine-scenes = { path = "crates/engine-scenes" }
engine-oracles = { path = "crates/engine-oracles" }
engine-fracture = { path = "crates/engine-fracture" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
