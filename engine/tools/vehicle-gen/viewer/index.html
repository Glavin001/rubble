<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubble vehicle models</title>
<link rel="icon" href="data:,">
<!-- Viewer for the vehicles generated by engine/tools/vehicle-gen: the .glb
     deliveries listed in engine/scenes/vehicles/index.json (written by
     build.py). Render only (three.js); the models are the files the
     soft-body builder will read.
     Local: python3 -m http.server 8813 --directory engine, then
     http://localhost:8813/tools/vehicle-gen/viewer/ . The web build copies it
     to /models/ with the models beside it. ?car=<name> opens one model. -->
<style>
 :root {
  --bg: #15181d; --panel: rgba(22, 26, 33, 0.86); --line: #2c3340; --fg: #e7eaef;
  --muted: #9aa3b2; --accent: #5aa9ff; --warn: #f0b04a;
 }
 * { box-sizing: border-box; }
 html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
   font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
 #app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
 #list { overflow-y: auto; border-right: 1px solid var(--line); padding: 12px; background: #11141a; }
 #list h1 { font-size: 15px; margin: 2px 2px 2px; }
 #list .sub { color: var(--muted); margin: 0 2px 12px; font-size: 12px; }
 .car { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #191d25;
   color: inherit; border-radius: 8px; padding: 6px; margin-bottom: 8px; cursor: pointer; font: inherit; }
 .car:hover { border-color: #46526a; }
 .car.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
 .car img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 5px; display: block; background: #0d1015; }
 .car b { display: block; margin: 6px 2px 0; font-size: 13px; }
 .car span { display: block; margin: 0 2px; color: var(--muted); font-size: 12px; }
 #stage { position: relative; min-width: 0; }
 canvas { display: block; width: 100%; height: 100%; touch-action: none; }
 #info { position: absolute; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--line);
   border-radius: 8px; padding: 8px 12px; max-width: min(28rem, calc(100% - 24px)); }
 #info b { font-size: 15px; }
 #info .muted, .muted { color: var(--muted); }
 #info a { color: var(--accent); text-decoration: none; }
 #stats { font-variant-numeric: tabular-nums; margin-top: 2px; }
 #panel { position: absolute; right: 12px; top: 12px; bottom: 52px; width: 270px; background: var(--panel);
   border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; }
 #panel .ctl { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
 #panel label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
 #panel input[type=range] { flex: 1; }
 #panel .row { display: flex; align-items: center; gap: 8px; }
 #panel button { background: #232936; color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
   padding: 3px 8px; font: inherit; cursor: pointer; }
 #panel button:hover { border-color: #46526a; }
 #parts { overflow-y: auto; padding: 6px 4px 10px; flex: 1; }
 #panel.closed { display: none; }
 #panelBtn { position: absolute; right: 12px; bottom: 12px; background: var(--panel); color: var(--fg);
   border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; z-index: 2; }
 #parts h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
   margin: 10px 8px 4px; display: flex; justify-content: space-between; }
 .part { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 5px; cursor: pointer; }
 .part:hover, .part.hover { background: #263043; }
 .part.solo { background: #1f3552; }
 .part .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 .part .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; }
 #tip { position: absolute; pointer-events: none; background: rgba(0,0,0,.78); padding: 3px 7px; border-radius: 4px;
   font-size: 12px; white-space: nowrap; display: none; }
 #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); }
 #err { color: #ff8e8e; white-space: pre-wrap; }
 @media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  #app { grid-template-rows: minmax(0, 1fr) 128px; }
  #list { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); display: flex; gap: 8px;
    overflow-x: auto; overflow-y: hidden; padding: 8px; height: 128px; }
  .car img { aspect-ratio: auto; height: 62px; }
  .car span { display: none; }
  #list h1, #list .sub { display: none; }
  .car { flex: 0 0 150px; margin: 0; }
  #panel { top: auto; bottom: 52px; height: 40%; left: 12px; right: 12px; width: auto; }
  #info { max-width: calc(100% - 24px); }
 }
</style>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
 <nav id="list"><h1>Vehicle models</h1><p class="sub">Generated by engine/tools/vehicle-gen to the vehicle art spec: part-based, metres, +Y up, front +Z.</p></nav>
 <main id="stage">
  <canvas id="c"></canvas>
  <div id="info"><b id="title">loading…</b><div id="meta" class="muted"></div><div id="stats" class="muted"></div><div id="err"></div></div>
  <div id="panel">
   <div class="ctl">
    <label><input type="checkbox" id="spin" checked> Turntable</label>
    <label><input type="checkbox" id="wire"> Wireframe</label>
    <label><input type="checkbox" id="marks"> Markers (wheel centres, hinges, latches, mounts)</label>
    <label><input type="checkbox" id="glass" checked> Glass</label>
    <div class="row">Explode <input type="range" id="explode" min="0" max="1" step="0.01" value="0"></div>
    <div class="row">Paint <input type="color" id="paint"> <button id="paintReset">Reset</button></div>
    <div class="row"><button id="showAll">Show all parts</button> <span class="muted" id="partCount"></span></div>
   </div>
   <div id="parts"></div>
  </div>
  <button id="panelBtn">Hide panel</button>
  <div id="tip"></div>
  <div id="status"></div>
 </main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const REPO = 'https://github.com/Glavin001/rubble/blob/main/';
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f26);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 25 });
sun.shadow.bias = -0.0004;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x2a2f38, roughness: 0.9 }));
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(12, 24, 0x3a4252, 0x2f3542);
grid.position.y = 0.001;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 200);
camera.position.set(5.6, 2.1, 6.4);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 1.5;
controls.maxDistance = 25;

// the parts panel covers the right of the canvas on a wide screen and the
// bottom on a narrow one: centre the view in what is left
let free = { w: 1, h: 1 };
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  const pan = $('panel');
  const open_ = !pan.classList.contains('closed');
  const narrow = matchMedia('(max-width: 820px)').matches;
  const pw = open_ && !narrow ? pan.offsetWidth + 12 : 0;
  const ph = open_ && narrow ? pan.offsetHeight + 12 : 0;
  free = { w: Math.max(r.width - pw, 1), h: Math.max(r.height - ph, 1) };
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.setViewOffset(r.width, r.height, pw / 2, ph / 2, r.width, r.height);
  camera.updateProjectionMatrix();
}
// frame the car: back the camera off along its current direction until the
// bounding sphere fits both the vertical and the horizontal field of view
function fit(obj) {
  const sph = new THREE.Box3().setFromObject(obj).getBoundingSphere(new THREE.Sphere());
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2;
  const vfFree = Math.atan(Math.tan(vf) * free.h / canvas.clientHeight);
  const hf = Math.atan(Math.tan(vf) * free.w / Math.max(canvas.clientHeight, 1));
  const d = sph.radius / Math.sin(Math.min(vfFree, hf)) * 1.02;
  controls.target.set(sph.center.x, Math.max(sph.center.y, 0.5), sph.center.z);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, d);
  controls.maxDistance = d * 3;
}
addEventListener('resize', resize);

// --- the vehicle list ---------------------------------------------------------
// The page works in the repo (served from engine/) and in the web build
// (/models/ with the models in ./vehicles/).
const MANIFESTS = location.pathname.includes('/tools/vehicle-gen/')
  ? ['../../../scenes/vehicles/index.json', './vehicles/index.json']
  : ['./vehicles/index.json', '../../../scenes/vehicles/index.json'];
let base = '', vehicles = [];
async function loadManifest() {
  for (const m of MANIFESTS) {
    try {
      const r = await fetch(m, { cache: 'no-store' });
      if (!r.ok) continue;
      const j = await r.json();
      base = new URL('.', new URL(m, location.href)).href;
      return j.vehicles;
    } catch (e) { /* try the next location */ }
  }
  throw new Error('No vehicle list found (engine/scenes/vehicles/index.json): serve the engine/ folder, see the comment at the top of this page.');
}

const mm = (v) => (v / 1000).toFixed(2) + ' m';
function cardList() {
  const nav = $('list');
  for (const v of vehicles) {
    const b = document.createElement('button');
    b.className = 'car';
    b.dataset.name = v.name;
    const s = v.size_mm;
    b.innerHTML = (v.thumb ? `<img loading="lazy" alt="" src="${base + v.thumb}">` : '') +
      `<b>${v.title}</b><span>${v.base ? 'variant of ' + v.base : 'own design'}${s ? ' · ' + mm(s.length) : ''}</span>`;
    b.onclick = () => open(v.name);
    nav.appendChild(b);
  }
}

// --- loading a model ----------------------------------------------------------
const loader = new GLTFLoader();
let model = null, parts = [], markers = [], paintMats = [], paintOrig = null, glassMeshes = [];
let solo = null;

const GROUPS = [
  ['Body panels', /^(body_shell|hood|trunk_lid|tailgate|door_[FR][LR]$|fender_|bumper_)/],
  ['Glass', /^glass_/],
  ['Lamps', /(light|lens|lamp)/],
  ['Wheels', /^(rim_|tyre_|brake_disc_|spare_wheel)/],
  ['Interior', /^(seat|dash|steering|console|door_trim|headliner)/],
  ['Mechanical', /^(engine|radiator|firewall|underbody|exhaust|wheel_well|blower)/],
  ['Trim and accessories', /./],
];
const groupOf = (n) => GROUPS.find(([, re]) => re.test(n))[0];
const triCount = (g) => (g.index ? g.index.count : g.attributes.position.count) / 3;

function dispose(o) {
  o.traverse((c) => {
    if (c.geometry) c.geometry.dispose();
    if (c.material) [].concat(c.material).forEach((m) => m.dispose());
  });
}

async function open(name) {
  const v = vehicles.find((x) => x.name === name) || vehicles[0];
  if (!v) return;
  document.querySelectorAll('.car').forEach((b) => b.classList.toggle('on', b.dataset.name === v.name));
  const url = new URL(location.href);
  url.searchParams.set('car', v.name);
  history.replaceState(null, '', url);
  $('title').textContent = v.title;
  const src = v.design ? ` · <a href="${REPO + v.design}" target="_blank" rel="noopener">design source</a>` : '';
  $('meta').innerHTML = (v.base ? `variant of <b>${v.base}</b>` : 'own design') + src;
  $('stats').textContent = '';
  $('err').textContent = '';
  $('status').textContent = 'loading ' + v.name + '…';
  if (model) { scene.remove(model); dispose(model); model = null; }
  markerGroup.clear();
  let gltf;
  try {
    gltf = await loader.loadAsync(base + v.glb, (e) => {
      if (e.total) $('status').textContent = `loading ${v.name}… ${Math.round(100 * e.loaded / e.total)}%`;
    });
  } catch (e) {
    $('status').textContent = '';
    $('err').textContent = 'Could not load ' + v.glb + ': ' + (e.message || e) +
      '\n(the .glb files are Git LFS objects: run git lfs pull)';
    return;
  }
  $('status').textContent = '';
  model = gltf.scene;
  parts = []; markers = []; paintMats = []; glassMeshes = []; solo = null;
  model.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      for (const m of [].concat(o.material)) {
        if (m.name === 'paint' && !paintMats.includes(m)) paintMats.push(m);
        if (m.name === 'glass') { m.depthWrite = false; glassMeshes.push(o); }
      }
    }
  });
  // parts: the root's mesh children (one node per part); markers: its empties
  const root = model.getObjectByName('vehicle') || model;
  for (const c of root.children) {
    if (c.isMesh || c.children.some((k) => k.isMesh)) {
      let tris = 0;
      c.traverse((k) => { if (k.isMesh) tris += triCount(k.geometry); });
      const box = new THREE.Box3().setFromObject(c);
      parts.push({ name: c.name, obj: c, tris, home: c.position.clone(), centre: box.getCenter(new THREE.Vector3()) });
    } else {
      markers.push(c);
    }
  }
  paintOrig = paintMats.length ? paintMats[0].color.clone() : null;
  if (paintOrig) $('paint').value = '#' + paintOrig.clone().convertLinearToSRGB().getHexString();
  scene.add(model);
  fit(model);
  buildMarkers();
  partList();
  applyToggles();
  explode(+$('explode').value);
  const tris = parts.reduce((a, p) => a + p.tris, 0);
  const s = v.size_mm;
  $('stats').textContent = [
    s && `${mm(s.length)} × ${mm(s.width)} × ${mm(s.height)}, wheelbase ${mm(s.wheelbase)}`,
    `${parts.length} parts · ${markers.length} markers · ${tris.toLocaleString()} triangles`,
    v.checks_failed !== undefined && `spec checks failing: ${v.checks_failed} (see checks.md)`,
  ].filter(Boolean).join('\n');
  $('stats').style.whiteSpace = 'pre';
}

// --- markers ------------------------------------------------------------------
const markerGroup = new THREE.Group();
scene.add(markerGroup);
const MARK_COL = { wheel: 0x5aa9ff, hinge: 0x7ddc84, latch: 0xf0b04a, mount: 0xd38cff, bolt: 0xff8e8e, seat: 0xffffff };
function buildMarkers() {
  const geo = new THREE.SphereGeometry(0.022, 12, 8);
  for (const m of markers) {
    const kind = Object.keys(MARK_COL).find((k) => m.name.startsWith(k)) || 'seat';
    const s = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: MARK_COL[kind], depthTest: false }));
    s.renderOrder = 10;
    m.getWorldPosition(s.position);
    s.userData.label = m.name;
    markerGroup.add(s);
    const ax = new THREE.AxesHelper(0.08);
    ax.position.copy(s.position);
    ax.quaternion.copy(m.getWorldQuaternion(new THREE.Quaternion()));
    markerGroup.add(ax);
  }
}

// --- parts list ---------------------------------------------------------------
function partList() {
  const el = $('parts');
  el.innerHTML = '';
  const byGroup = new Map(GROUPS.map(([g]) => [g, []]));
  for (const p of parts) byGroup.get(groupOf(p.name)).push(p);
  for (const [g, list] of byGroup) {
    if (!list.length) continue;
    const h = document.createElement('h3');
    h.innerHTML = `<span>${g}</span><span>${list.length}</span>`;
    el.appendChild(h);
    for (const p of list.sort((a, b) => a.name.localeCompare(b.name))) {
      const row = document.createElement('div');
      row.className = 'part';
      row.innerHTML = `<input type="checkbox" checked><span class="n" title="${p.name}">${p.name}</span><span class="t">${p.tris.toLocaleString()}</span>`;
      const cb = row.querySelector('input');
      cb.onclick = (e) => { e.stopPropagation(); p.obj.visible = cb.checked; };
      row.onclick = () => setSolo(solo === p ? null : p);
      row.onmouseenter = () => hover(p);
      row.onmouseleave = () => hover(null);
      p.row = row; p.cb = cb;
      el.appendChild(row);
    }
  }
  $('partCount').textContent = 'click a part to isolate it';
}
function setSolo(p) {
  solo = p;
  for (const q of parts) {
    q.obj.visible = p ? q === p : q.cb.checked;
    q.row.classList.toggle('solo', q === p);
  }
  if (p) controls.target.copy(p.centre);
  else if (model) fit(model);
}
$('showAll').onclick = () => {
  for (const p of parts) { p.cb.checked = true; }
  setSolo(null);
};

// --- toggles ------------------------------------------------------------------
function applyToggles() {
  controls.autoRotate = $('spin').checked;
  markerGroup.visible = $('marks').checked;
  if (!model) return;
  model.traverse((o) => { if (o.isMesh) [].concat(o.material).forEach((m) => { m.wireframe = $('wire').checked; }); });
  for (const g of glassMeshes) g.visible = $('glass').checked && (solo ? false : true);
}
['spin', 'wire', 'marks', 'glass'].forEach((id) => { $(id).onchange = applyToggles; });
$('panelBtn').onclick = () => {
  const c = $('panel').classList.toggle('closed');
  $('panelBtn').textContent = c ? 'Show panel' : 'Hide panel';
  resize();
  if (model) fit(model);
};

function explode(t) {
  for (const p of parts) {
    // out from the car's middle, more sideways than along it, wheels straight out
    const d = new THREE.Vector3(p.centre.x * 1.4, (p.centre.y - 0.55) * 0.9, p.centre.z * 0.35);
    if (/^(rim_|tyre_|brake_disc_)/.test(p.name)) d.set(Math.sign(p.centre.x) * (/^tyre/.test(p.name) ? 1.2 : /^rim/.test(p.name) ? 0.8 : 0.4), 0, 0);
    p.obj.position.copy(p.home).addScaledVector(d, t);
  }
}
$('explode').oninput = (e) => explode(+e.target.value);
$('paint').oninput = (e) => {
  const c = new THREE.Color(e.target.value).convertSRGBToLinear();
  paintMats.forEach((m) => m.color.copy(c));
};
$('paintReset').onclick = () => {
  if (!paintOrig) return;
  paintMats.forEach((m) => m.color.copy(paintOrig));
  $('paint').value = '#' + paintOrig.clone().convertLinearToSRGB().getHexString();
};

// --- hover: name the part under the pointer -----------------------------------
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const boxHelper = new THREE.Box3Helper(new THREE.Box3(), 0x5aa9ff);
boxHelper.visible = false;
scene.add(boxHelper);
let hovered = null;
function hover(p) {
  if (hovered && hovered.row) hovered.row.classList.remove('hover');
  hovered = p;
  if (p) {
    boxHelper.box.setFromObject(p.obj);
    boxHelper.visible = true;
    if (p.row) p.row.classList.add('hover');
  } else boxHelper.visible = false;
}
canvas.addEventListener('pointermove', (e) => {
  if (!model || e.buttons) return;
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const tip = $('tip');
  let label = null, part = null;
  if (markerGroup.visible) {
    const mh = ray.intersectObjects(markerGroup.children.filter((c) => c.isMesh), false)[0];
    if (mh) label = mh.object.userData.label;
  }
  if (!label) {
    const hit = ray.intersectObject(model, true).find((h) => h.object.visible && h.object.material.name !== 'glass');
    if (hit) {
      let o = hit.object;
      part = parts.find((p) => { let q = o; while (q) { if (q === p.obj) return true; q = q.parent; } return false; });
      if (part) label = `${part.name} · ${[].concat(hit.object.material).map((m) => m.name).join(', ')}`;
    }
  }
  hover(part);
  if (label) {
    tip.textContent = label;
    tip.style.display = 'block';
    tip.style.left = (e.clientX - r.left + 14) + 'px';
    tip.style.top = (e.clientY - r.top + 10) + 'px';
  } else tip.style.display = 'none';
});
canvas.addEventListener('pointerleave', () => { hover(null); $('tip').style.display = 'none'; });
canvas.addEventListener('dblclick', () => { if (hovered) setSolo(solo === hovered ? null : hovered); });

// --- go -------------------------------------------------------------------------
if (matchMedia('(max-width: 820px)').matches) { $('panel').classList.add('closed'); $('panelBtn').textContent = 'Show panel'; }
resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
try {
  vehicles = await loadManifest();
  cardList();
  await open(new URLSearchParams(location.search).get('car') || vehicles[0]?.name);
} catch (e) {
  $('title').textContent = 'Rubble vehicle models';
  $('err').textContent = e.message || String(e);
}
window.__VIEWER__ = { scene, get parts() { return parts; }, get markers() { return markers; }, open };
</script>
</body>
</html>
