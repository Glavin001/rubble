[package]
name = "stress-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The GPU stress solver coupled to rubble in the browser (WebGPU, wasm): the Fracture lab's stress-solver bond mode"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stress-ref = { path = "../stress-ref" }
stress-gpu = { path = "../stress-gpu" }
engine-gpu-wait = { path = "../../../crates/engine-gpu-wait" }
stress-rubble = { path = "../stress-rubble", default-features = false, features = ["gpu"] }
engine-fracture = { path = "../../../crates/engine-fracture" }
# Driven vehicles (a pack's `defaults.drives`): rubble's world API with the Threshold
# model, its raycast vehicle presets and its GPU records.
rubble = { package = "engine-world", path = "../../../crates/engine-world" }
engine-vehicle = { path = "../../../crates/engine-vehicle" }
engine-schema = { path = "../../../crates/engine-schema" }
glam = { version = "0.29", features = ["bytemuck"] }
anyhow = "1"
wgpu = "30"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
web-time = "1.1"
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
