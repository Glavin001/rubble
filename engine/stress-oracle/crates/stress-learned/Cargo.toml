[package]
name = "stress-learned"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Learned-impact event schema, recorder, and smoke generator (training data side track)"

[dependencies]
serde = { version = "1", features = ["derive"] }
rayon = "1"
# Saved oracle scenes must round-trip every f64.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Lossless compression of call records (`arrays.bin.zst`, P2's loader reads it).
zstd = "0.13"
# The island state's exact binary form (harness A relabelling): MessagePack, self-describing,
# every f64 bit and infinity kept, and readable from Python (`msgpack`).
rmp-serde = "1"
# The full-state recorder: a World serialized (MessagePack) and shredded into columns.
rmpv = "1"
stress-ref = { path = "../stress-ref" }

[[bin]]
name = "learned_impact_envelope_fixture"
path = "src/bin/learned_impact_envelope_fixture.rs"

[[bin]]
name = "learned_impact_budget_fixture"
path = "src/bin/learned_impact_budget_fixture.rs"

[[bin]]
name = "learned_impact_relabel"
path = "src/bin/learned_impact_relabel.rs"

[[bin]]
name = "learned_impact_smoke"
path = "src/bin/learned_impact_smoke.rs"

[[bin]]
name = "learned_impact_record"
path = "src/bin/learned_impact_record.rs"

[[bin]]
name = "learned_impact_generate"
path = "src/bin/learned_impact_generate.rs"

[[bin]]
name = "learned_impact_outcome_record"
path = "src/bin/learned_impact_outcome_record.rs"

[[bin]]
name = "learned_impact_outcome_generate"
path = "src/bin/learned_impact_outcome_generate.rs"

[[bin]]
name = "learned_impact_outcome_calls"
path = "src/bin/learned_impact_outcome_calls.rs"

[dev-dependencies]
rmpv = "1"
rmp-serde = "1"
