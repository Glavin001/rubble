[package]
name = "stress-viz"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Debug renderer and video tool for the reference destruction stress solver (wgpu or software rasterizer, ffmpeg output)"

[[bin]]
name = "stress-viz"
path = "src/main.rs"

[features]
# rubble's AVBD GPU engine as the rigid-body engine (`--engine rubble`, variant item
# `engine rubble`, E in the viewer); needs a wgpu adapter at run time.
rubble = ["dep:stress-rubble"]
# GPU rasterizer through wgpu (Metal, Vulkan, DX12); without an adapter at run time,
# or with `--renderer cpu`, the software rasterizer is used.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# `stress-viz view`: the interactive window (live simulation, replay, projectiles).
viewer = ["gpu", "dep:winit", "dep:rayon"]
default = ["gpu", "viewer"]

[dependencies]
stress-ref = { path = "../stress-ref" }
stress-rubble = { path = "../stress-rubble", optional = true }
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
winit = { version = "0.30.13", optional = true }
rayon = { version = "1.12.0", optional = true }
