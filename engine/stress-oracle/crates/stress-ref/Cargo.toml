[package]
name = "stress-ref"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Double-precision CPU reference solver for elastodynamic destruction stress (the oracle the GPU solver is diffed against)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "stress-ref"
path = "src/bin/stress_ref.rs"

[dependencies]
web-time = "1.1"
robust = "1.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `modal` feature only: dense eigensolvers for the modal pre-window (`world::modal`).
faer = { version = "=0.22.6", optional = true }

[features]
# The modal pre-window prototype for impacts (`src/modal.rs`, `findings/modal-prewindow.md`).
modal = ["dep:faer"]
# The multi-time-step explicit-implicit prototype (`src/avbd/mts.rs`,
# `findings/multi-time-step.md`).
mts = ["dep:faer"]

[[example]]
name = "modal_prewindow"
required-features = ["modal"]

[[test]]
name = "modal_prewindow"
required-features = ["modal"]

[[example]]
name = "mts_compare"
required-features = ["mts"]
