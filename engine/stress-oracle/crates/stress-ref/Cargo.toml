[package]
name = "stress-ref"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Double-precision CPU reference solver for elastodynamic destruction stress (the oracle the GPU solver is diffed against)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "stress-ref"
path = "src/bin/stress_ref.rs"

[dependencies]
robust = "1.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
