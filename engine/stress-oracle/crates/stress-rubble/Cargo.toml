[package]
name = "stress-rubble"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Couples the stress-ref destruction stress solver to rubble's AVBD GPU rigid-body engine (engine-webgpu)"

[dependencies]
engine-gpu-wait = { path = "../../../crates/engine-gpu-wait" }
web-time = "1.1"
stress-ref = { path = "../stress-ref" }
# rubble's own engine (wgpu 24; the oracle's GPU solver is on wgpu 30: both majors
# coexist in the lock, each crate on its own device).
engine-webgpu = { path = "../../../crates/engine-webgpu" }
engine-schema = { path = "../../../crates/engine-schema" }
glam = { version = "0.29", features = ["bytemuck"] }
anyhow = "1"
serde_json = "1"
wgpu = "30"
# The GPU stress solver coupled to rubble (`GpuWorld::with_engine`), for its tests.
stress-gpu = { path = "../stress-gpu", optional = true }
# `destruction-view` (the `view` feature): the interactive window.
winit = { version = "0.30", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
# The veneer house: a fracture GLB through the stress cooker's import (`engine-fracture`).
engine-fracture = { path = "../../../crates/engine-fracture", optional = true }

[dev-dependencies]
rmpv = "1"
# The closed-loop harness (`examples/learned_p0.rs`) writes P2's call records (`live_call`).
stress-learned = { path = "../stress-learned" }

[features]
default = ["view"]
gpu = ["dep:stress-gpu", "dep:bytemuck"]
# `destruction-view`: rubble's production stress pipeline in a window, in real time.
view = ["gpu", "dep:winit", "dep:pollster", "dep:bytemuck", "dep:engine-fracture"]
# The shared showcase behaviours with rubble as the engine (slow).
showcases = []

[[bin]]
name = "destruction-view"
path = "src/bin/destruction_view/main.rs"
required-features = ["view"]

[[example]]
name = "outcome_gnn_bench"
required-features = ["gpu"]

[[example]]
name = "destruction_video"
required-features = ["gpu"]
