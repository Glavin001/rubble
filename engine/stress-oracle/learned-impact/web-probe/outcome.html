<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outcome model timing</title>
<!-- P3: P2's trained model through the Slang port in the browser: stress-web's outcome_gnn_*
     exports time the OGNN1 programs the native outcome_gnn_bench wrote
     (--write-programs ../runs/p3-bench/programs). Serve engine/ over HTTP and open
     /stress-oracle/learned-impact/web-probe/outcome.html?programs=m5_free_wall_plain,m5_free_wall_lever
     Results: window.__probe.lines (JSON lines) once window.__probe.done. -->
<script type="importmap">{"imports":{"rubble-gpu-wait":"/crates/engine-webgpu/fracture/gpu-wait.mjs"}}</script>
<style>body{background:#111;color:#ddd;font:12px ui-monospace,monospace;margin:16px}pre{white-space:pre-wrap}</style>
</head><body><pre id="log">loading…</pre>
<script type="module">
import init,{gnn_probe_init,outcome_gnn_load,outcome_gnn_line} from '../runs/web-probe-pkg/stress_web.js';
const q=new URLSearchParams(location.search),log=document.getElementById('log'),say=t=>{log.textContent+='\n'+t;console.log(t)};
window.__probe={done:false,lines:[],error:null};
try{
 const m=await init({module_or_path:new URL('../runs/web-probe-pkg/stress_web_bg.wasm',import.meta.url)});
 say('device '+await gnn_probe_init());
 const run=WebAssembly.promising(m.outcome_gnn_run);
 const names=(q.get('programs')||'').split(',').filter(Boolean),warmup=+(q.get('warmup')||5),repeats=+(q.get('repeats')||30);
 for(const name of names){
  const bytes=new Uint8Array(await (await fetch(new URL('../runs/p3-bench/programs/'+name+'.ognn',import.meta.url))).arrayBuffer());
  const n=outcome_gnn_load(bytes);
  const ok=await run(warmup,repeats);const l=outcome_gnn_line();if(!ok)throw new Error('WebGPU error: '+JSON.parse(l).error);
  const d=JSON.parse(l);d.program=name;window.__probe.lines.push(JSON.stringify(d));
  say(`${name}: ${n} dispatches, steady ${d.steady_ms.median.toFixed(3)} ms/call, wall ${d.wall_ms.median.toFixed(3)} ms gpu ${d.gpu_ms?d.gpu_ms.median.toFixed(3):'-'} ms`)}
 window.__probe.done=true;say('done');
}catch(e){window.__probe.error=String(e);say('error: '+e)}
</script></body></html>
